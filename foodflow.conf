server {
    server_name foodflow.v2net.cc;

    client_max_body_size 20M;

    # ============ 上传文件：长缓存 ============
    location /uploads/ {
        alias /var/www/foodflow/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============ 语言包：协商缓存 ============
    location ~ ^/(languages\.min\.js|languages\.js)$ {
        root /var/www/foodflow;
        expires off;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # ============ socket.io 长连接 ============
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ============ 其它全部走 Node ============
    # /assets/、/pages/、/api/、HTML 都透传 Express 的缓存策略
    # Express 端已配置协商缓存：no-cache + ETag
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/foodflow.v2net.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodflow.v2net.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = foodflow.v2net.cc) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name foodflow.v2net.cc;
    return 404;
}

# gzip 压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;
