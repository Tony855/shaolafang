# ============================================================
#  FoodFlow Nginx 配置参考模板
#
#  ⚠️ 请勿直接复制此文件！
#  实际配置由 setup-nginx.sh 自动生成：
#      cd /path/to/foodflow
#      sudo bash setup-nginx.sh
#
#  setup-nginx.sh 会：
#    1. 从环境变量或交互式输入获取 DOMAIN
#    2. 用真实域名和路径替换本文件里的占位符
#    3. 自动申请 Let's Encrypt SSL 证书
#
#  占位符说明：
#    __DOMAIN__       你的域名（如 foodflow.example.com）
#    __APP_DIR__      应用目录（如 /var/www/foodflow）
#    __BACKEND_PORT__ 后端端口（默认 3000）
# ============================================================

log_format foodflow_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log foodflow_safe;
    server_name __DOMAIN__;

    client_max_body_size 55M;

    # ============ 上传文件：长缓存 ============
    location /uploads/ {
        alias /var/www/foodflow/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============ 语言包：协商缓存 ============
    location ~ ^/(languages\.min\.js|languages\.js)$ {
        root /var/www/foodflow;
        expires off;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # ============ socket.io 长连接 ============
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ============ 其它全部走 Node ============
    # /assets/、/pages/、/api/、HTML 都透传 Express 的缓存策略
    # Express 端已配置协商缓存：no-cache + ETag
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    access_log /var/log/nginx/access.log foodflow_safe;
    if ($host = __DOMAIN__) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name __DOMAIN__;
    return 404;
}

# gzip 压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;
