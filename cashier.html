<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5">
  <title>收银台</title>
  <script>
    try { if (localStorage.getItem('cashierToken')) document.documentElement.setAttribute('data-cashier-session', '1'); } catch(e) {}
  </script>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    :root{
      --primary: #667eea;
      --primary-light: #764ba2;
      --primary-dark: #5a67d8;
      --primary-bg: #f0f4ff;
      --gray-1: #f8f9fb;
      --gray-2: #eef0f2;
      --gray-3: #d5d8dd;
      --gray-4: #9ea3ac;
      --gray-5: #6b7078;
      --gray-6: #2d3138;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.15);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--gray-6);
      min-height: 100vh;
      padding-bottom: 70px;
      background: linear-gradient(145deg, #f0f4ff 0%, #e8ecf8 100%);
    }
    .toast{
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      color: #fff; padding: 8px 24px; border-radius: 30px;
      font-weight: 500; font-size: 14px; z-index: 999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show{ opacity: 1; }
    header{
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(102,126,234,0.3);
    }
    .header-left{ display: flex; align-items: center; gap: 10px; }
    .header-logo{ font-size: 20px; }
    .header-title{ font-size: 17px; font-weight: 700; }
    .header-store{ font-size: 12px; opacity: 0.9; }
    .header-right{ display: flex; align-items: center; gap: 8px; }
    .header-btn{
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
    .lang-select{
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 8px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
    .lang-select option{ color: #333; }
    .tabs{
      display: flex; background: #fff; padding: 0 16px;
      border-bottom: 1px solid var(--gray-2); position: sticky; top: 56px; z-index: 99;
    }
    .tab{
      flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600;
      color: var(--gray-4); cursor: pointer; border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab.active{ color: var(--primary); border-bottom-color: var(--primary); }
    .content{ padding: 16px; }
    .order-card{
      background: #fff; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border-left: 4px solid var(--primary); transition: all 0.2s;
    }
    .order-card:hover{ box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-1px); }
    .order-card.status-done{ border-left-color: #43e97b; }
    .order-card.status-canceled{ border-left-color: #f5576c; opacity: 0.7; }
    .order-card.status-refunded{ border-left-color: #ffa726; opacity: 0.7; }
    .order-header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .order-table{ display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--gray-6); flex-wrap: wrap; }
    .order-table-icon{
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff; font-size: 14px; flex-shrink: 0;
    }
    .order-table-name{ font-size: 16px; font-weight: 700; color: var(--gray-6); }
    .order-id-badge{
      display: inline-flex; align-items: center;
      background: #f0f2ff; color: #667eea;
      font-size: 12px; font-weight: 700; padding: 2px 8px;
      border-radius: 6px; flex-shrink: 0;
    }
    .customer-tag{
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff3e0; color: #e65100;
      font-size: 12px; font-weight: 600; padding: 2px 8px;
      border-radius: 6px; flex-shrink: 0;
    }
    .customer-tag.staff{ background: #e8f5e9; color: #2e7d32; }
    .order-status{
      font-size: 12px; padding: 4px 12px; border-radius: 12px; font-weight: 600;
      flex-shrink: 0; white-space: nowrap;
    }
    .order-status.pending{ background: #fff3cd; color: #856404; }
    .order-status.done{ background: #d4edda; color: #155724; }
    .order-status.canceled{ background: #f8d7da; color: #721c24; }
    .order-status.refunded{ background: #ffe0b2; color: #e65100; }
    .order-info{ font-size: 13px; color: var(--gray-4); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .order-dishes{ font-size: 13px; color: var(--gray-5); margin-bottom: 10px; line-height: 1.5; }
    .order-dish-row{
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px; border-bottom: 1px dashed var(--gray-2); font-size: 13px;
      border-radius: 4px;
    }
    .order-dish-row:nth-child(odd){ background: rgba(102,126,234,0.05); }
    .order-dish-row:nth-child(even){ background: transparent; }
    .order-dish-row:last-child{ border-bottom: none; }
    .order-dish-left{ display: flex; align-items: center; flex: 1; }
    .order-dish-name{ color: var(--gray-6); flex: 1; }
    .order-dish-qty{ color: var(--primary); font-weight: 700; margin-left: 12px; min-width: 40px; text-align: right; }
    .order-dish-price{ color: var(--gray-5); font-weight: 600; margin-left: 12px; min-width: 60px; text-align: right; }
    .order-footer{ display: flex; justify-content: space-between; align-items: center; }
    .order-total{ font-size: 18px; font-weight: 700; color: var(--primary); }
    .order-actions{ display: flex; gap: 8px; }
    .btn{
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-primary{ background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
    .btn-warning{ background: linear-gradient(135deg, #ffd93d, #ff9f43); color: #fff; }
    .btn-warning:hover{ transform: translateY(-2px); }
    .btn-danger{ background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
    .btn-danger:hover{ transform: translateY(-2px); }
    .btn-secondary{ background: var(--gray-2); color: var(--gray-5); }
    .btn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .bottom-bar{
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      padding: 12px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .stat-item{ text-align: center; }
    .stat-value{ font-size: 18px; font-weight: 700; color: var(--primary); }
    .stat-label{ font-size: 11px; color: var(--gray-4); }
    .modal-overlay{
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 300; display: none;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show{ display: flex; }
    .modal{
      position: relative; background: #2d2d44; border: 1px solid #55557b;
      border-radius: 16px; width: 100%; max-width: 420px;
      max-height: 85vh; overflow-y: auto; padding: 18px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    }
    .modal-close{
      position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
      border: 0; border-radius: 50%; background: rgba(255,255,255,0.09);
      color: #fff; cursor: pointer; font-size: 14px; display: flex;
      align-items: center; justify-content: center; transition: all 0.2s;
    }
    .modal-close:hover{ background: rgba(255,255,255,0.18); }
    .modal-title{ font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #ffd93d; padding-right: 36px; }
    .modal-section{ margin-bottom: 16px; }
    .modal-section-title{ font-size: 14px; font-weight: 600; color: #aaa; margin-bottom: 8px; }
    .dish-item{
      display: flex; justify-content: space-between; align-items: center; padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; border-radius: 4px;
    }
    .dish-item:nth-child(odd){ background: rgba(255,255,255,0.04); }
    .dish-item:nth-child(even){ background: transparent; }
    .dish-item .dish-left{ display: flex; align-items: center; flex: 1; }
    .dish-item .dish-name{ color: #e0e0e0; flex: 1; }
    .dish-item .dish-qty{ color: #999; margin-left: 12px; min-width: 40px; text-align: right; }
    .dish-item .dish-price{ color: #ffd93d; font-weight: 600; margin-left: 12px; min-width: 60px; text-align: right; }
    .modal-total{
      display: flex; justify-content: space-between; padding: 14px 0 4px;
      border-top: 2px solid rgba(255,255,255,0.12); font-size: 16px; font-weight: 700; color: #fff;
    }
    .modal-total .amount{ color: #ffd93d; }
    .modal-actions{ display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions .btn{
      border: 0; border-radius: 8px; padding: 9px 18px; background: #484867;
      color: #fff; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s;
    }
    .modal-actions .btn:hover{ background: #5a5a80; }
    .modal-actions .btn.btn-primary{
      background: linear-gradient(135deg, #f76b46, #df4d32); font-weight: 700;
    }
    .modal-actions .btn.btn-primary:hover{ background: linear-gradient(135deg, #ff7a55, #e85a3f); }
    .modal-actions .btn.btn-warning{
      background: linear-gradient(135deg, #f5a623, #e8941a); font-weight: 700;
    }
    .modal-actions .btn.btn-warning:hover{ background: linear-gradient(135deg, #ffb535, #f5a020); }
    .modal-actions .btn.btn-danger{
      background: linear-gradient(135deg, #e74c3c, #c0392b); font-weight: 700;
    }
    .modal-actions .btn.btn-danger:hover{ background: linear-gradient(135deg, #ff5c4a, #d64535); }
    .empty-hint{ text-align: center; padding: 40px 20px; color: var(--gray-4); }
    .empty-icon{ font-size: 48px; margin-bottom: 12px; }
    .report-card{
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .report-title{ font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
    .report-amount{ font-size: 32px; font-weight: 700; margin-bottom: 16px; }
    .report-stats{ display: flex; justify-content: space-around; }
    .report-stat{ text-align: center; }
    .report-stat-value{ font-size: 20px; font-weight: 700; }
    .report-stat-label{ font-size: 12px; opacity: 0.8; }
    .login-modal{ display: none; }
    html:not([data-cashier-session="1"]) .login-modal{ display: flex; }
    html:not([data-cashier-session="1"]) .app-content{ display: none; }
  </style>
</head>
<body>
  <!-- 登录提示 -->
  <div class="login-modal modal-overlay">
    <div class="modal" style="text-align:center;max-width:360px;">
      <div style="font-size:48px;margin-bottom:16px;">💰</div>
      <h2 style="margin-bottom:8px;color:#ffd93d;font-size:20px;" id="loginTitle">请重新登录</h2>
      <p style="color:#aaa;margin-bottom:20px;font-size:14px;" id="loginDesc">登录已过期，请重新登录</p>
      <button class="btn btn-primary" style="width:100%;background:linear-gradient(135deg,#f76b46,#df4d32);border:0;border-radius:8px;padding:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;" id="loginBtn" onclick="goLogin()">重新登录</button>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="app-content">
    <header>
      <div class="header-left">
        <span class="header-logo">💰</span>
        <div>
          <div class="header-title" id="pageTitle">收银台</div>
          <div class="header-store" id="storeName">加载中...</div>
        </div>
      </div>
      <div class="header-right">
        <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="km">ខ្មែរ</option>
        </select>
        <button class="header-btn" id="logoutBtn" onclick="logout()">退出</button>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="orders" onclick="switchTab('orders')" id="tabOrders">订单列表</div>
      <div class="tab" data-tab="report" onclick="switchTab('report')" id="tabReport"></div>
    </div>

    <div class="content">
      <div id="ordersView">
        <div id="orderList"></div>
      </div>
      <div id="reportView" style="display:none;">
        <div id="reportContent"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="stat-item">
        <div class="stat-value" id="pendingCount">0</div>
        <div class="stat-label" id="pendingLabel"></div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label" id="todayLabel"></div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayRevenue">$0.00</div>
        <div class="stat-label" id="revenueLabel"></div>
      </div>
    </div>
  </div>

  <!-- 订单详情弹窗 -->
  <div class="modal-overlay" id="orderDetailModal">
    <div class="modal">
      <button class="modal-close" onclick="closeOrderDetail()">✕</button>
      <div class="modal-title" id="detailTitle"></div>
      <div class="modal-section">
        <div class="modal-section-title" id="dishListTitle"></div>
        <div id="detailDishes"></div>
      </div>
      <div class="modal-total">
        <span id="totalLabel"></span>
        <span class="amount" id="detailTotal">$0.00</span>
      </div>
      <div class="modal-actions" id="detailActions"></div>
    </div>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:360px;text-align:center;">
      <button class="modal-close" onclick="hideConfirm()">✕</button>
      <div style="font-size:48px;margin-bottom:12px;" id="confirmIcon">⚠️</div>
      <div class="modal-title" id="confirmTitle" style="padding-right:0;"></div>
      <p style="color:#aaa;margin-bottom:20px;font-size:14px;" id="confirmMessage"></p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn" onclick="hideConfirm()" id="confirmCancelBtn"></button>
        <button class="btn btn-primary" onclick="executeConfirm()" id="confirmOkBtn"></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="languages.min.js?v=20260918"></script>

    SLF.i18n.init(currentLang, CASHIER_LABELS);

    function t(key, params) {
      return SLF.i18n.t(key, params);
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function goLogin() {
      window.location.href = '/login?type=cashier';
    }

    function logout() {
      showConfirm(t('logout'), t('confirmLogout'), function() {
        const token = SLF.store.rawGet('cashierToken');
        if (token) {
          SLF.api.post('/cashier/logout', null, { headers: { 'X-Cashier-Token': token } }).catch(() => {});



        }
        SLF.store.rawRemove('cashierToken');
        SLF.store.rawRemove('cashierStoreId');
        SLF.store.rawRemove('cashierInfo');
        SLF.store.rawRemove('storeId');
        window.location.href = '/login?type=cashier';
      }, { type: 'warning', icon: '🚪' });
    }

    function changeLang(lang) {
      currentLang = lang;
      SLF.store.rawSet('cashierLang', lang);
      SLF.store.rawSet('lang', lang);
      applyLang();
      renderOrders();
      loadOrders();
      if (currentTab === 'report') loadReport();
    }

    function applyLang() {
      document.getElementById('langSelect').value = currentLang;
      document.getElementById('pageTitle').textContent = t('cashier') + t('orderList');
      document.getElementById('tabOrders').textContent = t('orderList');
      document.getElementById('tabReport').textContent = t('report');
      document.getElementById('pendingLabel').textContent = t('pendingCount');
      document.getElementById('todayLabel').textContent = t('todayCount');
      document.getElementById('revenueLabel').textContent = t('todayRevenue');
      document.getElementById('loginTitle').textContent = t('reloginTitle');
      document.getElementById('loginDesc').textContent = t('reloginDesc');
      document.getElementById('loginBtn').textContent = t('relogin');
      document.getElementById('logoutBtn').textContent = t('logout');
      document.getElementById('detailTitle').textContent = t('orderDetail');
      document.getElementById('dishListTitle').textContent = t('dishList');
      document.getElementById('totalLabel').textContent = t('total');
      document.getElementById('confirmTitle').textContent = t('confirmTitle');
      document.getElementById('confirmCancelBtn').textContent = t('cancel');
      document.getElementById('confirmOkBtn').textContent = t('confirm');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
      document.getElementById('ordersView').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('reportView').style.display = tab === 'report' ? 'block' : 'none';
      if (tab === 'report') loadReport();
    }

    async function api(url, options = {}) {
      // 确保 storeId 键名统一（SLF.api 从 storeId 读取）
      const cashierStoreId = SLF.store.rawGet('cashierStoreId');
      if (cashierStoreId) SLF.store.rawSet('storeId', cashierStoreId);
      const method = (options.method || 'GET').toUpperCase();
      if (method === 'GET') return SLF.api.get(url, options);
      if (method === 'POST') return SLF.api.post(url, options.body, options);
      if (method === 'PUT') return SLF.api.put(url, options.body, options);
      if (method === 'DELETE') return SLF.api.del(url, options);
      return SLF.api._request(method, url, options);
    }

    async function loadOrders() {
      try {
        const data = await api('/cashier/orders');
        orders = data.orders || [];
        renderOrders();
        updateBottomStats();
      } catch (e) {
        if (e.message.includes('请先登录') || e.message.includes('登录已过期')) {
          SLF.store.rawRemove('cashierToken');
          window.location.href = '/login?type=cashier';
        } else {
          toast('❌ ' + e.message);
        }
      }
    }

    // 根据 session_token 分组生成客户标签
    function buildSessionLabels(orderList) {
      const labels = new Map();
      const tableGroups = {};
      orderList.forEach(o => {
        const key = o.table_name || 'unknown';
        if (!tableGroups[key]) tableGroups[key] = [];
        tableGroups[key].push(o);
      });
      Object.values(tableGroups).forEach(group => {
        const distinctTokens = [...new Set(group.map(o => o.sessionToken).filter(Boolean))];
        const tokenToIndex = new Map(distinctTokens.map((t, i) => [t, i + 1]));
        group.forEach(o => {
          if (o.sessionToken) {
            labels.set(o.id, t('customer') + tokenToIndex.get(o.sessionToken));
          } else {
            labels.set(o.id, t('staffOrder'));
          }
        });
      });
      return labels;
    }

    function renderOrders() {
      const container = document.getElementById('orderList');
      if (!orders.length) {
        container.innerHTML = '<div class="empty-hint"><div class="empty-icon">📋</div>' + t('noOrders') + '</div>';
        return;
      }
      const customerLabels = buildSessionLabels(orders);
      container.innerHTML = orders.map(order => {
        const statusClass = order.status === 'done' ? 'done' : order.status === 'canceled' ? 'canceled' : order.status === 'refunded' ? 'refunded' : 'pending';
        const statusText = order.status === 'done' ? t('settled') : order.status === 'canceled' ? t('canceled') : order.status === 'refunded' ? t('refunded') : t('pendingSettlement');
        const dishesHTML = (order.items || []).map(i =>
          '<div class="order-dish-row">' +
            '<div class="order-dish-left">' +
              '<span class="order-dish-name">' + i.name + '</span>' +
              '<span class="order-dish-qty">×' + i.quantity + '</span>' +
            '</div>' +
            '<span class="order-dish-price">$' + (parseFloat(i.price || 0) * i.quantity).toFixed(2) + '</span>' +
          '</div>'
        ).join('');
        const canSettle = cashierInfo?.permissions?.can_settle && order.status === 'pending';
        const canCancel = cashierInfo?.permissions?.can_cancel && order.status === 'pending';
        const canRefund = cashierInfo?.permissions?.can_refund && order.status === 'done';
        const customerLabel = customerLabels.get(order.id) || '';
        return '<div class="order-card status-' + statusClass + '" onclick="showOrderDetail(' + order.id + ')">' +
          '<div class="order-header">' +
            '<span class="order-table">' +
              '<span class="order-table-icon">🪑</span>' +
              '<span class="order-table-name">' + (order.table_name || '-') + '</span>' +
              '<span class="order-id-badge">#' + order.id + '</span>' +
              (customerLabel ? '<span class="customer-tag' + (customerLabel === t('staffOrder') ? ' staff' : '') + '">👤 ' + customerLabel + '</span>' : '') +
            '</span>' +
            '<span class="order-status ' + statusClass + '">' + statusText + '</span>' +
          '</div>' +
          '<div class="order-info">🕐 ' + formatTime(order.createdAt) + ' · ' + (order.items?.length || 0) + t('dishes') + '</div>' +
          '<div class="order-dishes">' + (dishesHTML || '<div style="color:var(--gray-4);">无菜品</div>') + '</div>' +
          '<div class="order-footer">' +
            '<span class="order-total">$' + (parseFloat(order.total || 0).toFixed(2)) + '</span>' +
            '<div class="order-actions" onclick="event.stopPropagation()">' +
              (canSettle ? '<button class="btn btn-primary" onclick="settleOrder(' + order.id + ')">' + t('settleOrder') + '</button>' : '') +
              (canCancel ? '<button class="btn btn-warning" onclick="cancelOrder(' + order.id + ')">' + t('cancelOrder') + '</button>' : '') +
              (canRefund ? '<button class="btn btn-danger" onclick="refundOrder(' + order.id + ')">' + t('refundOrder') + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function updateBottomStats() {
      const pending = orders.filter(o => o.status === 'pending').length;
      const today = new Date().toISOString().split('T')[0];
      const todayOrders = orders.filter(o => (o.createdAt || '').startsWith(today));
      const revenue = todayOrders.filter(o => o.status === 'done').reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('todayCount').textContent = todayOrders.length;
      document.getElementById('todayRevenue').textContent = '$' + revenue.toFixed(2);
    }

    function showOrderDetail(id) {
      const order = orders.find(o => o.id === id);
      if (!order) return;
      const detailCustomerLabel = buildSessionLabels([order]).get(order.id) || '';
      document.getElementById('detailTitle').textContent = t('orderDetail') + ' #' + order.id + (detailCustomerLabel ? ' · ' + detailCustomerLabel : '');
      document.getElementById('detailDishes').innerHTML = (order.items || []).map(item =>
        '<div class="dish-item">' +
          '<div class="dish-left">' +
            '<span class="dish-name">' + item.name + '</span>' +
            '<span class="dish-qty">×' + item.quantity + '</span>' +
          '</div>' +
          '<span class="dish-price">$' + (parseFloat(item.price || 0) * item.quantity).toFixed(2) + '</span>' +
        '</div>'
      ).join('') || '<div style="text-align:center;color:var(--gray-4);padding:20px;">无菜品</div>';
      document.getElementById('detailTotal').textContent = '$' + (parseFloat(order.total || 0).toFixed(2));
      const canSettle = cashierInfo?.permissions?.can_settle && order.status === 'pending';
      const canCancel = cashierInfo?.permissions?.can_cancel && order.status === 'pending';
      const canRefund = cashierInfo?.permissions?.can_refund && order.status === 'done';
      document.getElementById('detailActions').innerHTML =
        '<button class="btn btn-secondary" onclick="closeOrderDetail()">' + t('close') + '</button>' +
        (canSettle ? '<button class="btn btn-primary" onclick="settleOrder(' + order.id + ')">' + t('settleOrder') + '</button>' : '') +
        (canCancel ? '<button class="btn btn-warning" onclick="cancelOrder(' + order.id + ')">' + t('cancelOrder') + '</button>' : '') +
        (canRefund ? '<button class="btn btn-danger" onclick="refundOrder(' + order.id + ')">' + t('refundOrder') + '</button>' : '');
      document.getElementById('orderDetailModal').classList.add('show');
    }

    function closeOrderDetail() {
      document.getElementById('orderDetailModal').classList.remove('show');
    }

    // 自定义确认弹窗
    let confirmCallback = null;
    function showConfirm(title, message, callback, options = {}) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmIcon').textContent = options.icon || '⚠️';
      document.getElementById('confirmOkBtn').textContent = options.okText || t('confirm');
      document.getElementById('confirmCancelBtn').textContent = options.cancelText || t('cancel');
      if (options.type === 'danger') {
        document.getElementById('confirmOkBtn').className = 'btn btn-danger';
      } else if (options.type === 'warning') {
        document.getElementById('confirmOkBtn').className = 'btn btn-warning';
      } else {
        document.getElementById('confirmOkBtn').className = 'btn btn-primary';
      }
      confirmCallback = callback;
      document.getElementById('confirmModal').classList.add('show');
    }
    function hideConfirm() {
      document.getElementById('confirmModal').classList.remove('show');
      confirmCallback = null;
    }
    function executeConfirm() {
      if (confirmCallback) {
        const cb = confirmCallback;
        hideConfirm();
        cb();
      }
    }

    async function settleOrder(id) {
      showConfirm(t('settleOrder'), t('confirmSettle'), async function() {
        try {
          await api('/cashier/orders/' + id + '/settle', { method: 'PUT' });
          toast('✅ ' + t('settleSuccess'));
          closeOrderDetail();
          loadOrders();
        } catch (e) {
          toast('❌ ' + e.message);
        }
      }, { type: 'primary', icon: '💰' });
    }

    async function cancelOrder(id) {
      showConfirm(t('cancelOrder'), t('confirmCancel'), async function() {
        try {
          await api('/cashier/orders/' + id + '/cancel', { method: 'PUT' });
          toast('✅ ' + t('cancelSuccess'));
          closeOrderDetail();
          loadOrders();
        } catch (e) {
          toast('❌ ' + e.message);
        }
      }, { type: 'warning', icon: '⚠️' });
    }

    async function refundOrder(id) {
      showConfirm(t('refundOrder'), t('confirmRefund'), async function() {
        try {
          await api('/cashier/orders/' + id + '/refund', { method: 'PUT' });
          toast('✅ ' + t('refundSuccess'));
          closeOrderDetail();
          loadOrders();
        } catch (e) {
          toast('❌ ' + e.message);
        }
      }, { type: 'danger', icon: '💸' });
    }

    async function loadReport() {
      try {
        const data = await api('/cashier/report/today');
        document.getElementById('reportContent').innerHTML =
          '<div class="report-card">' +
            '<div class="report-title">' + t('todayRevenue') + '</div>' +
            '<div class="report-amount">$' + data.totalRevenue + '</div>' +
            '<div class="report-stats">' +
              '<div class="report-stat"><div class="report-stat-value">' + data.orderCount + '</div><div class="report-stat-label">' + t('orderCount') + '</div></div>' +
              '<div class="report-stat"><div class="report-stat-value">$' + data.avgOrderValue + '</div><div class="report-stat-label">' + t('avgOrderValue') + '</div></div>' +
            '</div>' +
          '</div>' +
          (data.orders && data.orders.length ? '<div class="modal-section-title" style="margin-bottom:8px;">今日已结算订单</div>' + data.orders.map(o =>
            '<div class="dish-item"><span class="dish-name">📋 ' + (o.table_name || '-') + ' · ' + formatTime(o.createdAt) + '</span><span class="dish-price">$' + (parseFloat(o.total || 0).toFixed(2)) + '</span></div>'
          ).join('') : '<div class="empty-hint">今日暂无已结算订单</div>');
      } catch (e) {
        if (e.message.includes('没有')) {
          document.getElementById('reportContent').innerHTML = '<div class="empty-hint"><div class="empty-icon">🔒</div>' + t('noPermission') + '</div>';
        } else {
          toast('❌ ' + e.message);
        }
      }
    }

    function formatTime(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
      } catch (e) { return iso; }
    }

    async function init() {
      applyLang();
      const token = SLF.store.rawGet('cashierToken');
      if (!token) {
        document.documentElement.removeAttribute('data-cashier-session');
        return;
      }
      try {
        const info = JSON.parse(SLF.store.rawGet('cashierInfo') || '{}');
        cashierInfo = info;
        const storeId = SLF.store.rawGet('cashierStoreId') || '1';
        // 同步 storeId 到统一的 key，供 SLF.api 使用
        SLF.store.rawSet('storeId', storeId);
        document.getElementById('storeName').textContent = cashierInfo.storeName || ('店铺 #' + storeId);
        await loadOrders();
        setInterval(loadOrders, 15000);
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('orderDetailModal').addEventListener('click', function(e) {
      if (e.target === this) closeOrderDetail();
    });

    document.getElementById('confirmModal').addEventListener('click', function(e) {
      if (e.target === this) hideConfirm();
    });

    init();
  </script>
