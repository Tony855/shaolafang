<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title id="pageTitle">FoodFlow · 收银台</title>
<script>
  try { if (localStorage.getItem('cashierToken')) document.documentElement.setAttribute('data-cashier-session', '1'); } catch(e) {}
</script>
<link rel="stylesheet" href="assets/common.css?v=1791286805">
<link rel="stylesheet" href="assets/cashier.css?v=1791286805">
</head>
<body>

<!-- 登录提示（复用） -->
<div class="login-modal modal-overlay" id="loginModal">
  <div class="modal" style="text-align:center;max-width:360px;">
    <div style="font-size:48px;margin-bottom:16px;">💰</div>
    <h2 style="margin-bottom:8px;color:#ffd93d;font-size:20px;" id="loginTitle" data-i18n="reloginTitle">请重新登录</h2>
    <p style="color:#aaa;margin-bottom:20px;font-size:14px;" id="loginDesc" data-i18n="reloginDesc">登录已过期，请重新登录</p>
    <button class="btn btn-primary" style="width:100%;" id="loginBtn" onclick="goLogin()" data-i18n="relogin"><span data-i18n="relogin">重新登录</span></button>
  </div>
</div>

<!-- 主应用 -->
<div class="pos-app" id="posApp">

  <!-- ===== 顶部状态栏 ===== -->
  <header class="pos-header">
    <div class="pos-brand">
      <span class="pos-brand-icon">💰</span>
      <div>
        <div class="pos-brand-title" id="posBrandTitle">FoodFlow · 收银台</div>
        <div class="pos-brand-store" id="storeName">加载中...</div>
      </div>
    </div>
    <div class="pos-header-right">
      <div class="pos-cashier">
        <span class="pos-cashier-avatar">👤</span>
        <span id="cashierName">收银员</span>
      </div>
      <div class="pos-clock" id="clock">--:--:--</div>
      <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇬🇧 English</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="th">🇹🇭 ภาษาไทย</option>
        <option value="km">🇰🇭 ភាសាម្មេរ</option>
      </select>
      <button class="pos-header-btn" id="logoutBtn" onclick="logout()">退出</button>
    </div>
  </header>

  <!-- ===== 主体：左右分栏 ===== -->
  <main class="pos-main">

    <!-- 左侧：订单列表 -->
    <aside class="pos-left">
      <div class="pos-search-wrap">
        <input type="text" id="searchInput" class="pos-search" 
               placeholder="🔍 搜索桌号 / 订单号" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      </div>

      <div class="pos-tabs">
        <button class="pos-tab active" data-tab="pending" onclick="switchTab('pending')" id="tabPending">
          待结 <span class="pos-tab-count" id="pendingCount">0</span>
        </button>
        <button class="pos-tab" data-tab="settled" onclick="switchTab('settled')" id="tabSettled">
          已结 <span class="pos-tab-count" id="settledCount">0</span>
        </button>
        <button class="pos-tab" data-tab="refunded" onclick="switchTab('refunded')" id="tabRefunded">
          退款订单 <span class="pos-tab-count" id="refundedCount">0</span>
        </button>
      </div>

      <div class="pos-order-list" id="orderList"></div>

      <div class="pos-left-bottom">
        <div class="pos-stat">
          <div class="pos-stat-label" id="todayLabel">今日订单</div>
          <div class="pos-stat-value" id="todayCount">0</div>
        </div>
        <div class="pos-stat">
          <div class="pos-stat-label" id="revenueLabel">今日营收</div>
          <div class="pos-stat-value" id="todayRevenue">$0.00</div>
        </div>
      </div>
    </aside>

    <!-- 右侧：订单详情 -->
    <section class="pos-right">
      <div class="pos-detail-empty" id="detailEmpty">
        <div style="font-size:64px;opacity:.3;">🧾</div>
        <p>← 从左侧选择一个订单</p>
      </div>

      <div class="pos-detail" id="detailView" style="display:none;">
        <!-- 订单头部 -->
        <div class="pos-detail-header">
          <div class="pos-detail-title">
            <span class="pos-detail-table" id="detailTable">-</span>
            <span class="pos-detail-orderNo" id="detailOrderNo">-</span>
            <span class="pos-detail-badge" id="detailStatus">未结算</span>
            <span class="pos-detail-time" id="detailTime">-</span>
          </div>
          <div class="pos-detail-actions-top">
            <button class="pos-icon-btn" onclick="closeDetail()" title="关闭" data-i18n-title="close">✕</button>
          </div>
        </div>

        <!-- 菜品明细 -->
        <div class="pos-detail-body">
          <div class="pos-detail-items" id="detailItems"></div>
        </div>

        <!-- 金额汇总 -->
        <div class="pos-detail-footer">
          <div class="pos-amount-row">
            <span class="pos-amount-label" id="totalLabel" data-i18n="total">合计</span>
            <span class="pos-amount-value pos-amount-total" id="detailTotal">$0.00</span>
          </div>
          <div class="pos-amount-row pos-amount-receivable">
            <span class="pos-amount-label" data-i18n="receivable">应收</span>
            <span class="pos-amount-value pos-amount-due" id="detailDue">$0.00</span>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="pos-detail-btns" id="detailButtons"></div>
      </div>
    </section>

  </main>
</div>

<!-- ===== 收款弹窗 ===== -->
<div class="modal-overlay" id="paymentModal">
  <div class="payment-card">
    <button class="modal-close" onclick="closePaymentModal()">✕</button>
    <h2 class="payment-title" id="paymentTitle">收款</h2>
    <div class="payment-amount">
      <div class="payment-amount-label" data-i18n="receivableAmount">应收金额</div>
      <div class="payment-amount-value" id="paymentAmount">$0.00</div>
    </div>

    <div class="payment-methods">
      <button class="payment-method active" data-method="cash" onclick="selectPayMethod('cash')">
        <span class="pm-icon">💵</span>
        <span class="pm-label" data-i18n="cashPay">现金</span>
      </button>
      <button class="payment-method" data-method="wechat" onclick="selectPayMethod('wechat')">
        <span class="pm-icon">💚</span>
        <span class="pm-label" data-i18n="wechatPay">微信</span>
      </button>
      <button class="payment-method" data-method="alipay" onclick="selectPayMethod('alipay')">
        <span class="pm-icon">💙</span>
        <span class="pm-label" data-i18n="alipayPay">支付宝</span>
      </button>
      <button class="payment-method" data-method="card" onclick="selectPayMethod('card')">
        <span class="pm-icon">💳</span>
        <span class="pm-label" data-i18n="cardPay">刷卡</span>
      </button>
      <button class="payment-method" data-method="aba" onclick="selectPayMethod('aba')">
        <span class="pm-icon pm-icon-aba"><img src="assets/vendor/payment-icons/aba.png" alt="ABA"></span>
        <span class="pm-label">ABA</span>
      </button>
    </div>

    <div class="payment-cash-area" id="cashArea">
      <div class="payment-input-row">
        <label data-i18n="actualReceived">实收</label>
        <input type="number" id="cashReceived" class="payment-input" 
               placeholder="0.00" step="0.01" min="0" 
               oninput="onCashInput()">
      </div>
      <div class="payment-change-row">
        <span data-i18n="changeAmount">找零</span>
        <span class="payment-change-value" id="cashChange">$0.00</span>
      </div>
      <div class="payment-quick-cash" id="quickCash"></div>
    </div>

    <div class="payment-actions">
      <button class="btn btn-secondary" onclick="closePaymentModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" id="confirmPayBtn" onclick="confirmPay()" data-i18n="confirmPay">确认收款</button>
    </div>
  </div>
</div>

<!-- ===== KHQR 动态收款弹窗 ===== -->
<div class="modal-overlay" id="khqrModal">
  <div class="payment-card" style="max-width:460px;text-align:center;">
    <button class="modal-close" onclick="closeKhqrModal()">✕</button>
    <h2 class="payment-title">💳 <span data-i18n="khqrTitle">扫码收款</span></h2>

    <div class="payment-amount" style="padding:8px 0 16px;">
      <div class="payment-amount-label" data-i18n="receivableAmount">应收金额</div>
      <div class="payment-amount-value" id="khqrAmount">$0.00</div>
    </div>

    <div style="background:#fff;padding:14px;border-radius:14px;display:inline-block;box-shadow:0 4px 16px rgba(0,0,0,.08);">
      <img id="khqrImage" src="" alt="KHQR" style="display:block;width:280px;height:280px;object-fit:contain;">
    </div>

    <div style="margin-top:14px;color:#888;font-size:13px;">
      <div><span data-i18n="khqrMerchant">收款人：</span><strong id="khqrMerchant" style="color:#333;"></strong></div>
      <div style="margin-top:4px;font-family:'SF Mono',monospace;font-size:12px;color:#999;"><span id="khqrOrderNo"></span></div>
    </div>

    <div style="margin-top:16px;font-size:14px;color:#666;">
      <span data-i18n="khqrCountdown">二维码有效期：</span>
      <span id="khqrCountdown" style="font-family:'SF Mono',monospace;font-weight:700;color:#e85d3a;font-size:16px;">10:00</span>
    </div>

    <div id="khqrStatusBar" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:#f0f4ff;color:#5a6acf;font-size:13px;">
      <span data-i18n="khqrWaiting">等待客户扫码付款...</span>
    </div>

    <div class="payment-actions" style="margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeKhqrModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" id="khqrConfirmBtn" onclick="confirmKhqrReceived()" data-i18n="khqrReceived">✅ 已收到款</button>
    </div>
  </div>
</div>

<!-- ===== 确认弹窗（复用） ===== -->
<!-- ===== 退款弹窗 ===== -->
<div class="modal-overlay" id="refundModal">
  <div class="payment-card">
    <button class="modal-close" onclick="closeRefundModal()">✕</button>
    <h2 class="payment-title">💸 <span data-i18n="refundOrder">退款订单</span></h2>

    <div class="payment-amount">
      <div class="payment-amount-label" data-i18n="refundAmount">退款金额</div>
      <div class="payment-amount-value" id="refundAmount">$0.00</div>
    </div>

    <div class="refund-input-row" style="margin-bottom:14px;">
      <label data-i18n="refundAmountInput">退款金额</label>
      <input type="number" id="refundInput" class="refund-input" step="0.01" min="0" placeholder="0.00">
    </div>

    <div class="refund-form">
      <label class="refund-label"><span data-i18n="refundReason">退款原因</span> <span style="color:#e74c3c;">*</span></label>
      <select id="refundReason" class="refund-select">
        <option value="" data-i18n="selectReason">请选择...</option>
        <option value="customer" data-i18n="refundReasonCustomer">顾客要求</option>
        <option value="dish" data-i18n="refundReasonDish">菜品问题</option>
        <option value="service" data-i18n="refundReasonService">服务问题</option>
        <option value="wrong" data-i18n="refundReasonMistake">误操作</option>
        <option value="other" data-i18n="refundReasonOther">其他</option>
      </select>

      <label class="refund-label" style="margin-top:14px;" data-i18n="refundNoteOptional">备注（可选）</label>
      <textarea id="refundNote" class="refund-textarea" maxlength="200"
                placeholder="补充说明..." data-i18n-placeholder="refundNotePlaceholder"></textarea>
    </div>

    <div class="payment-actions" style="margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeRefundModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" id="confirmRefundBtn" onclick="confirmRefund()" data-i18n="confirmRefundBtn">确认退款</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:360px;text-align:center;">
    <button class="modal-close" onclick="hideConfirm()">✕</button>
    <div style="font-size:48px;margin-bottom:12px;" id="confirmIcon">⚠️</div>
    <div class="modal-title" id="confirmTitle" style="padding-right:0;"></div>
    <p style="color:#aaa;margin-bottom:20px;font-size:14px;" id="confirmMessage"></p>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn" onclick="hideConfirm()" id="confirmCancelBtn" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" onclick="executeConfirm()" id="confirmOkBtn" data-i18n="confirm">确定</button>
    </div>
  </div>
</div>

<script src="languages.min.js?v=1791334649"></script>
<script src="assets/core.js?v=1791286805"></script>
<script src="assets/modules/ui.js?v=1791334649"></script>
<script src="assets/modules/money.js?v=1791286805"></script>
<script src="assets/modules/order-status.js?v=1791286805"></script>
<script src="assets/modules/customer-group.js?v=1791286805"></script>
<script src="assets/modules/role.js?v=1791286805"></script>
<script src="assets/modules/idle.js?v=1791286805"></script>
<script src="assets/modules/pwa.js?v=1791286805"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="pages/cashier.js?v=1791334649"></script>
</body>
</html>
