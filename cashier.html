<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5">
  <title>鏀堕摱鍙?/title>
  <script>
    if (localStorage.getItem('cashierToken')) {
      document.documentElement.setAttribute('data-cashier-session', '1');
    }
  </script>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    :root{
      --primary: #667eea;
      --primary-light: #764ba2;
      --primary-dark: #5a67d8;
      --primary-bg: #f0f4ff;
      --gray-1: #f8f9fb;
      --gray-2: #eef0f2;
      --gray-3: #d5d8dd;
      --gray-4: #9ea3ac;
      --gray-5: #6b7078;
      --gray-6: #2d3138;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.15);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--gray-6);
      min-height: 100vh;
      padding-bottom: 70px;
      background: linear-gradient(145deg, #f0f4ff 0%, #e8ecf8 100%);
    }
    .toast{
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      color: #fff; padding: 8px 24px; border-radius: 30px;
      font-weight: 500; font-size: 14px; z-index: 999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show{ opacity: 1; }
    header{
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(102,126,234,0.3);
    }
    .header-left{ display: flex; align-items: center; gap: 10px; }
    .header-logo{ font-size: 20px; }
    .header-title{ font-size: 17px; font-weight: 700; }
    .header-store{ font-size: 12px; opacity: 0.9; }
    .header-right{ display: flex; align-items: center; gap: 8px; }
    .header-btn{
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
    .lang-select{
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      padding: 6px 8px; border-radius: 20px; font-size: 13px; cursor: pointer;
    }
    .lang-select option{ color: #333; }
    .tabs{
      display: flex; background: #fff; padding: 0 16px;
      border-bottom: 1px solid var(--gray-2); position: sticky; top: 56px; z-index: 99;
    }
    .tab{
      flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600;
      color: var(--gray-4); cursor: pointer; border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab.active{ color: var(--primary); border-bottom-color: var(--primary); }
    .content{ padding: 16px; }
    .order-card{
      background: #fff; border-radius: var(--radius); padding: 14px;
      margin-bottom: 12px; box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
    }
    .order-card.status-done{ border-left-color: #43e97b; }
    .order-card.status-canceled{ border-left-color: #f5576c; opacity: 0.7; }
    .order-card.status-refunded{ border-left-color: #ffa726; opacity: 0.7; }
    .order-header{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-table{ font-size: 16px; font-weight: 700; color: var(--gray-6); }
    .order-status{
      font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
    }
    .order-status.pending{ background: #fff3cd; color: #856404; }
    .order-status.done{ background: #d4edda; color: #155724; }
    .order-status.canceled{ background: #f8d7da; color: #721c24; }
    .order-status.refunded{ background: #ffe0b2; color: #e65100; }
    .order-info{ font-size: 13px; color: var(--gray-4); margin-bottom: 6px; }
    .order-dishes{ font-size: 13px; color: var(--gray-5); margin-bottom: 8px; }
    .order-footer{ display: flex; justify-content: space-between; align-items: center; }
    .order-total{ font-size: 18px; font-weight: 700; color: var(--primary); }
    .order-actions{ display: flex; gap: 8px; }
    .btn{
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-primary{ background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
    .btn-warning{ background: linear-gradient(135deg, #ffd93d, #ff9f43); color: #fff; }
    .btn-warning:hover{ transform: translateY(-2px); }
    .btn-danger{ background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: #fff; }
    .btn-danger:hover{ transform: translateY(-2px); }
    .btn-secondary{ background: var(--gray-2); color: var(--gray-5); }
    .btn:disabled{ opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .bottom-bar{
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      padding: 12px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .stat-item{ text-align: center; }
    .stat-value{ font-size: 18px; font-weight: 700; color: var(--primary); }
    .stat-label{ font-size: 11px; color: var(--gray-4); }
    .modal-overlay{
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 200; display: none;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.show{ display: flex; }
    .modal{
      background: #fff; border-radius: var(--radius); width: 100%; max-width: 400px;
      max-height: 80vh; overflow-y: auto; padding: 20px;
    }
    .modal-title{ font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--gray-6); }
    .modal-section{ margin-bottom: 16px; }
    .modal-section-title{ font-size: 14px; font-weight: 600; color: var(--gray-5); margin-bottom: 8px; }
    .dish-item{
      display: flex; justify-content: space-between; padding: 6px 0;
      border-bottom: 1px solid var(--gray-1); font-size: 14px;
    }
    .dish-name{ color: var(--gray-6); }
    .dish-qty{ color: var(--gray-4); margin: 0 8px; }
    .dish-price{ color: var(--gray-6); font-weight: 600; }
    .modal-total{
      display: flex; justify-content: space-between; padding: 12px 0;
      border-top: 2px solid var(--gray-2); font-size: 16px; font-weight: 700;
    }
    .modal-total .amount{ color: var(--primary); }
    .modal-actions{ display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions .btn{ flex: 1; }
    .empty-hint{ text-align: center; padding: 40px 20px; color: var(--gray-4); }
    .empty-icon{ font-size: 48px; margin-bottom: 12px; }
    .report-card{
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .report-title{ font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
    .report-amount{ font-size: 32px; font-weight: 700; margin-bottom: 16px; }
    .report-stats{ display: flex; justify-content: space-around; }
    .report-stat{ text-align: center; }
    .report-stat-value{ font-size: 20px; font-weight: 700; }
    .report-stat-label{ font-size: 12px; opacity: 0.8; }
    .login-modal{ display: none; }
    html:not([data-cashier-session="1"]) .login-modal{ display: flex; }
    html:not([data-cashier-session="1"]) .app-content{ display: none; }
  </style>
</head>
<body>
  <!-- 鐧诲綍鎻愮ず -->
  <div class="login-modal modal-overlay">
    <div class="modal" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">馃挵</div>
      <h2 style="margin-bottom:8px;" id="loginTitle">鏀堕摱鍛樼櫥褰?/h2>
      <p style="color:var(--gray-4);margin-bottom:20px;" id="loginDesc">璇峰厛鐧诲綍鏀堕摱鍛樿处鍙?/p>
      <button class="btn btn-primary" style="width:100%;" onclick="goLogin()">鍓嶅線鐧诲綍</button>
    </div>
  </div>

  <!-- 涓诲唴瀹?-->
  <div class="app-content">
    <header>
      <div class="header-left">
        <span class="header-logo">馃挵</span>
        <div>
          <div class="header-title" id="pageTitle">鏀堕摱鍙?/div>
          <div class="header-store" id="storeName">鍔犺浇涓?..</div>
        </div>
      </div>
      <div class="header-right">
        <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
          <option value="zh">涓枃</option>
          <option value="en">English</option>
          <option value="vi">Ti岷縩g Vi峄噒</option>
          <option value="th">喙勦笚喔?/option>
          <option value="km">釣佱煉釣樶焸釣?/option>
        </select>
        <button class="header-btn" onclick="logout()">閫€鍑?/button>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="orders" onclick="switchTab('orders')" id="tabOrders">璁㈠崟鍒楄〃</div>
      <div class="tab" data-tab="report" onclick="switchTab('report')" id="tabReport">鎶ヨ〃</div>
    </div>

    <div class="content">
      <!-- 璁㈠崟鍒楄〃 -->
      <div id="ordersView">
        <div id="orderList"></div>
      </div>

      <!-- 鎶ヨ〃 -->
      <div id="reportView" style="display:none;">
        <div id="reportContent"></div>
      </div>
    </div>

    <!-- 搴曢儴缁熻鏍?-->
    <div class="bottom-bar">
      <div class="stat-item">
        <div class="stat-value" id="pendingCount">0</div>
        <div class="stat-label" id="pendingLabel">寰呯粨绠?/div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label" id="todayLabel">浠婃棩璁㈠崟</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayRevenue">$0.00</div>
        <div class="stat-label" id="revenueLabel">浠婃棩钀ヤ笟棰?/div>
      </div>
    </div>
  </div>

  <!-- 璁㈠崟璇︽儏寮圭獥 -->
  <div class="modal-overlay" id="orderDetailModal">
    <div class="modal">
      <div class="modal-title" id="detailTitle">璁㈠崟璇︽儏</div>
      <div class="modal-section">
        <div class="modal-section-title" id="dishListTitle">鑿滃搧娓呭崟</div>
        <div id="detailDishes"></div>
      </div>
      <div class="modal-total">
        <span id="totalLabel">鍚堣</span>
        <span class="amount" id="detailTotal">$0.00</span>
      </div>
      <div class="modal-actions" id="detailActions"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="languages.min.js"></script>
  <script src="assets/common.js"></script>
  <script>
    let currentLang = localStorage.getItem('cashierLang') || localStorage.getItem('lang') || 'zh';
    let cashierInfo = null;
    let orders = [];
    let currentTab = 'orders';

    function t(key) {
      try {
        if (window.LANGUAGES && window.LANGUAGES[currentLang] && window.LANGUAGES[currentLang][key]) {
          return window.LANGUAGES[currentLang][key];
        }
        if (window.LANGUAGES && window.LANGUAGES.zh && window.LANGUAGES.zh[key]) {
          return window.LANGUAGES.zh[key];
        }
      } catch (e) {}
      const defaults = {
        cashier: '鏀堕摱鍛?, cashierLogin: '鏀堕摱鍛樼櫥褰?, cashierLoginDesc: '璇疯緭鍏ユ敹閾跺憳鐢ㄦ埛鍚嶅拰瀵嗙爜',
        orderList: '璁㈠崟鍒楄〃', report: '鎶ヨ〃', pendingSettlement: '寰呯粨绠?, settled: '宸茬粨绠?,
        canceled: '宸插彇娑?, refunded: '宸查€€娆?, settleOrder: '缁撶畻璁㈠崟', cancelOrder: '鍙栨秷璁㈠崟',
        refundOrder: '閫€娆?, orderDetail: '璁㈠崟璇︽儏', dishList: '鑿滃搧娓呭崟', total: '鍚堣',
        todayRevenue: '浠婃棩钀ヤ笟棰?, orderCount: '璁㈠崟鏁?, avgOrderValue: '瀹㈠崟浠?,
        pendingCount: '寰呯粨绠?, todayCount: '浠婃棩璁㈠崟', confirmSettle: '纭缁撶畻璇ヨ鍗曪紵',
        confirmCancel: '纭鍙栨秷璇ヨ鍗曪紵', confirmRefund: '纭閫€娆捐璁㈠崟锛?,
        settleSuccess: '缁撶畻鎴愬姛', cancelSuccess: '鍙栨秷鎴愬姛', refundSuccess: '閫€娆炬垚鍔?,
        noPermission: '鏃犳潈闄?, noOrders: '鏆傛棤璁㈠崟', loading: '鍔犺浇涓?..',
        logout: '閫€鍑虹櫥褰?, confirmLogout: '纭閫€鍑虹櫥褰曪紵'
      };
      return defaults[key] || key;
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function goLogin() {
      window.location.href = '/login?type=cashier';
    }

    function logout() {
      if (confirm(t('confirmLogout'))) {
        const token = localStorage.getItem('cashierToken');
        if (token) {
          fetch('/api/cashier/logout', {
            method: 'POST',
            headers: { 'X-Cashier-Token': token, 'Content-Type': 'application/json' }
          }).catch(() => {});
        }
        localStorage.removeItem('cashierToken');
        localStorage.removeItem('cashierStoreId');
        localStorage.removeItem('cashierInfo');
        window.location.href = '/login?type=cashier';
      }
    }

    function changeLang(lang) {
      currentLang = lang;
      localStorage.setItem('cashierLang', lang);
      localStorage.setItem('lang', lang);
      applyLang();
      loadOrders();
      if (currentTab === 'report') loadReport();
    }

    function applyLang() {
      document.getElementById('langSelect').value = currentLang;
      document.getElementById('pageTitle').textContent = t('cashier') + t('orderList');
      document.getElementById('tabOrders').textContent = t('orderList');
      document.getElementById('tabReport').textContent = t('report');
      document.getElementById('pendingLabel').textContent = t('pendingCount');
      document.getElementById('todayLabel').textContent = t('todayCount');
      document.getElementById('revenueLabel').textContent = t('todayRevenue');
      document.getElementById('loginTitle').textContent = t('cashierLogin');
      document.getElementById('loginDesc').textContent = t('cashierLoginDesc');
      document.getElementById('detailTitle').textContent = t('orderDetail');
      document.getElementById('dishListTitle').textContent = t('dishList');
      document.getElementById('totalLabel').textContent = t('total');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelector('.tab[data-tab="' + tab + '"]').classList.add('active');
      document.getElementById('ordersView').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('reportView').style.display = tab === 'report' ? 'block' : 'none';
      if (tab === 'report') loadReport();
    }

    async function api(url, options = {}) {
      const token = localStorage.getItem('cashierToken');
      const storeId = localStorage.getItem('cashierStoreId') || '1';
      const headers = {
        'Content-Type': 'application/json',
        'X-Cashier-Token': token || '',
        'X-Store-Id': storeId
      };
      const res = await fetch('/api' + url, { ...options, headers });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '璇锋眰澶辫触');
      return data;
    }

    async function loadOrders() {
      try {
        const data = await api('/cashier/orders');
        orders = data.orders || [];
        renderOrders();
        updateBottomStats();
      } catch (e) {
        if (e.message.includes('璇峰厛鐧诲綍')) {
          localStorage.removeItem('cashierToken');
          window.location.href = '/login?type=cashier';
        } else {
          toast('鉂?' + e.message);
        }
      }
    }

    function renderOrders() {
      const container = document.getElementById('orderList');
      if (!orders.length) {
        container.innerHTML = '<div class="empty-hint"><div class="empty-icon">馃搵</div>' + t('noOrders') + '</div>';
        return;
      }
      container.innerHTML = orders.map(order => {
        const statusClass = order.status === 'done' ? 'done' : order.status === 'canceled' ? 'canceled' : order.status === 'refunded' ? 'refunded' : 'pending';
        const statusText = order.status === 'done' ? t('settled') : order.status === 'canceled' ? t('canceled') : order.status === 'refunded' ? t('refunded') : t('pendingSettlement');
        const dishes = (order.items || []).map(i => i.name + '脳' + i.quantity).join('銆?);
        const canSettle = cashierInfo?.permissions?.can_settle && order.status === 'pending';
        const canCancel = cashierInfo?.permissions?.can_cancel && order.status === 'pending';
        const canRefund = cashierInfo?.permissions?.can_refund && order.status === 'done';
        return '<div class="order-card status-' + statusClass + '" onclick="showOrderDetail(' + order.id + ')">' +
          '<div class="order-header">' +
            '<span class="order-table">馃搵 ' + (order.table_name || '-') + (order.customer_name ? ' 路 ' + order.customer_name : '') + '</span>' +
            '<span class="order-status ' + statusClass + '">' + statusText + '</span>' +
          '</div>' +
          '<div class="order-info">馃晲 ' + formatTime(order.createdAt) + ' 路 ' + (order.items?.length || 0) + '閬撹彍</div>' +
          '<div class="order-dishes">' + (dishes || '-') + '</div>' +
          '<div class="order-footer">' +
            '<span class="order-total">$' + (parseFloat(order.total || 0).toFixed(2)) + '</span>' +
            '<div class="order-actions" onclick="event.stopPropagation()">' +
              (canSettle ? '<button class="btn btn-primary" onclick="settleOrder(' + order.id + ')">' + t('settleOrder') + '</button>' : '') +
              (canCancel ? '<button class="btn btn-warning" onclick="cancelOrder(' + order.id + ')">' + t('cancelOrder') + '</button>' : '') +
              (canRefund ? '<button class="btn btn-danger" onclick="refundOrder(' + order.id + ')">' + t('refundOrder') + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function updateBottomStats() {
      const pending = orders.filter(o => o.status === 'pending').length;
      const today = new Date().toISOString().split('T')[0];
      const todayOrders = orders.filter(o => (o.createdAt || '').startsWith(today));
      const revenue = todayOrders.filter(o => o.status === 'done').reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('todayCount').textContent = todayOrders.length;
      document.getElementById('todayRevenue').textContent = '$' + revenue.toFixed(2);
    }

    function showOrderDetail(id) {
      const order = orders.find(o => o.id === id);
      if (!order) return;
      document.getElementById('detailDishes').innerHTML = (order.items || []).map(item =>
        '<div class="dish-item">' +
          '<span class="dish-name">' + item.name + '</span>' +
          '<span class="dish-qty">脳' + item.quantity + '</span>' +
          '<span class="dish-price">$' + (parseFloat(item.price || 0) * item.quantity).toFixed(2) + '</span>' +
        '</div>'
      ).join('') || '<div style="text-align:center;color:var(--gray-4);padding:20px;">鏃犺彍鍝?/div>';
      document.getElementById('detailTotal').textContent = '$' + (parseFloat(order.total || 0).toFixed(2));
      const canSettle = cashierInfo?.permissions?.can_settle && order.status === 'pending';
      const canCancel = cashierInfo?.permissions?.can_cancel && order.status === 'pending';
      const canRefund = cashierInfo?.permissions?.can_refund && order.status === 'done';
      document.getElementById('detailActions').innerHTML =
        '<button class="btn btn-secondary" onclick="closeOrderDetail()">鍏抽棴</button>' +
        (canSettle ? '<button class="btn btn-primary" onclick="settleOrder(' + order.id + ')">' + t('settleOrder') + '</button>' : '') +
        (canCancel ? '<button class="btn btn-warning" onclick="cancelOrder(' + order.id + ')">' + t('cancelOrder') + '</button>' : '') +
        (canRefund ? '<button class="btn btn-danger" onclick="refundOrder(' + order.id + ')">' + t('refundOrder') + '</button>' : '');
      document.getElementById('orderDetailModal').classList.add('show');
    }

    function closeOrderDetail() {
      document.getElementById('orderDetailModal').classList.remove('show');
    }

    async function settleOrder(id) {
      if (!confirm(t('confirmSettle'))) return;
      try {
        await api('/cashier/orders/' + id + '/settle', { method: 'PUT' });
        toast('鉁?' + t('settleSuccess'));
        closeOrderDetail();
        loadOrders();
      } catch (e) {
        toast('鉂?' + e.message);
      }
    }

    async function cancelOrder(id) {
      if (!confirm(t('confirmCancel'))) return;
      try {
        await api('/cashier/orders/' + id + '/cancel', { method: 'PUT' });
        toast('鉁?' + t('cancelSuccess'));
        closeOrderDetail();
        loadOrders();
      } catch (e) {
        toast('鉂?' + e.message);
      }
    }

    async function refundOrder(id) {
      if (!confirm(t('confirmRefund'))) return;
      try {
        await api('/cashier/orders/' + id + '/refund', { method: 'PUT' });
        toast('鉁?' + t('refundSuccess'));
        closeOrderDetail();
        loadOrders();
      } catch (e) {
        toast('鉂?' + e.message);
      }
    }

    async function loadReport() {
      try {
        const data = await api('/cashier/report/today');
        document.getElementById('reportContent').innerHTML =
          '<div class="report-card">' +
            '<div class="report-title">' + t('todayRevenue') + '</div>' +
            '<div class="report-amount">$' + data.totalRevenue + '</div>' +
            '<div class="report-stats">' +
              '<div class="report-stat"><div class="report-stat-value">' + data.orderCount + '</div><div class="report-stat-label">' + t('orderCount') + '</div></div>' +
              '<div class="report-stat"><div class="report-stat-value">$' + data.avgOrderValue + '</div><div class="report-stat-label">' + t('avgOrderValue') + '</div></div>' +
            '</div>' +
          '</div>' +
          (data.orders && data.orders.length ? '<div class="modal-section-title" style="margin-bottom:8px;">浠婃棩宸茬粨绠楄鍗?/div>' + data.orders.map(o =>
            '<div class="dish-item"><span class="dish-name">馃搵 ' + (o.table_name || '-') + ' 路 ' + formatTime(o.createdAt) + '</span><span class="dish-price">$' + (parseFloat(o.total || 0).toFixed(2)) + '</span></div>'
          ).join('') : '<div class="empty-hint">浠婃棩鏆傛棤宸茬粨绠楄鍗?/div>');
      } catch (e) {
        if (e.message.includes('娌℃湁')) {
          document.getElementById('reportContent').innerHTML = '<div class="empty-hint"><div class="empty-icon">馃敀</div>' + t('noPermission') + '</div>';
        } else {
          toast('鉂?' + e.message);
        }
      }
    }

    function formatTime(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
      } catch (e) { return iso; }
    }

    async function init() {
      applyLang();
      const token = localStorage.getItem('cashierToken');
      if (!token) {
        document.documentElement.removeAttribute('data-cashier-session');
        return;
      }
      try {
        const info = JSON.parse(localStorage.getItem('cashierInfo') || '{}');
        cashierInfo = info;
        const storeId = localStorage.getItem('cashierStoreId') || '1';
        document.getElementById('storeName').textContent = '搴楅摵 #' + storeId;
        await loadOrders();
        setInterval(loadOrders, 15000);
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('orderDetailModal').addEventListener('click', function(e) {
      if (e.target === this) closeOrderDetail();
    });

    init();
  </script>
</body>
</html>
