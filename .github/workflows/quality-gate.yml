name: Quality Gate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, audit and dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          find server routes pages -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -path './node_modules' -prune -o -type f -name '*.sh' -print0)

      - name: Python syntax
        run: python3 -m compileall -q scripts

      - name: Strict language validation
        run: npm run check:lang:strict

      - name: Repository code audit
        run: python3 scripts/audit-code.py --verbose

      - name: Run tests when defined
        run: npm test --if-present
