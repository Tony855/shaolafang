<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#e85d3a"><script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>FoodFlow 外卖点餐</title>
<style>
*{box-sizing:border-box}html{width:100%;min-width:0;max-width:100%;margin:0;overflow-x:clip}body{width:100%;min-width:0;max-width:100%;min-height:100%;margin:0;overflow-x:clip;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:#f4f6fa;color:#202b3b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:max(30px,env(safe-area-inset-bottom,0px))}
body>header{display:flex;width:100%;max-width:none;min-width:0;margin:0;box-sizing:border-box;background:linear-gradient(135deg,#ff8a4c 0%,#f0643c 52%,#e84a2a 100%);color:#fff;padding:clamp(16px,3vw,26px) max(18px,calc((100% - 980px)/2));flex-direction:column;justify-content:center;gap:6px;overflow:hidden;}
header h1{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0;max-width:100%;font-size:clamp(19px,2.5vw,23px);line-height:1.3;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere;}
header p{margin:0;max-width:100%;opacity:.94;font-size:13px;line-height:1.5;overflow-wrap:anywhere;}.load-retry{align-self:flex-start;border:1px solid #ffffff99;border-radius:999px;background:#ffffff20;color:#fff;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.load-retry[hidden]{display:none}.load-retry:disabled{opacity:.6;cursor:wait}
@media(max-width:720px){header{padding:calc(16px + env(safe-area-inset-top,0px)) 14px 17px;gap:5px}header h1{font-size:clamp(18px,5vw,21px);gap:6px}header p{font-size:12px}}
.telegram-entry{max-width:980px;margin:12px auto 0;padding:0 14px;display:flex;justify-content:flex-end;gap:8px;align-items:center}.telegram-entry button{border:1px solid #d9e1eb;border-radius:999px;background:#fff;color:#34465e;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}.telegram-entry button:disabled{opacity:.55;cursor:not-allowed}
.customer-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.customer-tools button{border:1px solid #d9e1eb;border-radius:9px;background:#fff;color:#34465e;padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}.customer-tools button.primary{background:#e85d3a;border-color:#e85d3a;color:#fff}
#recentDeliveryOrders{max-width:980px;margin:12px auto 0;padding:0 14px}.recent-order{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #edf0f4}.recent-order a{color:#d94d2d;font-weight:700;text-decoration:none;white-space:nowrap}
#trackingEntryPanel{max-width:980px;margin:12px auto;padding:0 14px}#trackingEntryPanel .panel{border:1px solid #f3c5b7;background:#fffaf8}
@media(max-width:480px){.recent-order{align-items:flex-start;flex-direction:column;gap:5px}.customer-tools button{flex:1 1 auto}}.telegram-entry span{font-size:12px;color:#64748b}
main{max-width:980px;margin:18px auto;padding:0 14px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 24px #14243b0c;margin-bottom:15px}
h2{font-size:17px;margin:0 0 14px}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{border:1px solid #e7ebf1;border-radius:13px;padding:13px;display:flex;flex-direction:column;min-height:138px}
.item strong{font-size:15px}.desc{color:#7c8797;font-size:12px;min-height:30px;margin:5px 0}.price{font-weight:700;color:#d94d2d;margin-top:auto}
.controls{display:flex;align-items:center;gap:12px;margin-top:10px}.controls button{width:30px;height:30px;border:0;border-radius:9px;background:#fff0e9;color:#c64c2d;font-size:19px}
.qty{min-width:18px;text-align:center;font-weight:700}
label{display:block;font-size:13px;color:#596579;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #dce2ea;border-radius:10px;padding:11px;font:inherit;background:#fff;color:#202b3b}textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cart-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0}
.submit{width:100%;border:0;border-radius:11px;background:#e85d3a;color:#fff;padding:13px;font-size:15px;font-weight:750;cursor:pointer}
.submit:disabled{opacity:.5;cursor:not-allowed}.muted{font-size:12px;color:#8792a2}.error{color:#b42318;font-size:13px;margin-top:9px}.hidden{display:none}
@media(max-width:720px){.layout{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){.menu{grid-template-columns:1fr}.row{grid-template-columns:1fr}}

/* Delivery storefront: category navigation, complete image cards and dual-currency totals. */
.store-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.store-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.store-tools select,.store-tools input{width:auto;min-width:130px;padding:8px 10px;font-size:13px}
.category-nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:2px 0 12px;margin-bottom:12px;scrollbar-width:thin}
.category-tab{flex:0 0 auto;border:1px solid #e5e9f0;border-radius:999px;background:#f7f8fb;color:#475467;padding:8px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.category-tab.active{background:#e85d3a;border-color:#e85d3a;color:#fff}
.category-tab:focus-visible,.controls button:focus-visible,.submit:focus-visible{outline:3px solid #f6b19c;outline-offset:2px}
.menu-meta{display:flex;justify-content:space-between;gap:8px;color:#8792a2;font-size:12px;margin:0 0 10px}
.menu{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-items:stretch}
.item{padding:0;overflow:hidden;min-height:0}
.item-photo{width:100%;height:150px;display:block;object-fit:cover;background:#fff0e8}
.item-photo-fallback{width:100%;height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#fff0e8,#f1f3f8);font-size:42px}
.item-content{padding:12px;display:flex;flex:1;flex-direction:column}
.item strong{line-height:1.4}
.item .price{line-height:1.5;margin-top:8px}
.secondary-price{display:block;color:#7b8492;font-size:12px;font-weight:600}
.item .controls{margin-top:12px}
.item .controls button{cursor:pointer}
.empty-category{grid-column:1/-1;border:1px dashed #d8dee8;border-radius:12px;padding:20px;text-align:center;color:#8792a2;background:#fafbfc}
.cart-line{align-items:flex-start}
.cart-line strong{text-align:right;white-space:normal;overflow-wrap:anywhere;max-width:55%;flex:0 1 auto}
.total{align-items:flex-start;gap:12px}
#total{text-align:right}
@media(max-width:1024px){main{width:100%;max-width:760px}.layout{grid-template-columns:minmax(0,1fr);gap:0}}
@media(max-width:720px){
 body>header{padding:calc(16px + env(safe-area-inset-top,0px)) 14px 17px}
 .telegram-entry{width:100%;max-width:760px;margin:10px auto 0;padding:0 12px;justify-content:center;flex-wrap:wrap}
 main{width:100%;margin:12px auto;padding:0 10px}
 .layout{grid-template-columns:minmax(0,1fr);gap:0}
 .layout>section,.layout>aside{width:100%;min-width:0}
 .panel{width:100%;min-width:0;padding:clamp(11px,3vw,16px);border-radius:14px}
 .store-heading{align-items:stretch;gap:9px}
 .store-tools{width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
 .store-tools select,.store-tools input{width:100%;min-width:0;max-width:100%}
 .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .item{min-width:0}
 .item-photo,.item-photo-fallback{height:clamp(96px,25vw,140px)}
 .item-content{min-width:0;padding:9px}
 .item strong{font-size:clamp(12px,3.3vw,14px);overflow-wrap:anywhere}
 .desc{font-size:11px;min-height:34px;overflow-wrap:anywhere}
 .item .price{font-size:clamp(12px,3.2vw,14px);overflow-wrap:anywhere}
 .controls{gap:8px;flex-wrap:wrap}
 .row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
 .menu{grid-template-columns:minmax(0,1fr)}
 .item{display:grid;grid-template-columns:clamp(104px,32vw,148px) minmax(0,1fr);align-items:stretch}
 .item-photo,.item-photo-fallback{width:100%;height:100%;min-height:clamp(132px,38vw,164px)}
 .item-content{padding:clamp(8px,2.5vw,12px)}
 .store-heading{flex-direction:column}
 .store-tools{grid-template-columns:minmax(0,1fr) auto}
 .menu-meta{font-size:11px}
 .cart-line{min-width:0;flex-wrap:wrap}
 .cart-line>span:first-child{min-width:0;overflow-wrap:anywhere}
.cart-line strong{white-space:normal;overflow-wrap:anywhere}
 .total{font-size:16px;flex-wrap:wrap}
 .row{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:360px){
 main{padding:0 8px}
 .panel{padding:10px}
 .item{grid-template-columns:96px minmax(0,1fr)}
 .item-photo,.item-photo-fallback{min-height:128px}
 .category-nav{gap:6px}
 .category-tab{padding:7px 11px;font-size:12px}
 .telegram-entry button{max-width:100%;padding:8px 11px;font-size:12px}
}


/* Compact checkout cart columns on very narrow phones. */
@media(max-width:390px){.cart-line strong{max-width:48%}}
</style></head>
<body>
<header><h1>🛵 FoodFlow 外卖点餐</h1><p id="storeName" role="status" aria-live="polite">正在加载门店…</p><button id="retryStoreLoad" class="load-retry" type="button" hidden>重新加载门店</button></header>
<div class="telegram-entry"><span id="telegramBindingStatus" role="status">Telegram 通知未绑定</span><button id="telegramBindingButton" type="button">✈️ 绑定 Telegram 通知</button></div>
<section id="recentDeliveryOrders" class="panel" hidden aria-live="polite"><h2>我的配送订单</h2><div id="recentDeliveryOrderList"></div><p class="muted">仅显示此浏览器保存的订单入口。请勿在公共设备保存顾客资料。</p></section>
<section id="trackingEntryPanel" hidden><div class="panel"><h2>订单已创建</h2><p id="trackingEntryMessage" class="muted">你可以随时查看骑手配送进度和最后一次定位。</p><button class="submit" type="button" id="openTrackingEntry">📍 查看配送进度</button></div></section>
<main>
<div class="layout">
<section class="panel">
<div class="store-heading"><h2>选择菜品</h2><div class="store-tools"><input id="menuSearch" type="search" placeholder="搜索菜品…" aria-label="搜索菜品"><span id="currencyHint" class="muted"></span></div></div>
<nav id="categoryNav" class="category-nav" aria-label="菜单分类"><span class="muted">正在加载分类…</span></nav>
<div class="menu-meta"><span id="menuCount">正在加载菜单…</span><span id="categoryHint"></span></div>
<div id="menu" class="menu" aria-live="polite"><p class="muted">正在加载菜单…</p></div></section>
<aside>
<section class="panel"><h2>配送信息</h2>
<form id="orderForm">
<label for="recipientName">收件人姓名</label><input id="recipientName" name="recipient_name" maxlength="120" required autocomplete="name">
<div class="customer-tools"><button class="primary" type="button" id="saveDeliveryProfile">保存配送资料</button><button type="button" id="clearDeliveryProfile">清除已保存资料</button><span id="deliveryProfileStatus" class="muted" role="status">资料仅保存在此浏览器</span></div>
<div class="row"><div><label for="recipientPhone">联系电话</label><input id="recipientPhone" name="recipient_phone" maxlength="40" required autocomplete="tel" inputmode="tel"></div><div><label for="paymentMethod">支付方式</label><select id="paymentMethod" name="payment_method"><option value="cash">现金（送达付款）</option><option value="khqr">KHQR（提交后生成收款码）</option></select></div></div>
<label for="deliveryAddress">详细配送地址</label><textarea id="deliveryAddress" name="delivery_address" maxlength="500" required placeholder="请填写街道、楼层、门牌号及附近地标"></textarea>
<label for="orderNote">订单备注（选填）</label><textarea id="orderNote" name="note" maxlength="200" placeholder="口味要求或配送备注"></textarea>
<div id="cart"></div><div class="total"><span>订单合计</span><span id="total">0.00 USD</span></div>
<button class="submit" id="submit" type="submit" disabled>提交外卖订单</button><div id="message" class="error" role="alert"></div>
<p class="muted">菜品价格和订单金额以服务器核算为准。提交后可使用专属凭证查看配送进度。</p>
</form></section>
<section class="panel hidden" id="paymentPanel">
<h2>KHQR 安全收款</h2><p class="muted" id="paymentSummary">请使用银行 App 扫描二维码付款。</p>
<img id="paymentQr" alt="KHQR 收款码" style="display:block;width:240px;max-width:100%;margin:14px auto">
<button class="submit" type="button" id="notifyPayment">我已付款，通知门店确认</button>
<button class="submit" type="button" id="trackOrder" style="margin-top:8px;background:#34465e">查看配送进度</button>
<div id="paymentMessage" class="muted" role="status"></div>
</section></aside></div></main>
<script>
(() => {
 'use strict';
 const params=new URLSearchParams(location.search),storeId=params.get('store_id')||'',storeEntry=params.get('entry')||'',botPath=params.get('bot')||'',telegramEntry=params.get('telegram')==='1';
 const telegramApp=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
 if(telegramApp){telegramApp.ready();telegramApp.expand();document.documentElement.classList.add('telegram-miniapp');}
 const $=id=>document.getElementById(id),cart=new Map();
 async function fetchWithTimeout(url,options={}){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  let settled=false;
  const clearTimer=()=>{if(!settled){settled=true;clearTimeout(timer);}};
  try{
   const response=await fetch(url,{...options,signal:controller.signal});
   const readJson=response.json.bind(response);
   response.json=async(...args)=>{try{return await readJson(...args);}finally{clearTimer();}};
   return response;
  }catch(error){clearTimer();throw error;}
 }
 function getCustomerIdentityToken(){
  try{
   const key='foodflow_customer_identity_v1',saved=localStorage.getItem(key)||'';
   if(/^[a-f0-9]{64}$/.test(saved))return saved;
   if(!window.crypto||typeof window.crypto.getRandomValues!=='function')return '';
   const bytes=new Uint8Array(32);window.crypto.getRandomValues(bytes);
   const token=Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
   localStorage.setItem(key,token);return token;
  }catch(_){return '';}
 }
 const customerToken=getCustomerIdentityToken();
 const profileKey='foodflow_delivery_profile_v1:'+storeId,recentOrdersKey='foodflow_delivery_recent_orders_v1:'+storeId;
 function readLocalJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')??fallback;}catch(_){return fallback;}}
 function saveDeliveryProfile(){const p={recipient_name:$('recipientName').value.trim().slice(0,120),recipient_phone:$('recipientPhone').value.trim().slice(0,40),delivery_address:$('deliveryAddress').value.trim().slice(0,500)};
  if(!p.recipient_name||!p.recipient_phone||!p.delivery_address){$('deliveryProfileStatus').textContent='请完整填写姓名、电话和配送地址后保存';return false;}
  try{localStorage.setItem(profileKey,JSON.stringify(p));$('deliveryProfileStatus').textContent='配送资料已保存，可随时修改后再次保存';return true;}catch(_){$('deliveryProfileStatus').textContent='浏览器存储不可用，无法保存资料';return false;}
 }
 function loadDeliveryProfile(){const p=readLocalJson(profileKey,{});if(!p||typeof p!=='object')return;
  if(p.recipient_name)$('recipientName').value=String(p.recipient_name).slice(0,120);if(p.recipient_phone)$('recipientPhone').value=String(p.recipient_phone).slice(0,40);if(p.delivery_address)$('deliveryAddress').value=String(p.delivery_address).slice(0,500);
  if(p.recipient_name||p.recipient_phone||p.delivery_address)$('deliveryProfileStatus').textContent='已载入保存的配送资料，修改后可重新保存';
 }
 function rememberTrackingOrder(orderId,token,orderNo){if(!Number.isSafeInteger(Number(orderId))||Number(orderId)<=0||!/^[a-f0-9]{64}$/.test(String(token||'')))return;
  const records=readLocalJson(recentOrdersKey,[]).filter(x=>x&&Number(x.orderId)!==Number(orderId));records.unshift({orderId:Number(orderId),token:String(token),orderNo:String(orderNo||orderId).slice(0,80)});
  try{localStorage.setItem(recentOrdersKey,JSON.stringify(records.slice(0,10)));}catch(_){}renderRecentTrackingOrders();
 }
 function renderRecentTrackingOrders(){const host=$('recentDeliveryOrderList'),panel=$('recentDeliveryOrders');if(!host||!panel)return;host.replaceChildren();
  const records=readLocalJson(recentOrdersKey,[]).filter(x=>x&&Number.isSafeInteger(Number(x.orderId))&&Number(x.orderId)>0&&/^[a-f0-9]{64}$/.test(String(x.token||''))).slice(0,10);
  if(!records.length){panel.hidden=true;return;}records.forEach(x=>{const row=document.createElement('div');row.className='recent-order';const label=document.createElement('span');label.textContent='订单 '+String(x.orderNo||x.orderId);row.append(label);const link=document.createElement('a');link.href='/delivery/track/'+Number(x.orderId)+'#token='+encodeURIComponent(x.token);link.textContent='查看配送进度';link.rel='noopener';row.append(link);host.append(row);});panel.hidden=false;
 }
 function showTrackingEntry(url,message){if(typeof url!=='string'||!url.startsWith('/delivery/track/'))return;$('openTrackingEntry').onclick=()=>{location.href=url;};$('trackingEntryMessage').textContent=message||'订单已创建，可随时查看配送进度。';$('trackingEntryPanel').hidden=false;$('trackingEntryPanel').scrollIntoView({behavior:'smooth',block:'nearest'});}
 function createCheckoutKey(){
  if(!window.crypto||typeof window.crypto.getRandomValues!=='function')return '';
  const bytes=new Uint8Array(32);window.crypto.getRandomValues(bytes);
  return Array.from(bytes,value=>value.toString(16).padStart(2,'0')).join('');
 }
 const checkoutKeyName='foodflow_delivery_checkout_key_v1:'+storeId;
 function getCheckoutKey(){
  try{
   const saved=sessionStorage.getItem(checkoutKeyName)||'';
   if(/^[a-f0-9]{64}$/.test(saved))return saved;
   const key=createCheckoutKey();if(key)sessionStorage.setItem(checkoutKeyName,key);return key;
  }catch(_){return '';}
 }
 let checkoutKey=getCheckoutKey();
 function rotateCheckoutKey(){
  checkoutKey=createCheckoutKey();
  try{if(checkoutKey)sessionStorage.setItem(checkoutKeyName,checkoutKey);}catch(_){checkoutKey='';}
 }
 let telegramBound=false,telegramBusy=false;
 async function refreshTelegramBinding(){
  const button=$('telegramBindingButton'),status=$('telegramBindingStatus');
  if(!button||!status)return;
  button.disabled=!customerToken||!/^\d+$/.test(storeId)||telegramBusy;
  if(!customerToken){status.textContent='浏览器无法保存顾客身份，请允许本地存储后重试';return;}
  if(!/^\d+$/.test(storeId)){status.textContent='门店链接无效';return;}
  try{
   const response=await fetchWithTimeout('/api/public/delivery/customer-telegram/binding?store_id='+encodeURIComponent(storeId),{headers:{'X-Customer-Token':customerToken},cache:'no-store'});
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data.error||'读取绑定状态失败');
   telegramBound=data.bound===true;
   status.textContent=telegramBound?'Telegram 通知已绑定':'Telegram 通知尚未绑定';
   button.textContent=telegramBound?'解除 Telegram 绑定':'✈️ 绑定 Telegram 通知';
  }catch(error){status.textContent=error.message||'Telegram 状态暂不可用';}
 }
 async function toggleTelegramBinding(){
  if(telegramBusy)return;
  if(!customerToken){$('telegramBindingStatus').textContent='无法建立安全的顾客身份凭证';return;}
  const popup=telegramBound?null:window.open('about:blank','_blank');
  telegramBusy=true;$('telegramBindingButton').disabled=true;
  try{
   if(telegramBound){
    if(!window.confirm('确定解除此门店的 Telegram 通知绑定吗？'))return;
    const response=await fetchWithTimeout('/api/public/delivery/customer-telegram/binding?store_id='+encodeURIComponent(storeId),{method:'DELETE',headers:{'X-Customer-Token':customerToken},cache:'no-store'});
    const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'解除绑定失败');
    telegramBound=false;$('telegramBindingStatus').textContent='Telegram 通知已解除绑定';
   }else{
    const response=await fetchWithTimeout('/api/public/delivery/customer-telegram/binding/start',{method:'POST',headers:{'Content-Type':'application/json','X-Customer-Token':customerToken},body:JSON.stringify({store_id:Number(storeId)})});
    const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'无法生成 Telegram 绑定入口');
    if(!data.deepLink)throw new Error('Telegram 绑定链接无效');
    if(popup){popup.opener=null;popup.location.replace(data.deepLink);}else window.location.href=data.deepLink;
    $('telegramBindingStatus').textContent='请在 Telegram 中点击 Start 完成绑定，再返回本页面';
   }
  }catch(error){if(popup&&!popup.closed)popup.close();$('telegramBindingStatus').textContent=error.message||'Telegram 操作失败';}
  finally{telegramBusy=false;$('telegramBindingButton').disabled=!customerToken;await refreshTelegramBinding();}
 }
 $('telegramBindingButton').addEventListener('click',toggleTelegramBinding);

 window.addEventListener('focus',refreshTelegramBinding);
 let menu=[],categories=[],rates=new Map(),maxQty=100,createdOrderId=null,createdTrackingUrl='';
 let primaryCurrency={code:'USD',symbol:'$',rate:1},secondaryCurrency=null,dualEnabled=false,currentCategory='__ALL__',searchTerm='';
 const escText=value=>String(value??'');
 function currencyRate(code){const rate=Number(rates.get(String(code||'USD').toUpperCase()));return Number.isFinite(rate)&&rate>0?rate:NaN;}
 function toBaseAmount(item){const price=Number(item?.price),rate=currencyRate(item?.currency_code||primaryCurrency.code);return Number.isFinite(price)&&price>=0&&Number.isFinite(rate)?price/rate:NaN;}
 function formatCurrency(baseAmount,currency){
  if(!currency||!Number.isFinite(baseAmount))return '—';
  const code=String(currency.code||'USD').toUpperCase(),rate=currencyRate(code);
  if(!Number.isFinite(rate))return '—';
  const amount=baseAmount*rate,decimals=code==='KHR'?0:2;
  const formatted=amount.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  return (currency.symbol||code)+' '+formatted+' '+code;
 }
 function priceMarkup(item){
  const base=toBaseAmount(item);
  const primary=formatCurrency(base,primaryCurrency);
  return {primary,secondary:''};
 }
 function renderCart(){
  const host=$('cart');host.replaceChildren();let totalBase=0,count=0,validTotal=true;
  for(const [id,qty] of cart){
   const item=menu.find(x=>String(x.id)===id);if(!item||qty<1)continue;
   const base=toBaseAmount(item);if(!Number.isFinite(base))validTotal=false;else totalBase+=base*qty;
   count+=qty;
   const lineBase=base*qty;
   const linePrimary=formatCurrency(lineBase,primaryCurrency);
   const line=document.createElement('div');line.className='cart-line';
   const left=document.createElement('span');left.textContent=escText(item.name)+' × '+qty;
   const right=document.createElement('strong');right.textContent=linePrimary;
   line.append(left,right);host.append(line);
  }
  const primaryTotal=formatCurrency(totalBase,primaryCurrency);
  $('total').textContent=validTotal?primaryTotal:'汇率暂不可用';
  $('submit').disabled=count===0||!validTotal||!customerToken||!checkoutKey;
  $('currencyHint').textContent=primaryCurrency.code;
 }
 function change(id,delta){
  const key=String(id),next=Math.max(0,Math.min(maxQty,Number(cart.get(key)||0)+delta));
  if(next)cart.set(key,next);else cart.delete(key);
  const el=document.querySelector('[data-qty="'+CSS.escape(key)+'"]');if(el)el.textContent=String(next);
  const card=el?.closest('.item');if(card){const buttons=card.querySelectorAll('.controls button');if(buttons[0])buttons[0].disabled=next===0;if(buttons[1])buttons[1].disabled=next>=maxQty;}
  renderCart();
 }
 function imageUrl(item){
  const value=String(item.image||item.image_url||'').trim();if(!value)return '';
  if(/^https?:\/\//i.test(value))return value;
  const normalized=value.replace(/\\/g,'/').replace(/^\.\/+/,'');
  if(normalized.startsWith('/'))return normalized;
  if(normalized.startsWith('uploads/'))return '/'+normalized;
  return '/uploads/'+normalized;
 }
 function makeImage(item){
  const src=imageUrl(item);
  if(!src){const fallback=document.createElement('div');fallback.className='item-photo-fallback';fallback.textContent=escText(item.emoji)||'🍽️';fallback.setAttribute('aria-label','暂无菜品图片');return fallback;}
  const img=document.createElement('img');img.className='item-photo';img.loading='lazy';img.decoding='async';img.alt=escText(item.name||'菜品图片');img.src=src;
  img.addEventListener('error',()=>{const fallback=document.createElement('div');fallback.className='item-photo-fallback';fallback.textContent=escText(item.emoji)||'🍽️';fallback.setAttribute('aria-label','菜品图片加载失败');img.replaceWith(fallback);},{once:true});
  return img;
 }
 function renderCategories(){
  const nav=$('categoryNav');nav.replaceChildren();
  const all=[{id:'__ALL__',name:'全部菜品'},...categories.map(c=>({id:String(c.name),name:String(c.name)}))];
  if(currentCategory!=='__ALL__'&&!all.some(c=>c.id===currentCategory))currentCategory='__ALL__';
  for(const category of all){
   const button=document.createElement('button');button.type='button';button.className='category-tab'+(currentCategory===category.id?' active':'');
   button.textContent=category.name;button.setAttribute('aria-pressed',String(currentCategory===category.id));
   button.addEventListener('click',()=>{currentCategory=category.id;renderCategories();renderMenu();});
   nav.append(button);
  }
 }
 function renderMenu(){
  const host=$('menu');host.replaceChildren();
  const filtered=menu.filter(item=>{
   const categoryMatch=currentCategory==='__ALL__'||String(item.category||'其他')===currentCategory;
   const haystack=[item.name,item.name_en,item.name_km,item.desc,item.desc_en,item.desc_km,item.category].join(' ').toLocaleLowerCase();
   return categoryMatch&&(!searchTerm||haystack.includes(searchTerm));
  });
  $('menuCount').textContent='显示 '+filtered.length+' / '+menu.length+' 道菜品';
  $('categoryHint').textContent=currentCategory==='__ALL__'?'全部分类':currentCategory;
  if(!filtered.length){
   const empty=document.createElement('div');empty.className='empty-category';
   empty.textContent=menu.length?'该分类暂无匹配菜品':'当前门店暂无可点菜品';host.append(empty);return;
  }
  for(const item of filtered){
   const card=document.createElement('article');card.className='item';
   card.append(makeImage(item));
   const content=document.createElement('div');content.className='item-content';
   const name=document.createElement('strong');name.textContent=escText(item.name);content.append(name);
   const desc=document.createElement('div');desc.className='desc';desc.textContent=escText(item.description||item.desc||'');content.append(desc);
   const price=document.createElement('div');price.className='price';
   const prices=priceMarkup(item);price.textContent=prices.primary;
   if(prices.secondary){const secondary=document.createElement('span');secondary.className='secondary-price';secondary.textContent=prices.secondary;price.append(secondary);}
   content.append(price);
   const controls=document.createElement('div');controls.className='controls';
   const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.disabled=Number(cart.get(String(item.id))||0)===0;minus.setAttribute('aria-label','减少 '+escText(item.name)+' 数量');minus.addEventListener('click',()=>change(item.id,-1));
   const qty=document.createElement('span');qty.className='qty';qty.dataset.qty=String(item.id);qty.textContent=String(cart.get(String(item.id))||0);
   const plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.disabled=Number(cart.get(String(item.id))||0)>=maxQty;plus.setAttribute('aria-label','增加 '+escText(item.name)+' 数量');plus.addEventListener('click',()=>change(item.id,1));
   controls.append(minus,qty,plus);content.append(controls);card.append(content);host.append(card);
  }
 }
 async function load(){
  if(!/^\d+$/.test(storeId)||Number(storeId)<=0){throw new Error('请使用包含有效 store_id 的外卖链接打开本页面');}
  if(telegramEntry){
   const initData=telegramApp&&typeof telegramApp.initData==='string'?telegramApp.initData:'';
   if(!initData||!/^[A-Za-z0-9_-]{43}$/.test(storeEntry)){throw new Error('Telegram 门店专属入口无效，请重新从门店群组链接进入');}
   const entryResponse=await fetchWithTimeout('/api/public/delivery/telegram-miniapp-stores?store_id='+encodeURIComponent(storeId)+'&entry='+encodeURIComponent(storeEntry)+(botPath?'&bot='+encodeURIComponent(botPath):''),{cache:'no-store',headers:{'X-Telegram-Init-Data':initData}});
   const entryData=await entryResponse.json().catch(()=>({}));
   if(!entryResponse.ok||!Array.isArray(entryData.stores)||entryData.stores.length!==1||Number(entryData.stores[0].id)!==Number(storeId)){
    throw new Error(entryData.error||'门店专属入口已失效，请重新获取门店链接');
   }
  }
  const endpoints=[
   '/api/public/store-info?store_id='+encodeURIComponent(storeId),
   '/api/menu?store_id='+encodeURIComponent(storeId),
   '/api/public/config?store_id='+encodeURIComponent(storeId),
   '/api/public/categories?store_id='+encodeURIComponent(storeId)
  ];
  const responses=await Promise.all(endpoints.map(url=>fetchWithTimeout(url,{cache:'no-store'}).catch(error=>({ok:false,networkError:true,json:async()=>({error:error?.name==='AbortError'?'请求超时，请检查网络后重试':'网络连接失败，请检查网络后重试'})}))));
  const payloads=await Promise.all(responses.map(response=>response.json().catch(()=>({}))));
  const endpointNames=['门店信息','菜单','门店币种配置','菜单分类'];
  for(let i=0;i<3;i++){
   if(!responses[i].ok)throw new Error(payloads[i].error||endpointNames[i]+'接口请求失败 (HTTP '+(responses[i].status||'网络错误')+')');
  }
  if(!payloads[0]||typeof payloads[0]!=='object'||Array.isArray(payloads[0])||!payloads[0].id)throw new Error('门店信息接口返回异常，请检查门店编号和服务器响应');
  if(!Array.isArray(payloads[1]))throw new Error('菜单接口返回格式异常，请稍后重试');
  if(!payloads[2]||typeof payloads[2]!=='object'||Array.isArray(payloads[2]))throw new Error('门店币种配置接口返回格式异常');
  const store=payloads[0],config=payloads[2];
  $('storeName').textContent=store.name||('门店 '+storeId);
  $('retryStoreLoad').hidden=true;
  menu=payloads[1];
  categories=responses[3].networkError||!responses[3].ok||!Array.isArray(payloads[3])?[]:payloads[3];
  const known=new Set(categories.map(c=>String(c.name)));
  for(const item of menu){const name=String(item.category||'其他');if(!known.has(name)){categories.push({id:'legacy-'+categories.length,name,sort:Number.MAX_SAFE_INTEGER});known.add(name);}}
  categories.sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0)||Number(a.id||0)-Number(b.id||0));
  rates=new Map((config.currencies||[]).map(currency=>[String(currency.code).toUpperCase(),Number(currency.rate)]));
  const primary=config.primaryCurrency||config.defaultCurrency||{code:'USD',symbol:'$',rate:1};
  primaryCurrency={code:String(primary.code||'USD').toUpperCase(),symbol:primary.symbol||primary.code||'USD',rate:currencyRate(primary.code)||1};
  const dual=config.dualCurrency||{};
  dualEnabled=dual.enabled===true;
  secondaryCurrency=dualEnabled?(dual.currency||null):null;
  if(dualEnabled&&!secondaryCurrency){
   const fallbackCode=primaryCurrency.code==='USD'?'KHR':'USD';
   secondaryCurrency=(config.currencies||[]).find(c=>String(c.code).toUpperCase()===fallbackCode)||null;
  }
  if(dualEnabled&&!secondaryCurrency)dualEnabled=false;
  const configuredMax=Number(config.max_item_quantity??config.constraints?.order?.maxPerItem??100);
  maxQty=Number.isFinite(configuredMax)?Math.max(1,Math.min(1000,Math.floor(configuredMax))):100;
  renderCategories();renderMenu();renderCart();
 }
 $('menuSearch').addEventListener('input',event=>{searchTerm=String(event.target.value||'').trim().toLocaleLowerCase();renderMenu();});
 $('saveDeliveryProfile').addEventListener('click',saveDeliveryProfile);
 $('clearDeliveryProfile').addEventListener('click',()=>{try{localStorage.removeItem(profileKey);}catch(_){}$('recipientName').value='';$('recipientPhone').value='';$('deliveryAddress').value='';$('deliveryProfileStatus').textContent='已清除本浏览器保存的配送资料';});
 loadDeliveryProfile();renderRecentTrackingOrders();
 $('orderForm').addEventListener('submit',async event=>{
  event.preventDefault();$('message').textContent='';$('submit').disabled=true;
  const form=new FormData(event.currentTarget),items=[...cart].map(([id,quantity])=>({id:Number(id),quantity}));
  try{
   if(!checkoutKey)throw new Error('浏览器无法保存安全的下单凭证，请允许本地存储后重试');
   const response=await fetchWithTimeout('/api/public/delivery/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':checkoutKey,...(telegramEntry?{'X-Telegram-Init-Data':String(telegramApp?.initData||'')}:{})},body:JSON.stringify({
    store_id:Number(storeId),customer_token:customerToken,telegram_entry:telegramEntry,store_entry:storeEntry,bot_path:botPath,recipient_name:form.get('recipient_name'),recipient_phone:form.get('recipient_phone'),
    delivery_address:form.get('delivery_address'),note:form.get('note'),payment_method:form.get('payment_method'),items
   })});
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data.error||'提交失败，请稍后重试');
   createdOrderId=Number(data.orderId);createdTrackingUrl=data.trackingUrl;
   sessionStorage.setItem('customer_token:'+data.orderId,data.customerToken);
   localStorage.setItem('customer_token:'+data.orderId,data.customerToken);
   rememberTrackingOrder(data.orderId,data.customerToken,data.orderNo);saveDeliveryProfile();
   showTrackingEntry(data.trackingUrl,'订单 '+(data.orderNo||data.orderId)+' 已创建，可在页面顶部“我的配送订单”中再次打开追踪入口。');
   rotateCheckoutKey();
   if(data.paymentMethod==='khqr'){
    const qrResponse=await fetchWithTimeout('/api/public/delivery/orders/'+encodeURIComponent(data.orderId)+'/khqr',{
     method:'POST',headers:{'Content-Type':'application/json','X-Customer-Token':data.customerToken},body:JSON.stringify({})
    });
    const qr=await qrResponse.json().catch(()=>({}));
    if(!qrResponse.ok)throw new Error(qr.error||'收款码生成失败');
    $('paymentPanel').classList.remove('hidden');$('paymentQr').src=qr.qr_data_url;
    $('paymentSummary').textContent='订单 '+data.orderNo+' · 应付 '+Number(qr.amount).toFixed(qr.currency==='KHR'?0:2)+' '+qr.currency+' · '+(qr.merchant_name||'FoodFlow');
    $('message').textContent='订单已创建，请完成付款后通知门店。';$('submit').disabled=true;
    $('notifyPayment').onclick=async()=>{
     $('notifyPayment').disabled=true;
     try{
      const notify=await fetchWithTimeout('/api/public/delivery/orders/'+encodeURIComponent(data.orderId)+'/payment-notify',{
       method:'POST',headers:{'Content-Type':'application/json','X-Customer-Token':data.customerToken},
       body:JSON.stringify({qr_generation_id:qr.qr_generation_id})
      });
      const result=await notify.json().catch(()=>({}));if(!notify.ok)throw new Error(result.error||'通知失败');
      $('paymentMessage').textContent='已通知门店，请等待收银员核实到账。';
     }catch(error){$('paymentMessage').textContent=error.message;$('notifyPayment').disabled=false;}
    };
    $('trackOrder').onclick=()=>location.href=data.trackingUrl;
   }else {$('message').textContent='订单已创建，请使用上方“查看配送进度”按钮跟踪骑手位置。';$('submit').disabled=true;}
  }catch(error){
   $('message').textContent=createdOrderId?'订单 '+createdOrderId+' 已创建，但支付初始化未完成：'+error.message+'。请先查看订单追踪或联系门店，勿重复提交。':error.message;
   if(createdOrderId){$('submit').disabled=true;$('paymentPanel').classList.remove('hidden');$('paymentMessage').textContent='可先查看订单配送状态。';$('trackOrder').onclick=()=>location.href=createdTrackingUrl;}
   else $('submit').disabled=false;
  }
 });
 async function loadStorefront(){
  const retry=$('retryStoreLoad');retry.hidden=true;retry.disabled=true;
  $('storeName').textContent='正在连接门店服务…';$('message').textContent='';
  try{await load();await refreshTelegramBinding();retry.hidden=true;}
  catch(error){
   $('storeName').textContent='门店加载失败';
   $('message').textContent=error.message||'门店暂时无法加载，请检查网络后重试';
   $('menu').textContent='门店暂时无法加载，请检查网络后重试';
   retry.hidden=false;
  }finally{retry.disabled=false;}
 }
 $('retryStoreLoad').addEventListener('click',loadStorefront);
 loadStorefront();
})();
</script></body></html>
