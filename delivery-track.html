<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>FoodFlow 配送追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #1522380d}
h1{font-size:22px;margin:8px 0}.muted{color:#68778b;font-size:13px}.status{font-size:18px;font-weight:700;color:#177245;margin:12px 0}
#map{height:360px;border-radius:14px;overflow:hidden;background:#e8edf2}.line{margin:7px 0;font-size:14px}
</style></head><body><main>
<h1>📍 配送实时位置</h1><div class="muted">仅显示当前订单配送信息</div>
<section class="card"><div class="status" id="status">正在读取配送信息…</div><div class="line" id="rider"></div><div class="line" id="phone"></div><div class="line" id="address"></div><div class="muted" id="updated"></div></section>
<section class="card"><div id="map"></div><p class="muted">骑手允许定位后，地图会自动更新；定位不可用时显示最后一次有效位置。</p></section>
</main>
<script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
 const orderId=location.pathname.split('/').pop(), customerToken=sessionStorage.getItem('customer_token')||'';
 const $=id=>document.getElementById(id);let map=null,marker=null,socket=null;
 const labels={assigned:'门店已分配骑手',accepted:'骑手已接单',picked_up:'骑手已取货',delivering:'骑手配送中',delivered:'订单已送达',cancelled:'配送已取消'};
 function updateLocation(data){if(!Number.isFinite(Number(data.latitude))||!Number.isFinite(Number(data.longitude)))return;
  const point=[Number(data.latitude),Number(data.longitude)];if(!map){map=L.map('map').setView(point,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);}
  if(!marker)marker=L.marker(point).addTo(map).bindPopup('骑手当前位置');else marker.setLatLng(point);map.panTo(point);
  $('updated').textContent='最后更新：'+(data.updatedAt||data.location_updated_at||'—');
 }
 function updateStatus(status){$('status').textContent=labels[status]||status;if(status==='delivered'||status==='cancelled')$('map').style.display='none';}
 async function refresh(){const response=await fetch('/api/public/delivery/'+encodeURIComponent(orderId),{headers:{'X-Customer-Token':customerToken,'Cache-Control':'no-store'}});const data=await response.json();if(!response.ok)throw new Error(data.error||'无法读取配送信息');
  const j=data.job;updateStatus(j.status);$('rider').textContent='骑手：'+(j.rider_name||'待分配');$('phone').textContent='联系电话：'+(j.rider_phone||j.recipient_phone||'—');$('address').textContent='配送地址：'+(j.delivery_address||'—');
  if(j.latitude!==null&&j.longitude!==null)updateLocation({latitude:Number(j.latitude),longitude:Number(j.longitude),updatedAt:j.location_updated_at});
  if(!socket&&window.io){socket=io({auth:{deliveryOrderId:Number(orderId),deliveryCustomerToken:customerToken}});socket.on('delivery:location',updateLocation);socket.on('delivery:status',e=>updateStatus(e.status));socket.on('connect_error',()=>{});}
 }
 if(!customerToken){$('status').textContent='顾客会话已失效，请返回下单页面重新进入。';}
 else refresh().catch(e=>$('status').textContent=e.message);
})();
</script></body></html>
