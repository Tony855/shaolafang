<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><title>FoodFlow 配送追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #1522380d;min-width:0}
h1{font-size:22px;margin:8px 0}.muted{color:#68778b;font-size:13px}.status{font-size:18px;font-weight:700;color:#177245;margin:12px 0}
#map{height:clamp(220px,42vh,360px);border-radius:14px;overflow:hidden;background:#e8edf2}@supports(height:100dvh){#map{height:clamp(220px,42dvh,360px)}}@media(max-width:480px){main{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}.card{padding:14px}h1{font-size:20px}}.line{margin:7px 0;font-size:14px}
</style></head><body><main>
<h1>📍 配送实时位置</h1><div class="muted">仅显示当前订单配送信息</div>
<section class="card"><div class="status" id="status">正在读取配送信息…</div><div class="line" id="orderSummary"></div><div class="line" id="rider"></div><div class="line" id="phone"></div><div class="line" id="address"></div><div class="muted" id="updated"></div></section>
<section class="card"><div id="map"></div><p class="muted">骑手允许定位后，地图会自动更新；定位不可用时显示最后一次有效位置。</p></section>
</main>
<script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
 const orderId=location.pathname.split('/').pop();
 const fragment=new URLSearchParams(location.hash.replace(/^#/,'')), fragmentToken=fragment.get('token')||'';
 const isCustomerToken=value=>typeof value==='string'&&/^[a-f0-9]{64}$/.test(value);
 function readStoredToken(storageName,key){try{return window[storageName].getItem(key)||'';}catch(_){return '';}}
 function saveStoredToken(storageName,key,value){try{window[storageName].setItem(key,value);return true;}catch(_){return false;}}
 let customerToken=isCustomerToken(fragmentToken)?fragmentToken:'';
 if(fragmentToken){
  if(customerToken){
   saveStoredToken('sessionStorage','customer_token:'+orderId,customerToken);
   saveStoredToken('localStorage','customer_token:'+orderId,customerToken);
  }
  try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
 }
 if(!customerToken){
  const storedTokens=[
   readStoredToken('sessionStorage','customer_token:'+orderId),
   readStoredToken('localStorage','customer_token:'+orderId),
   readStoredToken('sessionStorage','customer_token'),
   readStoredToken('localStorage','foodflow_customer_identity_v1')
  ];
  customerToken=storedTokens.find(isCustomerToken)||'';
 }

 const $=id=>document.getElementById(id);let map=null,marker=null,socket=null;
 const labels={pending_assignment:'等待门店分配骑手',assigned:'门店已分配骑手',accepted:'骑手已接单',picked_up:'骑手已取货',delivering:'骑手配送中',delivered:'订单已送达',cancelled:'配送已取消'};
 function updateLocation(data){if(!Number.isFinite(Number(data.latitude))||!Number.isFinite(Number(data.longitude)))return;
  const point=[Number(data.latitude),Number(data.longitude)];if(!map){map=L.map('map').setView(point,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);}
  if(!marker)marker=L.marker(point).addTo(map).bindPopup('骑手当前位置');else marker.setLatLng(point);map.panTo(point);
  $('updated').textContent='最后更新：'+(data.updatedAt||data.location_updated_at||'—');
 }
 function updateStatus(status){$('status').textContent=labels[status]||status;if(status==='delivered'||status==='cancelled')$('map').style.display='none';}
 async function fetchWithTimeout(url,options={}){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  let settled=false;
  const clearTimer=()=>{if(!settled){settled=true;clearTimeout(timer);}};
  try{
   const response=await fetch(url,{...options,signal:controller.signal});
   const readJson=response.json.bind(response);
   response.json=async(...args)=>{try{return await readJson(...args);}finally{clearTimer();}};
   return response;
  }catch(error){clearTimer();throw error;}
 }
 async function refresh(){const response=await fetchWithTimeout('/api/public/delivery/'+encodeURIComponent(orderId),{headers:{'X-Customer-Token':customerToken,'Cache-Control':'no-store'}});const data=await response.json();if(!response.ok)throw new Error(data.error||'无法读取配送信息');
  const j=data.job,o=data.order||{};updateStatus(j.status);$('orderSummary').textContent='订单：'+(o.order_no||o.id||orderId)+' · '+(o.status==='refunded'?'已退款':o.status==='canceled'?'订单已取消':o.status==='done'?'已收款':Number(o.awaiting_confirm)?'门店核实收款中':o.pay_method==='khqr'?'等待 KHQR 付款':'送达付款 · 待结算')+' · '+Number(o.total||0).toFixed(2)+' USD';$('rider').textContent='骑手：'+(j.rider_name||'待分配');$('phone').textContent='联系电话：'+(j.rider_phone||j.recipient_phone||'—');$('address').textContent='配送地址：'+(j.delivery_address||'—');
  if(j.latitude!==null&&j.longitude!==null)updateLocation({latitude:Number(j.latitude),longitude:Number(j.longitude),updatedAt:j.location_updated_at});
  if(!socket&&window.io){socket=io({auth:{deliveryOrderId:Number(orderId),deliveryCustomerToken:customerToken}});socket.on('connect',()=>refresh().catch(()=>{}));socket.on('delivery:location',updateLocation);socket.on('delivery:status',e=>updateStatus(e.status));socket.on('connect_error',()=>{});}
 }
 if(!customerToken){$('status').textContent='顾客会话已失效，请返回下单页面重新进入。';}
 else refresh().catch(e=>$('status').textContent=e.message);
})();
</script></body></html>
