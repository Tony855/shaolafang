<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 烧腊坊</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 12% 8%, rgba(232, 93, 58, .18), transparent 34%),
        radial-gradient(circle at 88% 18%, rgba(120, 110, 255, .16), transparent 34%),
        linear-gradient(145deg, #20203a, #15152a 60%);
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-shell { width: 100%; max-width: 430px; }
    .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 14px; }
    .lang-bar select {
      height: 36px; padding: 0 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
    }
    .lang-bar select option { background: #2d2d44; color: #fff; }
    .login-box {
      padding: 34px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(45,45,74,.98), rgba(33,33,56,.98));
      box-shadow: 0 26px 60px rgba(0,0,0,.36);
      text-align: center;
    }
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 24px; font-weight: 800; color: #ffd93d; margin-bottom: 10px;
    }
    .brand span {
      width: 48px; height: 48px; display: flex; align-items: center;
      justify-content: center; border-radius: 16px;
      background: rgba(232,93,58,.14); font-size: 28px;
    }
    h1 { margin: 0 0 10px; color: #fff; font-size: 22px; }
    .desc { color: #9b9bb2; margin: 0 0 20px; font-size: 14px; line-height: 1.6; }

    /* 登录类型下拉选择 */
    .login-type-wrapper {
      position: relative; margin-bottom: 20px;
    }
    .login-type-wrapper label {
      display: block; text-align: left; color: #9b9bb2;
      font-size: 13px; margin-bottom: 8px; font-weight: 500;
    }
    .login-type-select {
      width: 100%; height: 48px; padding: 0 40px 0 14px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: #20203a; color: #fff; font-size: 15px;
      cursor: pointer; outline: none; appearance: none;
      -webkit-appearance: none; transition: all .2s;
    }
    .login-type-select:focus {
      border-color: #e85d3a;
      box-shadow: 0 0 0 3px rgba(232,93,58,.15);
    }
    .login-type-select option {
      background: #2d2d44; color: #fff; padding: 10px;
    }
    .login-type-wrapper::after {
      content: '▼'; position: absolute; right: 16px; top: 38px;
      color: #9b9bb2; font-size: 10px; pointer-events: none;
    }

    .login-box input {
      width: 100%; height: 48px; margin-bottom: 14px; padding: 0 14px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: #20203a; color: #fff; font-size: 15px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(232,93,58,.15);
    }
    .login-box input.hidden { display: none; }
    .login-box button {
      width: 100%; height: 48px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, #f76b46, #df4d32);
      color: #fff; font-weight: 800; font-size: 16px; cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .login-box button:hover { filter: brightness(1.08); }
    .login-box button:active { transform: scale(.97); }
    .error { min-height: 20px; margin-top: 12px; color: #ff9c9c; font-size: 13px; }
    .hint { margin-top: 10px; font-size: 12px; color: #9c9cb2; }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="lang-bar">
      <select id="langSelect">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ภาษาไทย</option>
        <option value="km">ភាសាខ្មែរ</option>
      </select>
    </div>
    <div class="login-box">
      <div class="brand"><span>🍖</span><strong id="brandTitle">烧腊坊</strong></div>
      <h1 id="loginTitle">登录</h1>
      <p class="desc" id="loginDesc">请选择登录类型</p>

      <!-- 登录类型下拉选择 -->
      <div class="login-type-wrapper">
        <label id="loginTypeLabel">登录类型</label>
        <select id="loginType" class="login-type-select">
          <option value="admin">👔 管理员</option>
          <option value="waiter">🧑‍🍳 服务员</option>
        </select>
      </div>

      <!-- 用户名输入框 -->
      <input id="username" type="text" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn">登录</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <script src="languages.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    let lang = localStorage.getItem('lang') || 'zh';
    let loginType = 'admin'; // admin 或 waiter

    SLF.i18n.init(lang);

    // 从 URL 参数获取登录类型
    const urlParams = new URLSearchParams(window.location.search);
    const typeParam = urlParams.get('type');
    if (typeParam === 'waiter') {
      loginType = 'waiter';
    }

    function apply() {
      const t = SLF.i18n.t.bind(SLF.i18n);
      document.title = t('login') + ' - ' + t('brandName');
      $('#brandTitle').textContent = t('brandName');
      $('#langSelect').value = lang;

      // 更新登录类型下拉选择
      $('#loginType').value = loginType;
      $('#loginTypeLabel').textContent = t('loginType') || '登录类型';
      $('#loginType option[value="admin"]').textContent = '👔 ' + t('admin');
      $('#loginType option[value="waiter"]').textContent = '🧑‍🍳 ' + t('waiter');

      // 用户名输入框
      $('#username').placeholder = t('username');

      // 更新标题和描述
      if (loginType === 'admin') {
        $('#loginTitle').textContent = t('adminLogin');
        $('#loginDesc').textContent = t('adminLoginDesc') || '请输入管理员用户名和密码';
        $('#username').placeholder = t('adminUsername') || '管理员用户名';
        $('#password').placeholder = t('adminPassword');
      } else {
        $('#loginTitle').textContent = t('waiterLogin');
        $('#loginDesc').textContent = t('waiterLoginDesc');
        $('#password').placeholder = t('password');
      }
      $('#loginBtn').textContent = t('login');
    }

    // 语言切换
    $('#langSelect').value = lang;
    $('#langSelect').addEventListener('change', () => {
      lang = $('#langSelect').value;
      localStorage.setItem('lang', lang);
      SLF.i18n.setLang(lang);
      apply();
    });

    // 登录类型切换
    $('#loginType').addEventListener('change', function() {
      loginType = this.value;
      $('#loginError').textContent = '';
      apply();
    });

    // 登录
    $('#loginBtn').addEventListener('click', async () => {
      const t = SLF.i18n.t.bind(SLF.i18n);
      const password = $('#password').value.trim();
      if (!password) {
        $('#loginError').textContent = loginType === 'admin' ? t('enterPassword') : t('enterPassword');
        return;
      }

      if (loginType === 'admin') {
        // 商家管理员登录（用户名+密码）
        const username = $('#username').value.trim();
        if (!username) {
          $('#loginError').textContent = t('enterUsername');
          return;
        }
        try {
          const data = await SLF.api.post('/admin/login', { username, password });
          sessionStorage.setItem('adminToken', data.token);
          sessionStorage.setItem('adminMerchantId', data.merchantId);
          sessionStorage.setItem('adminMerchantName', data.merchantName);
          window.location.href = '/admin';
        } catch (e) {
          $('#loginError').textContent = e.message || t('loginError');
        }
      } else {
        // 服务员登录
        const username = $('#username').value.trim();
        if (!username) {
          $('#loginError').textContent = t('enterUsername');
          return;
        }
        try {
          const data = await SLF.api.post('/waiter/login', { username, password });
          sessionStorage.setItem('waiterToken', data.token);
          sessionStorage.setItem('waiterStoreId', data.storeId || 1);
          window.location.href = '/waiter';
        } catch (e) {
          $('#loginError').textContent = e.message || t('loginError');
        }
      }
    });

    // 回车键登录
    $('#password').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('#loginBtn').click();
    });
    $('#username').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('#loginBtn').click();
    });

    apply();
  </script>
</body>
</html>
