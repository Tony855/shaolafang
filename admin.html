<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>烧腊坊 · 后台管理</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 12% 8%, rgba(232, 93, 58, .18), transparent 34%),
                radial-gradient(circle at 88% 18%, rgba(120, 110, 255, .16), transparent 34%),
                linear-gradient(145deg, #20203a, #15152a 60%);
            color: #eee;
            font: 14px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
            padding-top: 64px;
        }

        /* ===== 顶部栏 — 固定 ===== */
        .top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(22, 22, 42, .92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .22);
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        h1, h2, h3, h4, h5, h6 { color: #fff; }

        .top strong {
            font-size: 20px;
            letter-spacing: .5px;
            white-space: nowrap;
            flex-shrink: 0;
            color: #fff;
            font-weight: 700;
        }
        .top span {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }
        .top select {
            height: 34px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .16);
            background: rgba(255, 255, 255, .08);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 60px;
        }
        .top select option {
            background: #2d2d44;
            color: #fff;
        }
        .top button {
            height: 34px;
            padding: 0 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #f76b46, #df4d32);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .top a {
            height: 34px;
            line-height: 34px;
            padding: 0 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .1);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            white-space: nowrap;
            transition: background .2s;
        }
        .top a:hover {
            background: rgba(255, 255, 255, .2);
        }
        #logoutBtn {
            background: rgba(255, 77, 79, .25);
            color: #ff9c9c;
        }
        #logoutBtn:hover {
            background: rgba(255, 77, 79, .4);
        }

        /* ===== 侧边栏 — 固定（桌面） ===== */
        .admin-sidebar {
            position: fixed;
            left: 0;
            top: 64px;
            width: 220px;
            height: calc(100vh - 64px);
            z-index: 150;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 12px;
            border-right: 1px solid rgba(255, 255, 255, .06);
            background: linear-gradient(165deg, rgba(33, 33, 56, .98), rgba(22, 22, 42, .98));
            box-shadow: 4px 0 28px rgba(0, 0, 0, .18);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar-brand {
            font-size: 18px;
            font-weight: 800;
            color: #ffd93d;
            padding: 8px 6px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            flex-shrink: 0;
            letter-spacing: .3px;
            text-shadow: 0 0 20px rgba(255, 217, 61, .3);
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 0;
            border-radius: 11px;
            background: transparent;
            color: #b8b8ce;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: .18s ease;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, .07);
            color: #fff;
        }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(232, 93, 58, .9), rgba(201, 74, 42, .9));
            color: #fff;
            box-shadow: 0 8px 18px rgba(232, 93, 58, .22);
        }
        .nav-item .nav-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        /* ===== 主内容区域 ===== */
        .admin-shell {
            margin-left: 220px;
            padding: 20px 24px 40px;
            max-width: 1260px;
        }
        .admin-modules .module-panel {
            display: none;
        }
        .admin-modules .module-panel.active {
            display: block;
        }

        /* ===== 面板卡片 ===== */
        .panel {
            background: linear-gradient(160deg, rgba(45, 45, 74, .97), rgba(33, 33, 56, .97));
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 18px 38px rgba(0, 0, 0, .22);
            margin-bottom: 20px;
        }
        .panel h2 {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 16px;
            font-size: 17px;
            letter-spacing: .3px;
            color: #ffd93d;
        }
        .panel h2::after {
            content: '';
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, rgba(255, 217, 61, .35), transparent);
        }

        /* ===== 表单 ===== */
        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, .035);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 14px;
        }
        .form input,
        .form select,
        .form button {
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: 10px;
        }
        .form input,
        .form select {
            background: #22223a;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .12);
        }
        .form input::placeholder {
            color: #7d7d96;
        }
        .form input:focus,
        .form select:focus {
            outline: none;
            border-color: #e85d3a;
            box-shadow: 0 0 0 3px rgba(232, 93, 58, .14);
        }
        .form button {
            background: linear-gradient(135deg, #f76b46, #df4d32);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            border: 0;
        }
        .form button.full {
            grid-column: 1/-1;
        }

        .admin-form {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid #3c3c58;
            border-radius: 14px;
        }
        .admin-form input,
        .admin-form select {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid #4d4d70;
            background: #22223a;
            color: #fff;
        }
        .admin-form button {
            height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
            font-weight: 700;
            background: linear-gradient(135deg, #f76b46, #df4d32);
            color: #fff;
        }

        /* ===== 菜单列表 ===== */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .menu-item-admin {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, .045);
            border: 1px solid #3c3c58;
            border-radius: 12px;
            padding: 10px 12px;
            transition: .2s ease;
        }
        .menu-item-admin.inactive {
            opacity: .55;
        }
        .menu-item-admin:hover {
            background: rgba(255, 255, 255, .075);
            border-color: #55557b;
        }
        .menu-thumb {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: #22223a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .menu-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .menu-info {
            flex: 1;
            min-width: 0;
        }
        .menu-info .name-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .menu-info .name {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
        }
        .menu-info .price {
            color: #ffd93d;
            font-weight: 700;
            font-size: 14px;
        }
        .menu-info .meta {
            color: #b8b8c8;
            font-size: 12px;
            margin-top: 4px;
            line-height: 1.4;
        }
        .menu-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .menu-actions button {
            border: 0;
            border-radius: 7px;
            padding: 6px 10px;
            cursor: pointer;
            background: #484867;
            color: #fff;
            font-size: 12px;
        }
        .menu-actions button.danger {
            color: #ff9c9c;
        }

        /* ===== 行 ===== */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: .2s ease;
        }
        .row:hover {
            background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
            border-color: rgba(255, 255, 255, .15);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }
        .row b {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }
        .row small {
            display: block;
            color: #c8c8d0;
            margin-top: 4px;
            font-size: 12px;
        }
        .row .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .row .actions button {
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 10px;
            padding: 7px 14px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: .2s ease;
        }
        .row .actions button:hover {
            background: rgba(255, 255, 255, .18);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        .row .actions .danger {
            color: #ff9c9c;
        }

        .badge {
            padding: 4px 9px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
        }
        .done {
            background: #52c41a;
        }
        .canceled {
            background: #777;
        }

        /* ===== 订单 ===== */
        .order-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .summary-card {
            background: rgba(255, 255, 255, .045);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .summary-card span {
            font-size: 12px;
            color: #9b9bb2;
        }
        .summary-card strong {
            font-size: 22px;
            color: #ffd93d;
        }
        .summary-card small {
            font-size: 14px;
            color: #fff;
            font-weight: 700;
        }
        .summary-card.pending strong {
            color: #fa8c16;
        }
        .summary-card.done strong {
            color: #52c41a;
        }

        .order-item-admin {
            background: rgba(255, 255, 255, .045);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .order-item-admin .top {
            position: static;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0;
            height: auto;
            background: transparent;
            box-shadow: none;
            border: none;
            backdrop-filter: none;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-item-admin .top .status {
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-pending {
            background: #fa8c16;
            color: #fff;
        }
        .status-done {
            background: #52c41a;
            color: #fff;
        }
        .status-canceled {
            background: #777;
            color: #fff;
        }
        .session-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 999px;
            background: rgba(123, 104, 238, .18);
            color: #b8a6ff;
            font-size: 12px;
            font-weight: 700;
        }
        .order-item-admin .items {
            margin: 8px 0;
        }
        .dish-line {
            display: grid;
            grid-template-columns: 1fr 84px;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }
        .dish-name {
            color: #eee;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .dish-line .item-status {
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(250, 140, 22, .15);
            color: #fa8c16;
            text-align: center;
        }
        .dish-line .item-status.done {
            background: rgba(82, 196, 26, .15);
            color: #52c41a;
        }
        .dish-line button {
            background: rgba(255, 255, 255, .1);
            border: 0;
            color: #ffd93d;
            border-radius: 8px;
            padding: 4px 9px;
            cursor: pointer;
        }
        .item-toggle {
            font-weight: 700;
            background: rgba(250, 140, 22, .15) !important;
            color: #fa8c16 !important;
        }
        .item-toggle.done {
            background: rgba(82, 196, 26, .15) !important;
            color: #52c41a !important;
        }
        .order-item-admin .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,.06);
        }
        .order-item-admin .bottom .time {
            color: #a8a8b8;
            font-size: 12px;
        }
        .order-item-admin .bottom .total {
            color: #ffd93d;
            font-weight: 700;
            font-size: 15px;
        }
        .order-item-admin .bottom .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .order-item-admin .bottom .actions button {
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            padding: 6px 12px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: .18s ease;
            white-space: nowrap;
        }
        .order-item-admin .bottom .actions button:hover {
            background: rgba(255,255,255,.18);
            transform: translateY(-1px);
        }
        .order-item-admin .bottom .actions button.edit {
            background: rgba(52,152,219,.15);
            border-color: rgba(52,152,219,.3);
            color: #5dade2;
        }
        .order-item-admin .bottom .actions button.edit:hover {
            background: rgba(52,152,219,.25);
        }
        .order-item-admin .bottom .actions button.danger {
            background: rgba(231,76,60,.15);
            border-color: rgba(231,76,60,.3);
            color: #ec7063;
        }
        .order-item-admin .bottom .actions button.danger:hover {
            background: rgba(231,76,60,.25);
        }
        .order-item-admin .top .table-info {
            color: #c8c8d0;
            font-size: 14px;
        }
        .order-item-admin .top .table-info strong {
            color: #fff;
            font-size: 16px;
        }

        .table-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .table-status.available {
            background: rgba(82, 196, 26, .14);
            color: #52c41a;
        }
        .table-status.occupied {
            background: rgba(250, 140, 22, .16);
            color: #fa8c16;
        }
        .table-status.reserved {
            background: rgba(24, 144, 255, .16);
            color: #1890ff;
        }

        /* ===== 模态框 ===== */
        .order-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 16px;
        }
        .order-modal.open {
            display: flex;
        }
        .order-modal-card {
            position: relative;
            width: 100%;
            max-width: 560px;
            max-height: 85vh;
            overflow-y: auto;
            background: #2d2d44;
            border: 1px solid #55557b;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, .35);
        }
        .dish-modal-card {
            max-width: 680px;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .09);
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        .order-modal-card h2 {
            margin: 0 0 14px;
            color: #ffd93d;
            font-size: 18px;
        }
        .order-field {
            margin-bottom: 14px;
        }
        .order-field label {
            display: block;
            color: #aaa;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .order-field select,
        .order-field input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid #4d4d70;
            background: #22223a;
            color: #fff;
            font-size: 14px;
        }
        .order-item-line {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .order-item-line select {
            flex: 1;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #4d4d70;
            background: #22223a;
            color: #fff;
        }
        .order-item-line input {
            width: 70px;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #4d4d70;
            background: #22223a;
            color: #fff;
        }
        .order-item-line button {
            background: #5b3442;
            border: 0;
            color: #ff9c9c;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .order-item-line.locked {
            opacity: .75;
        }
        .order-item-line.locked select,
        .order-item-line.locked input {
            background: #2a2a44;
            color: #aaa;
        }
        .add-line {
            background: #484867;
            border: 0;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .order-total-line {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
            color: #ffd93d;
            font-size: 16px;
        }
        .order-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
        .order-modal-actions button {
            border: 0;
            border-radius: 8px;
            padding: 9px 18px;
            background: #484867;
            color: #fff;
            cursor: pointer;
        }
        .order-modal-actions button.primary {
            background: linear-gradient(135deg, #f76b46, #df4d32);
            font-weight: bold;
        }

        /* ===== 分类 ===== */
        .category-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .category-form input {
            flex: 1;
            height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid #4d4d70;
            background: #22223a;
            color: #fff;
            font-size: 14px;
        }
        .category-form button {
            height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #f76b46, #df4d32);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .category-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 11px;
            background: rgba(255, 255, 255, .04);
            margin-bottom: 8px;
        }
        .category-row .name {
            font-weight: 700;
            color: #fff;
        }
        .category-row .actions button {
            background: #484867;
            border: 0;
            color: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            margin-left: 4px;
        }
        .category-row .actions .danger {
            color: #ff9c9c;
        }

        /* ===== 服务员 & 店铺 ===== */
        #waiterList .admin-card,
        #storeList .admin-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;

        // 本地字典优先，找不到时回退到 languages.js 的共享翻译（如 menuManage/orderManage/close/total/save），避免重复维护同一个词
        const tAdmin = k => (ADMIN_LABELS[adminLang] && ADMIN_LABELS[adminLang][k]) || ADMIN_LABELS.zh[k] || (LANGUAGES[adminLang] && LANGUAGES[adminLang][k]) || (LANGUAGES.zh && LANGUAGES.zh[k]) || k;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
            "'": '&#39;' }[c]));

        // 同一桌可能被多位顾客先后扫码下单：按桌号 + session_token 分组，
        // 给每一组分配一个短标签（客1/客2...），方便后台区分是同一位顾客的多笔订单
        // 还是不同顾客各自的订单；没有 session_token 的订单（服务员/后台代下单）单独标注。
        function buildSessionLabels(orders) {
            const byTable = new Map();
            for (const o of orders) {
                if (!byTable.has(o.table)) byTable.set(o.table, []);
                byTable.get(o.table).push(o);
            }
            const labels = new Map();
            for (const [, tableOrders] of byTable) {
                const sorted = [...tableOrders].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                const distinctTokens = [...new Set(sorted.filter(o => o.sessionToken).map(o => o.sessionToken))];
                const hasNoSession = sorted.some(o => !o.sessionToken);
                const groupCount = distinctTokens.length + (hasNoSession ? 1 : 0);
                if (groupCount <= 1) continue; // 同桌只有一组顾客/来源，不需要额外标注
                const tokenToIndex = new Map(distinctTokens.map((t, i) => [t, i + 1]));
                for (const o of sorted) {
                    labels.set(o.id, o.sessionToken ? `客${tokenToIndex.get(o.sessionToken)}` : '服务员/后台下单');
                }
            }
            return labels;
        }

        function toast(text) {
            const n = $('#notice');

            n.timer = setTimeout(() => n.style.display = 'none', 1800);
        }

        function defaultCurrency() {
            return currenciesCache.find(c => c.is_default) || currenciesCache[0] || { symbol: '$', rate: 1, code: 'USD' };
        }

        function toBasePrice(m) {
            const c = currenciesCache.find(x => x.code === (m.currency_code || 'USD')) || { rate: 1 };
            return Number(m.price || 0) / Number(c.rate || 1);
        }

        function formatMoney(base) {
            const c = defaultCurrency();
            return `${c.symbol}${(Number(base || 0) * Number(c.rate || 1)).toFixed(2)}`;
        }

        function toBaseCurrency(price, currencyCode) {
            const currency = currenciesCache.find(c => c.code === currencyCode) || { rate: 1 };
            return Number(price || 0) / Number(currency.rate || 1);
        }

        function formatPrimary(amount) {
            const c = defaultCurrencyObj || defaultCurrency() || { symbol: '$', rate: 1 };
            return `${c.symbol}${(Number(amount || 0) * Number(c.rate || 1)).toFixed(2)}`;
        }

        function formatSecondary(amount, secondaryCode) {
            if (!secondaryCode) return '';
            const secCurr = currenciesCache.find(c => c.code === secondaryCode);
            if (!secCurr) return '';
            const defaultRate = (defaultCurrencyObj && defaultCurrencyObj.rate) || 1;
            const secValue = (Number(amount || 0) / defaultRate) * Number(secCurr.rate || 1);
            return `${secCurr.symbol}${secValue.toFixed(2)}`;
        }

        function dualAmountSuffix(base) {
            if (!dualCurrencyEnabled || !secondaryCurrencyCode) return '';
            const sec = formatSecondary(base, secondaryCurrencyCode);
            return sec ? ` (${sec})` : '';
        }

        // ================================================================
        // API 请求

        async function api(path, options = {}) {
            const headers = new Headers(options.headers || {});
            if (adminKey) headers.set('X-Admin-Key', adminKey);
            headers.set('X-Store-Id', sessionStorage.getItem('adminStoreId') || '1');
            const r = await fetch(API + path, { ...options, headers });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(data.error || '操作失败');
            return data;
        }

  <script>
    function downloadQR() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const W = 1080, H = 1440;
      canvas.width = W; canvas.height = H;
      
      // Background
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(1, '#f8f9fa');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);
      
      // Header
      const headerGrad = ctx.createLinearGradient(0, 0, W, 320);
      headerGrad.addColorStop(0, '#e85d3a');
      headerGrad.addColorStop(1, '#c0392b');
      ctx.fillStyle = headerGrad;
      ctx.fillRect(0, 0, W, 320);
      
      // Brand
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 72px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🍖 烧腊坊', W/2, 140);
      ctx.font = '30px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillText('ROAST HOUSE', W/2, 200);
      ctx.font = 'bold 42px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('${esc(q.table)} 号桌', W/2, 275);
      
      // QR Code background
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 6;
      roundRect(ctx, W/2-270, 380, 540, 540, 30);
      ctx.fill(); ctx.stroke();
      
      // QR Code
      const qrImg = new Image();
      qrImg.onload = function() {
        ctx.drawImage(qrImg, W/2-230, 420, 460, 460);
        
        // Text
        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 52px sans-serif';
        ctx.fillText('扫码点餐', W/2, 1000);
        ctx.font = '28px sans-serif';
        ctx.fillStyle = '#95a5a6';
        ctx.fillText('SCAN TO ORDER', W/2, 1050);
        
        // Divider
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(150, 1100); ctx.lineTo(W/2-80, 1100);
        ctx.moveTo(W/2+80, 1100); ctx.lineTo(W-150, 1100);
        ctx.stroke();
        ctx.fillStyle = '#bdc3c7';
        ctx.font = '24px sans-serif';
        ctx.fillText('WELCOME', W/2, 1108);
        
        // Footer
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, H-100, W, 100);
        ctx.fillStyle = '#bdc3c7';
        ctx.font = '26px sans-serif';
        ctx.fillText('感谢您的光临 · THANK YOU', W/2, H-40);
        
        // Download
        const link = document.createElement('a');
        link.download = '烧腊坊-${esc(q.table)}-点餐码.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      qrImg.src = '${q.qrDataUrl}';
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }
  <\/script>

                loadTables();

        $('#adminLang').value = adminLang;

            adminLang = this.value;

        $('#adminStoreSelect').onchange = function() {

        // ================================================================
        // 超时退出
        // ================================================================
        const ADMIN_IDLE_TIMEOUT_MS = 5 * 60 * 1000;
        let adminIdleTimer = null;

        function resetAdminIdleTimer() {
            if (adminIdleTimer) clearTimeout(adminIdleTimer);
            adminIdleTimer = setTimeout(() => {
                adminKey = '';
                sessionStorage.removeItem('adminKey');
                window.location.href = '/login';
            }, ADMIN_IDLE_TIMEOUT_MS);
        }
        ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(evt =>
            document.addEventListener(evt, resetAdminIdleTimer, { passive: true })
        );
        window.logoutAdmin = function() {
            adminKey = '';
            sessionStorage.removeItem('adminKey');
            window.location.href = '/login';
        };

        // ================================================================
        // 初始化
        // ================================================================
        const today = new Date().toISOString().slice(0, 10);
        applyAdminLanguage();

        if (adminKey) {
            $('#dashboard').hidden = false;
            $('#logoutBtn').hidden = false;
            resetAdminIdleTimer();
            refresh().catch(() => {
                sessionStorage.removeItem('adminKey');
                window.location.href = '/login';
            });
        } else {
            window.location.href = '/login';
        }

        // ================================================================
        // 分类拖拽排序
        // ================================================================
        let draggedCategoryRow = null;
        document.addEventListener('dragstart', (e) => {
            const row = e.target.closest('.category-row');
            if (row) {
                draggedCategoryRow = row;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', row.dataset.id);
                row.style.opacity = '0.5';
            }
        });
        document.addEventListener('dragend', (e) => {
            const row = e.target.closest('.category-row');
            if (row) row.style.opacity = '';
        });
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            const targetRow = e.target.closest('.category-row');
            if (targetRow && draggedCategoryRow && targetRow !== draggedCategoryRow) {
                const container = document.getElementById('categoryList');
                const children = Array.from(container.children);
                const dragIndex = children.indexOf(draggedCategoryRow);
                const targetIndex = children.indexOf(targetRow);
                if (dragIndex < targetIndex) {
                    container.insertBefore(draggedCategoryRow, targetRow.nextSibling);
                } else {
                    container.insertBefore(draggedCategoryRow, targetRow);
                }
                const newOrder = Array.from(container.querySelectorAll('.category-row')).map(row => parseInt(row.dataset
                    .id));
                try {
                    await api('/menu-categories/sort', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: newOrder })
                    });
                    toast('✅ 分类顺序已更新');
                    await loadMenuCategories();
                } catch (err) {
                    toast('❌ 更新失败: ' + err.message);
                    await loadMenuCategories();
                }
            }
            if (draggedCategoryRow) {
                draggedCategoryRow.style.opacity = '';
                draggedCategoryRow = null;
            }
        });

        // ================================================================
        //  预约管理
        // ================================================================
        async function loadReservations() {
            try {
                const data = await api('/admin/reservations');
                const container = $('#reservationsList');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#c8c8d0;">暂无预约</div>';
                    return;
                }
                const statusMap = { pending: '待确认', confirmed: '已确认', canceled: '已取消', completed: '已完成' };
                const statusColor = { pending: '#ffb020', confirmed: '#2ecc71', canceled: '#999', completed: '#3498db' };
                container.innerHTML = data.map(r => `
                    <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <div>
                            <div style="font-weight:700;font-size:16px;">🪑 ${esc(r.table_name)} · ${esc(r.customer_name)}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">
                                📅 ${esc(r.reservation_time)} · 👥 ${r.guests}人 · 📞 ${esc(r.phone || '未留电话')}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:${statusColor[r.status] || '#999'}22;color:${statusColor[r.status] || '#999'};">${statusMap[r.status] || r.status}</span>
                            ${r.status === 'pending' ? `
                                <button onclick="updateReservation(${r.id}, 'confirmed')" style="background:#2ecc71;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">确认</button>
                                <button onclick="updateReservation(${r.id}, 'canceled')" style="background:#e74c3c;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">取消</button>
                            ` : ''}
                            ${r.status === 'confirmed' ? `
                                <button onclick="updateReservation(${r.id}, 'completed')" style="background:#3498db;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">完成</button>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                toast('加载预约失败: ' + err.message);
            }
        }

        async function updateReservation(id, status) {
            try {

                    method: 'PUT',

                });

        // ================================================================
        //  呼叫服务员

        // ================================================================
        //  打印机管理
        // ================================================================
        async function loadPrinters() {
            try {
                const data = await api('/admin/printers');

                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#c8c8d0;">暂无打印机，添加一台网络打印机开始打印</div>';

                }
                const typeMap = { network: '网络', usb: 'USB', bluetooth: '蓝牙' };
                container.innerHTML = data.map(p => `
                    <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <div>
                            <div style="font-weight:700;font-size:17px;color:#fff;margin-bottom:6px;">🖨️ ${esc(p.name)} ${p.is_default ? '<span style="background:#ffd93d;color:#333;padding:2px 10px;border-radius:10px;font-size:12px;margin-left:8px;font-weight:600;">默认</span>' : ''}</div>
                            <div style="color:#c8c8d0;font-size:13px;line-height:1.6;">
                                ${typeMap[p.type] || p.type} · ${p.brand} · ${p.paper_width}mm
                                ${p.ip_address ? ` · ${p.ip_address}:${p.port}` : ''}
                                · ${p.active ? '<span style="color:#2ecc71;font-weight:600;">已启用</span>' : '<span style="color:#e74c3c;">已停用</span>'}
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button onclick="testPrinter(${p.id})" style="background:#3498db;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">测试打印</button>
                            <button onclick="togglePrinter(${p.id}, ${p.active ? 0 : 1})" style="background:${p.active ? '#f39c12' : '#2ecc71'};color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">${p.active ? '停用' : '启用'}</button>
                            ${!p.is_default ? `<button onclick="setDefaultPrinter(${p.id})" style="background:#9b59b6;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;">设为默认</button>` : ''}

        async function addPrinter() {
            const name = $('#printerName').value.trim();
            if (!name) { toast('请输入打印机名称'); return; }
            try {
                await api('/admin/printers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        type: $('#printerType').value,
                        ip_address: $('#printerIp').value.trim(),
                        port: parseInt($('#printerPort').value) || 9100,
                        paper_width: parseInt($('#printerWidth').value) || 58,
                        brand: $('#printerBrand').value,
                        is_default: $('#printerDefault').checked
                    })
                });
                toast('打印机已添加');
                $('#printerName').value = '';
                $('#printerIp').value = '';
                $('#printerDefault').checked = false;
                loadPrinters();
            } catch (err) {
                toast('添加失败: ' + err.message);
            }
        }

                await api('/admin/printers/test', {
                    method: 'POST',

                });
                toast('测试打印已发送');

        // 打印订单

        // ================================================================
        //  营业报表与数据导出
        // ================================================================
        async function loadDailyReport() {
            const date = $('#reportDate').value || new Date().toISOString().slice(0, 10);
            try {
                const data = await api('/admin/reports/daily?date=' + date);
                const s = data.summary;
                const container = $('#reportContent');

                let html = `
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;">
                        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:28px;font-weight:700;color:#e85d3a;">${s.totalOrders}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">总订单数</div>
                        </div>
                        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:28px;font-weight:700;color:#2ecc71;">${s.completedOrders}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">已完成</div>
                        </div>
                        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:28px;font-weight:700;color:#e74c3c;">${s.canceledOrders}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">已取消</div>
                        </div>
                        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:28px;font-weight:700;color:#f1c40f;">$${Number(s.totalRevenue).toFixed(2)}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">总营收</div>
                        </div>
                        <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:16px;text-align:center;">
                            <div style="font-size:28px;font-weight:700;color:#3498db;">$${Number(s.avgOrderValue).toFixed(2)}</div>
                            <div style="color:#c8c8d0;font-size:13px;margin-top:4px;">客单价</div>
                        </div>
                    </div>
                `;

                // 桌台收入
                if (data.tableRevenue && data.tableRevenue.length > 0) {
                    html += `<h3 style="margin:20px 0 10px;color:#fff;font-size:15px;font-weight:700;">🏪 各桌台收入</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;">`;
                    for (const t of data.tableRevenue) {
                        html += `<div style="background:rgba(255,255,255,.05);border-radius:10px;padding:12px;text-align:center;">
                            <div style="font-weight:600;">${esc(t.table_name)}</div>
                            <div style="color:#2ecc71;font-size:18px;font-weight:700;margin-top:4px;">$${Number(t.revenue).toFixed(2)}</div>
                            <div style="color:#c8c8d0;font-size:12px;">${t.orders} 单</div>
                        </div>`;
                    }
                    html += `</div>`;
                }

                // 菜品销量排行
                if (data.dishRanking && data.dishRanking.length > 0) {
                    html += `<h3 style="margin:20px 0 10px;color:#fff;font-size:15px;font-weight:700;">🔥 菜品销量 TOP 10</h3><div style="background:rgba(255,255,255,.05);border-radius:12px;padding:14px;margin-bottom:20px;">`;
                    data.dishRanking.forEach((d, i) => {
                        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
                        html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);">
                            <span>${medal} ${d.emoji || ''} ${esc(d.name)}</span>
                            <span style="font-weight:600;">${d.quantity || 0} 份</span>
                        </div>`;
                    });
                    html += `</div>`;
                }

                // 小时分布
                if (data.hourlyStats && data.hourlyStats.length > 0) {
                    html += `<h3 style="margin:20px 0 10px;color:#fff;font-size:15px;font-weight:700;">⏰ 时段分布</h3><div style="background:rgba(255,255,255,.05);border-radius:12px;padding:14px;">`;
                    const maxOrders = Math.max(...data.hourlyStats.map(h => h.orders), 1);
                    for (const h of data.hourlyStats) {
                        const pct = (h.orders / maxOrders * 100).toFixed(0);
                        html += `<div style="display:flex;align-items:center;gap:10px;margin:6px 0;">
                            <span style="width:50px;color:#c8c8d0;font-size:13px;">${String(h.hour).padStart(2, '0')}:00</span>
                            <div style="flex:1;background:rgba(255,255,255,.1);border-radius:6px;height:20px;overflow:hidden;">
                                <div style="width:${pct}%;background:linear-gradient(90deg,#e85d3a,#f39c12);height:100%;border-radius:6px;"></div>
                            </div>
                            <span style="width:60px;text-align:right;font-size:13px;">${h.orders}单 $${Number(h.revenue).toFixed(0)}</span>
                        </div>`;
                    }
                    html += `</div>`;
                }

                container.innerHTML = html;
            } catch (err) {
                toast('加载报表失败: ' + err.message);
            }
        }

        function exportData(type) {
            const adminKey = sessionStorage.getItem('adminKey') || '';
            const url = '/api/admin/export/' + type;
            // 使用 fetch 下载，带上 admin key
            fetch(url, { headers: { 'X-Admin-Key': adminKey } })
                .then(res => {
                    if (!res.ok) throw new Error('导出失败');
                    return res.blob();
                })
                .then(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = type + '_' + new Date().toISOString().slice(0, 10) + '.csv';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    toast('导出成功');
                })
                .catch(err => toast('导出失败: ' + err.message));
        }
    </script>
