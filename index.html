<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FoodFlow · QR Ordering System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    /* ========== 全局变量与基础重置 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #e85d3a;
        --primary-dark: #c94a2a;
        --gray-100: #f8f8f8;
        --gray-200: #eeeeee;
        --gray-300: #dddddd;
        --gray-400: #aaaaaa;
        --gray-500: #888888;
        --gray-600: #555555;
        --gray-700: #333333;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
        --radius: 16px;
        --radius-sm: 10px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(180deg, #fff6f2 0%, #f7f7fb 46%, #eef0f7 100%);
        color: var(--gray-700);
        line-height: 1.6;
        padding-bottom: 96px;
    }


    /* ========== Header ========== */
    .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 64px;
        background: linear-gradient(135deg, #ff8a4c 0%, #e84a2a 100%);
        padding: 14px 20px;
        box-shadow: 0 10px 28px rgba(200, 65, 30, .22);
        color: #fff;
        z-index: 100;
    }
    .header-logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }
    .header-logo i { font-size: 24px; }
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        margin-left: auto;
    }
    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 10px;
        flex-shrink: 0;
    }
    .store-name-badge,
    .table-info {
        background: rgba(255, 255, 255, .22);
        border: 1px solid rgba(255, 255, 255, .22);
        padding: 5px 15px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .store-name-badge .badge-text,
    .table-info .badge-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .header-right button {
        background: rgba(255, 255, 255, .2);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 999px;
        height: 34px;
        min-height: 34px;
        padding: 0 14px;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .header-right button:hover { background: rgba(255, 255, 255, .35); }

    /* 语言按钮（圆形） */
    .lang-btn-wrap {
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        max-width: 34px !important;
        min-height: 34px !important;
        max-height: 34px !important;
        padding: 0 !important;
        border-radius: 50% !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        overflow: hidden;
    }
    .lang-btn-wrap .lang-icon {
        display: inline-block !important;
        font-size: 16px !important;
        line-height: 1 !important;
        pointer-events: none !important;
    }

    /* 语言下拉面板 */
    .lang-menu {
        position: fixed;
        z-index: 1200;
        min-width: 170px;
        max-width: 240px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(20, 20, 40, 0.22), 0 2px 8px rgba(20, 20, 40, 0.08);
        padding: 6px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
    }
    .lang-menu[hidden] { display: none !important; }
    .lang-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 14px;
        border: 0;
        background: transparent;
        color: #333;
        font-size: 15px;
        font-weight: 500;
        text-align: left;
        border-radius: 10px;
        cursor: pointer;
        line-height: 1.4;
        min-height: 40px;
        transition: background 0.15s ease;
        font-family: inherit;
    }
    .lang-menu button:hover { background: #f4f5f9; }
    .lang-menu button:active { background: #eceef4; }
    .lang-menu button.active {
        background: linear-gradient(135deg, #fff2ec, #ffe6db);
        color: var(--primary-dark);
        font-weight: 700;
    }
    .lang-menu button.active::after {
        content: '✓';
        margin-left: auto;
        color: var(--primary);
        font-weight: 700;
    }

    /* ========== 分类 Tab ========== */
    .category-tabs {
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 90;
        padding: 10px 12px 8px;
        border-bottom: 1px solid rgba(0, 0, 0, .04);
        overflow-x: auto;
        display: flex;
        gap: 8px;
        scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cats-scroll { display: contents; }
    .category-tab {
        flex-shrink: 0;
        padding: 6px 16px;
        border-radius: 999px;
        border: none;
        background: #f3f4f8;
        color: #666;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
    }
    .category-tab.active {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        color: #fff;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .25);
    }

    /* ========== 主内容与菜单 ========== */
    .main-content {
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px 12px 100px;
    }
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
    }
    .menu-item {
        background: #fff;
        border: 1px solid rgba(0, 0, 0, .04);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(20, 20, 40, .07);
        overflow: hidden;
        transition: transform .22s ease, box-shadow .22s ease;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 260px;
    }
    .menu-item:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(20, 20, 40, .13); }
    .menu-item .img-wrap {
        height: 156px;
        background: linear-gradient(135deg, #f7f0ea, #eee8f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
    }
    .menu-item .img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .menu-item .img-wrap .tag {
        position: absolute;
        top: 6px; left: 6px;
        background: #ffb347;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 10px;
    }
    .menu-item .info {
        padding: 9px 11px 11px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .menu-item .info .name {
        font-size: 15px;
        font-weight: 700;
        color: #2f2f3a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .menu-item .info .desc {
        font-size: 11px;
        color: #9a9aa6;
        margin-top: 2px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .menu-item .info .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
        flex-wrap: wrap;
        row-gap: 4px;
    }
    .menu-item .info .price { font-size: 16px; font-weight: 700; color: #e84a2a; }
    .menu-item .info .price-secondary { font-size: 12px; color: var(--gray-500); margin-left: 6px; }
    .menu-item .info .add-btn,
    .menu-item .info .dec-btn {
        width: 32px;
        height: 32px;
        min-height: 0 !important;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 32px;
        cursor: pointer;
        font-size: 14px;
    }
    .menu-item .info .add-btn {
        border: none;
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        color: #fff;
        box-shadow: 0 6px 14px rgba(232, 74, 42, .28);
    }
    .menu-item .info .dec-btn {
        border: 1px solid #ddd;
        background: #fff;
        color: #777;
        font-size: 13px;
    }
    .item-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .qty-badge {
        background: var(--primary);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 0 7px;
        border-radius: 10px;
        min-width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .empty-state {
        grid-column: 1/-1;
        text-align: center;
        padding: 40px;
        color: var(--gray-400);
    }
    .empty-state i { font-size: 40px; }
    .empty-state p { margin-top: 10px; }

    /* ========== 购物车底栏与抽屉 ========== */
    .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(16px);
        border-radius: 22px 22px 0 0;
        padding: 10px 18px 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        box-shadow: 0 -8px 28px rgba(20, 20, 40, .08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 200;
        border-top: 1px solid var(--gray-200);
    }
    .cart-bar .cart-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        cursor: pointer;
    }
    .cart-bar .cart-icon-wrap {
        position: relative;
        width: 42px;
        height: 42px;
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .28);
    }
    .cart-bar .cart-icon-wrap .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #ffb347;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
    }
    .cart-bar .cart-summary { flex: 1; font-size: 12px; color: var(--gray-500); }
    .cart-bar .cart-summary .total { font-weight: 700; color: var(--gray-700); font-size: 16px; }
    .cart-bar .checkout-btn {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border: none;
        color: #fff;
        padding: 9px 22px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .25);
        white-space: nowrap;
    }
    .cart-bar .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .cart-drawer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 65vh;
        background: #fff;
        border-radius: 22px 22px 0 0;
        box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
        z-index: 300;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
    }
    .cart-drawer.open { transform: translateY(0); }
    .cart-drawer .drawer-header {
        padding: 14px 18px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f0f0f3;
        flex-shrink: 0;
    }
    .cart-drawer .drawer-header h3 { font-size: 16px; font-weight: 700; }
    .cart-drawer .drawer-header .close-btn {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cart-drawer .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 18px 18px;
    }
    .cart-drawer .cart-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--gray-100);
    }
    .cart-drawer .cart-item .item-emoji { font-size: 24px; width: 36px; text-align: center; }
    .cart-drawer .cart-item .item-info { flex: 1; min-width: 0; }
    .cart-drawer .cart-item .item-info .item-name { font-weight: 500; font-size: 14px; word-break: break-word; }
    .cart-drawer .cart-item .item-info .item-price { font-size: 12px; color: var(--primary); }
    .cart-drawer .cart-item .item-qty { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .cart-drawer .cart-item .item-qty button {
        width: 32px;
        height: 32px;
        min-height: 0;
        flex: 0 0 32px;
        border-radius: 50%;
        border: 1px solid var(--gray-300);
        background: #fff;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cart-drawer .cart-item .item-qty .qty-num { font-weight: 600; min-width: 20px; text-align: center; }
    .cart-drawer .cart-item .item-remove {
        color: #ff4d4f;
        background: #fff1f1;
        border: none;
        font-size: 14px;
        cursor: pointer;
        width: 32px;
        height: 32px;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }
    .cart-drawer .drawer-footer {
        padding: 12px 18px 16px;
        border-top: 1px solid #f0f0f3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .cart-drawer .drawer-footer .drawer-total strong { color: var(--primary); font-size: 20px; }
    .cart-drawer .drawer-footer .submit-btn {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border: none;
        color: #fff;
        padding: 10px 28px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
    }

    /* ========== 遮罩 ========== */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(18, 18, 32, .46);
        z-index: 250;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
        backdrop-filter: blur(2px);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* ========== 订单卡片 ========== */
    .order-detail-wrap { padding: 4px 0; }
    .order-card {
        background: #fff;
        border-radius: 14px;
        padding: 16px 18px 14px;
        margin-bottom: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        border: 1px solid #f0ece8;
    }
    .order-card:last-child { margin-bottom: 0; }
    .order-card .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid #f0ece8;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .order-card .order-id { font-weight: 700; font-size: 17px; color: #2d2d2d; letter-spacing: 0.3px; }
    .order-card .order-id .order-id-hash { color: var(--primary); margin-right: 2px; }
    .order-card .order-status-badge {
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        background: #f7e4db;
        color: #b85a3a;
    }
    .order-card .order-status-badge.done { background: #e6f7e6; color: #2f9e44; }
    .order-card .order-status-badge.pending { background: #fff3e0; color: #d97a2a; }
    .order-card .order-items { display: flex; flex-direction: column; }
    .order-card .order-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        border-bottom: 1px solid #f5f2ef;
        gap: 10px;
        min-height: 36px;
    }
    .order-card .order-item:last-child { border-bottom: none; }
    .order-card .order-item .item-name {
        flex: 1;
        font-size: 14px;
        color: #2d2d2d;
        font-weight: 500;
        min-width: 0;
        word-break: break-word;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .order-card .order-item .item-name .item-emoji { font-size: 16px; flex-shrink: 0; }
    .order-card .order-item .item-name .item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order-card .order-item .item-name .item-qty-mark { color: var(--gray-500); font-weight: 400; margin-left: 2px; flex-shrink: 0; }
    .order-card .order-item .item-price {
        font-weight: 600;
        font-size: 15px;
        color: #2d2d2d;
        white-space: nowrap;
        margin: 0 6px;
        flex-shrink: 0;
        text-align: right;
        min-width: 60px;
    }
    .order-card .order-item .item-price .price-secondary {
        font-size: 12px;
        font-weight: 400;
        color: var(--gray-500);
        margin-left: 2px;
    }
    .order-card .order-item .item-status-label {
        padding: 3px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        text-align: center;
        min-width: 56px;
    }
    .order-card .order-item .item-status-label.pending { background: #fff3e0; color: #d97a2a; }
    .order-card .order-item .item-status-label.done { background: #e6f7e6; color: #2f9e44; }
    .order-card .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid #f0ece8;
        margin-top: 6px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .order-card .order-footer .total-label { font-size: 15px; font-weight: 600; color: var(--gray-600); }
    .order-card .order-footer .total-amount { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
    .order-card .order-footer .total-amount .total-secondary { font-size: 14px; font-weight: 400; color: var(--gray-500); }
    .order-empty-state { color: #aaa; padding: 30px 20px; text-align: center; font-size: 15px; }
    .order-empty-state i { font-size: 36px; display: block; margin-bottom: 12px; color: #ddd; }

    /* ========== 模态框通用 ========== */
    .order-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: #fff;
        border-radius: var(--radius);
        padding: 24px;
        z-index: 700;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        color: #333;
    }
    .order-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .order-modal h3 {
        font-size: 19px;
        font-weight: 700;
        color: #2d2d2d;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .order-modal h3 i { color: var(--primary); }
    .order-modal .form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
        border-top: 1px solid #f0ece8;
        padding-top: 14px;
    }
    .order-modal .form-actions button {
        padding: 8px 24px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
    }
    .order-modal .form-actions .btn-save {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        color: #fff;
    }
    .order-modal .form-actions .btn-cancel {
        background: #f0ece8;
        color: #555;
        transition: background 0.2s;
    }
    .order-modal .form-actions .btn-cancel:hover { background: #e5dfda; }

    /* 备注输入框 */
    #orderNoteInput {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        min-height: 40px;
        max-height: 120px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e5dfda;
        background: #fafafa;
        color: #333;
        font: inherit;
        font-size: 14px;
        transition: border-color 0.2s, background 0.2s;
    }
    #orderNoteInput::placeholder { color: #aaa; }
    #orderNoteInput:focus { outline: none; border-color: var(--primary); background: #fff; }

    /* 下单成功卡片 */
    #orderSuccessModal .order-modal-card { text-align: center; padding: 8px 4px; }
    #orderSuccessModal .success-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: #e9f9ee;
        color: #2fb767;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
    }
    #orderSuccessModal .success-msg { font-size: 15px; color: #333; line-height: 1.6; margin: 0 0 16px; }
    #orderSuccessModal .success-note {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        text-align: left;
        background: #fff8e8;
        border: 1px solid #ffe4a8;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        color: #a06a0a;
        line-height: 1.6;
    }
    #orderSuccessModal .success-note i { margin-top: 2px; color: #e0a30a; }
    #orderSuccessModal .form-actions { justify-content: center; }
    #orderSuccessModal .form-actions .btn-save { padding: 9px 40px; }

    /* 订单备注展示 */
    .order-note {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 193, 7, .12);
        font-size: 13px;
        color: #c98a1f;
        line-height: 1.5;
    }

    /* ========== 呼叫服务员确认弹窗 ========== */
    .confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        padding: 20px;
    }
    .confirm-overlay.show { opacity: 1; pointer-events: auto; }
    .confirm-card {
        background: #fff;
        border-radius: 20px;
        padding: 28px 24px 24px;
        width: 100%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        transform: scale(0.9) translateY(20px);
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .confirm-overlay.show .confirm-card { transform: scale(1) translateY(0); }
    .confirm-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #ff8a4c 0%, #e84a2a 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 8px 24px rgba(232, 74, 42, 0.35);
    }
    .confirm-title { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .confirm-message { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    .confirm-buttons { display: flex; gap: 12px; }
    .confirm-btn {
        flex: 1;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
    }
    .confirm-btn.cancel { background: #f5f5f7; color: #666; }
    .confirm-btn.cancel:hover { background: #e8e8ed; }
    .confirm-btn.confirm {
        background: linear-gradient(135deg, #ff8a4c 0%, #e84a2a 100%);
        color: #fff;
        box-shadow: 0 4px 12px rgba(232, 74, 42, 0.3);
    }
    .confirm-btn.confirm:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(232, 74, 42, 0.4); }
    .confirm-btn:active { transform: scale(0.97); }

    /* ========== 滚动条 ========== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 10px; }

    /* ========== 移动端（<= 768px） ========== */
    @media (max-width: 768px) {
        body { padding-top: 100px; }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 8px 12px 10px;
            gap: 8px;
            flex-wrap: wrap;
            align-content: flex-start;
            border-radius: 0 0 18px 18px;
            z-index: 100;
        }
        .header .header-logo {
            order: 0;
            width: 100%;
            text-align: center;
            justify-content: center;
            font-size: 20px !important;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: static;
            transform: none;
        }
        .header .header-logo i { font-size: 20px !important; }
        .header .header-left { order: 1; flex: 1; min-width: 0; gap: 6px; margin-left: 0; }
        .header .header-right { order: 2; margin-left: 0; gap: 6px; }

        .store-name-badge { max-width: 150px; padding: 3px 10px; font-size: 12px; }
        .table-info { max-width: 100px; padding: 3px 10px; font-size: 12px; }

        .category-tabs {
            position: fixed;
            top: 97px;
            left: 0; right: 0;
            padding: 8px 10px;
            z-index: 90;
        }
        .cats-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
            min-width: 0;
        }
        .cats-scroll::-webkit-scrollbar { display: none; }

        .main-content { padding-top: 50px !important; }

        .menu-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 4px; }
        .menu-item { min-height: 220px; border-radius: 16px; }
        .menu-item .img-wrap { height: 130px; font-size: 36px; }
        .menu-item .info { padding: 8px 10px 10px; }
        .menu-item .info .name { font-size: 13px; }
        .menu-item .info .desc { font-size: 10px; }
        .menu-item .info .price { font-size: 14px; }
        .menu-item .info .price-secondary { font-size: 10px; }
        .menu-item .info .add-btn,
        .menu-item .info .dec-btn { width: 28px; height: 28px; flex: 0 0 28px; font-size: 13px; }

        .header-right button {
            width: 34px !important;
            height: 34px !important;
            min-width: 34px !important;
            max-width: 34px !important;
            min-height: 34px !important;
            max-height: 34px !important;
            border-radius: 50% !important;
            padding: 0 !important;
            font-size: 16px !important;
        }
    }

    @media (max-width: 480px) {
        .header-logo { font-size: 18px !important; }
        .header-logo i { font-size: 18px !important; }
        .store-name-badge { max-width: 120px; font-size: 11px; padding: 3px 8px; }
        .table-info { max-width: 80px; font-size: 11px; padding: 3px 8px; }

        .order-card { padding: 12px 14px; }
        .order-card .order-item { padding: 5px 0; flex-wrap: wrap; gap: 4px 8px; }
        .order-card .order-item .item-name { font-size: 13px; flex: 1 1 100%; order: 0; }
        .order-card .order-item .item-price { font-size: 14px; min-width: 50px; order: 1; margin-left: 0; text-align: left; }
        .order-card .order-item .item-status-label { font-size: 11px; padding: 2px 12px; min-width: 48px; order: 2; }
        .order-card .order-footer .total-amount { font-size: 16px; }
        .order-card .order-id { font-size: 15px; }
        .order-card .order-status-badge { font-size: 12px; padding: 3px 12px; }
    }

    @media (max-width: 380px) {
        .header-logo { font-size: 16px !important; }
        .header-logo i { font-size: 16px !important; }
        .menu-grid { gap: 8px; }
        .menu-item .img-wrap { height: 120px; }
        .cart-bar .cart-summary { font-size: 11px; }
        .cart-bar .cart-summary .total { font-size: 14px; }
        .checkout-btn { padding: 8px 15px; font-size: 13px; }
    }

    /* 桌面端 */
    @media (min-width: 769px) {
        body { padding-top: 0; }
        .header { position: relative; border-radius: 0; }
        .category-tabs { position: sticky; top: 0; }
        .cats-scroll { display: contents; }
        .main-content { padding: 16px 24px 100px; }
        .menu-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    }

    @media (min-width: 700px) {
        .main-content { padding-left: 28px; padding-right: 28px; }
    }

    /* 横屏小高度 */
    @media (orientation: landscape) and (max-height: 500px) {
        .header { padding: 9px 14px; }
        .category-tabs { padding: 6px 12px; }
        .menu-item .img-wrap { height: 116px; }
        .cart-bar { padding: 6px 14px 8px; }
    }

    /* 安全区域 */
    .main-content, .category-tabs, .header {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
    }
</style>

<body>

    <header class="header">
        <div class="header-logo"><i class="fas fa-utensils"></i> <span id="appName">味享</span></div>
        <div class="header-left">
            <span class="store-name-badge" id="storeNameDisplay"><i class="fas fa-store"></i> <span class="badge-text">加载中...</span></span>
            <span class="table-info" id="tableInfo" title="请扫描桌面二维码绑定桌号"><i class="fas fa-chair"></i> <span class="badge-text" id="tableDisplay">未扫码</span></span>
        </div>
        <div class="header-right">
            <button id="callWaiterBtn" type="button" title="呼叫服务员" hidden>🔔</button>
            <button id="customerOrderBtn" type="button" title="订单详情" hidden>🧾</button>
            <button type="button" class="lang-btn-wrap" id="langBtn" title="Language / 语言" aria-haspopup="listbox" aria-expanded="false">
                <span class="lang-icon">🌐</span>
            </button>
        </div>
    </header>

    <nav class="category-tabs" id="categoryTabs">
        <div class="cats-scroll" id="catsScroll"></div>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="menu-grid" id="menuGrid"></div>
    </main>

    <div class="cart-bar" id="cartBar" style="display:none;">
        <div class="cart-left" id="cartToggle">
            <div class="cart-icon-wrap">
                <i class="fas fa-shopping-cart"></i>
                <span class="badge" id="cartBadge">0</span>
            </div>
            <div class="cart-summary">
                <span class="total" id="cartTotal">0.00</span>
                <span id="cartLabel">购物车</span>
            </div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" disabled><span id="checkoutLabel">去结算</span></button>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3><i class="fas fa-shopping-cart" style="color:var(--primary);"></i> <span id="drawerTitle">购物车</span></h3>
            <button class="close-btn" id="closeDrawer" type="button">✕</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
        <div class="drawer-footer">
            <div class="drawer-total"><span id="totalLabel">合计</span> <strong id="drawerTotal">0.00</strong></div>
            <button class="submit-btn" id="submitOrderBtn" type="button"><span id="submitLabel">确认下单</span></button>
        </div>
    </div>

    <!-- 呼叫服务员确认弹窗 -->
    <div class="confirm-overlay" id="callWaiterConfirmOverlay">
        <div class="confirm-card">
            <div class="confirm-icon">🔔</div>
            <div class="confirm-title" id="callConfirmTitle">呼叫服务员</div>
            <div class="confirm-message" id="callConfirmMessage">确认呼叫服务员？</div>
            <div class="confirm-buttons">
                <button class="confirm-btn cancel" id="callConfirmCancel" type="button">取消</button>
                <button class="confirm-btn confirm" id="callConfirmOk" type="button">确认呼叫</button>
            </div>
        </div>
    </div>

    <!-- 顾客订单详情弹窗 -->
    <div class="order-modal" id="customerOrderModal">
        <div class="order-modal-card">
            <h3><i class="fas fa-list-ul"></i> <span id="customerOrderTitle">订单详情</span></h3>
            <div id="customerOrderDetail" class="order-detail-wrap"></div>
            <div class="form-actions">
                <button class="btn-cancel" id="customerOrderCloseBtn" type="button">关闭</button>
            </div>
        </div>
    </div>

    <!-- 下单二次确认弹窗 -->
    <div class="order-modal" id="confirmOrderModal">
        <div class="order-modal-card">
            <h3><i class="fas fa-clipboard-check"></i> <span id="confirmOrderTitle">去结算</span></h3>
            <p id="confirmOrderDesc" style="color:#999;font-size:13px;margin:-8px 0 12px;line-height:1.5;">请核对以下菜品和数量，确认无误后提交</p>
            <div id="confirmOrderList" class="order-detail-wrap"></div>
            <div class="order-note-wrap" style="margin-top:12px;">
                <label for="orderNoteInput" id="orderNoteLabel" style="display:block;font-size:13px;color:#999;margin-bottom:6px;">备注（选填）</label>
                <textarea id="orderNoteInput" maxlength="200" rows="2" placeholder="如：不要香菜、少辣、打包带走…"></textarea>
            </div>
            <div class="form-actions">
                <button class="btn-cancel" id="confirmOrderCancelBtn" type="button">取消</button>
                <button class="btn-save" id="confirmOrderSubmitBtn" type="button">确认下单</button>
            </div>
        </div>
    </div>

    <!-- 下单成功提示弹窗 -->
    <div class="order-modal" id="orderSuccessModal">
        <div class="order-modal-card">
            <div class="success-icon"><i class="fas fa-check"></i></div>
            <h3 id="orderSuccessTitle">下单成功</h3>
            <p class="success-msg" id="orderSuccessMsg">请移步到「订单详情」查看订单</p>
            <div class="success-note">
                <i class="fas fa-circle-exclamation"></i>
                <span id="orderSuccessNote">注意：无法自行修改和取消订单，如需修改或取消订单，请联系商户</span>
            </div>
            <div class="form-actions">
                <button class="btn-save" id="orderSuccessCloseBtn" type="button">知道了</button>
            </div>
        </div>
    </div>

    <!-- 语言下拉面板 -->
    <div class="lang-menu" id="langMenu" role="listbox" aria-label="Language" hidden>
        <button type="button" data-lang="zh" role="option">🇨🇳 中文</button>
        <button type="button" data-lang="en" role="option">🇬🇧 English</button>
        <button type="button" data-lang="vi" role="option">🇻🇳 Tiếng Việt</button>
        <button type="button" data-lang="th" role="option">🇹🇭 ภาษาไทย</button>
        <button type="button" data-lang="km" role="option">🇰🇭 ភាសាខ្មែរ</button>
    </div>

  <script src="assets/modules/customer-group.js?v=20260923"></script>
  <script src="assets/modules/role.js?v=20260923"></script>
  <script src="assets/modules/idle.js?v=20260923"></script>
