﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FoodFlow · QR Ordering System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 原有样式保持不变 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e85d3a;
            --primary-dark: #c94a2a;
            --primary-bg: #fff5f0;
            --gray-100: #f8f8f8;
            --gray-200: #eeeeee;
            --gray-300: #dddddd;
            --gray-400: #aaaaaa;
            --gray-500: #888888;
            --gray-600: #555555;
            --gray-700: #333333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --admin-bg: #1e1e2f;
            --admin-card: #2d2d44;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--gray-100);
            color: var(--gray-700);
            line-height: 1.6;
            padding-bottom: 80px;
        }
        .toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(232, 93, 58, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .header-logo { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .header-logo i { font-size: 22px; }
        .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .header-right select, .header-right button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            height: 32px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-right select option { color: #333; background: #fff; }
        .header-right button:hover, .header-right select:hover { background: rgba(255, 255, 255, 0.35); }
        .header-left .table-info {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            max-width: 140px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-left .table-info i { flex-shrink: 0; }
        .table-info .badge-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; min-width: fit-content; max-width: 100%; }
        .header-right .status-badge { background: rgba(255, 255, 255, 0.15); padding: 2px 12px; border-radius: 12px; font-size: 11px; }
        .store-name-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            max-width: none;
            min-width: 0;
            white-space: nowrap;
        }
        .store-name-badge .badge-text { white-space: nowrap; min-width: 0; }
        .category-tabs {
            background: #fff;
            padding: 10px 12px 6px;
            position: sticky;
            top: 72px;
            z-index: 90;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
            display: flex;
            gap: 6px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .table-orders { max-width: 1000px; margin: 10px auto 0; padding: 0 12px; }
        .table-orders-card {
            background: linear-gradient(135deg, #fff7f2, #fff);
            border: 1px solid #ffd8c9;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
        }
        .table-orders-title { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }
        .table-order-line { padding: 7px 0; border-top: 1px dashed #f1c7b5; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
        .table-order-line small { color: var(--gray-500); display: block; margin-top: 2px; }
        .current-order { border-top: 1px dashed #f1c7b5; padding: 9px 0; }
        .current-order:first-of-type { border-top: 0; padding-top: 0; }
        .current-order-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
        .current-order-head .order-no { font-weight: 700; color: var(--primary-dark); }
        .current-order-head .order-status { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #f7e4db; color: #c94a2a; }
        .current-order-head .order-status.done { background: #e6f7e6; color: #2f9e44; }
        .current-order-items { display: flex; flex-direction: column; gap: 4px; }
        .current-order-item { display: grid; grid-template-columns: 1fr auto 64px; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-600); }
        .current-order-item .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .current-order-item .qty { color: var(--gray-400); white-space: nowrap; text-align: right; }
        .current-order-item .item-status { display: inline-block; justify-self: end; text-align: center; white-space: nowrap; padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #f7e4db; color: #c94a2a; }
        .current-order-item .item-status.done { background: #e6f7e6; color: #2f9e44; }
        .current-order-foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--gray-600); }
        .current-order-foot strong { color: var(--primary-dark); }
        .current-orders-summary { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ffd8c9; display: flex; justify-content: space-between; font-weight: 700; color: var(--primary-dark); }

        /* 订单详情卡片样式 */
        .order-detail-wrap { padding: 4px 0; }
        .order-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px 18px 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            border: 1px solid #f0ece8;
            transition: box-shadow 0.2s;
        }
        .order-card:last-child { margin-bottom: 0; }
        .order-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0ece8;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .order-id { font-weight: 700; font-size: 17px; color: #2d2d2d; letter-spacing: 0.3px; }
        .order-card .order-id .order-id-hash { color: var(--primary); margin-right: 2px; }
        .order-card .order-status-badge { padding: 4px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; background: #f7e4db; color: #b85a3a; }
        .order-card .order-status-badge.done { background: #e6f7e6; color: #2f9e44; }
        .order-card .order-status-badge.pending { background: #fff3e0; color: #d97a2a; }
        .order-card .order-items { display: flex; flex-direction: column; gap: 0; }
        .order-card .order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #f5f2ef;
            gap: 10px;
            min-height: 36px;
        }
        .order-card .order-item:last-child { border-bottom: none; }
        .order-card .order-item .item-name {
            flex: 1;
            font-size: 14px;
            color: #2d2d2d;
            font-weight: 500;
            min-width: 0;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .order-card .order-item .item-name .item-emoji { font-size: 16px; flex-shrink: 0; }
        .order-card .order-item .item-name .item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .order-card .order-item .item-name .item-qty-mark { color: var(--gray-500); font-weight: 400; margin-left: 2px; flex-shrink: 0; }
        .order-card .order-item .item-price { font-weight: 600; font-size: 15px; color: #2d2d2d; white-space: nowrap; margin: 0 6px; flex-shrink: 0; text-align: right; min-width: 60px; }
        .order-card .order-item .item-price .price-secondary { font-size: 12px; font-weight: 400; color: var(--gray-500); margin-left: 2px; }
        .order-card .order-item .item-status-label { padding: 3px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; text-align: center; min-width: 56px; }
        .order-card .order-item .item-status-label.pending { background: #fff3e0; color: #d97a2a; }
        .order-card .order-item .item-status-label.done { background: #e6f7e6; color: #2f9e44; }
        .order-card .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f0ece8;
            margin-top: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .order-footer .total-label { font-size: 15px; font-weight: 600; color: var(--gray-600); }
        .order-card .order-footer .total-amount { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
        .order-card .order-footer .total-amount .total-secondary { font-size: 14px; font-weight: 400; color: var(--gray-500); }
        .order-empty-state { color: #aaa; padding: 30px 20px; text-align: center; font-size: 15px; }
        .order-empty-state i { font-size: 36px; display: block; margin-bottom: 12px; color: #ddd; }
        @media (max-width: 500px) {
            .order-card { padding: 12px 14px 12px; }
            .order-card .order-item { padding: 5px 0; flex-wrap: wrap; gap: 4px 8px; }
            .order-card .order-item .item-name { font-size: 13px; flex: 1 1 100%; order: 0; }
            .order-card .order-item .item-price { font-size: 14px; min-width: 50px; order: 1; margin-left: 0; text-align: left; }
            .order-card .order-item .item-status-label { font-size: 11px; padding: 2px 12px; min-width: 48px; order: 2; }
            .order-card .order-footer .total-amount { font-size: 16px; }
            .order-card .order-id { font-size: 15px; }
            .order-card .order-status-badge { font-size: 12px; padding: 3px 12px; }
        }
        @media (max-width: 380px) {
            .order-card .order-item .item-name { font-size: 12px; }
            .order-card .order-item .item-price { font-size: 13px; min-width: 44px; }
            .order-card .order-item .item-status-label { font-size: 10px; padding: 2px 10px; min-width: 40px; }
        }

        .category-tab {
            flex-shrink: 0;
            padding: 5px 16px;
            border-radius: 20px;
            border: none;
            background: var(--gray-100);
            color: var(--gray-600);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .category-tab.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(232, 93, 58, 0.3); }
        .main-content { max-width: 1000px; margin: 0 auto; padding: 12px 12px 100px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .menu-item {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 260px;
        }
        .menu-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .menu-item .img-wrap {
            height: 120px;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .menu-item .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .menu-item .img-wrap .tag { position: absolute; top: 6px; left: 6px; background: #ffb347; color: #fff; font-size: 9px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
        .menu-item .info { padding: 8px 10px 10px; flex: 1; display: flex; flex-direction: column; }
        .menu-item .info .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-item .info .desc { font-size: 11px; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .menu-item .info .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .menu-item .info .price { font-weight: 700; color: var(--primary); font-size: 15px; }
        .menu-item .info .price-secondary { font-size: 12px; color: var(--gray-500); margin-left: 6px; }
        .menu-item .info .add-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .menu-item .info .qty-badge {
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 0 7px;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px 10px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
            border-top: 1px solid var(--gray-200);
            backdrop-filter: blur(8px);
        }
        .cart-bar .cart-left { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
        .cart-bar .cart-icon-wrap {
            position: relative;
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .cart-bar .cart-icon-wrap .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ffb347;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .cart-bar .cart-summary { flex: 1; font-size: 12px; color: var(--gray-500); }
        .cart-bar .cart-summary .total { font-weight: 700; color: var(--gray-700); font-size: 16px; }
        .cart-bar .checkout-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(232, 93, 58, 0.35);
            white-space: nowrap;
        }
        .cart-bar .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .cart-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 65vh;
            background: #fff;
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open { transform: translateY(0); }
        .cart-drawer .drawer-header { padding: 14px 18px 10px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
        .cart-drawer .drawer-body { flex: 1; overflow-y: auto; padding: 10px 18px 18px; }
        .cart-drawer .cart-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--gray-100); }
        .cart-drawer .cart-item .item-emoji { font-size: 24px; width: 36px; text-align: center; }
        .cart-drawer .cart-item .item-info { flex: 1; }
        .cart-drawer .cart-item .item-info .item-name { font-weight: 500; font-size: 14px; }
        .cart-drawer .cart-item .item-info .item-price { font-size: 12px; color: var(--primary); }
        .cart-drawer .cart-item .item-qty { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .cart-drawer .cart-item .item-qty button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--gray-300);
            background: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-drawer .cart-item .item-qty .qty-num { font-weight: 600; min-width: 20px; text-align: center; }
        .cart-drawer .cart-item .item-remove { color: #ff4d4f; background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 4px; }
        .cart-drawer .drawer-footer { padding: 12px 18px 16px; border-top: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .cart-drawer .drawer-footer .drawer-total strong { color: var(--primary); font-size: 20px; }
        .cart-drawer .drawer-footer .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(2px);
        }
        .overlay.show { opacity: 1; pointer-events: auto; }
        .admin-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: var(--admin-bg);
            color: #eee;
            z-index: 500;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 60px 16px 20px;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
        }
        .admin-panel.open { transform: translateX(0); }
        .admin-panel .admin-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #aaa; font-size: 28px; cursor: pointer; }
        .admin-panel h2 { font-size: 20px; margin-bottom: 16px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .admin-panel .admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .admin-panel .admin-tabs button { background: var(--admin-card); border: none; color: #aaa; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .admin-panel .admin-tabs button.active { background: var(--primary); color: #fff; }
        .admin-panel .admin-tab-content { display: none; }
        .admin-panel .admin-tab-content.active { display: block; }
        .admin-card { background: var(--admin-card); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .admin-card .info { flex: 1; }
        .admin-card .info .title { font-weight: 600; font-size: 14px; }
        .admin-card .info .sub { font-size: 12px; color: #888; }
        .admin-card .actions button { background: rgba(255, 255, 255, 0.1); border: none; color: #eee; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; margin-left: 4px; }
        .admin-card .actions .del { color: #ff6b6b; }
        .admin-card .actions .edit { color: #ffd93d; }
        .admin-form { background: var(--admin-card); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .admin-form input, .admin-form select { padding: 6px 10px; border-radius: 8px; border: none; background: #3a3a55; color: #fff; font-size: 13px; }
        .admin-form input::placeholder { color: #888; }
        .admin-form .full-width { grid-column: 1 / -1; }
        .admin-form button { background: var(--primary); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .admin-form .file-input-wrapper { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
        .admin-form .file-input-wrapper input[type="file"] { flex: 1; color: #ccc; }

<script>
  const customerSocket = io({ query: { storeId: (SLF.store.rawGet('storeId') || 1) } });

    <script>
        // ============================================================
        // 🔥 方案 B：语言选择改用自定义下拉
        // 1. 删除 langSelect 相关逻辑，改用 #langBtn + #langMenu
        // 2. currentLang 由顶部 IIFE 直接初始化，applyLanguage 不再从 select 读值
        // 3. 新增 switchLanguage / positionLangMenu / updateLangMenuActive
        // ============================================================

        // 常量：分类"全部"的哨兵值，不依赖 i18n
        const ALL_CATEGORY = '__ALL__';
        const HOT_CATEGORY = '__HOT__';

        // 初始化统一 i18n - 自动检测顾客手机终端语言
        (function() {
            const savedLang = SLF.store.rawGet('preferredLang');
            let initLang = 'zh';
            if (savedLang && ['zh','en','vi','th','km'].includes(savedLang)) {
                initLang = savedLang;
            } else {
                const sys = (navigator.language || navigator.userLanguage || '').toLowerCase();
                if (sys.startsWith('zh')) initLang = 'zh';
                else if (sys.startsWith('vi')) initLang = 'vi';
                else if (sys.startsWith('th')) initLang = 'th';
                else if (sys.startsWith('km')) initLang = 'km';
                else if (sys.startsWith('en')) initLang = 'en';
                else initLang = 'zh';
            }
            SLF.i18n.init(initLang);
        })();

        let currentLang = (function() {
            const saved = SLF.store.rawGet('preferredLang');
            if (saved && ['zh','en','vi','th','km'].includes(saved)) return saved;
            const sys = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (sys.startsWith('zh')) return 'zh';
            if (sys.startsWith('vi')) return 'vi';
            if (sys.startsWith('th')) return 'th';
            if (sys.startsWith('km')) return 'km';
            if (sys.startsWith('en')) return 'en';
            return 'zh';
        })();

        // 动态加载指定语言的翻译
        async function loadLanguageData(lang) {
            try { SLF.store.rawRemove('i18n_' + lang); } catch (e) {}
            if (SLF.i18n.dicts) { delete SLF.i18n.dicts[lang]; }
            try {
                await SLF.i18n.loadLanguage(lang);
            } catch (e) {
                console.warn('loadLanguage failed:', e);
            }
            SLF.i18n.lang = lang;
            currentLang = lang;
            return true;
        }

        // 统一 i18n 翻译，带兜底：字典缺失时返回 key 而不抛错
        function t(key, params) {
            try {
                if (!SLF || !SLF.i18n || typeof SLF.i18n.t !== 'function') return key;
                const v = SLF.i18n.t(key, params);
                return (v === undefined || v === null) ? key : v;
            } catch (e) {
                return key;
            }
        }

        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function escNote(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function getCategoryTranslation(cat) {
            if (cat === ALL_CATEGORY) return t('all');
            if (cat === HOT_CATEGORY) return '🔥 ' + t('hotSelling');
            const result = t('categories');
            if (result && typeof result === 'object' && result[cat]) {
                return result[cat];
            }
            return cat;
        }

        function getMenuTranslation(item) {
            if (!item || currentLang === 'zh') return null;
            const name = item.name_en || item.name;
            const desc = item.desc_en || item.desc;
            return { name, desc };
        }

        let state = {
            cart: {},
            currentCategory: ALL_CATEGORY,   // 🔥 哨兵值，不依赖 i18n
            searchKeyword: '',
            orders: [],
            menu: [],
            tables: [],
            table: '',
            storeId: 1,
            isAdmin: false,
            scanToken: '',
            scanSessionToken: '',
            scanExpiresAt: '',
            currencies: [],
            defaultCurrency: { code: 'USD', symbol: '$', rate: 1 },
            dualCurrency: { enabled: false, currency: null },
            categoryOrder: [],
            currentStore: null
        };
        // 货币基础工具（防御性：currencies 未初始化时返回默认值）
        function toBaseCurrency(price, currencyCode) {
            const list = Array.isArray(state.currencies) ? state.currencies : [];
            const currency = list.find(item => item.code === currencyCode) || { rate: 1 };
            return Number(price || 0) / Number(currency.rate || 1);
        }

        function formatPrimary(amount) {
            const c = state.defaultCurrency || { symbol: '$', rate: 1, code: 'USD' };
            const sym = c.symbol || '$';
            const rate = Number(c.rate || 1);
            return `${sym}${(Number(amount || 0) * rate).toFixed(2)}`;
        }

        function formatSecondary(amount, secondaryCode) {
            if (!secondaryCode) return '';
            const list = Array.isArray(state.currencies) ? state.currencies : [];
            const secCurr = list.find(c => c.code === secondaryCode);
            if (!secCurr) return '';
            const defaultRate = Number((state.defaultCurrency && state.defaultCurrency.rate) || 1);
            const secValue = (Number(amount || 0) / defaultRate) * Number(secCurr.rate || 1);
            return `${secCurr.symbol}${secValue.toFixed(2)}`;
        }

        function getMenuPrices(item) {
            const base = toBaseCurrency(item.price, item.currency_code);
            const primary = formatPrimary(base);
            let secondary = '';
            if (state.dualCurrency && state.dualCurrency.enabled && item.secondary_currency_code) {
                secondary = formatSecondary(base, item.secondary_currency_code);
            }
            return { primary, secondary };
        }

        function isScanSessionValid() {
            return Boolean(state.scanSessionToken && state.scanExpiresAt && new Date(state.scanExpiresAt).getTime() > Date.now());
        }

        // ============================================================
        //  状态
        // ============================================================
        let isBackendOnline = false;
        let orderSearchKeyword = '';
        let configLoaded = false;   // 🔥 标记配置是否已成功加载

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const menuGrid = $('#menuGrid');
        const categoryTabs = $('#categoryTabs');
        const cartBadge = $('#cartBadge');
        const cartTotal = $('#cartTotal');
        const drawerBody = $('#drawerBody');
        const drawerTotal = $('#drawerTotal');
        const cartDrawer = $('#cartDrawer');
        const overlay = $('#overlay');
        const toastEl = $('#toast');
        const tableDisplay = $('#tableDisplay');
        const tableInfo = $('#tableInfo');

        // 🔥 方案 B：语言选择相关 DOM
        const langBtn = $('#langBtn');
        const langMenu = $('#langMenu');

        const orderSearchInput = $('#orderSearchInput');
        const storeNameDisplay = $('#storeNameDisplay');

        // ============================================================
        //  Toast
        // ============================================================
        function showToast(msg, dur = 1800) {
            if (!toastEl) return;
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), dur);
        }

        // ============================================================
        //  API
        // ============================================================
        const API_BASE = '/api';


        async function checkBackend() {
            try {
                await SLF.api.get('/menu');
                isBackendOnline = true;
            } catch {
                isBackendOnline = false;
            }
            return isBackendOnline;
        }

        async function fetchCategoryOrder() {
            try {
                const data = await SLF.api.get(`/public/categories?store_id=${state.storeId || 1}`);


                state.categoryOrder = Array.isArray(data) ? data.map(c => c.name) : [];
            } catch (e) {
                console.warn('分类顺序加载失败，使用默认排序', e);
                state.categoryOrder = [];
            }
        }

        async function fetchStoreInfo() {
            try {
                state.currentStore = await SLF.api.get(`/public/store-info?store_id=${state.storeId || 1}`);


                updateStoreNameDisplay();
            } catch (e) {
                console.warn('加载店铺信息失败:', e);
                state.currentStore = null;
                updateStoreNameDisplay();
            }
        }

        function updateStoreNameDisplay() {
            if (!storeNameDisplay) return;
            if (state.currentStore && state.currentStore.name) {
                storeNameDisplay.textContent = '🏪 ' + state.currentStore.name;
            } else {
                storeNameDisplay.textContent = '🏪 未知店铺';
            }
        }

        async function fetchMenu() {
            try {
                if (!await checkBackend()) throw new Error('后端未连接');
                const data = await SLF.api.get(`/menu?store_id=${state.storeId || 1}`);


                // 🔥 只有拿到有效数组才覆盖，避免把好数据冲掉
                if (Array.isArray(data)) {
                    state.menu = data;
                }
                renderCategories();
                renderMenu();
                updateUI();
            } catch (e) {
                console.warn('fetchMenu failed:', e);
                // 🔥 修复：只有从未成功加载过菜单时才清空 state.menu
                if (state.menu.length === 0) {
                    renderCategories();
                    renderMenu();
                    updateUI();
                }
                showToast('⚠️ 无法加载数据库中的菜单，请检查后端服务', 2500);
            }
        }

        async function fetchStoreConfig() {
            try {
                const config = await SLF.api.get(`/public/config?store_id=${state.storeId || 1}`);


                state.currencies = Array.isArray(config.currencies) ? config.currencies : [];
                state.defaultCurrency = config.defaultCurrency || state.defaultCurrency;
                state.dualCurrency = config.dualCurrency || { enabled: false, currency: null };
                state.maxOrderItems = config.max_order_items || 50;
                state.maxItemQuantity = config.max_item_quantity || 100;
                state.maxOrderNoteLength = config.max_order_note_length || 200;
                if (state.dualCurrency.enabled && !state.dualCurrency.currency) {
                    const defaultSec = state.currencies.find(c => c.code === 'USD') || state.currencies[0];
                    if (defaultSec) state.dualCurrency.currency = defaultSec;
                }
                const noteInput = document.getElementById('orderNoteInput');
                if (noteInput) noteInput.maxLength = state.maxOrderNoteLength;
                configLoaded = true;
            } catch (e) {
                // 🔥 修复：配置加载失败不再抛出，使用默认值继续，避免阻断后续流程
                console.warn('fetchStoreConfig failed, using defaults:', e);
                state.currencies = state.currencies || [];
                state.defaultCurrency = state.defaultCurrency || { code: 'USD', symbol: '$', rate: 1 };
                state.dualCurrency = state.dualCurrency || { enabled: false, currency: null };
                configLoaded = false;
            }
        }

        async function fetchTables() {
            let menuAlreadyFetched = false;
            if (!isBackendOnline) {
                state.tables = [];
                return menuAlreadyFetched;
            }
            try {
                const res = await SLF.api.get('/tables');
                state.tables = res || [];
                const query = new URLSearchParams(window.location.search);
                let token = query.get('token');
                let sessionParam = query.get('session');
                if (SLF.store.rawGet('customer_session_terminated')) {
                    SLF.store.rawRemove('customer_session_terminated');
                    token = null;
                    sessionParam = null;
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.delete('table');
                        url.searchParams.delete('session');
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                }
                if (sessionParam) {
                    const info = await SLF.api.get(`/public/table-session/${encodeURIComponent(sessionParam)}/info`);


                    state.table = info.table;
                    state.storeId = info.storeId || 1;
                    state.scanToken = '';
                    state.scanSessionToken = info.sessionToken;
                    state.scanExpiresAt = info.expiresAt;
                    await fetchStoreInfo();
                    await fetchMenu();
                    menuAlreadyFetched = true;
                } else if (token) {
                    const session = await SLF.api.get(`/public/table-token/${encodeURIComponent(token)}`);


                    state.table = session.table;
                    state.storeId = session.storeId || 1;
                    state.scanToken = token;
                    state.scanSessionToken = session.sessionToken;
                    state.scanExpiresAt = session.expiresAt;
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.set('session', state.scanSessionToken);
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                    await fetchStoreInfo();
                    await fetchMenu();
                    menuAlreadyFetched = true;
                } else {
                    state.table = '';
                    state.scanToken = '';
                    state.scanSessionToken = '';
                    state.scanExpiresAt = '';
                state.storeId = 1;
                }
                tableDisplay.textContent = state.table || t('notScanned');
                tableInfo.title = state.table ? `${t('table')}: ${state.table}` : t('scanToBind');
                document.getElementById('customerOrderBtn').hidden = !isScanSessionValid();
                document.getElementById('callWaiterBtn').hidden = !isScanSessionValid();
                updateUI();
                return menuAlreadyFetched;
            } catch (e) {
                // 🔥 修复：扫码失败时清空 table/session，并给用户明确提示
                console.warn('fetchTables 错误:', e);
                state.tables = [];
                state.table = '';
                state.scanToken = '';
                state.scanSessionToken = '';
                state.scanExpiresAt = '';
                state.storeId = 1;
                tableDisplay.textContent = t('notScanned');
                tableInfo.title = t('scanToBind');
                document.getElementById('customerOrderBtn').hidden = true;
                document.getElementById('callWaiterBtn').hidden = true;
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('token');
                    url.searchParams.delete('table');
                    url.searchParams.delete('session');
                    history.replaceState(null, '', url.pathname + url.search + url.hash);
                } catch (_) {}
                try {
                    Object.keys(localStorage).filter(k => k.startsWith('scanSession_')).forEach(k => localStorage.removeItem(k));
                } catch (_) {}
                // 🔥 明确提示用户扫码会话失效
                if (e && e.message) {
                    showToast('⚠️ ' + e.message, 3000);
                }
                updateUI();
                return menuAlreadyFetched;
            }
        }

        // ============================================================
        //  顾客订单详情
        // ============================================================
        async function openCustomerOrders() {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            try {
                const data = await SLF.api.get(`/public/table-session/${encodeURIComponent(state.scanSessionToken)}/orders`);



                const orderStatusMap = {
                    'pending': t('orderPending') || '未结算',
                    'done': t('orderDone') || t('completed')
                };
                const itemStatusMap = {
                    'pending': t('pending') || t('inProgress'),
                    'done': t('itemDone') || t('completed')
                };
                const statusClassMap = {
                    'pending': 'pending',
                    'done': 'done'
                };

                const detailEl = document.getElementById('customerOrderDetail');

                if (!data.orders || data.orders.length === 0) {
                    detailEl.innerHTML = `
                        <div class="order-empty-state">
                            <i class="fas fa-receipt"></i>
                            ${t('noCurrentTableOrders')}
                        </div>
                    `;
                    document.getElementById('customerOrderModal').classList.add('show');
                    overlay.classList.add('show');
                    return;
                }

                let html = '';
                data.orders.forEach((order) => {
                    let timeStr = '未知时间';
                    if (order.createdAt) {
                        try {
                            const dt = new Date(order.createdAt);
                            if (!isNaN(dt.getTime())) timeStr = dt.toLocaleString();
                        } catch (_) {}
                    }

                    const orderStatusText = orderStatusMap[order.status] || order.status;
                    const orderStatusClass = statusClassMap[order.status] || 'pending';

                    const orderTotalBase = order.items.reduce((sum, item) => {
                        return sum + toBaseCurrency(item.price, item.currency_code) * (item.quantity - (item.returnedQty || 0));
                    }, 0);
                    const orderPrimaryTotal = formatPrimary(orderTotalBase);
                    let orderSecondaryTotal = '';
                    if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                        orderSecondaryTotal = formatSecondary(orderTotalBase, state.dualCurrency.currency.code);
                    }
                    const orderTotalDisplay = orderSecondaryTotal ?
                        `${orderPrimaryTotal} <span class="total-secondary">(${orderSecondaryTotal})</span>` :
                        orderPrimaryTotal;

                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;">
                                    <span class="order-id">
                                        <span class="order-id-hash">#</span>${order.order_no || ("#"+order.id)}
                                    </span>
                                    <span style="font-size:12px;color:#888;white-space:nowrap;">🕒 ${timeStr}</span>
                                </div>
                                <span class="order-status-badge ${orderStatusClass}">${orderStatusText}</span>
                            </div>
                            <div class="order-items">
                    `;

                    order.items.forEach((item) => {
                        const itemStatusText = itemStatusMap[item.itemStatus] || itemStatusMap['pending'];
                        const itemStatusClass = statusClassMap[item.itemStatus] || 'pending';

                        const itemTotalBase = toBaseCurrency(item.price, item.currency_code) * (item.quantity - (item.returnedQty || 0));
                        const unitDisplay = formatPrimary(toBaseCurrency(item.price, item.currency_code));
                        const itemPrimaryTotal = formatPrimary(itemTotalBase);
                        let itemSecondaryTotal = '';
                        if (state.dualCurrency.enabled && item.secondary_currency_code) {
                            itemSecondaryTotal = formatSecondary(itemTotalBase, item.secondary_currency_code);
                        }
                        const itemTotalDisplay = itemSecondaryTotal ?
                            `${itemPrimaryTotal} <span class="price-secondary">(${itemSecondaryTotal})</span>` :
                            itemPrimaryTotal;

                        const emoji = item.emoji || '🍽️';
                        const name = item.name || '菜品';

                        html += `
                            <div class="order-item">
                                <span class="item-name">
                                    <span class="item-emoji">${emoji}</span>
                                    <span class="item-label">${name}</span>
                                    <span class="item-qty-mark">× ${item.quantity}</span>
                                    <span style="color:#e67e22;font-size:12px;">@${unitDisplay}</span>
                                    ${item.returnedQty > 0 ? `<span style="color:#e74c3c;font-size:12px;"> (${t('returned')} ${item.returnedQty})</span>` : ''}
                                </span>
                                <span class="item-price">${itemTotalDisplay}</span>
                                <span class="item-status-label ${itemStatusClass}">${itemStatusText}</span>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                            ${order.note ? `<div class="order-note" style="margin:8px 0 0;padding:8px 10px;border-radius:8px;background:rgba(255,193,7,.12);font-size:13px;color:#c98a1f;line-height:1.5;"><strong>${t('orderNoteDisplay')}：</strong>${escNote(order.note)}</div>` : ''}
                            <div class="order-footer">
                                <span class="total-label">${t('total')}</span>
                                <span class="total-amount">${orderTotalDisplay}</span>
                            </div>
                            ${(() => {
                                if (order.status !== 'pending') return '';
                                const allDone = (order.items || []).every(item => item.itemStatus === 'done');
                                if (allDone) {
                                    return `<div style="margin-top:12px;text-align:center;">
                                        <button disabled style="background:#ccc;color:#999;border:0;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:not-allowed;box-shadow:none;">
                                            ⏰ ${t('urgeOrder')}
                                        </button>
                                    </div>`;
                                }
                                return `<div style="margin-top:12px;text-align:center;">
                                    <button onclick="urgeOrder(${order.id})" style="background:linear-gradient(135deg,#e85d3a,#f39c12);color:#fff;border:0;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(232,93,58,.3);">
                                        ⏰ ${t('urgeOrder')}
                                    </button>
                                </div>`;
                            })()}
                        </div>
                    `;
                });

                detailEl.innerHTML = html;
                document.getElementById('customerOrderModal').classList.add('show');
                overlay.classList.add('show');
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError')));
            }
        }

        // ============================================================
        //  渲染函数
        // ============================================================
        function renderCategories() {
            const presentCategories = [...new Set(state.menu.map(i => i.category))];
            const orderMap = {};
            state.categoryOrder.forEach((cat, idx) => orderMap[cat] = idx);
            const sorted = presentCategories.sort((a, b) => {
                const aIdx = orderMap[a] !== undefined ? orderMap[a] : Number.MAX_SAFE_INTEGER;
                const bIdx = orderMap[b] !== undefined ? orderMap[b] : Number.MAX_SAFE_INTEGER;
                return aIdx - bIdx || a.localeCompare(b, 'zh-CN');
            });
            // 🔥 使用哨兵值 ALL_CATEGORY，显示名通过 getCategoryTranslation 翻译
            const cats = [ALL_CATEGORY, HOT_CATEGORY, ...sorted];
            const catsScroll = document.getElementById('catsScroll');
            if (catsScroll) {
                catsScroll.innerHTML = cats.map(c => {
                    const displayName = getCategoryTranslation(c);
                    const active = (c === state.currentCategory) ? 'active' : '';
                    return `<button class="category-tab ${active}" data-cat="${esc(c)}">${esc(displayName)}</button>`;
                }).join('');
                catsScroll.querySelectorAll('.category-tab').forEach(b => {
                    b.addEventListener('click', () => {
                        state.currentCategory = b.dataset.cat;
                        renderCategories();
                        renderMenu();
                    });
                });
            }
        }

        function renderMenu() {
            let filtered = state.menu;
            // 🔥 用哨兵值判断"全部"
            if (state.currentCategory === HOT_CATEGORY) {
                filtered = state.menu.filter(function(i){ return (Number(i.sales_count) || 0) > 0; })
                    .sort(function(a,b){ return (Number(b.sales_count) || 0) - (Number(a.sales_count) || 0); });
            } else if (state.currentCategory !== ALL_CATEGORY) {
                filtered = filtered.filter(i => i.category === state.currentCategory);
            }
            const keyword = state.searchKeyword.trim().toLowerCase();
            if (keyword) {
                filtered = filtered.filter(item => {
                    const trans = getMenuTranslation(item);
                    const name = (trans ? trans.name : item.name).toLowerCase();
                    const desc = (trans ? trans.desc : item.desc || '').toLowerCase();
                    return name.includes(keyword) || desc.includes(keyword);
                });
            }
            if (filtered.length === 0) {
                menuGrid.innerHTML = `<div class="empty-state"><i class="fas fa-utensils"></i><p>${t('noDishes')}</p></div>`;
                updateUI();
                return;
            }
            menuGrid.innerHTML = filtered.map(item => {
                const qty = state.cart[item.id] || 0;
                const imgHtml = item.image ? `<img src="/uploads/${esc(item.image)}" alt="${esc(item.name)}">` : (esc(item.emoji) || '🍽️');
                const trans = getMenuTranslation(item);
                const name = esc(trans ? trans.name : item.name);
                const desc = esc(trans ? trans.desc : item.desc);
                const prices = getMenuPrices(item);
                let priceDisplay = `<span class="price">${prices.primary}</span>`;
                if (prices.secondary) {
                    priceDisplay += `<span class="price-secondary">(${prices.secondary})</span>`;
                }
                return `
                    <div class="menu-item" data-id="${item.id}">
                        <div class="img-wrap">${imgHtml}${item.category === t('hotCategory') ? '<span class="tag">🔥</span>' : ''}</div>
                        <div class="info">
                            <div class="name">${name}</div>
                            <div class="desc">${desc || ''}</div>
                            <div class="bottom">
                                <div>${priceDisplay}/${esc(item.unit)||t('portion')}</div>
                                <div class="item-actions">
                                    ${qty > 0 ? `<button class="dec-btn" data-id="${item.id}"><i class="fas fa-minus"></i></button><span class="qty-badge">${qty}</span>` : ''}
                                    <button class="add-btn" data-id="${item.id}"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            menuGrid.querySelectorAll('.add-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    addToCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.dec-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    removeFromCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.menu-item').forEach(card => {
                card.addEventListener('click', () => addToCart(Number(card.dataset.id)));
            });
            updateUI();
        }

        // ============================================================
        //  购物车
        // ============================================================
        function addToCart(id) {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            state.cart[id] = (state.cart[id] || 0) + 1;
            updateUI();
            renderMenu();
            const item = state.menu.find(d => d.id === id);
            const trans = item ? getMenuTranslation(item) : null;
            showToast(`+1 ${trans ? trans.name : item?.name || ''}`);
        }

        function removeFromCart(id) {
            if (!state.cart[id]) return;
            state.cart[id] -= 1;
            if (state.cart[id] <= 0) delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
        }

        function removeItemCompletely(id) {
            if (!state.cart[id]) return;
            delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
            showToast(t('itemRemoved'));
        }

        function getCartItems() {
            const items = [];
            for (const [id, qty] of Object.entries(state.cart)) {
                if (qty <= 0) continue;
                const item = state.menu.find(d => d.id === Number(id));
                if (item) items.push({ ...item, quantity: qty });
            }
            return items;
        }

        function getCartTotal() {
            let total = 0;
            for (const [id, qty] of Object.entries(state.cart)) {
                const item = state.menu.find(d => d.id === Number(id));
                if (item) total += toBaseCurrency(item.price, item.currency_code) * qty;
            }
            return total;
        }

        function getCartCount() {
            let c = 0;
            for (const q of Object.values(state.cart)) c += q;
            return c;
        }

        function updateUI() {
            const count = getCartCount();
            const totalBase = getCartTotal();
            const primaryTotal = formatPrimary(totalBase);
            let secondaryTotal = '';
            if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                secondaryTotal = formatSecondary(totalBase, state.dualCurrency.currency.code);
            }
            const totalDisplay = secondaryTotal ? `${primaryTotal} (${secondaryTotal})` : primaryTotal;
            cartBadge.textContent = count;
            cartBadge.style.display = count === 0 ? 'none' : 'flex';
            cartTotal.textContent = totalDisplay;
            const cartBar = document.getElementById('cartBar');
            if (cartBar) cartBar.style.display = count === 0 ? 'none' : 'flex';
            drawerTotal.textContent = totalDisplay;
            // 🔥 结算按钮：有菜品 + 已扫码绑定桌号 + 会话有效 才启用
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) {
                checkoutBtn.disabled = count === 0 || !state.table || !isScanSessionValid();
            }
            renderDrawer();
        }

        function renderDrawer() {
            const items = getCartItems();
            if (items.length === 0) {
                drawerBody.innerHTML =
                    `<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>${t('cart')} ${t('noOrders')}</p></div>`;
                return;
            }
            drawerBody.innerHTML = items.map(item => {
                const trans = getMenuTranslation(item);
                const name = trans ? trans.name : item.name;
                const prices = getMenuPrices(item);
                let priceDisplay = prices.primary;
                if (prices.secondary) priceDisplay += ` (${prices.secondary})`;
                const totalBase = toBaseCurrency(item.price, item.currency_code) * (item.quantity - (item.returnedQty || 0));
                const primaryTotal = formatPrimary(totalBase);
                let secondaryTotal = '';
                if (state.dualCurrency.enabled && item.secondary_currency_code) {
                    secondaryTotal = formatSecondary(totalBase, item.secondary_currency_code);
                }
                const totalDisplay = secondaryTotal ? `${primaryTotal} (${secondaryTotal})` : primaryTotal;
                return `
                    <div class="cart-item">
                        <span class="item-emoji">${esc(item.emoji) || '🍽️'}</span>
                        <div class="item-info">
                            <div class="item-name">${name}</div>
                            <div class="item-price">${priceDisplay}/${esc(item.unit)||t('portion')}</div>
                            <div style="font-size:12px;color:var(--gray-500);">小计: ${totalDisplay}</div>
                        </div>
                        <div class="item-qty">
                            <button data-id="${item.id}" data-act="dec"><i class="fas fa-minus"></i></button>
                            <span class="qty-num">${item.quantity}</span>
                            <button data-id="${item.id}" data-act="inc"><i class="fas fa-plus"></i></button>
                            <button class="item-remove" data-id="${item.id}" data-act="remove"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            drawerBody.querySelectorAll('.item-qty button').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = Number(b.dataset.id);
                    const act = b.dataset.act;
                    if (act === 'inc') addToCart(id);
                    else if (act === 'dec') removeFromCart(id);
                    else if (act === 'remove') removeItemCompletely(id);
                });
            });
        }

        function openDrawer() {
            if (getCartCount() === 0) { showToast(t('cart') + ' ' + t('noOrders')); return; }
            renderDrawer();
            cartDrawer.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('show');
            document.body.style.overflow = '';
        }

        // ============================================================
        //  下单
        // ============================================================
        async function submitOrder() {
            const items = getCartItems();
            if (items.length === 0) return;
            if (!state.table) {
                showToast(t('scanFirst'), 2600);
                return;
            }
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            if (!isBackendOnline) {
                showToast(`❌ ${t('backendOffline')}`, 3000);
                return;
            }
            const total = getCartTotal();
            const noteInput = document.getElementById('orderNoteInput');
            const orderData = {
                table: state.table,
                sessionToken: state.scanSessionToken,
                items: items.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity, emoji: i.emoji,
                    show_dual: i.show_dual || 0, secondary_currency_code: i.secondary_currency_code || '', unit: i
                        .unit || '份' })),
                total: total,
                note: noteInput ? noteInput.value.trim().slice(0, 200) : '',
            };
            try {
                const data = await SLF.api.post('/orders', orderData);
                if (data.success) {
                    state.cart = {};
                    if (noteInput) noteInput.value = '';
                    if (data.newExpiresAt) state.scanExpiresAt = data.newExpiresAt;
                    updateUI();
                    renderMenu();
                    closeDrawer();
                    showToast(`✅ ${t('submitOrder')} ${t('success')}! ${data.orderNo || ("#"+data.orderId)}`);
                    openOrderSuccessNotice();
                } else {
                    showToast('❌ ' + (data.error || t('orderFailed')));
                }
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError')));
            }
        }

        // ============================================================
        //  🔥 方案 B：语言切换
        // ============================================================
        // 让菜单中当前语言高亮
        function updateLangMenuActive() {
            if (!langMenu) return;
            langMenu.querySelectorAll('button[data-lang]').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === currentLang);
                b.setAttribute('aria-selected', b.dataset.lang === currentLang ? 'true' : 'false');
            });
        }

        // 计算下拉面板位置（fixed 定位，相对视口）
        function positionLangMenu() {
            if (!langBtn || !langMenu) return;
            const r = langBtn.getBoundingClientRect();
            const menuRect = langMenu.getBoundingClientRect();
            const menuWidth = menuRect.width || 180;
            const vw = window.innerWidth || document.documentElement.clientWidth;
            let right = vw - r.right;
            // 防止右侧超出
            if (right < 8) right = 8;
            langMenu.style.top = (r.bottom + 8) + 'px';
            langMenu.style.right = right + 'px';
            langMenu.style.left = 'auto';
        }

        function openLangMenu() {
            if (!langMenu) return;
            updateLangMenuActive();
            langMenu.hidden = false;
            if (langBtn) langBtn.setAttribute('aria-expanded', 'true');
            // 先显示再定位，确保能拿到宽度
            positionLangMenu();
        }

        function closeLangMenu() {
            if (!langMenu) return;
            langMenu.hidden = true;
            if (langBtn) langBtn.setAttribute('aria-expanded', 'false');
        }

        // 切换到指定语言（由菜单按钮调用）
        async function switchLanguage(lang) {
            if (!['zh','en','vi','th','km'].includes(lang)) return;
            if (lang === currentLang) return;
            currentLang = lang;
            await applyLanguage();
            updateLangMenuActive();
        }

        // 应用语言（不再从 <select> 读值，currentLang 已提前设置）
        async function applyLanguage() {
            SLF.store.rawSet('preferredLang', currentLang);
            try {
                await loadLanguageData(currentLang);
            } catch (e) {
                console.warn('applyLanguage loadLanguageData failed:', e);
            }
            // 🔥 所有 DOM 更新都加 optional check，防止元素缺失报错
            const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
            setText('appName', t('appName'));
            setText('cartLabel', t('cart'));
            setText('checkoutLabel', t('checkout'));
            setText('totalLabel', t('total'));
            setText('submitLabel', t('submitOrder'));
            setText('drawerTitle', t('cart'));
            setText('customerOrderTitle', t('orderDetails'));
            setText('customerOrderCloseBtn', t('close'));
            setText('confirmOrderTitle', t('checkout'));
            setText('confirmOrderDesc', t('confirmOrderDesc'));
            setText('orderNoteLabel', t('orderNoteLabel'));
            setText('confirmOrderCancelBtn', t('cancel'));
            setText('confirmOrderSubmitBtn', t('submitOrder'));
            setText('orderSuccessTitle', t('orderSuccessTitle'));
            setText('orderSuccessMsg', t('orderSuccessMsg'));
            setText('orderSuccessNote', t('orderSuccessNote'));
            setText('orderSuccessCloseBtn', t('gotIt'));
            const noteInput = document.getElementById('orderNoteInput');
            if (noteInput) noteInput.placeholder = t('orderNotePlaceholder');
            const customerOrderBtn = document.getElementById('customerOrderBtn');
            if (customerOrderBtn) customerOrderBtn.title = t('orderDetails');
            const callWaiterBtn = document.getElementById('callWaiterBtn');
            if (callWaiterBtn) callWaiterBtn.title = t('callWaiter');
            if (!state.table) {
                if (tableDisplay) tableDisplay.textContent = t('notScanned');
                if (tableInfo) tableInfo.title = t('scanToBind');
            }
            // 🔥 切换语言后重置为"全部"（哨兵值，不依赖 i18n）
            state.currentCategory = ALL_CATEGORY;
            setText('callConfirmTitle', t('callWaiter'));
            setText('callConfirmMessage', t('confirmCallWaiter'));
            setText('callConfirmCancel', t('cancel'));
            setText('callConfirmOk', t('confirmCall'));
            try {
                renderCategories();
                renderMenu();
                updateUI();
            } catch (e) {
                console.warn('render after applyLanguage failed:', e);
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            // 清除旧格式的i18n缓存（无_cacheTime字段）
            try {
                ['zh','en','vi','th','km'].forEach(l => {
                    const cached = SLF.store.rawGet('i18n_' + l);
                    if (cached) {
                        try {
                            const data = JSON.parse(cached);
                            if (!data._cacheTime) SLF.store.rawRemove('i18n_' + l);
                        } catch (_) {}
                    }
                });
            } catch (e) {}

            // 🔥 方案 B：currentLang 已经在文件顶部初始化，此处只需更新菜单高亮
            updateLangMenuActive();

            // ============================================================
            // 顺序：先加载配置和菜单，再应用语言
            // ============================================================
            await fetchStoreConfig();       // 失败也不抛，使用默认值
            await checkBackend();
            await fetchCategoryOrder();
            await fetchStoreInfo();
            // 先设置按钮隐藏，防止 fetchTables 抛异常时按钮保持可见
            document.getElementById('customerOrderBtn').hidden = true;
            document.getElementById('callWaiterBtn').hidden = true;
            const menuAlreadyFetchedInTables = await fetchTables();
            if (!menuAlreadyFetchedInTables) {
                await fetchMenu();
            }
            // 最后应用语言（会重新 renderCategories/renderMenu/updateUI）
            await applyLanguage();

            document.getElementById('cartToggle').addEventListener('click', openDrawer);
            document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
            document.getElementById('checkoutBtn').addEventListener('click', openOrderConfirm);
            document.getElementById('submitOrderBtn').addEventListener('click', openOrderConfirm);

            // 🔥 方案 B：语言选择事件绑定
            if (langBtn && langMenu) {
                // 点击按钮：开/关面板
                langBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (langMenu.hidden) {
                        openLangMenu();
                    } else {
                        closeLangMenu();
                    }
                });
                // 点击菜单项：切换语言
                langMenu.querySelectorAll('button[data-lang]').forEach(b => {
                    b.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const lang = b.dataset.lang;
                        closeLangMenu();
                        await switchLanguage(lang);
                    });
                });
                // 点击页面其他区域关闭面板
                document.addEventListener('click', (e) => {
                    if (langMenu.hidden) return;
                    if (langBtn.contains(e.target)) return;
                    if (langMenu.contains(e.target)) return;
                    closeLangMenu();
                });
                // 视口变化时重新定位或关闭
                window.addEventListener('resize', () => {
                    if (!langMenu.hidden) positionLangMenu();
                });
                window.addEventListener('orientationchange', () => {
                    if (!langMenu.hidden) positionLangMenu();
                });
                // 页面滚动时（尤其移动端），关闭面板避免错位
                window.addEventListener('scroll', () => {
                    if (!langMenu.hidden) closeLangMenu();
                }, true);
            }

            const customerOrderCloseBtnEl = document.getElementById('customerOrderCloseBtn');
            if (customerOrderCloseBtnEl) {
                customerOrderCloseBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    closeCustomerOrders();
                });
            }

            document.getElementById('confirmOrderCancelBtn').addEventListener('click', (e) => {
                e.preventDefault();
                cancelOrderConfirm();
            });
            document.getElementById('confirmOrderSubmitBtn').addEventListener('click', (e) => {
                e.preventDefault();
                confirmOrderSubmit();
            });
            document.getElementById('orderSuccessCloseBtn').addEventListener('click', (e) => {
                e.preventDefault();
                closeOrderSuccessNotice();
            });

            overlay.addEventListener('click', () => {
                closeDrawer();
                closeCustomerOrders();
                closeOrderConfirm();
                closeOrderSuccessNotice();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeDrawer();
                    closeCustomerOrders();
                    closeOrderConfirm();
                    closeOrderSuccessNotice();
                    closeLangMenu();
                }
            });
        }

        // ============================================================
        //  呼叫服务员
        // ============================================================
        function showCallWaiterConfirm() {
            if (!state.table) {
                showToast('⚠️ ' + t('scanFirst'), 2500);
                return;
            }
            const ov = document.getElementById('callWaiterConfirmOverlay');
            const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
            setText('callConfirmTitle', t('callWaiter'));
            setText('callConfirmMessage', t('confirmCallWaiter'));
            setText('callConfirmCancel', t('cancel'));
            setText('callConfirmOk', t('confirmCall'));
            if (ov) ov.classList.add('show');
        }
        function hideCallWaiterConfirm() {
            const ov = document.getElementById('callWaiterConfirmOverlay');
            if (ov) ov.classList.remove('show');
        }
        let callCooldownTimer = null;
        let callCooldownSeconds = 0;

        function startCallCooldown(minutes) {
            callCooldownSeconds = Math.max(1, minutes) * 60;
            const btn = document.getElementById('callWaiterBtn');
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            }
            if (callCooldownTimer) clearInterval(callCooldownTimer);
            callCooldownTimer = setInterval(() => {
                callCooldownSeconds--;
                if (callCooldownSeconds <= 0) {
                    clearInterval(callCooldownTimer);
                    callCooldownTimer = null;
                    if (btn) {
                        btn.disabled = false;
                        btn.style.opacity = '';
                        btn.style.cursor = '';
                    }
                }
            }, 1000);
        }

        async function callWaiter() {
            if (!state.table) {
                showToast('⚠️ ' + t('scanFirst'), 2500);
                return;
            }
            if (callCooldownSeconds > 0) {
                const mins = Math.ceil(callCooldownSeconds / 60);
                showToast('⏳ ' + t('callCooldown', { minutes: mins }), 3000);
                return;
            }
            try {
                const data = await SLF.api.post('/public/call-waiter', {
                    table: state.table,
                    sessionToken: state.scanSessionToken || ''
                });
                if (res.status === 429) {
                    const mins = data.cooldownMinutes || 10;
                    startCallCooldown(mins);
                    showToast('⏳ ' + t('callCooldown', { minutes: mins }), 3000);
                    return;
                }
                if (!res.ok) throw new Error(data.error || 'Failed');
                showToast('✅ ' + t('callWaiterSent'), 2500);
            } catch (e) {
                showToast('❌ ' + t('networkError'), 2500);
            }
        }

        async function urgeOrder(orderId) {
            try {
                const data = await SLF.api.post('/orders/' + orderId + '/urge', {});
                if (data.success) {
                    showToast(`✅ ${t('notifiedKitchen')}`, 2500);
                } else {
                    showToast('❌ ' + (data.error || t('urgeFailed')), 2500);
                }
            } catch (e) {
                showToast(`❌ ${t('networkError')}`, 2500);
            }
        }

        // 呼叫服务员确认弹窗事件绑定
        (function bindCallWaiterEvents() {
            const cancel = document.getElementById('callConfirmCancel');
            const ok = document.getElementById('callConfirmOk');
            const ov = document.getElementById('callWaiterConfirmOverlay');
            if (cancel) cancel.addEventListener('click', hideCallWaiterConfirm);
            if (ok) ok.addEventListener('click', async () => {
                hideCallWaiterConfirm();
                await callWaiter();
            });
            if (ov) ov.addEventListener('click', (e) => {
                if (e.target.id === 'callWaiterConfirmOverlay') hideCallWaiterConfirm();
            });
        })();

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
