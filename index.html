        // ============================================================
        // 渲染
        // ============================================================
        function renderCategories() {
            const presentCategories = [...new Set(state.menu.map(i => i.category).filter(Boolean))];
            const orderMap = {};
            state.categoryOrder.forEach((cat, idx) => { orderMap[cat] = idx; });
            const sorted = presentCategories.sort((a, b) => {
                const aIdx = orderMap[a] !== undefined ? orderMap[a] : Number.MAX_SAFE_INTEGER;
                const bIdx = orderMap[b] !== undefined ? orderMap[b] : Number.MAX_SAFE_INTEGER;
                if (aIdx !== bIdx) return aIdx - bIdx;
                return String(a || '').localeCompare(String(b || ''), 'zh-CN');
            });
            const cats = [ALL_CATEGORY, HOT_CATEGORY, ...sorted];
            const catsScroll = document.getElementById('catsScroll');
            if (!catsScroll) return;
            catsScroll.innerHTML = cats.map(c => {
                const displayName = getCategoryTranslation(c);
                const active = (c === state.currentCategory) ? 'active' : '';
                return `<button class="category-tab ${active}" data-cat="${esc(c)}" type="button">${esc(displayName)}</button>`;
            }).join('');
            catsScroll.querySelectorAll('.category-tab').forEach(b => {
                b.addEventListener('click', () => {
                    state.currentCategory = b.dataset.cat;
                    renderCategories();
                    renderMenu();
                });
            });
        }

        function renderMenu() {
            let filtered = state.menu;
            if (state.currentCategory === HOT_CATEGORY) {
                filtered = state.menu
                    .filter(i => (Number(i.sales_count) || 0) > 0)
                    .sort((a, b) => (Number(b.sales_count) || 0) - (Number(a.sales_count) || 0));
            } else if (state.currentCategory !== ALL_CATEGORY) {
                filtered = filtered.filter(i => i.category === state.currentCategory);
            }

            if (filtered.length === 0) {
                menuGrid.innerHTML = `<div class="empty-state"><i class="fas fa-utensils"></i><p>${t('noDishes', null, '暂无菜品')}</p></div>`;
                updateUI();
                return;
            }

            menuGrid.innerHTML = filtered.map(item => {
                const qty = state.cart[item.id] || 0;
                const imgHtml = item.image
                    ? `<img src="/uploads/${esc(item.image)}" alt="${esc(item.name)}">`
                    : (esc(item.emoji) || '🍽️');
                const trans = getMenuTranslation(item);
                const name = esc(trans ? trans.name : item.name);
                const desc = esc(trans ? trans.desc : item.desc);
                const prices = getMenuPrices(item);
                let priceDisplay = `<span class="price">${prices.primary}</span>`;
                if (prices.secondary) {
                    priceDisplay += `<span class="price-secondary">(${prices.secondary})</span>`;
                }
                const isHot = (Number(item.sales_count) || 0) > 0;
                const hotTag = isHot ? '<span class="tag">🔥</span>' : '';

                return `
                    <div class="menu-item" data-id="${item.id}">
                        <div class="img-wrap">${imgHtml}${hotTag}</div>
                        <div class="info">
                            <div class="name">${name}</div>
                            <div class="desc">${desc || ''}</div>
                            <div class="bottom">
                                <div>${priceDisplay}/${esc(item.unit) || t('portion', null, '份')}</div>
                                <div class="item-actions">
                                    ${qty > 0 ? `<button class="dec-btn" data-id="${item.id}" type="button"><i class="fas fa-minus"></i></button><span class="qty-badge">${qty}</span>` : ''}
                                    <button class="add-btn" data-id="${item.id}" type="button"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            menuGrid.querySelectorAll('.add-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    addToCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.dec-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    removeFromCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.menu-item').forEach(card => {
                card.addEventListener('click', () => addToCart(Number(card.dataset.id)));
            });

            updateUI();
        }

        // ============================================================
        // 购物车
        // ============================================================
        function addToCart(id) {
            if (!state.table) { showToast(t('scanFirst', null, '请先扫码'), 2600); return; }
            if (!isScanSessionValid()) { showToast(t('sessionExpired', null, '会话已过期'), 2600); return; }

            const prev = state.cart[id] || 0;

            // 先加一个，再统一校验；不通过则回滚
            state.cart[id] = prev + 1;
            const check = validateCart();
            if (!check.ok) {
                if (prev > 0) state.cart[id] = prev;
                else delete state.cart[id];
                showToast('⚠️ ' + check.msg, 2200);
                return;
            }

            updateUI();
            renderMenu();
            const item = state.menu.find(d => d.id === id);
            const trans = item ? getMenuTranslation(item) : null;
            showToast(`+1 ${trans ? trans.name : item?.name || ''}`);
        }

        function removeFromCart(id) {
            if (!state.cart[id]) return;
            state.cart[id] -= 1;
            if (state.cart[id] <= 0) delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
        }

        function removeItemCompletely(id) {
            if (!state.cart[id]) return;
            delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
            showToast(t('itemRemoved', null, '已移除'));
        }

        function getCartItems() {
            const items = [];
            for (const [id, qty] of Object.entries(state.cart)) {
                if (qty <= 0) continue;
                const item = state.menu.find(d => d.id === Number(id));
                if (item) items.push({ ...item, quantity: qty });
            }
            return items;
        }

        function getCartTotal() {
            let total = 0;
            for (const [id, qty] of Object.entries(state.cart)) {
                const item = state.menu.find(d => d.id === Number(id));
                if (item) total += toBaseCurrency(item.price, item.currency_code) * qty;
            }
            return total;
        }

        function getCartCount() {
            let c = 0;
            for (const q of Object.values(state.cart)) c += q;
            return c;
        }

        /**
         * 统一购物车校验：返回 { ok: true } 或 { ok: false, code, msg, ... }
         * 所有涉及"数量/种类/备注"的校验都走这里，新增规则时只改本函数。
         */
        function validateCart() {
            const c = state.constraints && state.constraints.order;
            if (!c) return { ok: true };

            const entries = Object.entries(state.cart).filter(([, q]) => q > 0);
            const distinctCount = entries.length;

            // 1. 种类数上限
            if (distinctCount > c.maxItemTypes) {
                return {
                    ok: false,
                    code: 'ORDER_ITEM_TYPES_EXCEEDED',
                    limit: c.maxItemTypes,
                    actual: distinctCount,
                    msg: t('limitItemTypes', { max: c.maxItemTypes }, `最多 ${c.maxItemTypes} 种菜品`),
                };
            }

            // 2. 单品数量上限
            for (const [id, qty] of entries) {
                if (qty > c.maxPerItem) {
                    const item = state.menu.find(m => m.id === Number(id));
                    return {
                        ok: false,
                        code: 'ITEM_QTY_EXCEEDED',
                        limit: c.maxPerItem,
                        actual: qty,
                        itemId: Number(id),
                        itemName: item ? item.name : '',
                        msg: t('limitItemQty', { max: c.maxPerItem, name: item ? item.name : '' },
                                `${item ? item.name : ''} 最多 ${c.maxPerItem} 份`),
                    };
                }
            }

            // 3. 备注长度
            const noteInput = document.getElementById('orderNoteInput');
            if (noteInput && noteInput.value && noteInput.value.length > c.maxNoteLength) {
                return {
                    ok: false,
                    code: 'NOTE_TOO_LONG',
                    limit: c.maxNoteLength,
                    actual: noteInput.value.length,
                    msg: t('limitNoteLength', { max: c.maxNoteLength }, `备注最多 ${c.maxNoteLength} 字`),
                };
            }

            return { ok: true };
        }

        function updateUI() {
            const count = getCartCount();
            const totalBase = getCartTotal();
            const primaryTotal = formatPrimary(totalBase);
            let secondaryTotal = '';
            if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                secondaryTotal = formatSecondary(totalBase, state.dualCurrency.currency.code);
            }
            const totalDisplay = secondaryTotal ? `${primaryTotal} (${secondaryTotal})` : primaryTotal;

            cartBadge.textContent = count;
            cartBadge.style.display = count === 0 ? 'none' : 'flex';
            cartTotal.textContent = totalDisplay;

            const cartBar = document.getElementById('cartBar');
            if (cartBar) cartBar.style.display = count === 0 ? 'none' : 'flex';

            drawerTotal.textContent = totalDisplay;

            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) {
                checkoutBtn.disabled = count === 0 || !state.table || !isScanSessionValid();
            }
            renderDrawer();
        }

        function renderDrawer() {
            const items = getCartItems();
            if (items.length === 0) {
                drawerBody.innerHTML = `<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>${t('cart', null, '购物车')} ${t('noOrders', null, '暂无')}</p></div>`;
                return;
            }
            drawerBody.innerHTML = items.map(item => {
                const trans = getMenuTranslation(item);
                const name = esc(trans ? trans.name : item.name);
                const prices = getMenuPrices(item);
                let priceDisplay = prices.primary;
                if (prices.secondary) priceDisplay += ` (${prices.secondary})`;

                const totalBase = toBaseCurrency(item.price, item.currency_code) *
                    (item.quantity - (item.returnedQty || 0));
                const primaryItemTotal = formatPrimary(totalBase);
                let secondaryItemTotal = '';
                if (state.dualCurrency.enabled && item.secondary_currency_code) {
                    secondaryItemTotal = formatSecondary(totalBase, item.secondary_currency_code);
                }
                const itemTotalDisplay = secondaryItemTotal
                    ? `${primaryItemTotal} (${secondaryItemTotal})`
                    : primaryItemTotal;

                return `
                    <div class="cart-item">
                        <span class="item-emoji">${esc(item.emoji) || '🍽️'}</span>
                        <div class="item-info">
                            <div class="item-name">${name}</div>
                            <div class="item-price">${priceDisplay}/${esc(item.unit) || t('portion', null, '份')}</div>
                            <div style="font-size:12px;color:var(--gray-500);">小计: ${itemTotalDisplay}</div>
                        </div>
                        <div class="item-qty">
                            <button data-id="${item.id}" data-act="dec" type="button"><i class="fas fa-minus"></i></button>
                            <span class="qty-num">${item.quantity}</span>
                            <button data-id="${item.id}" data-act="inc" type="button"><i class="fas fa-plus"></i></button>
                            <button class="item-remove" data-id="${item.id}" data-act="remove" type="button"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            drawerBody.querySelectorAll('.item-qty button').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = Number(b.dataset.id);
                    const act = b.dataset.act;
                    if (act === 'inc') addToCart(id);
                    else if (act === 'dec') removeFromCart(id);
                    else if (act === 'remove') removeItemCompletely(id);
                });
            });
        }

        function openDrawer() {
            if (getCartCount() === 0) {
                showToast(t('cart', null, '购物车') + ' ' + t('noOrders', null, '暂无'));
                return;
            }
            renderDrawer();
            cartDrawer.classList.add('open');
            overlay.classList.add('show');
            updateScrollLock();
        }

        function closeDrawer() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('show');
            updateScrollLock();
        }

        // ============================================================
        // 下单
        // ============================================================
        async function submitOrder() {
            const items = getCartItems();
            if (items.length === 0) return;
            if (!state.table) { showToast(t('scanFirst', null, '请先扫码'), 2600); return; }
            if (!isScanSessionValid()) { showToast(t('sessionExpired', null, '会话已过期'), 2600); return; }
            if (!isBackendOnline) { showToast(`❌ ${t('backendOffline', null, '后端离线')}`, 3000); return; }

            // 提交前再校验（防止绕过 openOrderConfirm）
            const check = validateCart();
            if (!check.ok) { showToast('⚠️ ' + check.msg, 2400); return; }

            const noteInput = document.getElementById('orderNoteInput');
            const maxNoteLen = (state.constraints && state.constraints.order && state.constraints.order.maxNoteLength) || 200;

            const orderData = {
                table: state.table,
                sessionToken: state.scanSessionToken,
                customerToken: state.customerToken || SLF.store.rawGet('customer_token') || '',
                items: items.map(i => ({
                    id: i.id,
                    quantity: i.quantity,
                    emoji: i.emoji,
                    currency_code: i.currency_code || state.defaultCurrency.code,
                    show_dual: i.show_dual || 0,
                    secondary_currency_code: i.secondary_currency_code || '',
                    unit: i.unit || '份'
                })),
                note: noteInput ? noteInput.value.trim().slice(0, maxNoteLen) : ''
            };

            try {
                const data = await SLF.api.post('/orders', orderData);
                if (data && data.success) {
                    state.cart = {};
                    if (noteInput) noteInput.value = '';
                    if (data.newExpiresAt) state.scanExpiresAt = data.newExpiresAt;
                    updateUI();
                    renderMenu();
                    closeDrawer();
                    showToast(`✅ ${t('submitOrder', null, '下单')} ${t('success', null, '成功')}! ${data.orderNo || ("#" + data.orderId)}`);
                    openOrderSuccessNotice();
                } else {
                    showToast('❌ ' + ((data && data.error) || t('orderFailed', null, '下单失败')));
                }
            } catch (e) {
                const data = e && e.data;
                let msg = e.message || t('networkError', null, '网络错误');
                if (data && data.code) {
                    if (data.code === 'ORDER_ITEM_TYPES_EXCEEDED') {
                        msg = t('limitItemTypes', { max: data.limit }, `最多 ${data.limit} 种菜品`);
                    } else if (data.code === 'ITEM_QTY_EXCEEDED') {
                        msg = t('limitItemQty', { max: data.limit, name: data.itemName || '' },
                                `${data.itemName || ''} 最多 ${data.limit} 份`);
                    } else if (data.code === 'NOTE_TOO_LONG') {
                        msg = t('limitNoteLength', { max: data.limit }, `备注最多 ${data.limit} 字`);
                    }
                }
                showToast('❌ ' + msg);
            }
        }

        // ============================================================
        // 语言切换
        // ============================================================
        function updateLangMenuActive() {
            if (!langMenu) return;
            langMenu.querySelectorAll('button[data-lang]').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === currentLang);
                b.setAttribute('aria-selected', b.dataset.lang === currentLang ? 'true' : 'false');
            });
        }

        function positionLangMenu() {
            if (!langBtn || !langMenu) return;
            const r = langBtn.getBoundingClientRect();
            const vw = window.innerWidth || document.documentElement.clientWidth;
            let right = vw - r.right;
            if (right < 8) right = 8;
            langMenu.style.top = (r.bottom + 8) + 'px';
            langMenu.style.right = right + 'px';
            langMenu.style.left = 'auto';
        }

        function openLangMenu() {
            if (!langMenu) return;
            updateLangMenuActive();
            langMenu.hidden = false;
            if (langBtn) langBtn.setAttribute('aria-expanded', 'true');
            positionLangMenu();
        }

        function closeLangMenu() {
            if (!langMenu) return;
            langMenu.hidden = true;
            if (langBtn) langBtn.setAttribute('aria-expanded', 'false');
        }

        async function switchLanguage(lang) {
            if (!SUPPORTED_LANGS.includes(lang)) return;
            if (lang === currentLang) return;
            currentLang = lang;
            await applyLanguage();
            updateLangMenuActive();
        }

        // 应用语言
        async function applyLanguage() {
            SLF.store.rawSet('preferredLang', currentLang);
            try { await loadLanguageData(currentLang); } catch (e) { console.warn('applyLanguage loadLanguageData failed:', e); }
            SLF.i18n.lang = currentLang;

            const setText = (id, txt) => {
                const el = document.getElementById(id);
                if (el) el.textContent = txt;
            };
            setText('appName', t('appName', null, '味享'));
            setText('cartLabel', t('cart', null, '购物车'));
            setText('checkoutLabel', t('checkout', null, '去结算'));
            setText('totalLabel', t('total', null, '合计'));
            setText('submitLabel', t('submitOrder', null, '确认下单'));
            setText('drawerTitle', t('cart', null, '购物车'));
            setText('customerOrderTitle', t('orderDetails', null, '订单详情'));
            setText('customerOrderCloseBtn', t('close', null, '关闭'));
            setText('confirmOrderTitle', t('checkout', null, '去结算'));
            setText('confirmOrderDesc', t('confirmOrderDesc', null, '请核对以下菜品和数量，确认无误后提交'));
            setText('orderNoteLabel', t('orderNoteLabel', null, '备注（选填）'));
            setText('confirmOrderCancelBtn', t('cancel', null, '取消'));
            setText('confirmOrderSubmitBtn', t('submitOrder', null, '确认下单'));
            setText('orderSuccessTitle', t('orderSuccessTitle', null, '下单成功'));
            setText('orderSuccessMsg', t('orderSuccessMsg', null, '请移步到「订单详情」查看订单'));
            setText('orderSuccessNote', t('orderSuccessNote', null, '注意：无法自行修改和取消订单'));
            setText('orderSuccessCloseBtn', t('gotIt', null, '知道了'));

            const noteInput = document.getElementById('orderNoteInput');
            if (noteInput) noteInput.placeholder = t('orderNotePlaceholder', null, '如：不要香菜、少辣、打包带走…');

            const customerOrderBtn = document.getElementById('customerOrderBtn');
            if (customerOrderBtn) customerOrderBtn.title = t('orderDetails', null, '订单详情');
            const callWaiterBtn = document.getElementById('callWaiterBtn');
            if (callWaiterBtn) callWaiterBtn.title = t('callWaiter', null, '呼叫服务员');

            if (!state.table) {
                if (tableDisplay) tableDisplay.textContent = t('notScanned', null, '未扫码');
                if (tableInfo) tableInfo.title = t('scanToBind', null, '请扫描桌面二维码绑定桌号');
            }

            setText('callConfirmTitle', t('callWaiter', null, '呼叫服务员'));
            setText('callConfirmMessage', t('confirmCallWaiter', null, '确认呼叫服务员？'));
            setText('callConfirmCancel', t('cancel', null, '取消'));
            setText('callConfirmOk', t('confirmCall', null, '确认呼叫'));

            // 切换语言后重置为"全部"
            state.currentCategory = ALL_CATEGORY;

            try {
                updateStoreNameDisplay();
                renderCategories();
                renderMenu();
                updateUI();
            } catch (e) { console.warn('render after applyLanguage failed:', e); }
        }

        // ============================================================
        // 呼叫服务员
        // ============================================================
        function showCallWaiterConfirm() {
            if (!state.table) { showToast('⚠️ ' + t('scanFirst', null, '请先扫码'), 2500); return; }
            if (!isScanSessionValid()) { showToast(t('sessionExpired', null, '会话已过期'), 2600); return; }
            const ov = document.getElementById('callWaiterConfirmOverlay');
            const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
            setText('callConfirmTitle', t('callWaiter', null, '呼叫服务员'));
            setText('callConfirmMessage', t('confirmCallWaiter', null, '确认呼叫服务员？'));
            setText('callConfirmCancel', t('cancel', null, '取消'));
            setText('callConfirmOk', t('confirmCall', null, '确认呼叫'));
            if (ov) ov.classList.add('show');
            updateScrollLock();
        }

        function hideCallWaiterConfirm() {
            const ov = document.getElementById('callWaiterConfirmOverlay');
            if (ov) ov.classList.remove('show');
            updateScrollLock();
        }

        let callCooldownTimer = null;
        let callCooldownSeconds = 0;

        function startCallCooldown(minutes) {
            callCooldownSeconds = Math.max(1, Number(minutes) || 1) * 60;
            const btn = document.getElementById('callWaiterBtn');
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            }
            if (callCooldownTimer) clearInterval(callCooldownTimer);
            callCooldownTimer = setInterval(() => {
                callCooldownSeconds--;
                if (callCooldownSeconds <= 0) {
                    clearInterval(callCooldownTimer);
                    callCooldownTimer = null;
                    if (btn) {
                        btn.disabled = false;
                        btn.style.opacity = '';
                        btn.style.cursor = '';
                    }
                }
            }, 1000);
        }

        async function callWaiter() {
            if (!state.table) { showToast('⚠️ ' + t('scanFirst', null, '请先扫码'), 2500); return; }
            if (!isScanSessionValid()) { showToast(t('sessionExpired', null, '会话已过期'), 2600); return; }
            if (callCooldownSeconds > 0) {
                const mins = Math.ceil(callCooldownSeconds / 60);
                showToast('⏳ ' + t('callCooldown', { minutes: mins }, `请等待 ${mins} 分钟`), 3000);
                return;
            }
            try {
                const data = await SLF.api.post('/public/call-waiter', {
                    table: state.table,
                    sessionToken: state.scanSessionToken || ''
                });
                if (data && data.error) {
                    if (data.cooldownMinutes) {
                        startCallCooldown(data.cooldownMinutes);
                        showToast('⏳ ' + t('callCooldown', { minutes: data.cooldownMinutes }, `请等待 ${data.cooldownMinutes} 分钟`), 3000);
                    } else {
                        showToast('❌ ' + data.error, 2500);
                    }
                    return;
                }
                showToast('✅ ' + t('callWaiterSent', null, '已通知服务员'), 2500);
            } catch (e) {
                const status = (e && (e.status || e.statusCode || (e.response && e.response.status))) || 0;
                const respData = (e && (e.data || (e.response && e.response.data))) || {};
                if (status === 429 || respData.cooldownMinutes) {
                    const fallback = (state.constraints && state.constraints.call && state.constraints.call.cooldownMinutes) || 10;
                    const mins = respData.cooldownMinutes || fallback;
                    startCallCooldown(mins);
                    showToast('⏳ ' + t('callCooldown', { minutes: mins }, `请等待 ${mins} 分钟`), 3000);
                    return;
                }
                showToast('❌ ' + (e.message || t('networkError', null, '网络错误')), 2500);
            }
        }

        async function urgeOrder(orderId) {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired', null, '会话已过期'), 2600);
                return;
            }
            try {
                const data = await SLF.api.post('/orders/' + orderId + '/urge', {
                    sessionToken: state.scanSessionToken || '',
                    customerToken: state.customerToken || SLF.store.rawGet('customer_token') || ''
                });
                if (data && data.success) {
                    showToast(`✅ ${t('notifiedKitchen', null, '已通知后厨')}`, 2500);
                } else {
                    showToast('❌ ' + ((data && data.error) || t('urgeFailed', null, '催单失败')), 2500);
                }
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError', null, '网络错误')), 2500);
            }
        }

        // ============================================================
        // Socket 事件（顾客端只加入 public 房间）
        // ============================================================
        let _refreshTimer = null;
        function refreshCustomerOrdersIfOpen() {
            const modal = document.getElementById('customerOrderModal');
            if (!modal || !modal.classList.contains('show')) return;
            clearTimeout(_refreshTimer);
            _refreshTimer = setTimeout(() => { openCustomerOrders(); }, 500);
        }

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            try {
                SUPPORTED_LANGS.forEach(l => {
                    const cached = SLF.store.rawGet('i18n_' + l);
                    if (cached) {
                        try {
                            const data = JSON.parse(cached);
                            if (!data._cacheTime) SLF.store.rawRemove('i18n_' + l);
                        } catch (_) {}
                    }
                });
            } catch (e) {}

            updateLangMenuActive();

            await fetchStoreConfig();
            await checkBackend();
            await fetchCategoryOrder();
            await fetchStoreInfo();

            document.getElementById('customerOrderBtn').hidden = true;
            document.getElementById('callWaiterBtn').hidden = true;

            const menuAlreadyFetchedInTables = await fetchTables();
            if (!menuAlreadyFetchedInTables) {
                await fetchMenu();
            }

            await applyLanguage();

            // 购物车事件
            document.getElementById('cartToggle').addEventListener('click', openDrawer);
            document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
            document.getElementById('checkoutBtn').addEventListener('click', openOrderConfirm);
            document.getElementById('submitOrderBtn').addEventListener('click', openOrderConfirm);

            // 呼叫服务员 & 订单详情按钮
            document.getElementById('callWaiterBtn').addEventListener('click', showCallWaiterConfirm);
            document.getElementById('customerOrderBtn').addEventListener('click', openCustomerOrders);

            // 语言选择事件
            if (langBtn && langMenu) {
                langBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (langMenu.hidden) openLangMenu();
                    else closeLangMenu();
                });
                langMenu.querySelectorAll('button[data-lang]').forEach(b => {
                    b.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const lang = b.dataset.lang;
                        closeLangMenu();
                        await switchLanguage(lang);
                    });
                });
                document.addEventListener('click', (e) => {
                    if (langMenu.hidden) return;
                    if (langBtn.contains(e.target)) return;
                    if (langMenu.contains(e.target)) return;
                    closeLangMenu();
                });
                window.addEventListener('resize', () => { if (!langMenu.hidden) positionLangMenu(); });
                window.addEventListener('orientationchange', () => { if (!langMenu.hidden) positionLangMenu(); });
                window.addEventListener('scroll', () => { if (!langMenu.hidden) closeLangMenu(); }, true);
            }

            // 弹窗关闭按钮（只绑一次）
            document.getElementById('customerOrderCloseBtn').addEventListener('click', (e) => {
                e.preventDefault();
                closeCustomerOrders();
            });
            document.getElementById('confirmOrderCancelBtn').addEventListener('click', (e) => {
                e.preventDefault();
                cancelOrderConfirm();
            });
            document.getElementById('confirmOrderSubmitBtn').addEventListener('click', (e) => {
                e.preventDefault();
                confirmOrderSubmit();
            });
            document.getElementById('orderSuccessCloseBtn').addEventListener('click', (e) => {
                e.preventDefault();
                closeOrderSuccessNotice();
            });

            // 呼叫服务员确认弹窗
            document.getElementById('callConfirmCancel').addEventListener('click', hideCallWaiterConfirm);
            document.getElementById('callConfirmOk').addEventListener('click', async () => {
                hideCallWaiterConfirm();
                await callWaiter();
            });
            document.getElementById('callWaiterConfirmOverlay').addEventListener('click', (e) => {
                if (e.target.id === 'callWaiterConfirmOverlay') hideCallWaiterConfirm();
            });

            // overlay 点击关闭
            overlay.addEventListener('click', () => {
                closeDrawer();
                closeCustomerOrders();
                closeOrderConfirm();
                closeOrderSuccessNotice();
            });

            // ESC 关闭
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeDrawer();
                    closeCustomerOrders();
                    closeOrderConfirm();
                    closeOrderSuccessNotice();
                    closeLangMenu();
                    hideCallWaiterConfirm();
                }
            });

            // Socket（不传 token，走 public 房间）
            if (typeof io === 'function') {
                const customerSocket = io({
                    query: { storeId: state.storeId || 1, token: '' }
                });
                customerSocket.on('item:updated', refreshCustomerOrdersIfOpen);
                customerSocket.on('order:settled', refreshCustomerOrdersIfOpen);
                customerSocket.on('order:new', refreshCustomerOrdersIfOpen);
                customerSocket.on('connect_error', (err) => {
                    console.warn('socket connect_error:', err.message);
                });
                window.addEventListener('beforeunload', () => {
                    try { customerSocket.disconnect(); } catch (_) {}
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
