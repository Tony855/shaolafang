<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>烧腊坊 · 扫码点餐系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 原有样式保持不变 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #e85d3a;
            --primary-dark: #c94a2a;
            --primary-bg: #fff5f0;
            --gray-100: #f8f8f8;
            --gray-200: #eeeeee;
            --gray-300: #dddddd;
            --gray-400: #aaaaaa;
            --gray-500: #888888;
            --gray-600: #555555;
            --gray-700: #333333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --admin-bg: #1e1e2f;
            --admin-card: #2d2d44;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--gray-100);
            color: var(--gray-700);
            line-height: 1.6;
            padding-bottom: 80px;
        }
        .toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(232, 93, 58, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-logo i {
            font-size: 22px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-right select,
        .header-right button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            height: 32px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-right select option {
            color: #333;
            background: #fff;
        }
        .header-right button:hover,
        .header-right select:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .header-right .table-info {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .header-right .status-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
        }
        .store-name-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .category-tabs {
            background: #fff;
            padding: 10px 12px 6px;
            position: sticky;
            top: 72px;
            z-index: 90;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
            display: flex;
            gap: 6px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .table-orders {
            max-width: 1000px;
            margin: 10px auto 0;
            padding: 0 12px;
        }
        .table-orders-card {
            background: linear-gradient(135deg, #fff7f2, #fff);
            border: 1px solid #ffd8c9;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
        }
        .table-orders-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }
        .table-order-line {
            padding: 7px 0;
            border-top: 1px dashed #f1c7b5;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }
        .table-order-line small {
            color: var(--gray-500);
            display: block;
            margin-top: 2px;
        }
        .current-order {
            border-top: 1px dashed #f1c7b5;
            padding: 9px 0;
        }
        .current-order:first-of-type {
            border-top: 0;
            padding-top: 0;
        }
        .current-order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .current-order-head .order-no {
            font-weight: 700;
            color: var(--primary-dark);
        }
        .current-order-head .order-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #f7e4db;
            color: #c94a2a;
        }
        .current-order-head .order-status.done {
            background: #e6f7e6;
            color: #2f9e44;
        }
        .current-order-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* ---- 旧样式（保留兼容） ---- */
        .current-order-item {
            display: grid;
            grid-template-columns: 1fr auto 64px;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray-600);
        }
        .current-order-item .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .current-order-item .qty {
            color: var(--gray-400);
            white-space: nowrap;
            text-align: right;
        }
        .current-order-item .item-status {
            display: inline-block;
            justify-self: end;
            text-align: center;
            white-space: nowrap;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: #f7e4db;
            color: #c94a2a;
        }
        .current-order-item .item-status.done {
            background: #e6f7e6;
            color: #2f9e44;
        }
        .current-order-foot {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 13px;
            color: var(--gray-600);
        }
        .current-order-foot strong {
            color: var(--primary-dark);
        }
        .current-orders-summary {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ffd8c9;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--primary-dark);
        }

        /* ============================================================
           新增：订单详情卡片样式（仿图片）
           ============================================================ */
        .order-detail-wrap {
            padding: 4px 0;
        }
        .order-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px 18px 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            border: 1px solid #f0ece8;
            transition: box-shadow 0.2s;
        }
        .order-card:last-child {
            margin-bottom: 0;
        }

        /* ---- 订单头部 ---- */
        .order-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0ece8;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .order-id {
            font-weight: 700;
            font-size: 17px;
            color: #2d2d2d;
            letter-spacing: 0.3px;
        }
        .order-card .order-id .order-id-hash {
            color: var(--primary);
            margin-right: 2px;
        }
        .order-card .order-status-badge {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            background: #f7e4db;
            color: #b85a3a;
        }
        .order-card .order-status-badge.done {
            background: #e6f7e6;
            color: #2f9e44;
        }
        .order-card .order-status-badge.pending {
            background: #fff3e0;
            color: #d97a2a;
        }

        /* ---- 菜品列表 ---- */
        .order-card .order-items {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .order-card .order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #f5f2ef;
            gap: 10px;
            min-height: 36px;
        }
        .order-card .order-item:last-child {
            border-bottom: none;
        }

        .order-card .order-item .item-name {
            flex: 1;
            font-size: 14px;
            color: #2d2d2d;
            font-weight: 500;
            min-width: 0;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .order-card .order-item .item-name .item-emoji {
            font-size: 16px;
            flex-shrink: 0;
        }
        .order-card .order-item .item-name .item-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .order-card .order-item .item-name .item-qty-mark {
            color: var(--gray-500);
            font-weight: 400;
            margin-left: 2px;
            flex-shrink: 0;
        }

        .order-card .order-item .item-price {
            font-weight: 600;
            font-size: 15px;
            color: #2d2d2d;
            white-space: nowrap;
            margin: 0 6px;
            flex-shrink: 0;
            text-align: right;
            min-width: 60px;
        }
        .order-card .order-item .item-price .price-secondary {
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-500);
            margin-left: 2px;
        }

        .order-card .order-item .item-status-label {
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
            min-width: 56px;
        }
        .order-card .order-item .item-status-label.pending {
            background: #fff3e0;
            color: #d97a2a;
        }
        .order-card .order-item .item-status-label.done {
            background: #e6f7e6;
            color: #2f9e44;
        }

        /* ---- 订单底部 ---- */
        .order-card .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f0ece8;
            margin-top: 6px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .order-card .order-footer .total-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-600);
        }
        .order-card .order-footer .total-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .order-card .order-footer .total-amount .total-secondary {
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-500);
        }

        /* ---- 空状态 ---- */
        .order-empty-state {
            color: #aaa;
            padding: 30px 20px;
            text-align: center;
            font-size: 15px;
        }
        .order-empty-state i {
            font-size: 36px;
            display: block;
            margin-bottom: 12px;
            color: #ddd;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 500px) {
            .order-card {
                padding: 12px 14px 12px;
            }
            .order-card .order-item {
                padding: 5px 0;
                flex-wrap: wrap;
                gap: 4px 8px;
            }
            .order-card .order-item .item-name {
                font-size: 13px;
                flex: 1 1 100%;
                order: 0;
            }
            .order-card .order-item .item-price {
                font-size: 14px;
                min-width: 50px;
                order: 1;
                margin-left: 0;
                text-align: left;
            }
            .order-card .order-item .item-status-label {
                font-size: 11px;
                padding: 2px 12px;
                min-width: 48px;
                order: 2;
            }
            .order-card .order-footer .total-amount {
                font-size: 16px;
            }
            .order-card .order-id {
                font-size: 15px;
            }
            .order-card .order-status-badge {
                font-size: 12px;
                padding: 3px 12px;
            }
        }
        @media (max-width: 380px) {
            .order-card .order-item .item-name {
                font-size: 12px;
            }
            .order-card .order-item .item-price {
                font-size: 13px;
                min-width: 44px;
            }
            .order-card .order-item .item-status-label {
                font-size: 10px;
                padding: 2px 10px;
                min-width: 40px;
            }
        }

        /* ========== 其余原有样式 ========== */
        .category-tab {
            flex-shrink: 0;
            padding: 5px 16px;
            border-radius: 20px;
            border: none;
            background: var(--gray-100);
            color: var(--gray-600);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .category-tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(232, 93, 58, 0.3);
        }
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 12px 12px 100px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }
        .menu-item {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 260px;
        }
        .menu-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .menu-item .img-wrap {
            height: 120px;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .menu-item .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .menu-item .img-wrap .tag {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #ffb347;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 10px;
        }
        .menu-item .info {
            padding: 8px 10px 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .menu-item .info .name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-item .info .desc {
            font-size: 11px;
            color: var(--gray-400);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .menu-item .info .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }
        .menu-item .info .price {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }
        .menu-item .info .price-secondary {
            font-size: 12px;
            color: var(--gray-500);
            margin-left: 6px;
        }
        .menu-item .info .add-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .menu-item .info .qty-badge {
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 0 7px;
            border-radius: 10px;
            min-width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px 10px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
            border-top: 1px solid var(--gray-200);
            backdrop-filter: blur(8px);
        }
        .cart-bar .cart-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
        }
        .cart-bar .cart-icon-wrap {
            position: relative;
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .cart-bar .cart-icon-wrap .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ffb347;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
        }
        .cart-bar .cart-summary {
            flex: 1;
            font-size: 12px;
            color: var(--gray-500);
        }
        .cart-bar .cart-summary .total {
            font-weight: 700;
            color: var(--gray-700);
            font-size: 16px;
        }
        .cart-bar .checkout-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(232, 93, 58, 0.35);
            white-space: nowrap;
        }
        .cart-bar .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .cart-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 65vh;
            background: #fff;
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
            z-index: 300;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open {
            transform: translateY(0);
        }
        .cart-drawer .drawer-header {
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-200);
            flex-shrink: 0;
        }
        .cart-drawer .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 18px 18px;
        }
        .cart-drawer .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-100);
        }
        .cart-drawer .cart-item .item-emoji {
            font-size: 24px;
            width: 36px;
            text-align: center;
        }
        .cart-drawer .cart-item .item-info {
            flex: 1;
        }
        .cart-drawer .cart-item .item-info .item-name {
            font-weight: 500;
            font-size: 14px;
        }
        .cart-drawer .cart-item .item-info .item-price {
            font-size: 12px;
            color: var(--primary);
        }
        .cart-drawer .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .cart-drawer .cart-item .item-qty button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--gray-300);
            background: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-drawer .cart-item .item-qty .qty-num {
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        .cart-drawer .cart-item .item-remove {
            color: #ff4d4f;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
        }
        .cart-drawer .drawer-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .cart-drawer .drawer-footer .drawer-total strong {
            color: var(--primary);
            font-size: 20px;
        }
        .cart-drawer .drawer-footer .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 600;

    <script src="languages.js"></script>

    <script>
        // 初始化统一 i18n
        SLF.i18n.init(localStorage.getItem('customerLang') || 'zh');
        // ============================================================
        //  工具函数（双币支持）
        // ============================================================
        let currentLang = 'zh';

        function t(key) {
            const langData = LANGUAGES[currentLang];
            if (!langData) return key;
            return langData[key] || key;
        }

        // 简单 HTML 转义，避免顾客备注中的特殊字符破坏页面结构
        function escNote(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function getCategoryTranslation(cat) {
            const langData = LANGUAGES[currentLang];
            if (langData && langData.categories && langData.categories[cat]) {
                return langData.categories[cat];
            }
            return cat;
        }

        function getMenuTranslation(item) {
            if (!item || currentLang === 'zh') return null;
            const name = item.name_en || item.name;
            const desc = item.desc_en || item.desc;
            return { name, desc };
        }

        // 货币基础工具
        function toBaseCurrency(price, currencyCode) {
            const currency = state.currencies.find(item => item.code === currencyCode) || { rate: 1 };
            return Number(price || 0) / Number(currency.rate || 1);
        }

        function formatPrimary(amount) {
            const c = state.defaultCurrency || { symbol: '$', rate: 1, code: 'USD' };
            return `${c.symbol}${(Number(amount || 0) * Number(c.rate || 1)).toFixed(2)}`;
        }

        function formatSecondary(amount, secondaryCode) {
            if (!secondaryCode) return '';
            const secCurr = state.currencies.find(c => c.code === secondaryCode);
            if (!secCurr) return '';
            const defaultRate = state.defaultCurrency.rate || 1;
            const secValue = (Number(amount || 0) / defaultRate) * Number(secCurr.rate || 1);
            return `${secCurr.symbol}${secValue.toFixed(2)}`;
        }

        // 获取菜品主副价格
        function getMenuPrices(item) {
            const base = toBaseCurrency(item.price, item.currency_code);
            const primary = formatPrimary(base);
            let secondary = '';
            if (state.dualCurrency.enabled && item.secondary_currency_code) {
                secondary = formatSecondary(base, item.secondary_currency_code);
            }
            return { primary, secondary };
        }

        function isScanSessionValid() {
            return Boolean(state.scanSessionToken && state.scanExpiresAt && new Date(state.scanExpiresAt).getTime() > Date.now());
        }

        // ============================================================
        //  状态
        // ============================================================
        let state = {
            cart: {},
            currentCategory: t('all'),
            searchKeyword: '',
            orders: [],
            menu: [],
            tables: [],
            table: '',
            storeId: 1,
            isAdmin: false,
            scanToken: '',
            scanSessionToken: '',
            scanExpiresAt: '',
            currencies: [],
            defaultCurrency: { code: 'USD', symbol: '$', rate: 1 },
            dualCurrency: { enabled: false, currency: null },
            categoryOrder: [],
            currentStore: null
        };
        let isBackendOnline = false;
        let orderSearchKeyword = '';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const menuGrid = $('#menuGrid');
        const categoryTabs = $('#categoryTabs');
        const cartBadge = $('#cartBadge');
        const cartTotal = $('#cartTotal');
        const drawerBody = $('#drawerBody');
        const drawerTotal = $('#drawerTotal');
        const cartDrawer = $('#cartDrawer');
        const overlay = $('#overlay');
        const toastEl = $('#toast');
        const adminPanel = $('#adminPanel');
        const loginModal = $('#loginModal');
        const tableDisplay = $('#tableDisplay');
        const tableInfo = $('#tableInfo');
        const langSelect = $('#langSelect');
        const connStatus = $('#connStatus');
        const orderSearchInput = $('#orderSearchInput');
        const storeNameDisplay = $('#storeNameDisplay');

        // ============================================================
        //  Toast
        // ============================================================
        function showToast(msg, dur = 1800) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), dur);
        }

        // ============================================================
        //  API
        // ============================================================
        const API_BASE = '/api';

        async function apiCall(method, url, data, isFormData = false) {
            try {
                const opts = { method };
                if (isFormData) {
                    opts.body = data;
                } else {
                    opts.headers = { 'Content-Type': 'application/json' };
                    if (data) opts.body = JSON.stringify(data);
                }
                opts.headers = opts.headers || {};
                opts.headers['X-Store-Id'] = String(state.storeId || 1);
                const res = await fetch(url, opts);
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.error || `HTTP ${res.status}`);
                }
                return await res.json();
            } catch (e) {
                console.warn('API调用失败:', e);
                throw e;
            }
        }

        async function checkBackend() {
            try {
                const res = await fetch(`${API_BASE}/menu`, { method: 'HEAD' });
                isBackendOnline = res.ok;
            } catch {
                isBackendOnline = false;
            }
            connStatus.textContent = isBackendOnline ? `✅ ${t('connected')}` : `⚠️ ${t('offlineMode')}`;
            connStatus.style.color = isBackendOnline ? '#8f8' : '#ffb347';
            return isBackendOnline;
        }

        async function fetchCategoryOrder() {
            try {
                const res = await fetch('/api/public/categories');
                if (!res.ok) throw new Error('获取分类顺序失败');
                const data = await res.json();
                state.categoryOrder = data.map(c => c.name);
            } catch (e) {
                console.warn('分类顺序加载失败，使用默认排序', e);
                state.categoryOrder = [];
            }
        }

        async function fetchStoreInfo() {
            try {
                const res = await fetch(`${API_BASE}/public/store-info?store_id=${state.storeId || 1}`);
                if (!res.ok) throw new Error('店铺信息加载失败');
                state.currentStore = await res.json();
                updateStoreNameDisplay();
            } catch (e) {
                console.warn('加载店铺信息失败:', e);
                state.currentStore = null;
                updateStoreNameDisplay();
            }
        }

        function updateStoreNameDisplay() {
            if (state.currentStore && state.currentStore.name) {
                storeNameDisplay.textContent = '🏪 ' + state.currentStore.name;
            } else {
                storeNameDisplay.textContent = '🏪 未知店铺';
            }
        }

        async function fetchMenu() {
            try {
                if (!await checkBackend()) throw new Error('后端未连接');
                const res = await fetch(`${API_BASE}/menu?store_id=${state.storeId || 1}`);
                if (!res.ok) throw new Error('菜单加载失败');
                state.menu = await res.json();
                renderCategories();
                renderMenu();
            } catch (e) {
                state.menu = [];
                renderCategories();
                renderMenu();
                showToast('⚠️ 无法加载数据库中的菜单，请检查后端服务', 2500);
            }
        }

        async function fetchStoreConfig() {
            const res = await fetch(`${API_BASE}/public/config`);
            if (!res.ok) throw new Error('货币配置加载失败');
            const config = await res.json();
            state.currencies = config.currencies || [];
            state.defaultCurrency = config.defaultCurrency || state.defaultCurrency;
            state.dualCurrency = config.dualCurrency || { enabled: false, currency: null };
            if (state.dualCurrency.enabled && !state.dualCurrency.currency) {
                const defaultSec = state.currencies.find(c => c.code === 'USD') || state.currencies[0];
                if (defaultSec) state.dualCurrency.currency = defaultSec;
            }
        }

        async function fetchTables() {
            if (!isBackendOnline) {
                state.tables = [];
                renderTables();
                return;
            }
            try {
                const res = await apiCall('GET', `${API_BASE}/tables`);
                state.tables = res || [];
                const query = new URLSearchParams(window.location.search);
                let token = query.get('token');
                let sessionParam = query.get('session');
                if (localStorage.getItem('customer_session_terminated')) {
                    localStorage.removeItem('customer_session_terminated');
                    token = null;
                    sessionParam = null;
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.delete('table');
                        url.searchParams.delete('session');
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                }
                if (sessionParam) {
                    const sessionRes = await fetch(`${API_BASE}/public/table-session/${encodeURIComponent(sessionParam)}/info`);
                    if (!sessionRes.ok) throw new Error('会话已失效，请重新扫码');
                    const info = await sessionRes.json();
                    state.table = info.table;
                    state.storeId = info.storeId || 1;
                    state.scanToken = '';
                    state.scanSessionToken = info.sessionToken;
                    state.scanExpiresAt = info.expiresAt;
                    await fetchStoreInfo();
                    await fetchMenu();
                } else if (token) {
                    const tokenRes = await fetch(`${API_BASE}/public/table-token/${encodeURIComponent(token)}`);
                    if (!tokenRes.ok) throw new Error('无效桌码');
                    const session = await tokenRes.json();
                    state.table = session.table;
                    state.storeId = session.storeId || 1;
                    state.scanToken = token;
                    // 每次扫码生成新的 session_token，确保同一桌不同顾客能被区分
                    // 同一顾客如需继续之前的订单，可通过 ?session=xxx 参数访问
                    state.scanSessionToken = session.sessionToken;
                    state.scanExpiresAt = session.expiresAt;
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.set('session', state.scanSessionToken);
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                    await fetchStoreInfo();
                    await fetchMenu();
                } else {
                    state.table = '';
                    state.scanToken = '';
                    state.scanSessionToken = '';
                    state.scanExpiresAt = '';
                }
                tableDisplay.textContent = state.table || t('notScanned');
                tableInfo.title = state.table ? `${t('table')}: ${state.table}` : t('scanToBind');
                document.getElementById('customerOrderBtn').hidden = !isScanSessionValid();
                document.getElementById('callWaiterBtn').hidden = !isScanSessionValid();
                renderTables();
                populateTableSelect();
                await fetchCurrentTableOrders();
                updateUI();
            } catch (e) {
                console.warn('fetchTables 错误:', e);
                state.tables = [];
                state.table = '';
                state.scanToken = '';
                state.scanSessionToken = '';
                state.scanExpiresAt = '';
                tableDisplay.textContent = t('notScanned');
                tableInfo.title = t('scanToBind');
                document.getElementById('customerOrderBtn').hidden = true;
                document.getElementById('callWaiterBtn').hidden = true;
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('token');
                    url.searchParams.delete('table');
                    url.searchParams.delete('session');
                    history.replaceState(null, '', url.pathname + url.search + url.hash);
                } catch (_) {}
                Object.keys(localStorage).filter(k => k.startsWith('scanSession_')).forEach(k => localStorage.removeItem(k));
                renderTables();
                populateTableSelect();
                updateUI();
            }
        }

        async function fetchCurrentTableOrders() {}

        function resetCustomerSession() {
            const savedKey = 'scanSession_' + (state.storeId || 1) + '_' + (state.table || '');
            if (savedKey !== 'scanSession_' + (state.storeId || 1) + '_') localStorage.removeItem(savedKey);
            if (state.scanSessionToken) {
                fetch(`${API_BASE}/public/table-session/${encodeURIComponent(state.scanSessionToken)}`, { method: 'DELETE' })
                    .catch(() => {});
            }
            try {
                const url = new URL(window.location.href);
                url.searchParams.delete('token');
                url.searchParams.delete('table');
                url.searchParams.delete('session');
                history.replaceState(null, '', url.pathname + url.search + url.hash);
            } catch (_) {}
            localStorage.setItem('customer_session_terminated', '1');
            state.table = '';
            state.scanToken = '';
            state.scanSessionToken = '';
            state.scanExpiresAt = '';
            state.cart = {};
            tableDisplay.textContent = t('notScanned');
            tableInfo.title = t('scanToBind');
            document.getElementById('customerOrderBtn').hidden = true;
            document.getElementById('callWaiterBtn').hidden = true;
            closeDrawer();
            closeCustomerOrders();
            updateUI();
            renderMenu();
            showToast('✅ ' + t('orderCompleted'), 2600);
        }

        async function checkCustomerOrderCompletion() {
            if (!isScanSessionValid()) return;
            try {
                const res = await fetch(`${API_BASE}/public/table-session/${encodeURIComponent(state.scanSessionToken)}/orders`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.orders.length && data.orders.every(order => order.status === 'done')) {
                    resetCustomerSession();
                }
            } catch (_) {}
        }

        // ============================================================
        //  🔥 核心修改：顾客订单详情（仿图片样式）
        // ============================================================
        async function openCustomerOrders() {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/public/table-session/${encodeURIComponent(state.scanSessionToken)}/orders`);
                if (!res.ok) throw new Error('订单加载失败');
                const data = await res.json();
        
                // 状态映射（使用多语言）
                const orderStatusMap = {
                    'pending': t('orderPending') || '未结算',
                    'done': t('orderDone') || t('completed')
                };
                const itemStatusMap = {
                    'pending': t('pending') || t('inProgress'),
                    'done': t('itemDone') || t('completed')
                };
                const statusClassMap = {
                    'pending': 'pending',
                    'done': 'done'
                };
        
                const detailEl = document.getElementById('customerOrderDetail');
        
                if (!data.orders || data.orders.length === 0) {
                    detailEl.innerHTML = `
                        <div class="order-empty-state">
                            <i class="fas fa-receipt"></i>
                            ${t('noCurrentTableOrders')}
                        </div>
                    `;
                    document.getElementById('customerOrderModal').classList.add('show');
                    overlay.classList.add('show');
                    return;
                }
        
                let html = '';
                data.orders.forEach((order) => {
                    let timeStr = '未知时间';
                    if (order.createdAt) {
                        try {
                            const dt = new Date(order.createdAt);
                            if (!isNaN(dt.getTime())) {
                                timeStr = dt.toLocaleString();
                            }
                        } catch (_) {}
                    }
        
                    const orderStatusText = orderStatusMap[order.status] || order.status;
                    const orderStatusClass = statusClassMap[order.status] || 'pending';
        
                    const orderTotalBase = order.items.reduce((sum, item) => {
                        return sum + toBaseCurrency(item.price, item.currency_code) * item.quantity;
                    }, 0);
                    const orderPrimaryTotal = formatPrimary(orderTotalBase);
                    let orderSecondaryTotal = '';
                    if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                        orderSecondaryTotal = formatSecondary(orderTotalBase, state.dualCurrency.currency.code);
                    }
                    const orderTotalDisplay = orderSecondaryTotal ?
                        `${orderPrimaryTotal} <span class="total-secondary">(${orderSecondaryTotal})</span>` :
                        orderPrimaryTotal;
        
                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;">
                                    <span class="order-id">
                                        <span class="order-id-hash">#</span>${order.id}
                                    </span>
                                    <span style="font-size:12px;color:#888;white-space:nowrap;">🕒 ${timeStr}</span>
                                </div>
                                <span class="order-status-badge ${orderStatusClass}">${orderStatusText}</span>
                            </div>
                            <div class="order-items">
                    `;
        
                    order.items.forEach((item) => {
                        const itemStatusText = itemStatusMap[item.itemStatus] || itemStatusMap['pending'];
                        const itemStatusClass = statusClassMap[item.itemStatus] || 'pending';
        
                        const itemTotalBase = toBaseCurrency(item.price, item.currency_code) * item.quantity;
                        const itemPrimaryTotal = formatPrimary(itemTotalBase);
                        let itemSecondaryTotal = '';
                        if (state.dualCurrency.enabled && item.secondary_currency_code) {
                            itemSecondaryTotal = formatSecondary(itemTotalBase, item.secondary_currency_code);
                        }
                        const itemTotalDisplay = itemSecondaryTotal ?
                            `${itemPrimaryTotal} <span class="price-secondary">(${itemSecondaryTotal})</span>` :
                            itemPrimaryTotal;
        
                        const emoji = item.emoji || '🍽️';
                        const name = item.name || '菜品';
        
                        html += `
                            <div class="order-item">
                                <span class="item-name">
                                    <span class="item-emoji">${emoji}</span>
                                    <span class="item-label">${name}</span>
                                    <span class="item-qty-mark">× ${item.quantity}</span>
                                </span>
                                <span class="item-price">${itemTotalDisplay}</span>
                                <span class="item-status-label ${itemStatusClass}">${itemStatusText}</span>
                            </div>
                        `;
                    });
        
                    html += `
                            </div>
                            ${order.note ? `<div class="order-note" style="margin:8px 0 0;padding:8px 10px;border-radius:8px;background:rgba(255,193,7,.12);font-size:13px;color:#c98a1f;line-height:1.5;"><strong>${t('orderNoteDisplay')}：</strong>${escNote(order.note)}</div>` : ''}
                            <div class="order-footer">
                                <span class="total-label">${t('total')}</span>
                                <span class="total-amount">${orderTotalDisplay}</span>
                            </div>
                            ${order.status === 'pending' ? `
                                <div style="margin-top:12px;text-align:center;">
                                    <button onclick="urgeOrder(${order.id})" style="background:linear-gradient(135deg,#e85d3a,#f39c12);color:#fff;border:0;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(232,93,58,.3);">
                                        ⏰ 催单
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
        
                detailEl.innerHTML = html;
                document.getElementById('customerOrderModal').classList.add('show');
                overlay.classList.add('show');
        
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError')));
            }
        }

        function closeCustomerOrders() {
            document.getElementById('customerOrderModal').classList.remove('show');
            overlay.classList.remove('show');
        }

        // ============================================================
        //  下单二次确认弹窗
        // ============================================================
        function renderConfirmOrderList() {
            const items = getCartItems();
            const listEl = document.getElementById('confirmOrderList');

            let rows = '';
            items.forEach(item => {
                const trans = getMenuTranslation(item);
                const name = trans ? trans.name : item.name;
                const prices = getMenuPrices(item);
                let priceDisplay = prices.primary;
                if (prices.secondary) priceDisplay += ` (${prices.secondary})`;

                rows += `
                    <div class="order-item">
                        <span class="item-name">
                            <span class="item-emoji">${item.emoji || '🍽️'}</span>
                            <span class="item-label">${name}</span>
                            <span class="item-qty-mark">× ${item.quantity}</span>
                        </span>
                        <span class="item-price">${priceDisplay}</span>
                    </div>
                `;
            });

            const totalBase = getCartTotal();
            const primaryTotal = formatPrimary(totalBase);
            let secondaryTotal = '';
            if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                secondaryTotal = formatSecondary(totalBase, state.dualCurrency.currency.code);
            }
            const totalDisplay = secondaryTotal ?
                `${primaryTotal} <span class="total-secondary">(${secondaryTotal})</span>` :
                primaryTotal;

            listEl.innerHTML = `
                <div class="order-card">
                    <div class="order-items">${rows}</div>
                    <div class="order-footer">

                        <span class="total-amount">${totalDisplay}</span>
                    </div>
                </div>
            `;
        }

        // 点击“去结算/确认下单”时，先弹出详细清单做二次确认，而不是直接提交
        function openOrderConfirm() {
            if (getCartCount() === 0) return;
            if (!state.table) {
                showToast(t('scanFirst'), 2600);
                return;
            }
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            if (!isBackendOnline) {
                showToast(`❌ ${t('backendOffline')}`, 3000);
                return;
            }
            renderConfirmOrderList();
            document.getElementById('confirmOrderModal').classList.add('show');
            overlay.classList.add('show');
        }

        function closeOrderConfirm() {
            document.getElementById('confirmOrderModal').classList.remove('show');
            overlay.classList.remove('show');
        }

        // 取消下单：只关闭二次确认弹窗，回到点餐界面，不再弹出订单详情
        function cancelOrderConfirm() {
            closeOrderConfirm();
        }

        // 确认下单：关闭二次确认弹窗，真正提交订单
        function confirmOrderSubmit() {
            closeOrderConfirm();
            submitOrder();
        }

        // ============================================================
        //  下单成功提示弹窗（仅提示语，不展示明细/金额）
        // ============================================================
        function openOrderSuccessNotice() {
            document.getElementById('orderSuccessModal').classList.add('show');
            overlay.classList.add('show');
        }

        function closeOrderSuccessNotice() {
            document.getElementById('orderSuccessModal').classList.remove('show');
            overlay.classList.remove('show');
        }

        // ============================================================
        //  渲染函数
        // ============================================================
        function renderCategories() {
            const presentCategories = [...new Set(state.menu.map(i => i.category))];
            const orderMap = {};
            state.categoryOrder.forEach((cat, idx) => orderMap[cat] = idx);
            const sorted = presentCategories.sort((a, b) => {
                const aIdx = orderMap[a] !== undefined ? orderMap[a] : Number.MAX_SAFE_INTEGER;
                const bIdx = orderMap[b] !== undefined ? orderMap[b] : Number.MAX_SAFE_INTEGER;
                return aIdx - bIdx || a.localeCompare(b, 'zh-CN');
            });
            const cats = [t('all'), ...sorted];
            categoryTabs.innerHTML = cats.map(c => {
                const displayName = getCategoryTranslation(c);
                return `<button class="category-tab ${c === state.currentCategory ? 'active' : ''}" data-cat="${c}">${displayName}</button>`;
            }).join('');
            categoryTabs.querySelectorAll('.category-tab').forEach(b => {
                b.addEventListener('click', () => {
                    state.currentCategory = b.dataset.cat;
                    renderCategories();
                    renderMenu();
                });
            });
        }

        function renderMenu() {
            let filtered = state.menu;
            if (state.currentCategory !== t('all')) {
                filtered = filtered.filter(i => i.category === state.currentCategory);
            }
            const keyword = state.searchKeyword.trim().toLowerCase();
            if (keyword) {
                filtered = filtered.filter(item => {
                    const trans = getMenuTranslation(item);
                    const name = (trans ? trans.name : item.name).toLowerCase();
                    const desc = (trans ? trans.desc : item.desc || '').toLowerCase();
                    return name.includes(keyword) || desc.includes(keyword);
                });
            }
            if (filtered.length === 0) {
                menuGrid.innerHTML = `<div class="empty-state"><i class="fas fa-utensils"></i><p>${t('noDishes')}</p></div>`;
                return;
            }
            menuGrid.innerHTML = filtered.map(item => {
                const qty = state.cart[item.id] || 0;
                const imgHtml = item.image ? `<img src="/uploads/${item.image}" alt="${item.name}">` : (item.emoji || '🍽️');
                const trans = getMenuTranslation(item);
                const name = trans ? trans.name : item.name;
                const desc = trans ? trans.desc : item.desc;
                const prices = getMenuPrices(item);
                let priceDisplay = `<span class="price">${prices.primary}</span>`;
                if (prices.secondary) {
                    priceDisplay += `<span class="price-secondary">(${prices.secondary})</span>`;
                }
                return `
                    <div class="menu-item" data-id="${item.id}">
                        <div class="img-wrap">${imgHtml}${item.category === '热销' ? '<span class="tag">🔥</span>' : ''}</div>
                        <div class="info">
                            <div class="name">${name}</div>
                            <div class="desc">${desc || ''}</div>
                            <div class="bottom">
                                <div>${priceDisplay}/${item.unit||t('portion')}</div>
                                <div class="item-actions">
                                    ${qty > 0 ? `<button class="dec-btn" data-id="${item.id}"><i class="fas fa-minus"></i></button><span class="qty-badge">${qty}</span>` : ''}
                                    <button class="add-btn" data-id="${item.id}"><i class="fas fa-plus"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            menuGrid.querySelectorAll('.add-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    addToCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.dec-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    removeFromCart(Number(b.dataset.id));
                });
            });
            menuGrid.querySelectorAll('.menu-item').forEach(card => {
                card.addEventListener('click', () => addToCart(Number(card.dataset.id)));
            });
            updateUI();
        }

        // ============================================================
        //  购物车
        // ============================================================
        function addToCart(id) {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            state.cart[id] = (state.cart[id] || 0) + 1;
            updateUI();
            renderMenu();
            const item = state.menu.find(d => d.id === id);
            const trans = getMenuTranslation(item);
            showToast(`+1 ${trans ? trans.name : item?.name || ''}`);
        }

        function removeFromCart(id) {
            if (!state.cart[id]) return;
            state.cart[id] -= 1;
            if (state.cart[id] <= 0) delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
        }

        function removeItemCompletely(id) {
            if (!state.cart[id]) return;
            delete state.cart[id];
            updateUI();
            renderMenu();
            renderDrawer();
            showToast(t('itemRemoved'));
        }

        function getCartItems() {
            const items = [];
            for (const [id, qty] of Object.entries(state.cart)) {
                if (qty <= 0) continue;
                const item = state.menu.find(d => d.id === Number(id));
                if (item) items.push({ ...item, quantity: qty });
            }
            return items;
        }

        function getCartTotal() {
            let total = 0;
            for (const [id, qty] of Object.entries(state.cart)) {
                const item = state.menu.find(d => d.id === Number(id));
                if (item) total += toBaseCurrency(item.price, item.currency_code) * qty;
            }
            return total;
        }

        function getCartCount() {
            let c = 0;
            for (const q of Object.values(state.cart)) c += q;
            return c;
        }

        function updateUI() {
            const count = getCartCount();
            const totalBase = getCartTotal();
            const primaryTotal = formatPrimary(totalBase);
            let secondaryTotal = '';
            if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                secondaryTotal = formatSecondary(totalBase, state.dualCurrency.currency.code);
            }
            const totalDisplay = secondaryTotal ? `${primaryTotal} (${secondaryTotal})` : primaryTotal;
            cartBadge.textContent = count;
            cartBadge.style.display = count === 0 ? 'none' : 'flex';
            cartTotal.textContent = totalDisplay;
            drawerTotal.textContent = totalDisplay;
            document.getElementById('checkoutBtn').disabled = count === 0 || !state.table;
            renderDrawer();
        }

        function renderDrawer() {
            const items = getCartItems();
            if (items.length === 0) {
                drawerBody.innerHTML =
                    `<div class="empty-state"><i class="fas fa-shopping-cart"></i><p>${t('cart')} ${t('noOrders')}</p></div>`;
                return;
            }
            drawerBody.innerHTML = items.map(item => {
                const trans = getMenuTranslation(item);
                const name = trans ? trans.name : item.name;
                const prices = getMenuPrices(item);
                let priceDisplay = prices.primary;
                if (prices.secondary) priceDisplay += ` (${prices.secondary})`;
                const totalBase = toBaseCurrency(item.price, item.currency_code) * item.quantity;
                const primaryTotal = formatPrimary(totalBase);
                let secondaryTotal = '';
                if (state.dualCurrency.enabled && item.secondary_currency_code) {
                    secondaryTotal = formatSecondary(totalBase, item.secondary_currency_code);
                }
                const totalDisplay = secondaryTotal ? `${primaryTotal} (${secondaryTotal})` : primaryTotal;
                return `
                    <div class="cart-item">
                        <span class="item-emoji">${item.emoji || '🍽️'}</span>
                        <div class="item-info">
                            <div class="item-name">${name}</div>
                            <div class="item-price">${priceDisplay}/${item.unit||t('portion')}</div>
                            <div style="font-size:12px;color:var(--gray-500);">小计: ${totalDisplay}</div>
                        </div>
                        <div class="item-qty">
                            <button data-id="${item.id}" data-act="dec"><i class="fas fa-minus"></i></button>
                            <span class="qty-num">${item.quantity}</span>
                            <button data-id="${item.id}" data-act="inc"><i class="fas fa-plus"></i></button>
                            <button class="item-remove" data-id="${item.id}" data-act="remove"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            drawerBody.querySelectorAll('.item-qty button').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = Number(b.dataset.id);
                    const act = b.dataset.act;
                    if (act === 'inc') addToCart(id);
                    else if (act === 'dec') removeFromCart(id);
                    else if (act === 'remove') removeItemCompletely(id);
                });
            });
        }

        function openDrawer() {
            if (getCartCount() === 0) { showToast(t('cart') + ' ' + t('noOrders')); return; }
            renderDrawer();
            cartDrawer.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
            cartDrawer.classList.remove('open');
            overlay.classList.remove('show');
            document.body.style.overflow = '';
        }

        // ============================================================
        //  下单
        // ============================================================
        async function submitOrder() {
            const items = getCartItems();
            if (items.length === 0) return;
            if (!state.table) {
                showToast(t('scanFirst'), 2600);
                return;
            }
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired'), 2600);
                return;
            }
            if (!isBackendOnline) {
                showToast(`❌ ${t('backendOffline')}`, 3000);
                return;
            }
            const total = getCartTotal();
            const noteInput = document.getElementById('orderNoteInput');
            const orderData = {
                table: state.table,
                sessionToken: state.scanSessionToken,
                items: items.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity, emoji: i.emoji,
                    show_dual: i.show_dual || 0, secondary_currency_code: i.secondary_currency_code || '', unit: i
                        .unit || '份' })),
                total: total,
                note: noteInput ? noteInput.value.trim().slice(0, 200) : '',
            };
            try {
                const res = await fetch(`${API_BASE}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || t('orderFailed'));
                if (data.success) {
                    state.cart = {};
                    if (noteInput) noteInput.value = '';
                    updateUI();
                    renderMenu();
                    closeDrawer();
                    showToast(`✅ ${t('submitOrder')} ${t('success')}! #${data.orderId}`);
                    openOrderSuccessNotice();
                } else {
                    showToast('❌ ' + (data.error || t('orderFailed')));
                }
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError')));
            }
        }

        // ============================================================
        //  管理面板（占位）
        // ============================================================
        function renderTables() {}
        function populateTableSelect() {}

        function closeAdmin() { adminPanel.classList.remove('open');
            overlay.classList.remove('show');
            document.body.style.overflow = ''; }

        function handleLogin() {
            const pwd = document.getElementById('loginPassword').value;
            if (pwd === 'admin123') {
                state.isAdmin = true;
                loginModal.classList.remove('show');
                overlay.classList.remove('show');
                openAdmin();
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginError').textContent = '';
                showToast(`✅ ${t('loginSuccess')}`);
            } else {
                document.getElementById('loginError').textContent = `❌ ${t('wrongPassword')}`;
            }
        }

        function openAdmin() { adminPanel.classList.add('open');
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden'; }

        function renderAdminMenu() {}
        function resetForm() {}
        function handleMenuSave() {}
        function closeOrderForm() {}
        function addItemRow() {}
        function removeItemRow() {}
        function searchOrders() {}
        function renderAdminOrders() {}
        function renderStats() {}
        async function fetchOrders() {}

        // ============================================================
        //  语言切换
        // ============================================================
        function applyLanguage() {
            currentLang = langSelect.value;
            localStorage.setItem('preferredLang', currentLang);
            document.getElementById('appName').textContent = t('appName');
            document.getElementById('cartLabel').textContent = t('cart');
            document.getElementById('checkoutLabel').textContent = t('checkout');
            document.getElementById('totalLabel').textContent = t('total');
            document.getElementById('submitLabel').textContent = t('submitOrder');
            document.getElementById('panelTitle').textContent = t('adminPanel');
            document.getElementById('menuManageLabel').textContent = t('menuManage');
            document.getElementById('tablesLabel').textContent = t('tablesManage');
            document.getElementById('orderManageLabel').textContent = t('orderManage');
            document.getElementById('statsLabel').textContent = t('stats');
            document.getElementById('settingsLabel').textContent = t('settings') || '设置';
            document.getElementById('saveLabel').textContent = t('save');
            document.getElementById('cancelLabel').textContent = t('cancel');
            document.getElementById('loginTitle').textContent = t('adminLogin');
            document.getElementById('loginBtnLabel').textContent = t('login');
            document.getElementById('totalOrdersLabel').textContent = t('totalOrders');
            document.getElementById('totalRevenueLabel').textContent = t('totalRevenue');
            document.getElementById('drawerTitle').textContent = t('cart');
            document.getElementById('customerOrderBtn').textContent = '🧾 ' + t('orderDetails');
            document.getElementById('customerOrderTitle').textContent = t('orderDetails');
            document.getElementById('customerOrderCloseBtn').textContent = t('close');
            document.getElementById('confirmOrderTitle').textContent = t('checkout');
            document.getElementById('confirmOrderDesc').textContent = t('confirmOrderDesc');
            document.getElementById('orderNoteLabel').textContent = t('orderNoteLabel');
            document.getElementById('orderNoteInput').placeholder = t('orderNotePlaceholder');
            document.getElementById('confirmOrderCancelBtn').textContent = t('cancel');
            document.getElementById('confirmOrderSubmitBtn').textContent = t('submitOrder');
            document.getElementById('orderSuccessTitle').textContent = t('orderSuccessTitle');
            document.getElementById('orderSuccessMsg').textContent = t('orderSuccessMsg');
            document.getElementById('orderSuccessNote').textContent = t('orderSuccessNote');
            document.getElementById('orderSuccessCloseBtn').textContent = t('gotIt');
            const callWaiterBtn = document.getElementById('callWaiterBtn');
            if (callWaiterBtn) callWaiterBtn.textContent = '🔔 ' + t('callWaiter');
            const searchInput = document.getElementById('menuSearchInput');
            if (searchInput) searchInput.placeholder = t('searchDishes');
            connStatus.textContent = isBackendOnline ? `✅ ${t('connected')}` : `⚠️ ${t('offlineMode')}`;
            if (!state.table) {
                tableDisplay.textContent = t('notScanned');
                tableInfo.title = t('scanToBind');
            }
            // 切换语言后重置当前分类为新语言的"全部"，避免过滤条件不匹配导致菜单为空
            const allTranslations = Object.values(LANGUAGES).map(l => l.all).filter(Boolean);
            if (!state.currentCategory || allTranslations.includes(state.currentCategory)) {
                state.currentCategory = t('all');
            }
            renderCategories();
            renderMenu();
            updateUI();
        }

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang && LANGUAGES[savedLang]) {
                langSelect.value = savedLang;
            } else {
                const sys = (navigator.language || navigator.userLanguage || '').toLowerCase();
                if (sys.startsWith('zh')) langSelect.value = 'zh';
                else if (sys.startsWith('vi')) langSelect.value = 'vi';
                else if (sys.startsWith('th')) langSelect.value = 'th';
                else if (sys.startsWith('km')) langSelect.value = 'km';
                else if (sys.startsWith('en')) langSelect.value = 'en';
                else langSelect.value = 'zh';
            }
            applyLanguage();

            await checkBackend();
            await fetchStoreConfig();
            await fetchCategoryOrder();
            await fetchStoreInfo();
            await fetchTables();
            await fetchMenu();
            setInterval(checkCustomerOrderCompletion, 5000);

            document.getElementById('cartToggle').addEventListener('click', openDrawer);
            document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
            // 🔥 修改：点击“去结算”直接提交订单，不再打开购物车抽屉（移除二次确认）
            document.getElementById('checkoutBtn').addEventListener('click', openOrderConfirm);
            document.getElementById('submitOrderBtn').addEventListener('click', openOrderConfirm);
            document.getElementById('menuSearchInput').addEventListener('input', e => {
                state.searchKeyword = e.target.value;
                renderMenu();
            });

            document.getElementById('adminClose').addEventListener('click', closeAdmin);
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

            document.querySelectorAll('#adminTabs button').forEach(b => {
                b.addEventListener('click', () => {
                    document.querySelectorAll('#adminTabs button').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    document.querySelectorAll('.admin-tab-content').forEach(x => x.classList.remove('active'));
                    const tabId = b.dataset.tab;
                    const target = document.getElementById('tab' + tabId.charAt(0).toUpperCase() + tabId.slice(1));
                    if (target) target.classList.add('active');
                    if (tabId === 'orders') fetchOrders();
                    if (tabId === 'stats') fetchOrders();
                    if (tabId === 'menu') renderAdminMenu();
                    if (tabId === 'tables') fetchTables();
                });
            });

            document.getElementById('menuSaveBtn').addEventListener('click', handleMenuSave);
            document.getElementById('menuCancelBtn').addEventListener('click', resetForm);
            langSelect.addEventListener('change', applyLanguage);

            // 兜底绑定：确保“订单详情”弹窗的关闭按钮一定能响应
            const customerOrderCloseBtnEl = document.getElementById('customerOrderCloseBtn');
            if (customerOrderCloseBtnEl) {
                customerOrderCloseBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    closeCustomerOrders();
                });
            }

            // 下单二次确认弹窗：取消 -> 关闭并弹出订单详情；确认下单 -> 真正提交
            document.getElementById('confirmOrderCancelBtn').addEventListener('click', (e) => {
                e.preventDefault();
                cancelOrderConfirm();
            });
            document.getElementById('confirmOrderSubmitBtn').addEventListener('click', (e) => {
                e.preventDefault();
                confirmOrderSubmit();
            });
            document.getElementById('orderSuccessCloseBtn').addEventListener('click', (e) => {
                e.preventDefault();
                closeOrderSuccessNotice();
            });

            overlay.addEventListener('click', () => {
                closeDrawer();
                closeAdmin();
                loginModal.classList.remove('show');
                closeOrderForm();
                closeCustomerOrders();
                closeOrderConfirm();
                closeOrderSuccessNotice();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeDrawer();
                    closeAdmin();
                    loginModal.classList.remove('show');
                    closeOrderForm();
                    closeCustomerOrders();
                    closeOrderConfirm();
                    closeOrderSuccessNotice();
                }
            });

            const now = new Date();
            const sevenDaysAgo = new Date(now);
            sevenDaysAgo.setDate(now.getDate() - 7);
            document.getElementById('statStartDate').value = sevenDaysAgo.toISOString().slice(0, 10);
            document.getElementById('statEndDate').value = now.toISOString().slice(0, 10);

            await fetchOrders();

            console.log('🍽️ 多语言点餐系统已启动 (前端)');
            console.log(`🪑 桌号: ${state.table}`);
            console.log(`🏪 店铺ID: ${state.storeId}`);
            console.log(`🌐 语言: ${currentLang}`);
            console.log(`📡 后端状态: ${isBackendOnline ? t('online') : '离线（演示模式）'}`);
            console.log(`🏷️ 分类顺序:`, state.categoryOrder);
        }

        // ============================================================
        //  呼叫服务员
        // ============================================================
        async function callWaiter() {
            if (!state.table) {
                showToast('⚠️ ' + t('scanFirst'), 2500);
                return;
            }
            try {
                await fetch('/api/public/call-waiter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        table: state.table,
                        sessionToken: state.scanSessionToken || ''
                    })
                });
                showToast('✅ ' + t('billRequested'), 2500);
            } catch (e) {
                showToast('❌ ' + t('networkError'), 2500);
            }
        }

        // 催单
        async function urgeOrder(orderId) {
            try {
                const res = await fetch('/api/orders/' + orderId + '/urge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`✅ ${t('notifiedKitchen')}`, 2500);
                } else {
                    showToast('❌ ' + (data.error || t('urgeFailed')), 2500);
                }
            } catch (e) {
                showToast(`❌ ${t('networkError')}`, 2500);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
