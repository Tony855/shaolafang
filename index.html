<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FoodFlow · QR Ordering System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    /* ========== 全局变量与基础重置 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #e85d3a;
        --primary-dark: #c94a2a;
        --gray-100: #f8f8f8;
        --gray-200: #eeeeee;
        --gray-300: #dddddd;
        --gray-400: #aaaaaa;
        --gray-500: #888888;
        --gray-600: #555555;
        --gray-700: #333333;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
        --radius: 16px;
        --radius-sm: 10px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(180deg, #fff6f2 0%, #f7f7fb 46%, #eef0f7 100%);
        color: var(--gray-700);
        line-height: 1.6;
        padding-bottom: 96px;
    }

    /* ========== Toast ========== */
    .toast {
        position: fixed;
        top: 90px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        padding: 10px 24px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(8px);
        max-width: 90%;
        text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ========== Header ========== */
    .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 64px;
        background: linear-gradient(135deg, #ff8a4c 0%, #e84a2a 100%);
        padding: 14px 20px;
        box-shadow: 0 10px 28px rgba(200, 65, 30, .22);
        color: #fff;
        z-index: 100;
    }
    .header-logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }
    .header-logo i { font-size: 24px; }
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        margin-left: auto;
    }
    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 10px;
        flex-shrink: 0;
    }
    .store-name-badge,
    .table-info {
        background: rgba(255, 255, 255, .22);
        border: 1px solid rgba(255, 255, 255, .22);
        padding: 5px 15px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .store-name-badge .badge-text,
    .table-info .badge-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .header-right button {
        background: rgba(255, 255, 255, .2);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 999px;
        height: 34px;
        min-height: 34px;
        padding: 0 14px;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }
    .header-right button:hover { background: rgba(255, 255, 255, .35); }

    /* 语言按钮（圆形） */
    .lang-btn-wrap {
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        max-width: 34px !important;
        min-height: 34px !important;
        max-height: 34px !important;
        padding: 0 !important;
        border-radius: 50% !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        overflow: hidden;
    }
    .lang-btn-wrap .lang-icon {
        display: inline-block !important;
        font-size: 16px !important;
        line-height: 1 !important;
        pointer-events: none !important;
    }

    /* 语言下拉面板 */
    .lang-menu {
        position: fixed;
        z-index: 1200;
        min-width: 170px;
        max-width: 240px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(20, 20, 40, 0.22), 0 2px 8px rgba(20, 20, 40, 0.08);
        padding: 6px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
    }
    .lang-menu[hidden] { display: none !important; }
    .lang-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 14px;
        border: 0;
        background: transparent;
        color: #333;
        font-size: 15px;
        font-weight: 500;
        text-align: left;
        border-radius: 10px;
        cursor: pointer;
        line-height: 1.4;
        min-height: 40px;
        transition: background 0.15s ease;
        font-family: inherit;
    }
    .lang-menu button:hover { background: #f4f5f9; }
    .lang-menu button:active { background: #eceef4; }
    .lang-menu button.active {
        background: linear-gradient(135deg, #fff2ec, #ffe6db);
        color: var(--primary-dark);
        font-weight: 700;
    }
    .lang-menu button.active::after {
        content: '✓';
        margin-left: auto;
        color: var(--primary);
        font-weight: 700;
    }

    /* ========== 分类 Tab ========== */
    .category-tabs {
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 90;
        padding: 10px 12px 8px;
        border-bottom: 1px solid rgba(0, 0, 0, .04);
        overflow-x: auto;
        display: flex;
        gap: 8px;
        scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cats-scroll { display: contents; }
    .category-tab {
        flex-shrink: 0;
        padding: 6px 16px;
        border-radius: 999px;
        border: none;
        background: #f3f4f8;
        color: #666;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
    }
    .category-tab.active {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        color: #fff;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .25);
    }

    /* ========== 主内容与菜单 ========== */
    .main-content {
        max-width: 1000px;
        margin: 0 auto;
        padding: 16px 12px 100px;
    }
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
    }
    .menu-item {
        background: #fff;
        border: 1px solid rgba(0, 0, 0, .04);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(20, 20, 40, .07);
        overflow: hidden;
        transition: transform .22s ease, box-shadow .22s ease;
        cursor: pointer;
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 260px;
    }
    .menu-item:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(20, 20, 40, .13); }
    .menu-item .img-wrap {
        height: 156px;
        background: linear-gradient(135deg, #f7f0ea, #eee8f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
    }
    .menu-item .img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .menu-item .img-wrap .tag {
        position: absolute;
        top: 6px; left: 6px;
        background: #ffb347;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 10px;
    }
    .menu-item .info {
        padding: 9px 11px 11px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .menu-item .info .name {
        font-size: 15px;
        font-weight: 700;
        color: #2f2f3a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .menu-item .info .desc {
        font-size: 11px;
        color: #9a9aa6;
        margin-top: 2px;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .menu-item .info .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
        flex-wrap: wrap;
        row-gap: 4px;
    }
    .menu-item .info .price { font-size: 16px; font-weight: 700; color: #e84a2a; }
    .menu-item .info .price-secondary { font-size: 12px; color: var(--gray-500); margin-left: 6px; }
    .menu-item .info .add-btn,
    .menu-item .info .dec-btn {
        width: 32px;
        height: 32px;
        min-height: 0 !important;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 32px;
        cursor: pointer;
        font-size: 14px;
    }
    .menu-item .info .add-btn {
        border: none;
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        color: #fff;
        box-shadow: 0 6px 14px rgba(232, 74, 42, .28);
    }
    .menu-item .info .dec-btn {
        border: 1px solid #ddd;
        background: #fff;
        color: #777;
        font-size: 13px;
    }
    .item-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .qty-badge {
        background: var(--primary);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 0 7px;
        border-radius: 10px;
        min-width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .empty-state {
        grid-column: 1/-1;
        text-align: center;
        padding: 40px;
        color: var(--gray-400);
    }
    .empty-state i { font-size: 40px; }
    .empty-state p { margin-top: 10px; }

    /* ========== 购物车底栏与抽屉 ========== */
    .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(16px);
        border-radius: 22px 22px 0 0;
        padding: 10px 18px 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        box-shadow: 0 -8px 28px rgba(20, 20, 40, .08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 200;
        border-top: 1px solid var(--gray-200);
    }
    .cart-bar .cart-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        cursor: pointer;
    }
    .cart-bar .cart-icon-wrap {
        position: relative;
        width: 42px;
        height: 42px;
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .28);
    }
    .cart-bar .cart-icon-wrap .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #ffb347;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
    }
    .cart-bar .cart-summary { flex: 1; font-size: 12px; color: var(--gray-500); }
    .cart-bar .cart-summary .total { font-weight: 700; color: var(--gray-700); font-size: 16px; }
    .cart-bar .checkout-btn {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border: none;
        color: #fff;
        padding: 9px 22px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(232, 74, 42, .25);
        white-space: nowrap;
    }
    .cart-bar .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .cart-drawer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 65vh;
        background: #fff;
        border-radius: 22px 22px 0 0;
        box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.15);
        z-index: 300;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
    }
    .cart-drawer.open { transform: translateY(0); }
    .cart-drawer .drawer-header {
        padding: 14px 18px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #f0f0f3;
        flex-shrink: 0;
    }
    .cart-drawer .drawer-header h3 { font-size: 16px; font-weight: 700; }
    .cart-drawer .drawer-header .close-btn {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cart-drawer .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 18px 18px;
    }
    .cart-drawer .cart-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--gray-100);
    }
    .cart-drawer .cart-item .item-emoji { font-size: 24px; width: 36px; text-align: center; }
    .cart-drawer .cart-item .item-info { flex: 1; min-width: 0; }
    .cart-drawer .cart-item .item-info .item-name { font-weight: 500; font-size: 14px; word-break: break-word; }
    .cart-drawer .cart-item .item-info .item-price { font-size: 12px; color: var(--primary); }
    .cart-drawer .cart-item .item-qty { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .cart-drawer .cart-item .item-qty button {
        width: 32px;
        height: 32px;
        min-height: 0;
        flex: 0 0 32px;
        border-radius: 50%;
        border: 1px solid var(--gray-300);
        background: #fff;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cart-drawer .cart-item .item-qty .qty-num { font-weight: 600; min-width: 20px; text-align: center; }
    .cart-drawer .cart-item .item-remove {
        color: #ff4d4f;
        background: #fff1f1;
        border: none;
        font-size: 14px;
        cursor: pointer;
        width: 32px;
        height: 32px;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }
    .cart-drawer .drawer-footer {
        padding: 12px 18px 16px;
        border-top: 1px solid #f0f0f3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .cart-drawer .drawer-footer .drawer-total strong { color: var(--primary); font-size: 20px; }
    .cart-drawer .drawer-footer .submit-btn {
        background: linear-gradient(135deg, #ff8a4c, #e84a2a);
        border: none;
        color: #fff;
        padding: 10px 28px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
    }

    /* ========== 遮罩 ========== */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(18, 18, 32, .46);
        z-index: 250;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
        backdrop-filter: blur(2px);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* ========== 订单卡片 ========== */
    .order-detail-wrap { padding: 4px 0; }
    .order-card {
        background: #fff;
        border-radius: 14px;
        padding: 16px 18px 14px;
        margin-bottom: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        border: 1px solid #f0ece8;
    }
    .order-card:last-child { margin-bottom: 0; }
    .order-card .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 10px;
        border-bottom: 1px solid #f0ece8;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .order-card .order-id { font-weight: 700; font-size: 17px; color: #2d2d2d; letter-spacing: 0.3px; }
    .order-card .order-id .order-id-hash { color: var(--primary); margin-right: 2px; }
    .order-card .order-status-badge {
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        background: #f7e4db;
        color: #b85a3a;
    }
    .order-card .order-status-badge.done { background: #e6f7e6; color: #2f9e44; }
    .order-card .order-status-badge.pending { background: #fff3e0; color: #d97a2a; }
    .order-card .order-items { display: flex; flex-direction: column; }
    .order-card .order-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        border-bottom: 1px solid #f5f2ef;
        gap: 10px;
        min-height: 36px;
    }
    .order-card .order-item:last-child { border-bottom: none; }
    .order-card .order-item .item-name {
        flex: 1;
        font-size: 14px;
        color: #2d2d2d;
        font-weight: 500;
        min-width: 0;
        word-break: break-word;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .order-card .order-item .item-name .item-emoji { font-size: 16px; flex-shrink: 0; }
    .order-card .order-item .item-name .item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .order-card .order-item .item-name .item-qty-mark { color: var(--gray-500); font-weight: 400; margin-left: 2px; flex-shrink: 0; }
    .order-card .order-item .item-price {
        font-weight: 600;
        font-size: 15px;
        color: #2d2d2d;
        white-space: nowrap;
        margin: 0 6px;
        flex-shrink: 0;
        text-align: right;
        min-width: 60px;
    }
    .order-card .order-item .item-price .price-secondary {
        font-size: 12px;
        font-weight: 400;
        color: var(--gray-500);
        margin-left: 2px;
    }
    .order-card .order-item .item-status-label {
        padding: 3px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        text-align: center;
        min-width: 56px;
    }
    .order-card .order-item .item-status-label.pending { background: #fff3e0; color: #d97a2a; }
    .order-card .order-item .item-status-label.done { background: #e6f7e6; color: #2f9e44; }
    .order-card .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid #f0ece8;
        margin-top: 6px;
        flex-wrap: wrap;
        gap: 6px;
    }
    .order-card .order-footer .total-label { font-size: 15px; font-weight: 600; color: var(--gray-600); }
    .order-card .order-footer .total-amount { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
    .order-card .order-footer .total-amount .total-secondary { font-size: 14px; font-weight: 400; color: var(--gray-500); }
    .order-empty-state { color: #aaa; padding: 30px 20px; text-align: center; font-size: 15px; }
    .order-empty-state i { font-size: 36px; display: block; margin-bottom: 12px; color: #ddd; }

    /* ========== 模态框通用 ========== */
    .order-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: #fff;
        border-radius: var(--radius);
        padding: 24px;
        z-index: 700;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        color: #333;
    }
    .order-modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .order-modal h3 {
        font-size: 19px;
        font-weight: 700;
        color: #2d2d2d;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .order-modal h3 i { color: var(--primary); }
    .order-modal .form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
        border-top: 1px solid #f0ece8;
        padding-top: 14px;
    }
    .order-modal .form-actions button {
        padding: 8px 24px;
        border-radius: 30px;

    <!-- 下单成功提示弹窗 -->

            <h3 id="orderSuccessTitle">下单成功</h3>

            <div class="success-note">
                <i class="fas fa-circle-exclamation"></i>
                <span id="orderSuccessNote">注意：无法自行修改和取消订单，如需修改或取消订单，请联系商户</span>
            </div>
            <div class="form-actions">
                <button class="btn-save" id="orderSuccessCloseBtn" type="button">知道了</button>
            </div>

    <!-- 语言下拉面板 -->
    <div class="lang-menu" id="langMenu" role="listbox" aria-label="Language" hidden>
        <button type="button" data-lang="zh" role="option">🇨🇳 中文</button>
        <button type="button" data-lang="en" role="option">🇬🇧 English</button>
        <button type="button" data-lang="vi" role="option">🇻🇳 Tiếng Việt</button>
        <button type="button" data-lang="th" role="option">🇹🇭 ภาษาไทย</button>
        <button type="button" data-lang="km" role="option">🇰🇭 ភាសាខ្មែរ</button>
    </div>

    <script src="languages.min.js?v=20260921e"></script>
    <script src="assets/core.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ============================================================
        // 常量
        // ============================================================
        const ALL_CATEGORY = '__ALL__';
        const HOT_CATEGORY = '__HOT__';
        const SUPPORTED_LANGS = ['zh', 'en', 'vi', 'th', 'km'];

        // ============================================================
        // 初始化 i18n
        // ============================================================
        function detectInitialLang() {
            const saved = SLF.store.rawGet('preferredLang');
            if (saved && SUPPORTED_LANGS.includes(saved)) return saved;
            const sys = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (sys.startsWith('zh')) return 'zh';
            if (sys.startsWith('vi')) return 'vi';
            if (sys.startsWith('th')) return 'th';
            if (sys.startsWith('km')) return 'km';
            if (sys.startsWith('en')) return 'en';
            return 'zh';
        }

        let currentLang = detectInitialLang();
        SLF.i18n.init(currentLang);

        // ============================================================
        // i18n 工具函数
        // ============================================================
        async function loadLanguageData(lang) {
            try { SLF.store.rawRemove('i18n_' + lang); } catch (e) {}
            if (SLF.i18n.dicts) { delete SLF.i18n.dicts[lang]; }
            try { await SLF.i18n.loadLanguage(lang); } catch (e) { console.warn('loadLanguage failed:', e); }
        }

        // t(key, params, fallback)
        function t(key, params, fallback) {
            try {
                if (!SLF || !SLF.i18n || typeof SLF.i18n.t !== 'function') {
                    return fallback !== undefined ? fallback : key;
                }
                const v = SLF.i18n.t(key, params);
                if (v === undefined || v === null || v === key) {
                    return fallback !== undefined ? fallback : key;
                }
                return v;
            } catch (e) {
                return fallback !== undefined ? fallback : key;
            }
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        const escNote = esc;

        function getCategoryTranslation(cat) {
            if (cat === ALL_CATEGORY) return t('all', null, '全部');
            if (cat === HOT_CATEGORY) return '🔥 ' + t('hotSelling', null, '热销');
            const lang = SLF.i18n.lang;
            const localDict = (SLF.i18n.dicts[lang] && SLF.i18n.dicts[lang].categories) || {};
            if (localDict[cat]) return localDict[cat];
            const globalDict = (window.LANGUAGES && window.LANGUAGES[lang] && window.LANGUAGES[lang].categories) || {};
            return globalDict[cat] || cat;
        }

        // 支持所有语言的菜单翻译
        function getMenuTranslation(item) {
            if (!item) return null;
            if (currentLang === 'zh') return null;
            const lang = currentLang;
            const name = item[`name_${lang}`] || item.name_en || item.name;
            const desc = item[`desc_${lang}`] || item.desc_en || item.desc || '';
            return { name, desc };
        }

        // ============================================================
        // 状态
        // ============================================================
        let state = {
            cart: {},
            currentCategory: ALL_CATEGORY,
            menu: [],
            table: '',
            storeId: 1,
            scanToken: '',
            scanSessionToken: '',
            scanExpiresAt: '',
            customerToken: '',
            currencies: [],
            defaultCurrency: { code: 'USD', symbol: '$', rate: 1 },
            dualCurrency: { enabled: false, currency: null },
            categoryOrder: [],
            currentStore: null,
            maxOrderItems: 50,
            maxItemQuantity: 100,
            maxOrderNoteLength: 200,
            constraints: null
        };

        let isBackendOnline = false;

        // ============================================================
        // 货币工具
        // ============================================================
        function toBaseCurrency(price, currencyCode) {
            const list = Array.isArray(state.currencies) ? state.currencies : [];
            const currency = list.find(item => item.code === currencyCode) || { rate: 1 };
            return Number(price || 0) / Number(currency.rate || 1);
        }

        function formatPrimary(amount) {
            const c = state.defaultCurrency || { symbol: '$', rate: 1, code: 'USD' };
            const sym = c.symbol || '$';
            const rate = Number(c.rate || 1);
            return `${sym}${(Number(amount || 0) * rate).toFixed(2)}`;
        }

        function formatSecondary(amount, secondaryCode) {
            if (!secondaryCode) return '';
            const list = Array.isArray(state.currencies) ? state.currencies : [];
            const secCurr = list.find(c => c.code === secondaryCode);
            if (!secCurr) return '';
            const defaultRate = Number((state.defaultCurrency && state.defaultCurrency.rate) || 1);
            const secValue = (Number(amount || 0) / defaultRate) * Number(secCurr.rate || 1);
            return `${secCurr.symbol}${secValue.toFixed(2)}`;
        }

        function getMenuPrices(item) {
            const base = toBaseCurrency(item.price, item.currency_code);
            const primary = formatPrimary(base);
            let secondary = '';
            if (state.dualCurrency && state.dualCurrency.enabled && item.secondary_currency_code) {
                secondary = formatSecondary(base, item.secondary_currency_code);
            }
            return { primary, secondary };
        }

        function isScanSessionValid() {
            return Boolean(state.scanSessionToken && state.scanExpiresAt &&
                new Date(state.scanExpiresAt).getTime() > Date.now());
        }

        // ============================================================
        // DOM 引用
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const menuGrid = $('#menuGrid');
        const cartBadge = $('#cartBadge');
        const cartTotal = $('#cartTotal');
        const drawerBody = $('#drawerBody');
        const drawerTotal = $('#drawerTotal');
        const cartDrawer = $('#cartDrawer');
        const overlay = $('#overlay');
        const toastEl = $('#toast');
        const tableDisplay = $('#tableDisplay');
        const tableInfo = $('#tableInfo');
        const langBtn = $('#langBtn');
        const langMenu = $('#langMenu');
        const storeNameDisplay = $('#storeNameDisplay');

        // ============================================================
        // 滚动锁定
        // ============================================================
        function updateScrollLock() {
            const anyOpen =
                cartDrawer.classList.contains('open') ||
                document.getElementById('customerOrderModal').classList.contains('show') ||
                document.getElementById('confirmOrderModal').classList.contains('show') ||
                document.getElementById('orderSuccessModal').classList.contains('show') ||
                document.getElementById('callWaiterConfirmOverlay').classList.contains('show');
            document.body.style.overflow = anyOpen ? 'hidden' : '';
        }

        // ============================================================
        // Toast
        // ============================================================
        function showToast(msg, dur = 1800) {
            if (!toastEl) return;
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), dur);
        }

        // ============================================================
        // API
        // ============================================================
        async function checkBackend() {
            try {
                await SLF.api.get('/menu');
                isBackendOnline = true;
            } catch {
                isBackendOnline = false;
            }
            return isBackendOnline;
        }

        async function fetchCategoryOrder() {
            try {
                const data = await SLF.api.get(`/public/categories?store_id=${state.storeId || 1}`);
                state.categoryOrder = Array.isArray(data) ? data.map(c => c.name) : [];
            } catch (e) {
                console.warn('分类顺序加载失败，使用默认排序', e);
                state.categoryOrder = [];
            }
        }

        async function fetchStoreInfo() {
            try {
                state.currentStore = await SLF.api.get(`/public/store-info?store_id=${state.storeId || 1}`);
            } catch (e) {
                console.warn('加载店铺信息失败:', e);
                state.currentStore = null;
            }
            updateStoreNameDisplay();
        }

        // 只更新 .badge-text，保留图标
        function updateStoreNameDisplay() {
            if (!storeNameDisplay) return;
            const name = state.currentStore && state.currentStore.name
                ? state.currentStore.name
                : t('unknownStore', null, '未知店铺');
            let badge = storeNameDisplay.querySelector('.badge-text');
            if (!badge) {
                storeNameDisplay.innerHTML = '<i class="fas fa-store"></i> <span class="badge-text"></span>';

        async function fetchMenu() {
            try {
                if (!isBackendOnline) {
                    isBackendOnline = await checkBackend();
                    if (!isBackendOnline) throw new Error('后端未连接');
                }
                const data = await SLF.api.get(`/menu?store_id=${state.storeId || 1}`);
                if (Array.isArray(data)) state.menu = data;
                renderCategories();
                renderMenu();
                updateUI();
            } catch (e) {
                console.warn('fetchMenu failed:', e);
                if (state.menu.length === 0) {
                    renderCategories();
                    renderMenu();
                    updateUI();
                }
                showToast('⚠️ 无法加载数据库中的菜单，请检查后端服务', 2500);
            }

        async function fetchStoreConfig() {
            try {
                const config = await SLF.api.get(`/public/config?store_id=${state.storeId || 1}`);

                state.currencies = Array.isArray(config.currencies) ? config.currencies : [];
                state.defaultCurrency = config.defaultCurrency || state.defaultCurrency;
                state.dualCurrency = config.dualCurrency || { enabled: false, currency: null };

                // 统一约束（优先用 constraints，缺失时回退旧字段）
                state.constraints = config.constraints || {
                    order: {
                        maxItemTypes:   Number(config.max_order_items) || 50,
                        maxPerItem:     Number(config.max_item_quantity) || 100,
                        maxNoteLength:  Number(config.max_order_note_length) || 200,
                        minIntervalSec: 30,
                    },
                    call: {
                        enabled: true,
                        maxPerWindow: 3,
                        windowMinutes: 5,
                        cooldownMinutes: 10,
                    },
                };

                // 兼容旧引用
                state.maxOrderItems      = state.constraints.order.maxItemTypes;
                state.maxItemQuantity    = state.constraints.order.maxPerItem;
                state.maxOrderNoteLength = state.constraints.order.maxNoteLength;

                if (state.dualCurrency.enabled && !state.dualCurrency.currency) {
                    const defaultSec = state.currencies.find(c => c.code === 'USD') || state.currencies[0];
                    if (defaultSec) state.dualCurrency.currency = defaultSec;
                }

                const noteInput = document.getElementById('orderNoteInput');
                if (noteInput) noteInput.maxLength = state.constraints.order.maxNoteLength;
            } catch (e) {
                console.warn('fetchStoreConfig failed, using defaults:', e);
                state.currencies = state.currencies || [];
                state.defaultCurrency = state.defaultCurrency || { code: 'USD', symbol: '$', rate: 1 };
                state.dualCurrency = state.dualCurrency || { enabled: false, currency: null };
                state.constraints = state.constraints || {
                    order: { maxItemTypes: 50, maxPerItem: 100, maxNoteLength: 200, minIntervalSec: 30 },
                    call: { enabled: true, maxPerWindow: 3, windowMinutes: 5, cooldownMinutes: 10 },
                };
                state.maxOrderItems      = state.constraints.order.maxItemTypes;
                state.maxItemQuantity    = state.constraints.order.maxPerItem;
                state.maxOrderNoteLength = state.constraints.order.maxNoteLength;
            }
        }

        // 不再请求 /tables（该接口需要信息也没必要暴露给顾客）
        async function fetchTables() {
            if (!isBackendOnline) return false;
            let menuAlreadyFetched = false;
            try {
                const query = new URLSearchParams(window.location.search);
                let token = query.get('token');
                let sessionParam = query.get('session');

                if (SLF.store.rawGet('customer_session_terminated')) {
                    SLF.store.rawRemove('customer_session_terminated');
                    token = null;
                    sessionParam = null;
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.delete('table');
                        url.searchParams.delete('session');
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                }

                if (sessionParam) {
                    const info = await SLF.api.get(`/public/table-session/${encodeURIComponent(sessionParam)}/info`);
                    state.table = info.table;
                    state.storeId = info.storeId || 1;
                    state.scanToken = '';
                    state.scanSessionToken = info.sessionToken;
                    state.scanExpiresAt = info.expiresAt;
                    if (info.customerToken) {
                        state.customerToken = info.customerToken;
                        SLF.store.rawSet('customer_token', info.customerToken);
                    } else if (SLF.store.rawGet('customer_token')) {
                        state.customerToken = SLF.store.rawGet('customer_token');
                    }
                    await fetchStoreInfo();
                    await fetchMenu();
                    menuAlreadyFetched = true;
                } else if (token) {
                    const session = await SLF.api.get(`/public/table-token/${encodeURIComponent(token)}`);
                    state.table = session.table;
                    state.storeId = session.storeId || 1;
                    state.scanToken = token;
                    state.scanSessionToken = session.sessionToken;
                    state.scanExpiresAt = session.expiresAt;
                    if (session.customerToken) {
                        state.customerToken = session.customerToken;
                        SLF.store.rawSet('customer_token', session.customerToken);
                    } else if (SLF.store.rawGet('customer_token')) {
                        state.customerToken = SLF.store.rawGet('customer_token');
                    }
                    try {
                        const url = new URL(window.location.href);
                        url.searchParams.delete('token');
                        url.searchParams.set('session', state.scanSessionToken);
                        history.replaceState(null, '', url.pathname + url.search + url.hash);
                    } catch (_) {}
                    await fetchStoreInfo();
                    await fetchMenu();
                    menuAlreadyFetched = true;
                } else {
                    state.table = '';
                    state.scanToken = '';
                    state.scanSessionToken = '';
                    state.scanExpiresAt = '';
                    state.storeId = 1;
                }

                tableDisplay.textContent = state.table || t('notScanned', null, '未扫码');
                tableInfo.title = state.table ? `${t('table', null, '桌号')}: ${state.table}` : t('scanToBind', null, '请扫描桌面二维码绑定桌号');
                document.getElementById('customerOrderBtn').hidden = !isScanSessionValid();
                document.getElementById('callWaiterBtn').hidden = !isScanSessionValid();
                updateUI();
                return menuAlreadyFetched;
            } catch (e) {
                console.warn('fetchTables 错误:', e);
                state.table = '';
                state.scanToken = '';
                state.scanSessionToken = '';
                state.scanExpiresAt = '';
                state.storeId = 1;
                state.customerToken = '';
                SLF.store.rawRemove('customer_token');
                tableDisplay.textContent = t('notScanned', null, '未扫码');
                tableInfo.title = t('scanToBind', null, '请扫描桌面二维码绑定桌号');
                document.getElementById('customerOrderBtn').hidden = true;
                document.getElementById('callWaiterBtn').hidden = true;
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('token');
                    url.searchParams.delete('table');
                    url.searchParams.delete('session');
                    history.replaceState(null, '', url.pathname + url.search + url.hash);
                } catch (_) {}
                try {
                    Object.keys(localStorage)
                        .filter(k => k.startsWith('scanSession_'))
                        .forEach(k => localStorage.removeItem(k));
                } catch (_) {}
                if (e && e.message) showToast('⚠️ ' + e.message, 3000);
                updateUI();
                return menuAlreadyFetched;
            }
        }

        // ============================================================
        // 顾客订单详情
        // ============================================================
        async function openCustomerOrders() {
            if (!isScanSessionValid()) {
                showToast(t('sessionExpired', null, '会话已过期'), 2600);
                return;
            }
            try {
                const ct = state.customerToken || SLF.store.rawGet('customer_token') || '';
                const data = await SLF.api.get(
                    `/public/table-session/${encodeURIComponent(state.scanSessionToken)}/orders` +
                    (ct ? `?ct=${encodeURIComponent(ct)}` : '')
                );

                const orderStatusMap = {
                    'pending': t('orderPending', null, '未结算'),
                    'done': t('orderDone', null, t('completed', null, '已完成'))
                };
                const itemStatusMap = {
                    'pending': t('pending', null, t('inProgress', null, '进行中')),
                    'done': t('itemDone', null, t('completed', null, '已完成'))
                };
                const statusClassMap = { 'pending': 'pending', 'done': 'done' };

                const detailEl = document.getElementById('customerOrderDetail');

                if (!data.orders || data.orders.length === 0) {
                    detailEl.innerHTML = `
                        <div class="order-empty-state">
                            <i class="fas fa-receipt"></i>
                            ${t('noCurrentTableOrders', null, '暂无订单')}
                        </div>
                    `;
                    document.getElementById('customerOrderModal').classList.add('show');
                    overlay.classList.add('show');
                    updateScrollLock();
                    return;
                }

                let html = '';
                data.orders.forEach((order) => {
                    let timeStr = '未知时间';
                    if (order.createdAt) {
                        try {
                            const dt = new Date(order.createdAt);
                            if (!isNaN(dt.getTime())) timeStr = dt.toLocaleString();
                        } catch (_) {}
                    }

                    const orderStatusText = orderStatusMap[order.status] || order.status;
                    const orderStatusClass = statusClassMap[order.status] || 'pending';

                    const orderTotalBase = order.items.reduce((sum, item) => {
                        return sum + toBaseCurrency(item.price, item.currency_code) *
                            (item.quantity - (item.returnedQty || 0));
                    }, 0);
                    const orderPrimaryTotal = formatPrimary(orderTotalBase);
                    let orderSecondaryTotal = '';
                    if (state.dualCurrency.enabled && state.dualCurrency.currency) {
                        orderSecondaryTotal = formatSecondary(orderTotalBase, state.dualCurrency.currency.code);
                    }
                    const orderTotalDisplay = orderSecondaryTotal
                        ? `${orderPrimaryTotal} <span class="total-secondary">(${orderSecondaryTotal})</span>`
                        : orderPrimaryTotal;

                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;">
                                    <span class="order-id">
                                        <span class="order-id-hash">#</span>${esc(order.order_no || ("#" + order.id))}
                                    </span>
                                    <span style="font-size:12px;color:#888;white-space:nowrap;">🕒 ${esc(timeStr)}</span>
                                </div>
                                <span class="order-status-badge ${orderStatusClass}">${esc(orderStatusText)}</span>
                            </div>
                            <div class="order-items">
                    `;

                    order.items.forEach((item) => {
                        const itemStatusText = itemStatusMap[item.itemStatus] || itemStatusMap['pending'];
                        const itemStatusClass = statusClassMap[item.itemStatus] || 'pending';

                        const itemTotalBase = toBaseCurrency(item.price, item.currency_code) *
                            (item.quantity - (item.returnedQty || 0));
                        const unitDisplay = formatPrimary(toBaseCurrency(item.price, item.currency_code));
                        const itemPrimaryTotal = formatPrimary(itemTotalBase);
                        let itemSecondaryTotal = '';
                        if (state.dualCurrency.enabled && item.secondary_currency_code) {
                            itemSecondaryTotal = formatSecondary(itemTotalBase, item.secondary_currency_code);
                        }
                        const itemTotalDisplay = itemSecondaryTotal
                            ? `${itemPrimaryTotal} <span class="price-secondary">(${itemSecondaryTotal})</span>`
                            : itemPrimaryTotal;

                        const emoji = item.emoji || '🍽️';
                        const name = item.name || '菜品';

                        html += `
                            <div class="order-item">
                                <span class="item-name">
                                    <span class="item-emoji">${esc(emoji)}</span>
                                    <span class="item-label">${esc(name)}</span>
                                    <span class="item-qty-mark">× ${item.quantity}</span>
                                    <span style="color:#e67e22;font-size:12px;">@${unitDisplay}</span>
                                    ${item.returnedQty > 0 ? `<span style="color:#e74c3c;font-size:12px;"> (${t('returned', null, '退')} ${item.returnedQty})</span>` : ''}
                                </span>
                                <span class="item-price">${itemTotalDisplay}</span>
                                <span class="item-status-label ${itemStatusClass}">${esc(itemStatusText)}</span>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                            ${order.note ? `<div class="order-note"><strong>${t('orderNoteDisplay', null, '备注')}：</strong>${escNote(order.note)}</div>` : ''}
                            <div class="order-footer">
                                <span class="total-label">${t('total', null, '合计')}</span>
                                <span class="total-amount">${orderTotalDisplay}</span>
                            </div>
                    `;

                    if (order.status === 'pending') {
                        const allDone = (order.items || []).every(item => item.itemStatus === 'done');
                        if (allDone) {
                            html += `
                                <div style="margin-top:12px;text-align:center;">
                                    <button disabled style="background:#ccc;color:#999;border:0;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:not-allowed;box-shadow:none;">
                                        ⏰ ${t('urgeOrder', null, '催单')}
                                    </button>
                                </div>
                            `;
                        } else {
                            html += `
                                <div style="margin-top:12px;text-align:center;">
                                    <button data-urge-order="${order.id}" style="background:linear-gradient(135deg,#e85d3a,#f39c12);color:#fff;border:0;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(232,93,58,.3);">
                                        ⏰ ${t('urgeOrder', null, '催单')}
                                    </button>
                                </div>
                            `;
                        }
                    }
                    html += `</div>`;
                });

                detailEl.innerHTML = html;
                detailEl.querySelectorAll('button[data-urge-order]').forEach(btn => {
                    btn.addEventListener('click', () => urgeOrder(Number(btn.dataset.urgeOrder)));
                });

                document.getElementById('customerOrderModal').classList.add('show');
                overlay.classList.add('show');
                updateScrollLock();
            } catch (e) {
                showToast('❌ ' + (e.message || t('networkError', null, '网络错误')));
            }
        }
