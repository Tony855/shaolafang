<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e85d3a">
<meta name="referrer" content="no-referrer">
<title>FoodFlow 外卖点餐</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
*{box-sizing:border-box}
body{margin:0;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin-inline:auto}
header{padding:16px 4px 18px}
h1{font-size:23px;margin:0 0 7px}
p{color:#68758a;line-height:1.6;margin:0}
#storeList{display:grid;gap:12px;margin-top:18px}
.store{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:17px;border:1px solid #e2e8f0;border-radius:15px;background:#fff;color:#172033;text-align:left;font:inherit;cursor:pointer;box-shadow:0 4px 16px #1720330a}
.store strong{font-size:16px}
.store span{font-size:13px;color:#d94d2d;font-weight:700;white-space:nowrap}
.state{padding:18px;border-radius:14px;background:#fff;color:#68758a}
footer{margin-top:24px;font-size:12px;color:#8a94a6;text-align:center}
</style>
</head>
<body>
<header><h1>🍽️ FoodFlow 外卖点餐</h1><p id="intro">选择你要点餐的门店，进入菜单开始下单。</p></header>
<main><div id="storeList" aria-live="polite"><div class="state">正在加载可点餐门店…</div></div></main>
<footer>安全下单 · 在线支付 · 配送进度追踪</footer>
<script>
(() => {
 'use strict';
 const app=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
 if(app){app.ready();app.expand();}
 const list=document.getElementById('storeList');
 const initData=app&&typeof app.initData==='string'?app.initData:'';
 const params=new URLSearchParams(location.search);let storeId=params.get('store_id')||'',entry=params.get('entry')||'',botPath=params.get('bot')||'';
 const intro=document.getElementById('intro');
 function showError(message){list.replaceChildren();const p=document.createElement('div');p.className='state';p.textContent=message;list.appendChild(p);}
 function openStore(id,signature){location.href='/delivery/order?store_id='+encodeURIComponent(String(id))+'&entry='+encodeURIComponent(signature)+'&telegram=1'+(botPath?'&bot='+encodeURIComponent(botPath):'');}
 async function load(){
  try{
   if(!initData)throw new Error('请从 FoodFlow 统一 Client Bot 的菜单按钮打开此页面。');
   const hasStoreId=!!storeId,hasEntry=!!entry;
   if(botPath&&!/^[A-Za-z0-9_-]{43}$/.test(botPath))throw new Error('当前商户 Telegram 入口无效，请重新打开 Bot。');
   if(hasStoreId!==hasEntry||(hasStoreId&&(!/^\d+$/.test(storeId)||!/^[A-Za-z0-9_-]{43}$/.test(entry))))throw new Error('门店专属入口参数不完整，请重新从商户 Bot 入口进入。');
   const query=new URLSearchParams();if(botPath)query.set('bot',botPath);if(hasStoreId){query.set('store_id',storeId);query.set('entry',entry);}
   const endpoint='/api/public/delivery/telegram-miniapp-stores'+(query.toString()?'?'+query.toString():'');
   const response=await fetch(endpoint,{cache:'no-store',headers:{accept:'application/json','X-Telegram-Init-Data':initData}});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||!Array.isArray(data.stores))throw new Error(data.error||'门店列表暂时不可用，请稍后重试');
   const stores=data.stores.filter(x=>Number.isSafeInteger(Number(x.id))&&Number(x.id)>0&&typeof x.name==='string');
   if(!stores.length){showError('当前商户没有可点餐的门店，请联系商户管理员。');return;}
   if(hasStoreId){if(stores.length!==1||Number(stores[0].id)!==Number(storeId))throw new Error('门店专属入口与当前商户不匹配，请重新获取门店链接。');const resolvedEntry=typeof stores[0].entry==='string'?stores[0].entry:entry;if(!/^[A-Za-z0-9_-]{43}$/.test(resolvedEntry))throw new Error('无法安全确认门店入口，请重新获取门店专属链接。');intro.textContent='正在进入 '+stores[0].name+'…';openStore(stores[0].id,resolvedEntry);return;}
   if(stores.length===1){const resolvedEntry=stores[0].entry;if(!/^[A-Za-z0-9_-]{43}$/.test(resolvedEntry))throw new Error('无法安全确认门店入口，请重新获取门店专属链接。');intro.textContent='正在进入 '+stores[0].name+'…';openStore(stores[0].id,resolvedEntry);return;}
   intro.textContent='请选择此商户旗下的门店。';list.replaceChildren();for(const store of stores){if(!Number.isSafeInteger(Number(store.id))||!/^[A-Za-z0-9_-]{43}$/.test(String(store.entry||'')))continue;const button=document.createElement('button');button.type='button';button.className='store';const name=document.createElement('strong');name.textContent=store.name;const action=document.createElement('span');action.textContent='进入点餐';button.append(name,action);button.addEventListener('click',()=>openStore(store.id,store.entry));list.appendChild(button);}if(!list.children.length)showError('当前商户暂无可用门店。');return;
  }catch(error){showError(error.message||'加载门店失败，请重新打开菜单按钮。');}
 }
 load();
})();
</script>
</body>
</html>
