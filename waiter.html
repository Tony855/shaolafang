<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>服务员点餐</title>
<script>
    // 同步判断登录态，避免刷新时登录窗口闪现
    if (localStorage.getItem('waiterToken')) {
        document.documentElement.setAttribute('data-waiter-session', '1');
    }
</script>
<style>
    :root{
      --primary: #e84a2a;
      --primary-light: #ff6b4a;
      --primary-dark: #c73d1f;
      --primary-bg: #fef6f3;
      --gray-1: #f8f9fb;
      --gray-2: #eef0f2;
      --gray-3: #d5d8dd;
      --gray-4: #9ea3ac;
      --gray-5: #6b7078;
      --gray-6: #2d3138;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.15);
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--gray-6);
      min-height: 100vh;
      padding-bottom: 80px;
      background: linear-gradient(145deg, #fff5f0 0%, #fde8dd 100%);
      position: relative;
    }
    body::before{ content: ''; position: fixed; top: -20%; right: -10%; width: 60%; height: 80%; background: radial-gradient(circle, rgba(232,74,42,0.10) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    body::after{ content: ''; position: fixed; bottom: -20%; left: -10%; width: 50%; height: 70%; background: radial-gradient(circle, rgba(255,140,76,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .toast{
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      color: #fff; padding: 8px 24px; border-radius: 30px;
      font-weight: 500; font-size: 14px; z-index: 999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show{ opacity: 1; }
    html, body { overscroll-behavior: none; -webkit-overflow-scrolling: auto; }
    body { position: fixed; width: 100%; height: 100%; overflow: hidden; }
    #mainContent { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    header{
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, #ff8a4c 0%, #e84a2a 100%);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 10px 28px rgba(200, 65, 30, .22);
      border-radius: 0 0 22px 22px;
    }
    header .header-title{ font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
    header .header-left{ display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; justify-content: center; }
    header .header-right{ display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
    header .waiter-name{ background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 30px; font-weight: 600; font-size: 14px; }
    header .store-name{ background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); padding: 4px 14px; border-radius: 30px; font-weight: 600; font-size: 14px; }
    header .header-btn{ background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 5px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    header .header-btn:hover{ background: rgba(255,255,255,0.3); }
    header .icon-btn{ width: 34px; height: 34px; min-width: 34px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; position: relative; }
    header .call-notification-btn #callNotificationCount{ position: absolute; top: -4px; right: -4px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; line-height: 1; }
    header .call-notification-btn{ position: relative; background: #ff7a45; color: #fff; border: 0; padding: 5px 14px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .lang-btn-wrap{ width: 34px; height: 34px; min-width: 34px; max-width: 34px; border-radius: 50%; background: rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; margin: 0; box-sizing: border-box; overflow: hidden; position: relative; }
    .lang-btn-wrap .lang-icon{ font-size: 16px; line-height: 1; pointer-events: none; }
    .lang-btn-wrap select{ position: absolute; inset: 0; opacity: 0; cursor: pointer; border: none; background: transparent; color: transparent; padding: 0; margin: 0; width: 100%; height: 100%; }
    header select option{ color: var(--gray-6); background: #fff; }
    main{ max-width: 1000px; margin: 20px auto; padding: 0 16px; position: relative; z-index: 1; }
    .table-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .table-card{ position: relative; background: #fff; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.04); cursor: pointer; transition: var(--transition); }
    .table-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .table-card .name{ font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .table-card .name .status{ margin-top: 0; font-size: 12px; padding: 2px 10px; font-weight: 500; }
    .table-card .status{ display: inline-block; margin-top: 4px; padding: 2px 14px; border-radius: 30px; font-size: 12px; font-weight: 600; }
    .status.available{ background: #e3f5e3; color: #1d7a3e; }
    .status.occupied{ background: #fff0e0; color: #b85c2a; }
    .status.reserved{ background: #e3edfc; color: #2a5fb8; }
    .table-card .bill{ margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-2); font-size: 14px; }
    .table-card .amount{ font-weight: 700; color: var(--primary); font-size: 16px; }
    .bill-items{ margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; max-height: 120px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .bill-items::-webkit-scrollbar{ display: none; }
    .bill-items .line{ display: grid; grid-template-columns: 1fr 64px 72px; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px dashed var(--gray-2); }
    .bill-items .dish-name{ min-width:0; color: var(--gray-6); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .order-detail-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; gap:10px; }
    .order-detail-item .dish-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .order-detail-item .item-price{ color:#e74c3c; flex-shrink:0; }
    .line-amount{ text-align:right; color: var(--gray-5); }
    .bill-items .line .item-status, .bill-items .line .item-toggle{ justify-self:center; text-align:center; white-space:nowrap; }
    .item-status{ padding: 2px 10px; border-radius: 30px; font-size: 11px; font-weight: 600; background: rgba(250, 140, 22, .15); color: #fa8c16; }
    .item-status.done{ background: rgba(82, 196, 26, .15); color: #52c41a; }
    .item-toggle{ border: 0; padding: 3px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; background: rgba(250, 140, 22, .15); color: #fa8c16; cursor: pointer; transition: var(--transition); }
    .item-toggle.done{ background: rgba(82, 196, 26, .15); color: #52c41a; }
    .order-block{ margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--gray-2); }
    .order-head{ display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
    .order-head .order-meta{ font-weight: 400; font-size: 12px; color: #c8c8d0; }
    .session-badge{ display: inline-block; padding: 1px 8px; border-radius: 999px; background: rgba(123, 104, 238, .15); color: #7b68ee; font-size: 11px; font-weight: 700; margin-left: 4px; }
    .order-head button{ background: #e3f5e3; border: 1px solid #b7dbb7; color: #1d7a3e; border-radius: 30px; padding: 2px 12px; font-size: 12px; cursor: pointer; transition: var(--transition); }
    .order-head button:hover{ background: #c8eac8; }
    .modal{ position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .modal.open{ display: flex; }
    html[data-waiter-session] .login-modal.open{ display: none; }
    .modal-card{ background: #fff; border-radius: var(--radius); max-width: 920px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 24px; }
    .modal-head{ display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--gray-2); flex-shrink: 0; }
    .modal-head h2{ font-size: 20px; font-weight: 700; margin: 0; }
    .close{ background: var(--gray-2); border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: var(--transition); }
    .close:hover{ background: var(--gray-3); }
    .confirm-modal .confirm-card{ max-width: 380px; padding: 32px 28px 28px; text-align: center; border-radius: 20px; }
    .confirm-icon{ font-size: 48px; margin-bottom: 16px; }
    .confirm-title{ font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
    .confirm-message{ font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    .confirm-buttons{ display: flex; gap: 12px; justify-content: center; }
    .confirm-cancel, .confirm-ok{ flex: 1; padding: 12px 24px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .confirm-cancel{ background: #f0f0f5; color: #666; }
    .confirm-cancel:hover{ background: #e4e4ec; }
    .confirm-ok{ background: linear-gradient(135deg, #e85d3a, #e84a2a); color: #fff; }
    .confirm-ok:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232,93,58,0.3); }
    .login-modal .modal-card{ max-width: 420px; padding: 32px 28px 28px; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-radius: 28px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 30px 80px rgba(0,0,0,0.15); position: relative; z-index: 1; }
    .login-modal .modal-head{ border-bottom: none; padding-bottom: 8px; }
    .login-modal .modal-head h2{ font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .login-modal .modal-head h2 .brand-icon{ font-size: 32px; }
    .login-modal .form-group{ margin-bottom: 14px; }
    .login-modal .form-group input{ width: 100%; height: 48px; padding: 0 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--gray-3); font-size: 15px; transition: var(--transition); background: rgba(255,255,255,0.8); }
    .login-modal .form-group input:focus{ outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(232,74,42,0.12); background: #fff; }
    .login-modal .form-group label{ display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--gray-5); cursor: pointer; }
    .login-modal .form-group label input[type="checkbox"]{ width: 18px; height: 18px; accent-color: var(--primary); }
    .login-btn{ width: 100%; height: 50px; border: 0; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 4px; }
    .login-btn:hover{ background: var(--primary-dark); transform: translateY(-1px); }
    .login-btn:active{ transform: scale(0.97); }
    .login-error{ color: var(--primary); margin-top: 10px; font-size: 14px; text-align: center; min-height: 22px; }
    .current-table{ background: var(--primary-bg); border: 1px solid #f5d5c8; color: var(--primary-dark); font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 15px; flex: 1; }
    .modal-head .current-table{ margin-bottom: 0; background: transparent; border: none; padding: 0; font-size: 18px; font-weight: 700; color: var(--gray-6); }
    .selected-items{ flex-shrink: 0; background: var(--gray-1); border-radius: var(--radius-sm); padding: 12px 14px; max-height: 110px; overflow-y: auto; margin-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
    .selected-items::-webkit-scrollbar{ display: none; }
    .selected-items .title{ font-weight: 600; margin-bottom: 8px; color: var(--gray-5); }
    .selected-item{ display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--gray-2); }
    .selected-item:last-child{ border-bottom: 0; }
    .selected-item .sel-name{ min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .item-status.new{ background: var(--primary-bg); color: var(--primary); padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .selected-item .sel-price{ color: var(--gray-5); font-size: 13px; white-space: nowrap; }
    .selected-item .qty{ gap: 4px; }
    .selected-item .qty button{ width: 26px; height: 26px; font-size: 14px; }
    .selected-item .qty span{ min-width: 18px; font-size: 13px; }
    .selected-item .remove-btn{ background: #fee8e6; border: 0; color: var(--primary); padding: 2px 10px; border-radius: 30px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .selected-item .remove-btn:hover{ background: #fdd5d0; }
    .dish-categories{ display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; margin-bottom: 8px; scrollbar-width: none; -ms-overflow-style: none; flex-shrink: 0; }
    .dish-categories::-webkit-scrollbar{ display: none; }
    .dish-categories .cat-btn{ padding: 6px 14px; border-radius: 20px; border: 1px solid var(--gray-3); background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
    .dish-categories .cat-btn:hover{ border-color: var(--primary); color: var(--primary); }
    .dish-categories .cat-btn.active{ background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .dish-list{ display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; flex: 1; overflow-y: auto; padding: 6px 2px 12px 0; scrollbar-width: none; -ms-overflow-style: none; }
    .dish-list::-webkit-scrollbar{ display: none; }
    .dish-item{ display: flex; align-items: center; gap: 12px; background: var(--gray-1); border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--gray-2); transition: var(--transition); }
    .dish-item:hover{ background: #fff; border-color: var(--gray-3); }
    .dish-thumb{ width: 56px; height: 56px; border-radius: var(--radius-sm); background: var(--gray-2); display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; flex-shrink: 0; }
    .dish-thumb img{ width:100%; height:100%; object-fit:cover; }
    .dish-item .info{ flex:1; min-width:0; }
    .dish-item .info .name{ font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dish-item .info .price{ color: var(--primary); font-size:14px; font-weight:500; }
    .price-secondary{ font-size:12px; color: var(--gray-4); margin-left:4px; }
    .qty{ display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; }
    .qty button{ width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gray-3); background: #fff; font-size: 16px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
    .qty button:hover{ border-color: var(--primary); color: var(--primary); }
    .qty span{ min-width: 24px; text-align: center; font-weight: 600; }
    .footer{ flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding-top: 16px; margin-top: 12px; border-top: 1px solid var(--gray-2); }
    .footer .total{ font-size: 22px; font-weight: 700; color: var(--primary); }
    .submit-btn{ background: var(--primary); border: 0; color: #fff; padding: 10px 28px; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer; transition: var(--transition); }
    .submit-btn:hover{ background: var(--primary-dark); transform: translateY(-2px); }
    .submit-btn:active{ transform: scale(0.97); }
    @media (max-width: 600px) {
      header{ padding: 10px 14px; gap: 8px; display: flex !important; flex-wrap: wrap !important; }
      header .header-title{ position: static !important; transform: none !important; order: 0; width: 100%; text-align: center; justify-content: center; font-size: 17px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); }
      header .header-right{ order: 2; margin-left: 0 !important; flex: 1; justify-content: flex-end; flex-wrap: nowrap !important; gap: 6px !important; }
      header .header-left{ order: 1; margin-left: 0 !important; gap: 6px !important; }
      header .header-btn{ padding: 4px 10px !important; font-size: 12px !important; }
      header .icon-btn{ width: 30px !important; height: 30px !important; min-width: 30px !important; font-size: 14px !important; }
      header .waiter-name, header .store-name{ padding: 3px 10px !important; font-size: 12px !important; }
      .login-modal .modal-card{ padding: 24px 18px 20px; }
      .dish-list{ grid-template-columns: 1fr; }
      .table-grid{ grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .selected-item{ grid-template-columns: 1fr auto auto; row-gap: 4px; }
      .selected-item .sel-price{ grid-column: 1 / 2; font-size: 12px; }
    }
</style>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="toast" id="toast"></div>

<header id="mainHeader" style="display:none;">
  <div class="header-title" id="waiterTitle">🍴 FoodFlow</div>
  <div class="header-left">
    <span class="store-name" id="storeNameDisplay" style="display:none;"></span>
    <span class="waiter-name" id="waiterNameDisplay"></span>
  </div>
  <div class="header-right">
    <button class="call-notification-btn icon-btn" id="callNotificationBtn" onclick="showCallNotifications()" style="display:none;" title="呼叫通知">
      🔔 <span id="callNotificationCount">0</span>
    </button>
    <button class="header-btn icon-btn" onclick="showOrderHistory()" id="orderHistoryBtn" title="订单历史">📋</button>
    <div class="lang-btn-wrap">
      <span class="lang-icon">🌐</span>
      <select id="waiterLang">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ภาษาไทย</option>
        <option value="km">ភាសាខ្មែរ</option>
      </select>
    </div>
    <button class="header-btn exit-fs-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
    <button class="header-btn icon-btn logout-btn" id="logoutBtn" title="退出登录">🚪</button>
  </div>
</header>

<main id="mainContent" style="display:none;">
  <div class="table-grid" id="tableGrid"></div>
</main>

<!-- 订单历史模态框 -->
<div class="modal" id="orderHistoryModal">
  <div class="modal-card" style="max-width:700px;max-height:85vh;">
    <div class="modal-head">
      <h2 id="orderHistoryTitle">📋 订单历史</h2>
      <button class="close" onclick="hideOrderHistory()">✕</button>
    </div>
    <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
      <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
        <select id="historyStatusFilter" onchange="loadOrderHistory()" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;">
          <option value="">全部状态</option>
          <option value="pending">制作中</option>
          <option value="done">已完成</option>
          <option value="canceled">已取消</option>
        </select>
        <input type="date" id="historyDateFilter" onchange="loadOrderHistory()" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;">
      </div>
      <div id="orderHistoryList"></div>
    </div>
  </div>
</div>

<!-- 订单详情模态框 -->
<div class="modal" id="orderDetailModal">
  <div class="modal-card" style="max-width:500px;max-height:85vh;">
    <div class="modal-head">
      <h2 id="orderDetailTitle">订单详情</h2>
      <button class="close" onclick="hideOrderDetail()">✕</button>
    </div>
    <div class="modal-body scroll-hide" id="orderDetailContent" style="max-height:60vh;overflow-y:auto;"></div>
  </div>
</div>

<!-- 点餐模态框 -->
<div class="modal" id="orderModal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="current-table" id="currentTableBadge">当前桌号：</div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="selected-items" id="selectedItems"></div>
    <div class="dish-categories" id="dishCategories"></div>
    <div class="dish-list" id="dishList"></div>
    <div class="footer">
      <span class="total" id="orderTotal">¥0.00</span>
      <button class="submit-btn" id="submitBtn">提交订单</button>
    </div>
  </div>
</div>

<!-- 转移桌号模态框 -->
<div class="modal" id="transferModal">
  <div class="modal-card" style="max-width:400px;">
    <div class="modal-head">
      <h2 id="transferTitle">↔</h2>
      <button class="close" onclick="closeTransferModal()">✕</button>
    </div>
    <div style="padding:10px 0;">

<script src="/socket.io/socket.io.js"></script>
<script>
  // 禁止下拉刷新和窗口移动
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('#mainContent') === null) e.preventDefault();
  }, { passive: false });
  document.body.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // 三连击切换全屏
  let _tripleClickTimer = null, _clickCount = 0;
  window.toggleFullscreen = function() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      if (window.navigator.standalone) {
        alert('已在全屏模式（主屏幕打开）。若需退出，请从底部向上滑动返回。');
      } else {
        document.documentElement.requestFullscreen().catch(e => alert('请用"添加到主屏幕"打开以获得全屏体验'));
      }
    }
  };
  function _handleTap() {
    _clickCount++;
    if (_clickCount === 3) {
      _clickCount = 0;
      clearTimeout(_tripleClickTimer);
      if (!document.fullscreenElement) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
        if (req) req.call(el).catch(()=>{});
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
      }
    }
    clearTimeout(_tripleClickTimer);
    _tripleClickTimer = setTimeout(() => { _clickCount = 0; }, 600);
  }
  document.addEventListener('touchend', _handleTap, { passive: true });
  document.addEventListener('click', _handleTap);
</script>
<script>
  // 安全兜底
  if (typeof SLF === 'undefined' || !SLF.audio) {
    window.SLF = window.SLF || {};
    SLF.audio = {
      _enabled: true,
      setEnabled(v) { this._enabled = !!v; },
      isEnabled() { return this._enabled; },
      unlock() {},
      playNewOrderChime() {},
      playCallChime() {},
    };
  }

  const $ = s => document.querySelector(s);

  const state = {
    tables: [],
    orders: [],
    menu: [],
    cart: {},
    cartMeta: {},
    currentTable: null,
    currencies: [],
    defaultCurrency: { symbol: '$', rate: 1, code: 'USD' },
    dualCurrency: { enabled: false, currency: null },
    waiter: null,
    token: SLF.store.rawGet('waiterToken') || '',
    editingOrderId: null,
    lockedItems: [],
    storeId: null,
    storeName: '',
    currentCategory: 'all',
    selectedItem: null       // 修复：新增字段
  };

  let waiterLang = SLF.store.rawGet('waiterLang') || 'zh';
  SLF.i18n.init(waiterLang);

  // t(key, params, fallback)
  function t(key, params, fallback) {
    try {
      if (!SLF || !SLF.i18n || typeof SLF.i18n.t !== 'function') {
        return fallback !== undefined ? fallback : key;
      }
      const v = SLF.i18n.t(key, params);
      if (v === undefined || v === null || v === key) return fallback !== undefined ? fallback : key;
      return v;
    } catch (e) {
      return fallback !== undefined ? fallback : key;
    }
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  const escNote = esc;

  // 双币工具
  function toBaseCurrency(price, currencyCode) {
    const currency = state.currencies.find(c => c.code === currencyCode) || { rate: 1 };
    return Number(price || 0) / Number(currency.rate || 1);
  }

  function formatPrimary(amount) {
    const c = state.defaultCurrency || { symbol: '$', rate: 1, code: 'USD' };
    return `${c.symbol}${(Number(amount || 0) * Number(c.rate || 1)).toFixed(2)}`;
  }

  function formatSecondary(amount, secondaryCode) {
    if (!secondaryCode) return '';
    const secCurr = state.currencies.find(c => c.code === secondaryCode);
    if (!secCurr) return '';
    const defaultRate = (state.defaultCurrency && state.defaultCurrency.rate) || 1;
    const secValue = (Number(amount || 0) / defaultRate) * Number(secCurr.rate || 1);
    return `${secCurr.symbol}${secValue.toFixed(2)}`;
  }

  function formatMoney(amount, showSecondary = true) {
    const primary = formatPrimary(amount);
    let secondary = '';
    if (showSecondary && state.dualCurrency.enabled && state.dualCurrency.currency) {
      secondary = formatSecondary(amount, state.dualCurrency.currency.code);
    }
    return secondary ? `${primary} (${secondary})` : primary;
  }

  // 修复：移除语义错误的 formatDisplay
  // 之前的 formatDisplay 直接 Number(amount).toFixed(2) 输出主符号但无 rate 转换 → 已经用 formatPrimary 替代

  function getMenuPrices(item) {
    const base = toBaseCurrency(item.price, item.currency_code);
    const primary = formatPrimary(base);
    let secondary = '';
    if (state.dualCurrency.enabled && item.secondary_currency_code) {
      secondary = formatSecondary(base, item.secondary_currency_code);
    }
    return { primary, secondary };
  }

  function applyWaiterLanguage() {
    const titleEl = $('#waiterTitle'); if (titleEl) titleEl.textContent = t('title', null, '🍴 FoodFlow');
    const logoutEl = $('#logoutBtn'); if (logoutEl) logoutEl.title = t('logout', null, '退出');
    const langEl = $('#waiterLang'); if (langEl) langEl.value = waiterLang;
    if (!state.currentTable) { const badge = $('#currentTableBadge'); if (badge) badge.textContent = t('currentTable', null, '当前桌号') + ': '; }
    const submitBtn = $('#submitBtn'); if (submitBtn) submitBtn.textContent = t('submitOrder', null, '提交订单');
    const confirmCancelBtn = $('#confirmCancelBtn'); if (confirmCancelBtn) confirmCancelBtn.textContent = t('cancel', null, '取消');
    const confirmOkBtn = $('#confirmOkBtn'); if (confirmOkBtn) confirmOkBtn.textContent = t('confirm', null, '确定');
    const historyBtn = $('#orderHistoryBtn'); if (historyBtn) historyBtn.title = t('orderHistory', null, '订单历史');
    renderTables();
    const _newBtn = document.getElementById('createNewOrderBtn');
    if (_newBtn) _newBtn.textContent = '➕ ' + t('createNewOrder', null, '创建新订单');
  }

  let confirmCallback = null;
  function showConfirm(message, callback, title) {
    if ($('#confirmModal').classList.contains('open')) return;
    $('#confirmTitle').textContent = title || t('confirmTitle', null, '确认操作');
    $('#confirmMessage').textContent = message;
    confirmCallback = callback;
    $('#confirmModal').classList.add('open');
  }
  function hideConfirm() {
    $('#confirmModal').classList.remove('open');
    $('#confirmInput').style.display = 'none';
    confirmCallback = null;
  }
  $('#confirmCancelBtn').onclick = hideConfirm;
  $('#confirmOkBtn').onclick = function () { if (confirmCallback) confirmCallback(); hideConfirm(); };
  $('#confirmModal').onclick = function (e) { if (e.target === this) hideConfirm(); };

  async function api(path, opt = {}) {
    try {
      const method = (opt.method || 'GET').toUpperCase();
      let result;
      if (method === 'GET') result = await SLF.api.get(path, opt);
      else if (method === 'POST') result = await SLF.api.post(path, opt.body, opt);
      else if (method === 'PUT') result = await SLF.api.put(path, opt.body, opt);
      else if (method === 'DELETE') result = await SLF.api.del(path, opt);
      else result = await SLF.api._request(method, path, opt);
      return result;
    } catch (e) {
      if (e.status === 401) {
        state.token = '';
        SLF.store.rawRemove('waiterToken');
        window.location.href = '/login?type=waiter';
        throw new Error('登录已过期，请重新登录');
      }
      throw e;
    }
  }

  let knownWaiterOrderIds = null;
  function logoutWaiter() {
    stopCallPolling();
    state.token = '';
    SLF.store.rawRemove('waiterToken');
    SLF.store.rawRemove('storeId');
    document.documentElement.removeAttribute('data-waiter-session');
    knownWaiterOrderIds = null;
    stopWaiterAutoRefresh();
    if (waiterIdleTimer) { clearTimeout(waiterIdleTimer); waiterIdleTimer = null; }
    window.location.href = '/login?type=waiter';
  }

  let waiterIdleTimer = null;
  let waiterIdleTimeoutMin = 20;
  function resetWaiterIdle() {
    clearTimeout(waiterIdleTimer);
    if (SLF.store.rawGet('waiterRemember') !== '1' && state.token) {
      const idleTimeout = waiterIdleTimeoutMin * 60 * 1000;
      waiterIdleTimer = setTimeout(logoutWaiter, idleTimeout);
    }
  }
  ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(evt => document.addEventListener(evt, resetWaiterIdle, { passive: true }));

  $('#logoutBtn').onclick = function () { showConfirm(t('confirmLogout', null, '确认退出登录？'), logoutWaiter); };

  function toast(m) {
    const n = $('#toast');
    n.textContent = m;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 1800);
  }

  function getCustomerColor(label) {
    const colors = [
      { bg: 'rgba(123, 104, 238, .15)', color: '#7b68ee' },
      { bg: 'rgba(232, 93, 58, .15)', color: '#e85d3a' },
      { bg: 'rgba(46, 204, 113, .15)', color: '#2ecc71' },
      { bg: 'rgba(52, 152, 219, .15)', color: '#3498db' },
      { bg: 'rgba(241, 196, 15, .15)', color: '#f39c12' },
      { bg: 'rgba(231, 76, 60, .15)', color: '#e74c3c' },
      { bg: 'rgba(26, 188, 156, .15)', color: '#1abc9c' },
      { bg: 'rgba(155, 89, 182, .15)', color: '#9b59b6' },
      { bg: 'rgba(52, 73, 94, .15)', color: '#34495e' },
      { bg: 'rgba(230, 126, 34, .15)', color: '#e67e22' },
      { bg: 'rgba(39, 174, 96, .15)', color: '#27ae60' },
      { bg: 'rgba(41, 128, 185, .15)', color: '#2980b9' },
    ];
    const match = label.match(/\d+/);
    if (match) return colors[(parseInt(match[0]) - 1) % colors.length];
    return { bg: 'rgba(149, 165, 166, .15)', color: '#95a5a6' };
  }

  function buildSessionLabels(orders) {
    const sorted = [...orders].sort((a, b) => {
      const ta = a.createdAt ? (new Date(a.createdAt).getTime() || 0) : 0;
      const tb = b.createdAt ? (new Date(b.createdAt).getTime() || 0) : 0;
      return ta - tb;
    });
    const distinctCt = [...new Set(sorted.filter(o => o.customerToken).map(o => o.customerToken))];
    const labels = new Map();
    const ctToIndex = new Map(distinctCt.map((ct, i) => [ct, i + 1]));
    for (const o of sorted) {
      labels.set(o.id, o.customerToken ? `${t('customer', null, '客')}${ctToIndex.get(o.customerToken)}` : (o.sessionToken ? `${t('customer', null, '客')}1` : t('staffOrder', null, '服务员下单')));
    }
    return labels;
  }

  function bill(table) {
    const active = state.orders.filter(o => o.table === table.name && o.status === 'pending');
    const totalBase = active.reduce((s, o) => s + Number(o.total || 0), 0);
    const totalDisplay = formatMoney(totalBase);
    const sessionLabels = buildSessionLabels(active);
    const blocks = active.slice(0, 5).map(o => {
      const orderTotalBase = (o.items || []).reduce((s, item) => s + toBaseCurrency(item.price, item.currency_code) * (item.quantity - (item.returnedQty || 0)), 0);
      const orderTotalDisplay = formatMoney(orderTotalBase);
      const lines = (o.items || []).map((i, idx) => {
        const qty = Number(i.quantity || 1) - Number(i.returnedQty || 0);
        const unitPrices = getMenuPrices(i);
        const basePrice = toBaseCurrency(i.price, i.currency_code);
        const subBase = basePrice * qty;
        let priceDisplay = `<span style="color:#e67e22;font-size:12px;">@${unitPrices.primary}</span> <b>${formatMoney(subBase, false)}</b>`;
        const returnedHtml = i.returnedQty > 0 ? `<span class="item-status returned" style="background:#95a5a6;">${t('returned', null, '已退')} ${i.returnedQty}</span>` : '';
        const isSelected = state.selectedItem && state.selectedItem.orderId === o.id && state.selectedItem.index === idx;
        const returnBtn = i.itemStatus === 'done' && Number(i.quantity) > 1 && Number(i.quantity) > Number(i.returnedQty || 0) && isSelected ? `<button class="item-toggle return-btn" onclick="event.stopPropagation();returnWaiterItem(${o.id},${idx})" style="background:#e74c3c;color:#fff;">${t('returnDish', null, '退菜')}</button>` : '';
        return `<div class="line" onclick="event.stopPropagation();toggleSelectedItem(${o.id},${idx})" style="cursor:pointer;${isSelected ? 'background:rgba(52,152,219,0.12);border-radius:8px;padding:4px;' : ''}"><span class="dish-name">${esc(i.name)} ×${i.quantity}</span><span class="line-amount">${priceDisplay}</span>${i.itemStatus === 'done' ? `<span class="item-status done">${t('completed', null, '已完成')}</span>` + returnBtn + returnedHtml : (state.waiter && state.waiter.can_mark_item ? `<button class="item-toggle" onclick="event.stopPropagation();toggleWaiterItem(${o.id},${idx})">${t('pending', null, '制作中')}</button>` : '')}</div>`;
      }).join('');
      const timeLabel = o.createdAt ? SLF.utils.formatDateTime(o.createdAt) : '';
      const badgeLabel = sessionLabels.get(o.id);
      const badgeColor = badgeLabel ? getCustomerColor(badgeLabel) : null;
      const badge = badgeLabel ? `<span class="session-badge" style="background:${badgeColor.bg};color:${badgeColor.color};">${badgeLabel}</span>` : '';
      const noteHtml = o.note ? `<div class="order-note" style="margin:4px 0 6px;padding:6px 8px;border-radius:6px;background:rgba(255,193,7,.15);font-size:12px;color:#c98a1f;line-height:1.4;"><strong>${t('orderNoteDisplay', null, '备注')}：</strong>${escNote(o.note)}</div>` : '';
      const orderSettleBtn = (state.waiter && state.waiter.can_complete_order) ? `<button onclick="event.stopPropagation();completeWaiterOrder(${o.id})" style="background:var(--primary);color:#fff;border:none;padding:5px 14px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600;flex-shrink:0;">${t('settleOrder', null, '结算')}</button>` : '';
      return `<div class="order-block"><div class="order-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span>${o.order_no || ("#"+o.id)} · ${t('orderPending', null, '未结算')}${badge}<span class="order-meta"> · ${timeLabel}</span></span>${orderSettleBtn}</div>${noteHtml}<div class="bill-items">${lines}</div></div>`;
    }).join('');
    return active.length ? `<div class="amount" style="display:flex;align-items:center;justify-content:space-between;">${active.length} ${t('order', null, '订单')} · ${totalDisplay}</div>${blocks}` : `<div class="amount" style="color:#c8c8d0">${t('noCustomerOrder', null, '暂无顾客下单')}</div>`;
  }

  async function toggleWaiterItem(id, index) {
    try {
      const order = state.orders.find(o => o.id === id);
      if (!order || !order.items[index]) return;
      const next = order.items[index].itemStatus === 'done' ? 'pending' : 'done';
      await api(`/orders/${id}/items/${index}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ itemStatus: next }) });
      toast('✅ ' + t('orderUpdated', null, '订单已更新'));
      await load();
    } catch (e) { toast('❌ ' + e.message); }
  }

  function toggleSelectedItem(orderId, index) {
    if (state.selectedItem && state.selectedItem.orderId === orderId && state.selectedItem.index === index) {
      state.selectedItem = null;
    } else {
      state.selectedItem = { orderId, index };
    }
    renderTables();
  }
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.line') && !e.target.closest('.return-btn') && state.selectedItem) {
      state.selectedItem = null;
      renderTables();
    }
  });

  async function returnWaiterItem(id, index) {
    try {
      const order = state.orders.find(o => o.id === id);
      if (!order || !order.items[index]) return;
      const item = order.items[index];
      const qty = Number(item.quantity) || 1;
      const returned = Number(item.returnedQty || 0);
      const maxReturn = qty - returned;
      if (maxReturn <= 0) { toast('❌ ' + t('noMoreToReturn', null, '已全部退回')); return; }
      const input = $('#confirmInput');
      showConfirm(t('returnQuantityPrompt', null, '请输入退回数量') + ' (1-' + maxReturn + ')', async function () {
        const returnQty = parseInt(input.value) || 0;
        if (returnQty < 1 || returnQty > maxReturn) { toast('❌ ' + t('invalidReturnQty', null, '退回数量无效')); return; }
        await api(`/orders/${id}/items/${index}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnQty: returned + returnQty }) });
        toast('✅ ' + t('returnSuccess', null, '退菜成功'));
        await load();
      }, t('returnDish', null, '退菜'));
      input.style.display = 'block';
      input.max = maxReturn;
      input.value = 1;
      input.focus();
    } catch (e) { toast('❌ ' + e.message); }
  }

  async function completeWaiterOrder(id) {
    showConfirm(t('confirmComplete', null, '确认结算该订单？'), async function () {
      try {
        await api(`/orders/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'done' }) });
        toast('✅ ' + t('settleOrder', null, '已结算'));
        await load();
      } catch (e) {
        const msg = e.message.includes('未完成菜品') ? (t('incompleteItemsError', null, e.message)) : e.message;
        toast('❌ ' + msg);
      }
    });
  }

  async function load() {
    if (!state.token) { logoutWaiter(); return; }
    try {
      const overview = await api('/waiter/overview');
      const [menuRes, configRes] = await Promise.all([
        SLF.api.get('/menu?store_id=' + (overview.waiter?.store_id || 1)),
        SLF.api.get('/public/config')
      ]);
      detectNewWaiterOrders(overview.orders || []);
      state.tables = overview.tables;
      state.orders = overview.orders;
      state.waiter = overview.waiter;
      state.menu = menuRes;
      state.currencies = configRes.currencies || [];
      state.defaultCurrency = configRes.defaultCurrency || state.defaultCurrency;
      state.dualCurrency = configRes.dualCurrency || { enabled: false, currency: null };
      if (typeof configRes.newOrderSoundEnabled === 'boolean' && SLF.audio) SLF.audio.setEnabled(configRes.newOrderSoundEnabled);
      startWaiterAutoRefresh(configRes.waiter_refresh_interval || 8);
      waiterIdleTimeoutMin = configRes.waiter_idle_timeout || 20;
      if (state.dualCurrency.enabled && !state.dualCurrency.currency) {
        const defaultSec = state.currencies.find(c => c.code === 'USD') || state.currencies[0];
        if (defaultSec) state.dualCurrency.currency = defaultSec;
      }
      $('#mainHeader').style.display = 'flex';
      $('#mainContent').style.display = 'block';
      if (state.waiter && state.waiter.display_name) $('#waiterNameDisplay').textContent = '👤 ' + state.waiter.display_name;
      if (state.waiter && state.waiter.store_id) loadStoreInfo(state.waiter.store_id);
      renderTables();
    } catch (e) {
      toast('❌ ' + e.message);
      if (e.message.includes('请先登录')) logoutWaiter();
    }
  }

  function detectNewWaiterOrders(orders) {
    const pendingIds = new Set((orders || []).filter(o => o.status === 'pending').map(o => o.id));
    if (knownWaiterOrderIds !== null) {
      let hasNew = false;
      for (const id of pendingIds) { if (!knownWaiterOrderIds.has(id)) { hasNew = true; break; } }
      if (hasNew && SLF.audio) SLF.audio.playNewOrderChime();
    }
    knownWaiterOrderIds = pendingIds;
  }

  ['click', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
    document.addEventListener(evt, () => { if (SLF.audio) SLF.audio.unlock(); }, { passive: true });
  });

  async function loadStoreInfo(storeId) {
    if (!storeId) return;
    if (state.storeId === storeId && state.storeName) {
      $('#storeNameDisplay').textContent = '🏬 ' + state.storeName;
      $('#storeNameDisplay').style.display = 'inline-block';
      return;
    }
    try {
      const info = await SLF.api.get('/public/store-info?store_id=' + storeId);
      if (info && info.name) {
        state.storeId = storeId;
        state.storeName = info.name;
        $('#storeNameDisplay').textContent = '🏬 ' + info.name;
        $('#storeNameDisplay').style.display = 'inline-block';
      }
    } catch (e) { /* 静默忽略 */ }
  }

  // 呼叫/催单实时通知
  let knownCallIds = new Set();
  let callPollTimer = null;
  let pendingCalls = [];

  async function pollCalls() {
    if (!state.token || document.hidden) return;
    try {
      const calls = await api('/waiter-calls');
      pendingCalls = calls || [];
      const btn = $('#callNotificationBtn');
      const count = $('#callNotificationCount');
      if (pendingCalls.length > 0) {
        btn.style.display = 'inline-flex';
        count.textContent = pendingCalls.length;
        let hasNew = false;
        for (const c of pendingCalls) { if (!knownCallIds.has(c.id)) { hasNew = true; break; } }
        if (hasNew) {
          if (SLF.audio) SLF.audio.playCallChime();
          const newCall = pendingCalls.find(c => !knownCallIds.has(c.id));
          if (newCall) {
              const isUrge = newCall.type === 'urge';
              const icon = isUrge ? '⚡' : '🔔';
              const label = isUrge ? t('urgeOrder', null, '催单') : t('callWaiter', null, '呼叫');
              toast(`${icon} ${newCall.table_name} ${label}`);
          }
        }
        knownCallIds = new Set(pendingCalls.map(c => c.id));
      } else {
        btn.style.display = 'none';
        knownCallIds.clear();
      }
    } catch (e) { /* 静默失败 */ }
  }

  function startCallPolling() {
    stopCallPolling();
    callPollTimer = setInterval(pollCalls, 5000);
    pollCalls();
  }
  function stopCallPolling() {
    if (callPollTimer) clearInterval(callPollTimer);
    callPollTimer = null;
  }

  function showCallNotifications() {
      if (pendingCalls.length === 0) { toast(t('noCalls', null, '暂无呼叫')); return; }
      const list = pendingCalls.map(c => {
          const isUrge = c.type === 'urge';
          const icon = isUrge ? '⚡' : '🔔';
          const label = isUrge ? t('urgeOrder', null, '催单') : t('callWaiter', null, '呼叫');
          const bg = isUrge ? 'rgba(231,76,60,.1)' : 'rgba(255,176,32,.1)';
          const border = isUrge ? 'rgba(231,76,60,.3)' : 'rgba(255,176,32,.3)';
          return `<div style="background:${bg};border:1px solid ${border};border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
              <div>
                  <div style="font-weight:700;">${icon} ${esc(c.table_name)} ${label}</div>
                  <div style="color:#999;font-size:12px;margin-top:2px;">${esc(c.created_at) || ''}${c.message ? ' · ' + esc(c.message) : ''}</div>
              </div>
              <button onclick="handleCall('${c.id}')" style="background:#27ae60;color:#fff;border:0;padding:6px 14px;border-radius:6px;cursor:pointer;">${t('handled', null, '已处理')}</button>
          </div>`;
      }).join('');
      let modal = document.getElementById('callNotifyModal');
      if (modal) modal.remove();
      modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'callNotifyModal';
      modal.innerHTML = `<div class="modal-card" style="max-width:400px;">
        <div class="modal-head"><h2>🔔 ${t('callWaiter', null, '顾客呼叫')} / ⚡ ${t('urgeOrder', null, '催单')}</h2><button class="close" onclick="document.getElementById('callNotifyModal').remove()">✕</button></div>
        <div class="modal-body">${list}</div>
      </div>`;
      modal.style.display = 'flex';
      document.body.appendChild(modal);
  }

  async function handleCall(id) {
    try {
      await api('/waiter-calls/' + id + '/handle', { method: 'PUT' });
      toast(t('handled', null, '已处理'));
      const modal = document.getElementById('callNotifyModal');
      if (modal) modal.remove();
      pollCalls();
    } catch (e) { toast(t('handleFailed', null, '处理失败') + ': ' + e.message); }
  }

  // 订单历史
  let historyOrders = [];

  function showOrderHistory() {
    document.getElementById('orderHistoryModal').style.display = 'flex';
    document.getElementById('orderHistoryTitle').textContent = '📋 ' + t('orderHistory', null, '订单历史');
    const statusSelect = document.getElementById('historyStatusFilter');
    statusSelect.options[0].text = t('allStatus', null, '全部状态');
    statusSelect.options[1].text = t('pending', null, '制作中');
    statusSelect.options[2].text = t('completed', null, '已完成');
    statusSelect.options[3].text = t('canceled', null, '已取消');
    loadOrderHistory();
  }
  function hideOrderHistory() {
    document.getElementById('orderHistoryModal').style.display = 'none';
  }

  async function loadOrderHistory() {
    try {
      const statusFilter = document.getElementById('historyStatusFilter').value;
      const dateFilter = document.getElementById('historyDateFilter').value;
      let url = '/orders';
      const params = [];
      if (statusFilter) params.push('status=' + encodeURIComponent(statusFilter));
      if (params.length > 0) url += '?' + params.join('&');
      const orders = await api(url);
      historyOrders = orders || [];
      let filtered = historyOrders;
      if (dateFilter) {
        filtered = historyOrders.filter(o => {
          const d = new Date(o.createdAt);
          if (isNaN(d.getTime())) return false;
          const orderDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
          return orderDate === dateFilter;
        });
      }
      const container = document.getElementById('orderHistoryList');
      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">' + t('noOrders', null, '暂无订单') + '</div>';
        return;
      }
      const statusMap = { pending: t('pending', null, '制作中'), done: t('completed', null, '已完成'), canceled: t('canceled', null, '已取消') };
      container.innerHTML = filtered.map(o => `
        <div onclick="showOrderDetail(${o.id})" style="background:#f8f9fa;border:1px solid #e9ecef;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="font-weight:700;font-size:15px;">${esc(o.order_no || ("#"+o.id))} ${t('table', null, '桌号')} ${esc(o.table) || '-'}</div>
            <span style="background:${o.status === 'done' ? '#27ae60' : o.status === 'canceled' ? '#95a5a6' : '#f39c12'};color:#fff;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;">${statusMap[o.status] || o.status}</span>
          </div>
          <div style="color:#666;font-size:13px;">${SLF.utils.formatDateTime(o.createdAt)}</div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;">
            <span style="color:#888;font-size:13px;">${(o.items || []).length} ${t('dishes', null, '道菜品')}</span>
            <span style="font-weight:700;color:#e74c3c;">${formatPrimary(o.total)}</span>
          </div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('orderHistoryList').innerHTML = '<div style="text-align:center;padding:20px;color:#e74c3c;">' + e.message + '</div>';
    }
  }

  function showOrderDetail(id) {
    const order = historyOrders.find(o => o.id === id);
    if (!order) return;
    const modal = document.getElementById('orderDetailModal');
    const content = document.getElementById('orderDetailContent');
    document.getElementById('orderDetailTitle').textContent = t('order', null, '订单') + ' #' + id;
    const statusMap = { pending: t('pending', null, '制作中'), done: t('completed', null, '已完成'), canceled: t('canceled', null, '已取消') };
    content.innerHTML = `
      <div style="margin-bottom:15px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:#666;">${t('table', null, '桌号')}</span><span style="font-weight:600;">${esc(order.table) || '-'}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:#666;">${t('status', null, '状态')}</span><span style="font-weight:600;">${statusMap[order.status] || order.status}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:#666;">${t('orderTime', null, '下单时间')}</span><span>${SLF.utils.formatDateTime(order.createdAt)}</span></div>
        ${order.note ? `<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:#666;">${t('note', null, '备注')}</span><span>${esc(order.note)}</span></div>` : ''}
      </div>
      <div style="border-top:1px solid #eee;padding-top:12px;margin-bottom:12px;">
        <div style="font-weight:700;margin-bottom:10px;">${t('dishes', null, '菜品')}</div>
        ${(order.items || []).map((item) => `
          <div class="order-detail-item">
            <span class="dish-name">${esc(item.emoji) || '🍽️'} ${esc(item.name)} x${item.quantity}</span>
            <span class="item-price">${formatPrimary((Number(item.price) || 0) * item.quantity)}</span>
          </div>
        `).join('')}
      </div>
      <div style="border-top:2px solid #333;padding-top:12px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;">
        <span>${t('total', null, '合计')}</span>
        <span style="color:#e74c3c;">${formatPrimary(order.total)}</span>
      </div>
    `;
    modal.style.display = 'flex';
  }
  function hideOrderDetail() {
    document.getElementById('orderDetailModal').style.display = 'none';
  }

  // 自动刷新
  let waiterAutoRefreshTimer = null;
  function startWaiterAutoRefresh(intervalSec) {
    stopWaiterAutoRefresh();
    const secs = Math.max(3, parseInt(intervalSec, 10) || 8);
    waiterAutoRefreshTimer = setInterval(() => { if (state.token && !document.hidden) load(); }, secs * 1000);
  }
  function stopWaiterAutoRefresh() {
    if (waiterAutoRefreshTimer) clearInterval(waiterAutoRefreshTimer);
    waiterAutoRefreshTimer = null;
  }

  // 转移桌号
  let transferFromTable = null;
  window.showTransferModal = function(tableName) {
    transferFromTable = tableName;
    const active = state.orders.filter(o => o.table === tableName && o.status === 'pending');
    if (!active.length) { toast(t('noPending', null, '暂无未结算订单')); return; }
    document.getElementById('transferTitle').textContent = '↔ ' + t('transferOrder', null, '转移');
    document.getElementById('transferToLabel').textContent = t('transferTo', null, '转移到');
    document.getElementById('transferCancelBtn').textContent = t('cancel', null, '取消');
    document.getElementById('transferConfirmBtn').textContent = t('confirm', null, '确定');
    document.getElementById('transferFromLabel').textContent = t('transferFrom', null, '当前桌') + ': ' + tableName + ' (' + active.length + ' ' + t('order', null, '订单') + ')';
    const select = document.getElementById('transferTargetSelect');
    const others = state.tables.filter(x => x.name !== tableName);
    select.innerHTML = others.map(x => '<option value="' + esc(x.name) + '">' + esc(x.name) + '</option>').join('');
    document.getElementById('transferModal').classList.add('open');
  };
  window.closeTransferModal = function() {
    document.getElementById('transferModal').classList.remove('open');
    transferFromTable = null;
  };
  window.confirmTransfer = async function() {
    if (!transferFromTable) return;
    const target = document.getElementById('transferTargetSelect').value;
    const orderIds = state.orders.filter(o => o.table === transferFromTable && o.status === 'pending').map(o => o.id);
    showConfirm(t('transferConfirmMsg', null, '确认转移') + ' ' + transferFromTable + ' → ' + target, async function() {
      try {
        for (const id of orderIds) {
          const res = await api('/orders/' + id + '/transfer', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ target_table: target }) });
          if (res && res.targetHasOrders) toast('⚠️ ' + t('targetHasOrders', null, '目标桌已有订单'));
        }
        toast('✅ ' + t('transferSuccess', null, '转移成功'));
        closeTransferModal();
        await load();
      } catch(e) { toast('❌ ' + e.message); }
    });
  };

  function renderTables() {
    $('#tableGrid').innerHTML = state.tables.map(table => {
      const hasActiveOrder = state.orders.some(o => o.table === table.name && o.status === 'pending');
      const statusClass = hasActiveOrder ? 'occupied' : 'available';
      const statusText = hasActiveOrder ? t('occupied', null, '已占') : t('available', null, '空闲');
      const transferBtn = hasActiveOrder ? `<div style="position:absolute;top:14px;right:14px;"><button data-table='${esc(table.name)}' class='transfer-btn' style="width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid rgba(232,74,42,0.4);color:var(--primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:10;transition:all 0.2s;" title="${t('transferOrder', null, '转移')}">↔</button></div>` : '';
      return `<div class="table-card" onclick="openModal('${esc(table.name)}')">${transferBtn}<div class="name">🍽️ ${esc(table.name)} <span class="status ${statusClass}">${statusText}</span></div><div class="bill">${bill(table)}</div></div>`;
    }).join('') || `<div style="color:#c8c8d0">${t('noTables', null, '暂无桌号')}</div>`;
    $('#submitBtn').style.display = state.waiter && state.waiter.can_order ? 'block' : 'none';
    document.querySelectorAll('.transfer-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        window.showTransferModal(this.dataset.table);
      });
    });
  }

  function openModal(table) {
    state.currentTable = table;
    const tableOrders = state.orders.filter(o => o.table === table && o.status === 'pending');
    if (tableOrders.length > 1) {
      showOrderSelect(tableOrders);
      return;
    }
    openOrderEditor(table, tableOrders[0] || null);
  }

  function openOrderEditor(table, order) {
    state.currentTable = table;
    state.cart = {};
    state.cartMeta = {};
    state.lockedItems = [];
    state.currentCategory = 'all';
    if (order && order.items && order.items.length) {
      state.lockedItems = order.items.filter(i => i.itemStatus === 'done' || i.status === 'done' || i.completed === true);
      order.items.filter(i => !(i.itemStatus === 'done' || i.status === 'done' || i.completed === true)).forEach(i => {
        const menuItem = state.menu.find(m => (m.id == i.id || m.id === +i.id || m.name === i.name));
        const itemId = menuItem ? menuItem.id : (i.id || i.name);
        const qty = i.quantity || i.qty || 1;
        state.cart[itemId] = (state.cart[itemId] || 0) + qty;
        state.cartMeta[itemId] = menuItem || i;
      });
    }
    let tableLabel = t('currentTable', null, '当前桌号') + '：' + table;
    if (order && order.sessionToken) {
      const tableOrders = state.orders.filter(o => o.table === table && o.status === 'pending');
      const labels = buildSessionLabels(tableOrders);
      const customerLabel = labels.get(order.id);
      if (customerLabel) {
        const customerColor = getCustomerColor(customerLabel);
        tableLabel += ' <span class="session-badge" style="background:' + customerColor.bg + ';color:' + customerColor.color + ';">' + customerLabel + '</span>';
      }
    }
    $('#currentTableBadge').innerHTML = tableLabel;
    $('#submitBtn').textContent = order ? t('saveChanges', null, '保存修改') : t('submitOrder', null, '提交订单');
    renderDishes();
    $('#orderModal').classList.add('open');
  }

  function showOrderSelect(tableOrders) {
    $('#orderSelectTitle').textContent = t('currentTable', null, '当前桌号') + '：' + state.currentTable + ' - ' + t('selectOrder', null, '选择订单');
    const labels = buildSessionLabels(tableOrders);
    const listEl = $('#orderSelectList');
    let html = '';
    tableOrders.forEach((order, idx) => {
      const customerLabel = labels.get(order.id) || (t('order', null, '订单') + (idx + 1));
      const itemCount = order.items ? order.items.length : 0;
      const timeStr = order.createdAt ? new Date(order.createdAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
      html += '<div class="order-select-item" onclick="selectOrder(' + order.id + ')" style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--gray-2);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s;">';
      html += '<div><div style="font-weight:600;font-size:15px;">' + esc(customerLabel) + '</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">' + itemCount + ' ' + t('dishes', null, '道菜品') + ' · ' + timeStr + '</div></div>';
      html += '<div style="font-weight:700;color:var(--primary);">' + formatPrimary(order.total || 0) + '</div>';
      html += '</div>';
    });
    listEl.innerHTML = html;
    $('#orderSelectModal').classList.add('open');
  }

  function selectOrder(orderId) {
    const order = state.orders.find(o => o.id === orderId);
    if (!order) return;
    const t_ = state.currentTable;
    closeOrderSelect();
    openOrderEditor(t_, order);
  }
  function createNewOrderFromSelect() {
    const t_ = state.currentTable;
    closeOrderSelect();
    openOrderEditor(t_, null);
  }
  function closeOrderSelect() {
    $('#orderSelectModal').classList.remove('open');
    state.currentTable = null;
  }

  function closeModal() {
    $('#orderModal').classList.remove('open');
    state.currentTable = null;
    state.cart = {};
    state.cartMeta = {};
    state.editingOrderId = null;
    state.lockedItems = [];
    $('#submitBtn').textContent = t('submitOrder', null, '提交订单');
  }

  function renderSelected() {
    const items = Object.entries(state.cart).filter(([id, q]) => q > 0).map(([id, q]) => {
      let m = state.menu.find(x => (x.id == id || x.id === +id || x.name === id)) || state.cartMeta[id];
      if (!m) m = state.menu.find(x => state.cartMeta[id] && (x.id == state.cartMeta[id].id || x.name === state.cartMeta[id].name));
      return m ? { m, q, id } : null;
    }).filter(Boolean);

    const cartHtml = items.length ? items.map(x => {
      const prices = getMenuPrices(x.m);
      let priceDisplay = prices.primary;
      if (prices.secondary) priceDisplay += ' (' + prices.secondary + ')';
      const statusLabel = '<span class="item-status new">' + t('newItem', null, '新下单') + '</span>';
      const itemId = x.m.id || x.id;
      return '<div class="selected-item"><span class="sel-name">' + esc(x.m.name) + ' ' + statusLabel + '</span><span class="sel-price">' + priceDisplay + '</span><div class="qty"><button onclick="changeQty(' + itemId + ',-1)">−</button><span>' + x.q + '</span><button onclick="changeQty(' + itemId + ',1)">+</button></div><button class="remove-btn" onclick="removeItem(' + itemId + ')">' + t('remove', null, '移除') + '</button></div>';
    }).join('') : '';

    let doneHtml = '';
    if (state.lockedItems.length) {
      doneHtml = state.lockedItems.map(i => {
        const prices = getMenuPrices(i);
        let priceDisplay = prices.primary;
        if (prices.secondary) priceDisplay += ' (' + prices.secondary + ')';
        return '<div class="selected-item" style="opacity:.55;pointer-events:none;"><span class="sel-name">' + esc(i.name) + ' <span class="item-status done">' + t('dishServed', null, '已上菜') + '</span></span><span class="sel-price">' + priceDisplay + '</span><div class="qty"><span>×' + (i.quantity || 1) + '</span></div></div>';
      }).join('');
    }
    const emptyHtml = (!items.length && !state.lockedItems.length) ? '<div style="color:#c8c8d0">' + t('emptySelected', null, '尚未选择菜品') + '</div>' : '';
    $('#selectedItems').innerHTML = '<div class="title">' + t('selectedDishes', null, '已选菜品') + '</div>' + cartHtml + doneHtml + emptyHtml;
  }

  function transCategory(cat) {
      const lang = SLF.i18n.lang;
      // 1. 优先查 SLF.i18n.dicts[lang]
      const localDict = (SLF.i18n.dicts[lang] && SLF.i18n.dicts[lang].categories) || {};
      if (localDict[cat]) return localDict[cat];
      // 2. 兜底查 window.LANGUAGES[lang]
      const globalDict = (window.LANGUAGES && window.LANGUAGES[lang] && window.LANGUAGES[lang].categories) || {};
      return globalDict[cat] || cat;
  }

  function renderCategories() {
    const categories = ['all', ...new Set(state.menu.map(m => m.category).filter(Boolean))];
    const catHtml = categories.map(cat => {
      const label = cat === 'all' ? t('allCategories', null, '全部') : transCategory(cat);
      const active = state.currentCategory === cat ? 'active' : '';
      return `<button class="cat-btn ${active}" onclick="setDishCategory('${esc(cat)}')">${esc(label)}</button>`;
    }).join('');
    $('#dishCategories').innerHTML = catHtml;
  }

  function setDishCategory(cat) {
    state.currentCategory = cat;
    renderDishes();
  }

  function renderDishes() {
    renderCategories();
    let sortedMenu = [...state.menu].sort((a, b) => (Number(b.sales_count) || 0) - (Number(a.sales_count) || 0));
    if (state.currentCategory !== 'all') {
      sortedMenu = sortedMenu.filter(m => m.category === state.currentCategory);
    }
    $('#dishList').innerHTML = sortedMenu.map(m => {
      const cartQty = state.cart[m.id] || 0;
      const prices = getMenuPrices(m);
      let priceDisplay = prices.primary;
      if (prices.secondary) priceDisplay += ` <span class="price-secondary">(${prices.secondary})</span>`;
      const qtyHtml = `<button onclick="changeQty(${m.id},-1)">−</button><span>${cartQty}</span><button onclick="changeQty(${m.id},1)">+</button>`;
      return `<div class="dish-item"><div class="dish-thumb">${m.image ? `<img src="/uploads/${esc(m.image)}" alt="${esc(m.name)}">` : esc(m.emoji) || '🍽️'}</div><div class="info"><div class="name">${esc(m.name)}</div><div class="price">${priceDisplay}/${esc(m.unit) || t('unit', null, '份')}</div></div><div class="qty">${qtyHtml}</div></div>`;
    }).join('');
    renderSelected();
    updateTotal();
  }

  function changeQty(id, delta) {
    state.cart[id] = (state.cart[id] || 0) + delta;
    if (state.cart[id] <= 0) delete state.cart[id];
    renderDishes();
  }

  function removeItem(id) {
    delete state.cart[id];
    delete state.cartMeta[id];
    renderDishes();
  }

  function updateTotal() {
    let totalBase = 0;
    for (const [id, q] of Object.entries(state.cart)) {
      const m = state.menu.find(x => x.id === +id) || state.cartMeta[id];
      if (m) totalBase += toBaseCurrency(m.price, m.currency_code) * q;
    }
    for (const i of state.lockedItems) {
      totalBase += toBaseCurrency(i.price, i.currency_code) * i.quantity;
    }
    $('#orderTotal').textContent = formatMoney(totalBase);
  }

  $('#submitBtn').onclick = async function () {
    if (!state.currentTable) { toast(t('noTables', null, '暂无桌号')); return; }
    showConfirm(t('confirmSubmit', null, '确认提交此订单？'), async function () {
      const cartItems = Object.entries(state.cart).filter(([id, q]) => q > 0).map(([id, q]) => {
        const m = state.menu.find(x => x.id === +id);
        return { id: m.id, name: m.name, price: m.price, quantity: q, emoji: m.emoji, itemStatus: 'pending', show_dual: m.show_dual || 0, secondary_currency_code: m.secondary_currency_code || '', unit: m.unit || t('unit', null, '份') };
      });
      const lockedItems = state.lockedItems.map(i => ({ id: i.id, name: i.name, price: i.price, quantity: i.quantity, emoji: i.emoji, itemStatus: 'done', show_dual: i.show_dual || 0, secondary_currency_code: i.secondary_currency_code || '', unit: i.unit || t('unit', null, '份') }));
      const items = [...lockedItems, ...cartItems];
      if (!items.length) { toast(t('selectDish', null, '请先选择菜品')); return; }
      try {
        if (state.editingOrderId) {
          await api('/orders/' + state.editingOrderId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }) });
          toast('✅ ' + t('orderUpdated', null, '订单已更新'));
        } else {
          const res = await api('/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ table: state.currentTable, items }) });
          toast(`✅ ${state.currentTable} ${t('orderSubmitted', null, '订单已提交')} ${res.orderNo || ("#"+res.orderId)}`);
        }
        closeModal();
        await load();
      } catch (e) { toast('❌ ' + e.message); }
    });
  };

  async function setLanguage(lang) {
      waiterLang = lang;
      SLF.i18n.lang = lang;
  
      // 确保目标语言的字典已加载到 SLF.i18n.dicts
      if (!SLF.i18n.dicts[lang] && window.LANGUAGES && window.LANGUAGES[lang]) {
          SLF.i18n.dicts[lang] = { ...window.LANGUAGES[lang] };
      }
  
      SLF.store.rawSet('waiterLang', lang);
      SLF.store.rawSet('lang', lang);
      if (state.token) {
          applyWaiterLanguage();
          if (state.menu) renderDishes();
      }
  }

  document.getElementById('waiterLang').addEventListener('change', async function () {
    await setLanguage(this.value);
  });

  const savedLang = SLF.store.rawGet('waiterLang') || 'zh';
  waiterLang = savedLang;

  function initWaiterPage() {
    try {
      if (state.token) {
        document.getElementById('mainHeader').style.display = 'flex';
        document.getElementById('mainContent').style.display = 'block';
        applyWaiterLanguage();
        load().then(() => { startCallPolling(); }).catch((e) => {
          if (e && e.message && e.message.includes('登录已过期')) {
            logoutWaiter();
          } else {
            console.error('加载失败:', e);
            toast(t('loadFailed', null, '加载失败'));
          }
        });
      } else {
        window.location.href = '/login?type=waiter';
      }
    } catch (e) {
      console.error('服务员端初始化错误:', e);
      window.location.href = '/login?type=waiter';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initWaiterPage);
  } else {
    initWaiterPage();
  }

  // Socket（传 waiterToken）
  if (typeof io === 'function') {
    const waiterSocket = io({
      query: {
        storeId: SLF.store.rawGet('storeId') || 1,
        token: SLF.store.rawGet('waiterToken') || ''
      }
    });
    let socketDebounce = null;
    function debouncedLoad() {
      clearTimeout(socketDebounce);
      socketDebounce = setTimeout(() => { if (typeof load === 'function') load(); }, 300);
    }
    waiterSocket.on('order:new', debouncedLoad);
    waiterSocket.on('item:updated', debouncedLoad);
    waiterSocket.on('order:settled', debouncedLoad);
    waiterSocket.on('order:transfer', debouncedLoad);
    waiterSocket.on('connect_error', (err) => { console.warn('waiterSocket connect_error:', err.message); });
    window.addEventListener('beforeunload', () => {
      try { waiterSocket.disconnect(); } catch (_) {}
    });
  }
</script>
</body>
</html>
