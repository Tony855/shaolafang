<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title data-i18n="loginTitle">服务员点餐</title>
<script>
    // 同步判断登录态，避免刷新时登录窗口闪现
    if (localStorage.getItem('waiterToken')) {
        document.documentElement.setAttribute('data-waiter-session', '1');
    }
</script>
<link rel="stylesheet" href="assets/waiter.css?v=1791135535">
<link rel="stylesheet" href="assets/common.css?v=1791135535">
</head>
<body>

<header id="mainHeader" style="display:none;">
  <div class="header-title" id="waiterTitle">🍴 FoodFlow</div>
  <div class="header-left">
    <span class="store-name" id="storeNameDisplay" style="display:none;"></span>
    <span class="waiter-name" id="waiterNameDisplay"></span>
  </div>
  <div class="header-right">
    <button class="call-notification-btn icon-btn" id="callNotificationBtn" onclick="showCallNotifications()" style="display:none;" title="呼叫通知" data-i18n-title="callWaiter">
      🔔 <span id="callNotificationCount">0</span>
    </button>
    <button class="header-btn icon-btn" onclick="showOrderHistory()" id="orderHistoryBtn" title="订单历史" data-i18n-title="orderHistory">📋</button>
    <div class="lang-btn-wrap">
      <span class="lang-icon">🌐</span>
      <select id="waiterLang">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇬🇧 English</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="th">🇹🇭 ภาษาไทย</option>
        <option value="km">🇰🇭 ភាសាម្មេរ</option>
      </select>
    </div>
    <button class="header-btn exit-fs-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="全屏" data-i18n-title="fullscreen">⛶</button>
    <button class="header-btn icon-btn logout-btn" id="logoutBtn" title="退出登录" data-i18n-title="logout">🚪</button>
  </div>
</header>

<main id="mainContent" style="display:none;">
  <div class="table-toolbar">
    <input type="text" id="tableSearchInput" class="table-search" 
           placeholder="🔍 搜索桌号（如 B08）" data-i18n-placeholder="searchTablePlaceholder" 
           autocomplete="off">
    <div class="table-filter-tabs">
      <button class="filter-tab active" data-filter="all" data-i18n="all">全部</button>
      <button class="filter-tab" data-filter="occupied" data-i18n="occupied">已占</button>
      <button class="filter-tab" data-filter="available" data-i18n="available">空闲</button>
    </div>
  </div>
  <div class="table-grid" id="tableGrid"></div>
</main>

<!-- 订单历史模态框 -->
<div class="modal" id="orderHistoryModal">
  <div class="modal-card" style="max-width:700px;max-height:85vh;">
    <div class="modal-head">
      <h2 id="orderHistoryTitle" data-i18n="orderHistory">📋 订单历史</h2>
      <button class="close" onclick="hideOrderHistory()">✕</button>
    </div>
    <div class="modal-body scroll-hide" style="flex:1;min-height:0;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;">
      <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
        <select id="historyStatusFilter" onchange="loadOrderHistory()" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;">
          <option value="" data-i18n="allStatus">全部状态</option>
          <option value="pending" data-i18n="pending">制作中</option>
          <option value="done" data-i18n="completed">已完成</option>
          <option value="canceled" data-i18n="canceled">已取消</option>
        </select>
        <input type="date" id="historyDateFilter" onchange="loadOrderHistory()" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;">
      </div>
      <div id="orderHistoryList"></div>
    </div>
  </div>
</div>

<!-- 订单详情模态框 -->
<div class="modal" id="orderDetailModal">
  <div class="modal-card" style="max-width:500px;max-height:85vh;">
    <div class="modal-head">
      <h2 id="orderDetailTitle" data-i18n="orderDetail">订单详情</h2>
      <button class="close" onclick="hideOrderDetail()">✕</button>
    </div>
    <div class="modal-body scroll-hide" id="orderDetailContent" style="flex:1;min-height:0;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;"></div>
  </div>
</div>

<!-- 点餐模态框 -->
<div class="modal" id="orderModal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="current-table" id="currentTableBadge"><span data-i18n="currentTable">当前桌号</span>：</div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="selected-items" id="selectedItems"></div>
    <div class="dish-categories" id="dishCategories"></div>
    <div class="dish-list" id="dishList"></div>
    <div class="footer">
      <span class="total" id="orderTotal">¥0.00</span>
      <div style="display:flex;gap:10px;">
        <button class="settle-btn" onclick="handleSettleFromEditor()" id="settleBtn" data-i18n="settleOrder" style="display:none;background:linear-gradient(135deg,#27ae60,#2ecc71)!important;border:0!important;color:#fff!important;padding:10px 22px!important;border-radius:30px!important;font-weight:600!important;font-size:15px!important;cursor:pointer!important;box-shadow:0 4px 12px rgba(46,204,113,.25);transition:all .2s;">结算</button>
        <button class="submit-btn" id="submitBtn" data-i18n="submitOrder">提交订单</button>
      </div>
    </div>
  </div>
</div>

<!-- 转移桌号模态框 -->
<div class="modal" id="transferModal">
  <div class="modal-card" style="max-width:400px;">
    <div class="modal-head">
      <h2 id="transferTitle">↔</h2>
      <button class="close" onclick="closeTransferModal()">✕</button>
    </div>
    <div style="padding:10px 0;">
      <div style="margin-bottom:10px;font-weight:600;" id="transferFromLabel"></div>
      <label style="display:block;font-size:13px;color:#666;margin-bottom:6px;" id="transferToLabel"></label>
      <select id="transferTargetSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:14px;"></select>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="confirm-cancel" onclick="closeTransferModal()" id="transferCancelBtn" style="flex:1;padding:10px;border:0;border-radius:8px;"></button>
      <button class="confirm-ok" onclick="confirmTransfer()" id="transferConfirmBtn" style="flex:1;padding:10px;border:0;border-radius:8px;background:var(--primary);color:#fff;"></button>
    </div>
  </div>
</div>

<!-- 确认模态框 -->
<div class="modal confirm-modal" id="confirmModal">
  <div class="modal-card confirm-card">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title" id="confirmTitle" data-i18n="confirmTitle">确认操作</div>
    <div class="confirm-message" id="confirmMessage" data-i18n="confirmMessage">确定要执行此操作吗？</div>
    <input type="number" id="confirmInput" min="1" value="1" style="display:none;width:100%;padding:10px;margin:10px 0;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:16px;box-sizing:border-box;">
    <div class="confirm-buttons">
      <button class="confirm-cancel" id="confirmCancelBtn" data-i18n="cancel">取消</button>
      <button class="confirm-ok" id="confirmOkBtn" data-i18n="confirm">确定</button>
    </div>
  </div>
</div>

<!-- 收款弹窗（与收银台一致） -->
<div class="modal-overlay" id="paymentModal">
  <div class="payment-card">
    <button class="modal-close" onclick="closePaymentModal()">✕</button>
    <h2 class="payment-title" id="paymentTitle" data-i18n="settleOrder">收款</h2>
    <div class="payment-amount">
      <div class="payment-amount-label" data-i18n="receivableAmount">应收金额</div>
      <div class="payment-amount-value" id="paymentAmount">$0.00</div>
    </div>

    <div class="payment-methods" id="paymentMethodsWrap">
      <button class="payment-method active" data-method="cash" onclick="selectPayMethod('cash')">
        <span class="pm-icon">💵</span>
        <span class="pm-label" data-i18n="cashPay">现金</span>
      </button>
      <button class="payment-method" data-method="wechat" onclick="selectPayMethod('wechat')">
        <span class="pm-icon">💚</span>
        <span class="pm-label" data-i18n="wechatPay">微信</span>
      </button>
      <button class="payment-method" data-method="alipay" onclick="selectPayMethod('alipay')">
        <span class="pm-icon">💙</span>
        <span class="pm-label" data-i18n="alipayPay">支付宝</span>
      </button>
      <button class="payment-method" data-method="card" onclick="selectPayMethod('card')">
        <span class="pm-icon">💳</span>
        <span class="pm-label" data-i18n="cardPay">刷卡</span>
      </button>
      <button class="payment-method" data-method="aba" onclick="selectPayMethod('aba')">
        <span class="pm-icon pm-icon-aba"><img src="assets/vendor/payment-icons/aba.png" alt="ABA"></span>
        <span class="pm-label">ABA</span>
      </button>
    </div>

    <div class="payment-cash-area" id="cashArea">
      <div class="payment-input-row">
        <label data-i18n="actualReceived">实收</label>
        <input type="number" id="cashReceived" class="payment-input"
               placeholder="0.00" step="0.01" min="0"
               oninput="onCashInput()">
      </div>
      <div class="payment-change-row">
        <span data-i18n="changeAmount">找零</span>
        <span class="payment-change-value" id="cashChange">$0.00</span>
      </div>
      <div class="payment-quick-cash" id="quickCash"></div>
    </div>

    <div class="payment-actions">
      <button class="btn btn-secondary" onclick="closePaymentModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" id="confirmPayBtn" onclick="confirmPay()" data-i18n="confirmPay">确认收款</button>
    </div>
  </div>
</div>

<!-- KHQR 动态收款弹窗（与收银台一致） -->
<div class="modal-overlay" id="khqrModal">
  <div class="payment-card" style="max-width:460px;text-align:center;">
    <button class="modal-close" onclick="closeKhqrModal()">✕</button>
    <h2 class="payment-title">💳 <span data-i18n="khqrTitle">扫码收款</span></h2>

    <div class="payment-amount" style="padding:8px 0 16px;">
      <div class="payment-amount-label" data-i18n="receivableAmount">应收金额</div>
      <div class="payment-amount-value" id="khqrAmount">$0.00</div>
    </div>

    <div style="background:#fff;padding:14px;border-radius:14px;display:inline-block;box-shadow:0 4px 16px rgba(0,0,0,.08);max-width:100%;box-sizing:border-box;">
      <img id="khqrImage" src="" alt="KHQR" class="khqr-image">
    </div>

    <div style="margin-top:14px;color:#888;font-size:13px;">
      <div><span data-i18n="khqrMerchant">收款人：</span><strong id="khqrMerchant" style="color:#333;"></strong></div>
      <div style="margin-top:4px;font-family:'SF Mono',monospace;font-size:12px;color:#999;"><span id="khqrOrderNo"></span></div>
    </div>

    <div style="margin-top:16px;font-size:14px;color:#666;">
      <span data-i18n="khqrCountdown">二维码有效期：</span>
      <span id="khqrCountdown" style="font-family:'SF Mono',monospace;font-weight:700;color:#e85d3a;font-size:16px;">10:00</span>
    </div>

    <div id="khqrStatusBar" style="margin-top:14px;padding:10px 14px;border-radius:10px;background:#f0f4ff;color:#5a6acf;font-size:13px;">
      <span data-i18n="khqrWaiting">等待客户扫码付款...</span>
    </div>

    <div class="payment-actions" style="margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeKhqrModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" id="khqrConfirmBtn" onclick="confirmKhqrReceived()" data-i18n="khqrReceived">✅ 已收到款</button>
    </div>
  </div>
</div>

<!-- 结算确认弹窗（展示订单详情） -->
<div class="modal confirm-modal" id="settleConfirmModal">
  <div class="modal-card" style="max-width:520px;">
    <div class="modal-head">
      <h2 id="settleConfirmTitle" data-i18n="settleOrder">💰 结算订单</h2>
      <button class="close" onclick="closeSettleConfirm()">✕</button>
    </div>
    <div id="settleConfirmBody" style="max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 0;"></div>
    <div style="padding:12px 0;border-top:1px solid #f0f0f0;">
      <div style="color:#666;font-size:13px;margin-bottom:8px;font-weight:600;" data-i18n="payMethod">收款方式</div>
      <div class="pay-methods" id="settlePayMethods">
        <button type="button" class="pay-method-btn active" data-method="cash" onclick="selectSettlePayMethod('cash')">💵 <span data-i18n="cashPay">现金</span></button>
        <button type="button" class="pay-method-btn" data-method="aba" onclick="selectSettlePayMethod('aba')">📱 <span data-i18n="khqrPay">扫码</span></button>
        <button type="button" class="pay-method-btn" data-method="wechat" onclick="selectSettlePayMethod('wechat')">💚 <span data-i18n="wechatPay">微信</span></button>
        <button type="button" class="pay-method-btn" data-method="alipay" onclick="selectSettlePayMethod('alipay')">💙 <span data-i18n="alipayPay">支付宝</span></button>
        <button type="button" class="pay-method-btn" data-method="card" onclick="selectSettlePayMethod('card')">💳 <span data-i18n="cardPay">刷卡</span></button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0;">
      <button class="confirm-cancel" style="flex:1;padding:10px;border:0;border-radius:10px;background:#f0f0f5;color:#666;font-size:15px;font-weight:600;cursor:pointer;" onclick="closeSettleConfirm()" data-i18n="cancel">取消</button>
      <button class="confirm-ok" style="flex:1;padding:10px;border:0;border-radius:10px;background:linear-gradient(135deg,#e85d3a,#e84a2a);color:#fff;font-size:15px;font-weight:600;cursor:pointer;" onclick="confirmSettleFromEditor()" data-i18n="settleNow">确认结算</button>
    </div>
  </div>
</div>

<!-- 订单选择模态框 -->
<div class="modal" id="orderSelectModal">
  <div class="modal-card" style="max-width:400px;">
    <div class="modal-head">
      <div class="current-table" id="orderSelectTitle" data-i18n="selectOrder">选择订单</div>
      <button class="close" onclick="closeOrderSelect()">✕</button>
    </div>
    <div id="orderSelectList" style="max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;"></div>
  </div>
</div>

<script src="languages.min.js?v=1791135535"></script>
<script src="assets/core.js?v=1791135535"></script>
<script src="assets/modules/ui.js?v=1791135535"></script>
  <script src="assets/modules/money.js?v=1791135535"></script>
  <script src="assets/modules/order-status.js?v=1791135535"></script>
  <script src="assets/modules/customer-group.js?v=1791135535"></script>
  <script src="assets/modules/role.js?v=1791135535"></script>
  <script src="assets/modules/idle.js?v=1791135535"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="pages/waiter.js?v=1791135535"></script>
<script src="pages/waiter-payment.js?v=1791135535"></script>
</body>
</html>
