<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5">
<title>Kitchen Display</title>
<link rel="stylesheet" href="assets/common.css">
<style>
  :root {
    --bg: #14151f;
    --panel: #1c1e2b;
    --panel-2: #232538;
    --border: rgba(255,255,255,.08);
    --text: #f0f1f5;
    --text-dim: #9598ab;
    --primary: #ff7a45;
    --primary-2: #ffb020;
    --ok: #2ecc71;
    --warn: #ffb020;
    --danger: #ff5f5f;
    --radius: 16px;
  }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(255,122,69,.10), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(120,110,255,.10), transparent 40%), var(--bg);
    color: var(--text);
    font: 15px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  }
  /* 登录界面 */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box {
    width: 100%; max-width: 420px; padding: 34px;
    border: 1px solid var(--border); border-radius: 24px;
    background: linear-gradient(165deg, var(--panel-2), var(--panel));
    box-shadow: 0 26px 60px rgba(0,0,0,.4); text-align: center;
  }
  .login-box h1 { margin: 0 0 6px; font-size: 22px; }
  .login-box .desc { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  .login-box input {
    width: 100%; height: 48px; margin-bottom: 12px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: #20223a; color: #fff; font-size: 15px; outline: none;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, #ff8a5c, var(--primary));
    color: #fff; font-weight: 800; font-size: 16px; cursor: pointer;
  }
  .login-box .error { min-height: 20px; margin-top: 12px; color: #ff9c9c; font-size: 13px; }
  .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .lang-bar select {
    height: 34px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  }
  .lang-bar select option { background: #2d2d44; color: #fff; }
  /* 主显示界面 */
  .kitchen-app { display: none; min-height: 100vh; flex-direction: column; }
  .kitchen-app.show { display: flex; }
  .login-wrap.hide { display: none; }
  .top-bar {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: rgba(0,0,0,.2); flex-wrap: wrap;
  }
  .top-bar h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .top-bar .spacer { flex: 1; }
  .top-bar .status-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--ok);
    display: inline-block; margin-right: 6px; box-shadow: 0 0 8px var(--ok);
  }
  .top-bar .status-dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .top-bar .count-badge {
    background: var(--primary); color: #fff; border-radius: 999px;
    padding: 4px 14px; font-weight: 700; font-size: 14px;
  }
  .top-bar .updated { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .top-bar button, .top-bar select {
    height: 36px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.06);
    color: var(--text); font-size: 13px; cursor: pointer;
  }
  .top-bar button:hover { background: rgba(255,255,255,.12); }
  .top-bar select option { background: #2d2d44; color: #fff; }
  .ticket-grid {
    flex: 1; padding: 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px; align-content: start;
  }
  .empty-state { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text-dim); font-size: 18px; }
  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--primary);
  }
  .ticket.warn { border-left-color: var(--warn); }
  .ticket.danger { border-left-color: var(--danger); animation: pulseBorder 1.6s infinite; }
  .ticket.ready { border-left-color: var(--ok); }
  @keyframes pulseBorder {
    0%,100% { box-shadow: 0 0 0 rgba(255,95,95,0); }
    50% { box-shadow: 0 0 0 4px rgba(255,95,95,.15); }
  }
  .ticket-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ticket-head .table-name { font-size: 22px; font-weight: 800; }
  .ticket-head .order-id {
    font-size: 26px; font-weight: 900; letter-spacing: .3px;
    padding: 6px 16px; border-radius: 10px; background: rgba(255,255,255,.1);
    color: var(--text); white-space: nowrap;
  }
  .ticket-head .order-id.warn { background: rgba(255,176,32,.18); color: var(--warn); }
  .ticket-head .order-id.danger { background: rgba(255,95,95,.18); color: var(--danger); }
  .ticket-head .order-id.ready { background: rgba(46,204,113,.18); color: var(--ok); }
  .ticket-time { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .ticket-time.warn { color: var(--warn); }
  .ticket-time.danger { color: var(--danger); font-weight: 700; }
  .ticket-note {
    background: rgba(255,176,32,.14); color: var(--primary-2);
    border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.5;
  }
  .ticket-items { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 10px; background: rgba(255,255,255,.04);
  }
  .item-row.done { opacity: .45; }
  .item-row .qty { font-size: 20px; font-weight: 800; color: var(--primary-2); min-width: 34px; text-align: center; }
  .item-row .emoji { font-size: 22px; }
  .item-row .name { flex: 1; font-size: 18px; font-weight: 600; }
  .item-row .unit { color: var(--text-dim); font-size: 13px; }
  .item-row .done-badge { color: var(--ok); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .item-row button.mark-btn {
    border: 0; border-radius: 8px; background: var(--primary); color: #fff;
    font-size: 13px; font-weight: 700; padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  .item-row button.mark-btn:hover { filter: brightness(1.1); }
  .ticket-ready-tag {
    align-self: flex-start; background: rgba(46,204,113,.16); color: var(--ok);
    font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  .ticket-actions {
    display: flex; gap: 8px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .ticket-actions button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s;
  }
  .ticket-actions button:hover { opacity: .85; }
  .print-btn { background: rgba(52,152,219,.2); color: #5dade2; }
  .complete-btn { background: rgba(46,204,113,.2); color: var(--ok); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 20px;
    border-radius: 10px; font-size: 14px; z-index: 999; opacity: 0;
    pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
  @media (max-width:520px) {
    .ticket-grid { grid-template-columns: 1fr; padding: 12px; }
    .top-bar { padding: 10px 12px; }
    .top-bar h1 { font-size: 17px; }
  }

  /* ===== 确认模态框 ===== */
  .modal{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .modal.open{ display: flex; }
  .modal-card{
    background: #fff;
    border-radius: 16px;
    max-width: 920px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 24px;
  }
  .confirm-modal .confirm-card{
    max-width: 380px;
    padding: 32px 28px 28px;
    text-align: center;
    border-radius: 20px;
  }
  .confirm-icon{ font-size: 48px; margin-bottom: 16px; }
  .confirm-title{ font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
  .confirm-message{ font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 24px; }
  .confirm-buttons{ display: flex; gap: 12px; justify-content: center; }
  .confirm-cancel, .confirm-ok{
    flex: 1; padding: 12px 24px; border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  }
  .confirm-cancel{ background: #f0f0f5; color: #666; }
  .confirm-cancel:hover{ background: #e4e4ec; }
  .confirm-ok{ background: linear-gradient(135deg, #e85d3a, #e84a2a); color: #fff; }
  .confirm-ok:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232,93,58,0.3); }
</style>
</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <div class="lang-bar">
        <select id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ภาษาไทย</option>
          <option value="km">ភាសាខ្មែរ</option>
        </select>
      </div>
      <h1 id="loginTitle">后厨登录</h1>
      <p class="desc" id="loginDesc">请使用服务员账号登录后厨显示屏</p>
      <input id="username" type="text" autocomplete="username">
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn">登录</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <div class="kitchen-app" id="kitchenApp">
    <div class="top-bar">
      <h1>🍳 <span id="pageTitle">后厨订单显示</span></h1>
      <span class="count-badge" id="countBadge">0</span>
      <div class="spacer"></div>
      <span class="updated"><span class="status-dot" id="statusDot"></span><span id="updatedLabel">更新于</span> <span id="updatedTime">--:--:--</span></span>
      <select id="langSelectMain">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ภาษาไทย</option>
        <option value="km">ភាសាខ្មែរ</option>
      </select>
      <button id="fullscreenBtn">⛶ <span id="fullscreenLabel">全屏</span></button>
      <button id="logoutBtn">🚪 <span id="logoutLabel">退出登录</span></button>
    </div>
    <div class="ticket-grid" id="ticketGrid">
      <div class="empty-state" id="emptyState">暂无待处理订单</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ===== 确认模态框 ===== -->
  <div class="modal confirm-modal" id="confirmModal">
    <div class="modal-card confirm-card">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
      <div class="confirm-buttons">
        <button class="confirm-cancel" id="confirmCancelBtn">取消</button>
        <button class="confirm-ok" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>

  <script src="languages.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    let lang = localStorage.getItem('kitchenLang') || 'zh';
    SLF.i18n.init(lang);
    const kt = k => SLF.i18n.t(k);

    let token = localStorage.getItem('kitchenToken') || '';
    let waiter = null;
    let pollTimer = null;
    let clockTimer = null;
    let knownOrderIds = null;
    let soundEnabled = true;

    // 新订单提示音
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }
    function playNewOrderChime() {
      if (!soundEnabled) return;
      unlockAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12, now);
        compressor.knee.setValueAtTime(20, now);
        compressor.ratio.setValueAtTime(8, now);
        compressor.attack.setValueAtTime(0.003, now);
        compressor.release.setValueAtTime(0.15, now);
        compressor.connect(audioCtx.destination);
        [[0, 880], [0.35, 1318.5], [0.70, 880], [1.05, 1318.5], [1.55, 880], [1.90, 1318.5]].forEach(([t, freq]) => {
          [freq, freq * 2].forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = f;
            const peak = i === 0 ? 1.0 : 0.5;
            gain.gain.setValueAtTime(0.0001, now + t);
            gain.gain.exponentialRampToValueAtTime(peak, now + t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.9);
            osc.connect(gain).connect(compressor);
            osc.start(now + t);
            osc.stop(now + t + 0.95);
          });
        });
      } catch (e) {}
    }
    async function loadSoundSetting() {
      try {
        const data = await SLF.api.get('/public/config');
        if (typeof data.newOrderSoundEnabled === 'boolean') soundEnabled = data.newOrderSoundEnabled;
      } catch (e) {}
    }
    function detectNewOrders(orders) {
      const pendingIds = new Set((orders || []).filter(o => o.status === 'pending').map(o => o.id));
      if (knownOrderIds !== null) {
        let hasNew = false;
        for (const id of pendingIds) { if (!knownOrderIds.has(id)) { hasNew = true; break; } }
        if (hasNew) playNewOrderChime();
      }
      knownOrderIds = pendingIds;
    }

    function showToast(msg, ms = 2200) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), ms);
    }

    async function api(path, opt = {}) {
      const headers = new Headers(opt.headers || {});
      if (token) headers.set('X-Waiter-Token', token);
      const res = await fetch('/api' + path, { ...opt, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || kt('networkError'));
      return data;
    }

    function applyLoginLanguage() {
      $('#loginTitle').textContent = kt('kitchenLogin');
      $('#loginDesc').textContent = kt('kitchenLoginDesc');
      $('#username').placeholder = kt('username');
      $('#password').placeholder = kt('password');
      $('#loginBtn').textContent = kt('login');
      $('#langSelect').value = lang;
    }

    function applyMainLanguage() {
      $('#pageTitle').textContent = kt('kitchenDisplay');
      $('#updatedLabel').textContent = kt('updatedAt');
      $('#fullscreenLabel').textContent = document.fullscreenElement ? kt('exitFullscreen') : kt('fullscreen');
      $('#logoutLabel').textContent = kt('logout');
      $('#langSelectMain').value = lang;
      $('#emptyState').textContent = kt('noPendingOrders');
    }

    function setLang(next) {
      lang = next;
      localStorage.setItem('kitchenLang', lang);
      SLF.i18n.setLang(lang);
      applyLoginLanguage();
      applyMainLanguage();
      renderTickets(lastOrders);
    }
    $('#langSelect').addEventListener('change', e => setLang(e.target.value));
    $('#langSelectMain').addEventListener('change', e => setLang(e.target.value));

    function timeAgoLabel(createdAt) {
      const mins = Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime()) / 60000));
      if (mins < 1) return { text: kt('justNow'), level: 'ok' };
      const text = `${mins} ${kt('minutesAgo')}`;
      if (mins >= 15) return { text, level: 'danger' };
      if (mins >= 8) return { text, level: 'warn' };
      return { text, level: 'ok' };
    }

    let lastOrders = [];

    function renderTickets(orders) {
      lastOrders = orders || [];
      const grid = $('#ticketGrid');
      const pending = lastOrders
        .filter(o => o.status === 'pending')
        .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

      $('#countBadge').textContent = pending.length;

      if (pending.length === 0) {
        grid.innerHTML = `<div class="empty-state">${kt('noPendingOrders')}</div>`;
        return;
      }

      grid.innerHTML = pending.map(o => {
        const time = timeAgoLabel(o.createdAt);
        const allDone = o.items.length > 0 && o.items.every(it => it.itemStatus === 'done');
        const ticketClass = allDone ? 'ready' : (time.level === 'danger' ? 'danger' : (time.level === 'warn' ? 'warn' : ''));
        const timeClass = time.level === 'danger' ? 'danger' : (time.level === 'warn' ? 'warn' : '');

        const itemsHtml = o.items.map((item, idx) => {
          const isDone = item.itemStatus === 'done';
          const canMark = waiter && waiter.can_mark_item;
          let action = '';
          if (isDone) {
            action = `<span class="done-badge">✓ ${kt('itemDone')}</span>`;
          } else if (canMark) {
            action = `<button class="mark-btn" onclick="markItemDone(${o.id},${idx})">${kt('markDone')}</button>`;
          }
          return `
            <div class="item-row ${isDone ? 'done' : ''}">
              <span class="qty">×${item.quantity}</span>
              <span class="emoji">${SLF.utils.esc(item.emoji || '🍽️')}</span>
              <span class="name">${SLF.utils.esc(item.name)}</span>
              <span class="unit">${SLF.utils.esc(item.unit || '')}</span>
              ${action}
            </div>`;
        }).join('');

        const noteHtml = o.note ? `<div class="ticket-note"><strong>${kt('orderNoteDisplay')}：</strong>${SLF.utils.esc(o.note)}</div>` : '';
        const readyTag = allDone ? `<div class="ticket-ready-tag">✅ ${kt('readyToServe')}</div>` : '';

        return `
          <div class="ticket ${ticketClass}">
            <div class="ticket-head">
              <span class="table-name">🪑 ${SLF.utils.esc(o.table)}</span>
              <span class="order-id ${ticketClass}">#${o.id}</span>
            </div>
            <div class="ticket-time ${timeClass}">🕒 ${time.text}</div>
            ${noteHtml}
            <div class="ticket-items">${itemsHtml}</div>
            ${readyTag}
            <div class="ticket-actions">
              <button class="print-btn" onclick="printKitchenTicket(${o.id})">🖨️ 打印</button>
              ${allDone ? `<button class="complete-btn" onclick="completeOrder(${o.id})">✅ ${kt('completeOrder')}</button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    window.markItemDone = async function(orderId, index) {
      try {
        await api(`/orders/${orderId}/items/${index}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemStatus: 'done' })
        });
        await loadOrders();
      } catch (e) {
        showToast('❌ ' + (e.message || kt('networkError')));
      }
    };

    // 打印后厨小票
    window.printKitchenTicket = async function(orderId) {
      try {
        const data = await api('/orders/' + orderId + '/print-kitchen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        if (data.printed) {
          showToast('✅ ' + kt('kitchenTicketPrinted'));
        } else {
          showToast('⚠️ ' + kt('noPrinterConfigured'));
        }
      } catch (e) {
        showToast('❌ ' + (e.message || kt('printFailed')));
      }
    };

    // 完成订单
    window.completeOrder = async function(orderId) {
      try {
        await api('/orders/' + orderId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'done' })
        });
        showToast('✅ 订单已完成');
        await loadOrders();
      } catch (e) {
        showToast('❌ ' + (e.message || kt('networkError')));
      }
    };

    async function loadOrders() {
      try {
        const data = await api('/waiter/overview');
        waiter = data.waiter;
        detectNewOrders(data.orders || []);
        renderTickets(data.orders || []);
        $('#statusDot').classList.remove('off');
        $('#updatedTime').textContent = new Date().toLocaleTimeString();
      } catch (e) {
        $('#statusDot').classList.add('off');
        if (/请先登录|无操作权限|401/.test(e.message || '')) {
          logout(false);
        } else {
          showToast('❌ ' + (e.message || kt('networkError')));
        }
      }
    }

    function startPolling() {
      stopPolling();
      knownOrderIds = null;
      loadSoundSetting();
      loadOrders();
      pollTimer = setInterval(loadOrders, 4000);
      clockTimer = setInterval(() => { renderTickets(lastOrders); loadSoundSetting(); }, 30000);
    }
    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      if (clockTimer) clearInterval(clockTimer);
      pollTimer = null; clockTimer = null;
    }

    function showKitchenApp() {
      $('#loginWrap').classList.add('hide');
      $('#kitchenApp').classList.add('show');
      applyMainLanguage();
      startPolling();
    }

    function showLoginScreen() {
      $('#kitchenApp').classList.remove('show');
      $('#loginWrap').classList.remove('hide');
      applyLoginLanguage();
      stopPolling();
    }

    async function doLogin() {
      unlockAudio();
      const username = $('#username').value.trim();
      const password = $('#password').value.trim();
      if (!username || !password) { $('#loginError').textContent = kt('pleaseLogin'); return; }
      try {
        const data = await SLF.api.post('/waiter/login', { username, password });
        token = data.token;
        waiter = data.waiter;
        localStorage.setItem('kitchenToken', token);
        $('#loginError').textContent = '';
        showKitchenApp();
      } catch (e) {
        $('#loginError').textContent = e.message || kt('loginError');
      }
    }
    $('#loginBtn').addEventListener('click', doLogin);
    $('#password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    $('#username').addEventListener('keydown', e => { if (e.key === 'Enter') $('#password').focus(); });

    let confirmCallback=null;
    function showConfirm(message,callback,title){
      $('#confirmTitle').textContent=title||kt('confirmTitle')||'确认操作';
      $('#confirmMessage').textContent=message;
      confirmCallback=callback;
      $('#confirmModal').classList.add('open');
      // 更新按钮文本
      $('#confirmCancelBtn').textContent=kt('cancel')||'取消';
      $('#confirmOkBtn').textContent=kt('confirm')||'确定';
    }
    function hideConfirm(){$('#confirmModal').classList.remove('open');confirmCallback=null;}
    $('#confirmCancelBtn').onclick=hideConfirm;
    $('#confirmOkBtn').onclick=function(){if(confirmCallback)confirmCallback();hideConfirm();};
    $('#confirmModal').onclick=function(e){if(e.target===this)hideConfirm();};

    function logout(confirmFirst = true) {
      if (confirmFirst) { showConfirm(kt('confirmLogout'), function(){ logout(false); }); return; }
      token = '';
      waiter = null;
      localStorage.removeItem('kitchenToken');
      showLoginScreen();
    }
    $('#logoutBtn').addEventListener('click', () => logout(true));

    $('#fullscreenBtn').addEventListener('click', () => {
      unlockAudio();
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', () => {
      $('#fullscreenLabel').textContent = document.fullscreenElement ? kt('exitFullscreen') : kt('fullscreen');
    });

    document.addEventListener('click', unlockAudio, { once: true });

    // 初始化
    applyLoginLanguage();
    applyMainLanguage();
    if (token) {
      showKitchenApp();
    } else {
      showLoginScreen();
    }
  </script>
</body>
</html>
