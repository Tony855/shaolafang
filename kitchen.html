<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5">
<title>Kitchen Display</title>
<link rel="stylesheet" href="assets/common.css">
<script>
  // 页面渲染前立即检查登录状态，避免登录框闪现
  (function() {
    try {
      if (localStorage.getItem('kitchenToken') || sessionStorage.getItem('kitchenToken')) {
        document.documentElement.setAttribute('data-authed', 'true');
      }
    } catch(e) {}
  })();
</script>
<style>
  /* 已登录状态：隐藏登录框，显示主应用 */
  html[data-authed="true"] .login-wrap { display: none !important; }
  html[data-authed="true"] .kitchen-app { display: flex !important; }
  :root {
    --bg: #14151f;
    --panel: #1c1e2b;
    --panel-2: #232538;
    --border: rgba(255,255,255,.08);
    --text: #f0f1f5;
    --text-dim: #9598ab;
    --primary: #ff7a45;
    --primary-2: #ffb020;
    --ok: #2ecc71;
    --warn: #ffb020;
    --danger: #ff5f5f;
    --radius: 16px;
  }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 10% 0%, rgba(255,122,69,.10), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(120,110,255,.10), transparent 40%), var(--bg);
    color: var(--text);
    font: 15px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  }
  /* 登录界面 */
  .login-wrap {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-box {
    width: 100%; max-width: 420px; padding: 34px;
    border: 1px solid var(--border); border-radius: 24px;
    background: linear-gradient(165deg, var(--panel-2), var(--panel));
    box-shadow: 0 26px 60px rgba(0,0,0,.4); text-align: center;
  }
  .login-box h1 { margin: 0 0 6px; font-size: 22px; }
  .login-box .desc { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  .login-box input {
    width: 100%; height: 48px; margin-bottom: 12px; padding: 0 14px;
    border-radius: 12px; border: 1px solid var(--border);
    background: #20223a; color: #fff; font-size: 15px; outline: none;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: linear-gradient(135deg, #ff8a5c, var(--primary));
    color: #fff; font-weight: 800; font-size: 16px; cursor: pointer;
  }
  .login-box .error { min-height: 20px; margin-top: 12px; color: #ff9c9c; font-size: 13px; }
  .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .lang-bar select {
    height: 34px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  }
  .lang-bar select option { background: #2d2d44; color: #fff; }
  /* 主显示界面 */
  .kitchen-app { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
  .kitchen-app.show { display: flex; }
  .login-wrap.hide { display: none; }
  .top-bar {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: rgba(0,0,0,.2); flex-wrap: wrap;
  }
  .top-bar h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .top-bar .spacer { flex: 1; }
  .top-bar .status-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--ok);
    display: inline-block; margin-right: 6px; box-shadow: 0 0 8px var(--ok);
  }
  .top-bar .status-dot.off { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .top-bar .count-badge {
    background: var(--primary); color: #fff; border-radius: 999px;
    padding: 4px 14px; font-weight: 700; font-size: 14px;
  }
  .top-bar .updated { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .top-bar button, .top-bar select {
    height: 36px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,.06);
    color: var(--text); font-size: 13px; cursor: pointer;
  }
  .top-bar button:hover { background: rgba(255,255,255,.12); }
  .top-bar select option { background: #2d2d44; color: #fff; }
  .ticket-grid {
    flex: 1; padding: 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px; align-content: start;
  }
  .empty-state { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text-dim); font-size: 18px; }
  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--primary);
  }
  .ticket.warn { border-left-color: var(--warn); }
  .ticket.urgent { border-left-color: #ff8c00; }
  .ticket.urgent .order-id { background: rgba(255,140,0,.2); color: #ff8c00; }
  .ticket.danger { border-left-color: var(--danger); animation: pulseBorder 1.6s infinite; }
  .ticket.ready { border-left-color: var(--ok); }
  @keyframes pulseBorder {
    0%,100% { box-shadow: 0 0 0 rgba(255,95,95,0); }
    50% { box-shadow: 0 0 0 4px rgba(255,95,95,.15); }
  }
  .ticket-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ticket-head .table-name { font-size: 22px; font-weight: 800; }
  .ticket-head .order-id {
    font-size: 26px; font-weight: 900; letter-spacing: .3px;
    padding: 6px 16px; border-radius: 10px; background: rgba(255,255,255,.1);
    color: var(--text); white-space: nowrap;
  }
  .ticket-head .order-id.warn { background: rgba(255,176,32,.18); color: var(--warn); }
  .ticket-head .order-id.danger { background: rgba(255,95,95,.18); color: var(--danger); }
  .ticket-head .order-id.ready { background: rgba(46,204,113,.18); color: var(--ok); }
  .ticket-time { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .ticket-time.warn { color: var(--warn); }
  .ticket-time.danger { color: var(--danger); font-weight: 700; }
  .ticket-note {
    background: rgba(255,176,32,.14); color: var(--primary-2);
    border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.5;
  }
  .ticket-items { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .item-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 10px; background: rgba(255,255,255,.04);
  }
  .item-row.done { opacity: .45; }
  .item-row .qty { font-size: 20px; font-weight: 800; color: var(--primary-2); min-width: 34px; text-align: center; }
  .item-row .emoji { font-size: 22px; }
  .item-row .name { flex: 1; font-size: 18px; font-weight: 600; }
  .item-row .unit { color: var(--text-dim); font-size: 13px; }
  .item-row .done-badge { color: var(--ok); font-size: 13px; font-weight: 700; white-space: nowrap; }
  .item-row button.mark-btn {
    border: 0; border-radius: 8px; background: var(--primary); color: #fff;
    font-size: 13px; font-weight: 700; padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  .item-row button.mark-btn:hover { filter: brightness(1.1); }
  .ticket-ready-tag {
    align-self: flex-start; background: rgba(46,204,113,.16); color: var(--ok);
    font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  }
  /* 修复：原先 CSS 结尾多了个 } 与孤立声明，已修正 */
  .ticket-serve-btn {
    align-self: stretch;
    background: linear-gradient(135deg,#27ae60,#2ecc71);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 0;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    margin-top: auto;
    box-shadow: 0 4px 12px rgba(46,204,113,.3);
  }
  .ticket-serve-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(46,204,113,.4); }
  .ticket-actions {
    display: flex; gap: 8px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .ticket-actions button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s;
  }
  .ticket-actions button:hover { opacity: .85; }
  .print-btn { background: rgba(52,152,219,.2); color: #5dade2; }
  .complete-btn { background: rgba(46,204,113,.2); color: var(--ok); }
  @media (max-width:520px) {
    .ticket-grid { grid-template-columns: 1fr; padding: 12px; }
    .top-bar { padding: 10px 12px; }
    .top-bar h1 { font-size: 17px; }
  }

  /* ===== 确认模态框 ===== */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: #fff;
    border-radius: 16px;
    max-width: 920px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 24px;
  }
  .confirm-modal .confirm-card {
    max-width: 360px;
    padding: 24px 24px 20px;
    text-align: center;
    border-radius: 16px;
  }
  .confirm-icon { font-size: 40px; margin-bottom: 12px; }
  .confirm-title { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
  .confirm-message { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 18px; }
  .confirm-buttons { display: flex; gap: 10px; justify-content: center; }
  .confirm-cancel, .confirm-ok {
    flex: 1; padding: 10px 20px; border: 0; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  }
  .confirm-cancel { background: #f0f0f5; color: #666; }
  .confirm-cancel:hover { background: #e4e4ec; }
  .confirm-ok { background: linear-gradient(135deg, #e85d3a, #e84a2a); color: #fff; }
  .confirm-ok:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232,93,58,0.3); }

  /* 催单 */
  .urge-modal .urge-card { max-width: 400px; padding: 0; border-radius: 14px; overflow: hidden; }
  .urge-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
  }
  .urge-title { font-size: 15px; font-weight: 700; }
  .urge-close {
    background: rgba(255,255,255,.2); border: 0; color: #fff;
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .urge-close:hover { background: rgba(255,255,255,.3); }
  .urge-list { padding: 12px; max-height: 260px; overflow-y: auto; }
  .urge-item {
    background: rgba(231,76,60,.08); border: 1px solid rgba(231,76,60,.2);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .urge-item:last-child { margin-bottom: 0; }
  .urge-item-info { flex: 1; min-width: 0; }
  .urge-item-table { font-weight: 700; color: #1a1a2e; font-size: 14px; }
  .urge-item-msg { color: #888; font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urge-item-btn {
    background: #27ae60; color: #fff; border: 0; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    white-space: nowrap; transition: all .2s;
  }
  .urge-item-btn:hover { background: #219a52; transform: translateY(-1px); }
</style>
</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <div class="lang-bar">
        <select id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ภาษาไทย</option>
          <option value="km">ភាសាខ្មែរ</option>
        </select>
      </div>
      <h1 id="loginTitle">后厨登录</h1>
      <p class="desc" id="loginDesc">请使用服务员账号登录后厨显示屏</p>
      <input id="username" type="text" autocomplete="username">
      <input id="password" type="password" autocomplete="current-password">
      <button id="loginBtn">登录</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <div class="kitchen-app" id="kitchenApp">
    <div class="top-bar">
      <h1>🍳 <span id="pageTitle">后厨订单显示</span></h1>
      <span class="count-badge" id="countBadge">0</span>
      <button class="urge-notification-btn" id="urgeNotificationBtn" onclick="showUrgeNotifications()" style="display:none;background:#e74c3c;color:#fff;border:0;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px;margin-left:10px;">
        ⚡ <span id="urgeNotificationCount">0</span>
      </button>
      <span id="kitchenStoreName" style="background:rgba(255,255,255,.15);padding:4px 12px;border-radius:12px;font-size:13px;margin-left:10px;display:none;"></span>
      <div class="spacer"></div>
      <span class="updated"><span class="status-dot" id="statusDot"></span><span id="updatedLabel">更新于</span> <span id="updatedTime">--:--:--</span></span>
      <select id="langSelectMain">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ภาษาไทย</option>
        <option value="km">ភាសាខ្មែរ</option>
      </select>
      <button id="fullscreenBtn">⛶ <span id="fullscreenLabel">全屏</span></button>
      <button id="logoutBtn">🚪 <span id="logoutLabel">退出登录</span></button>
    </div>
    <div class="ticket-grid" id="ticketGrid"></div>
  </div>


  <div class="modal confirm-modal" id="confirmModal">
    <div class="modal-card confirm-card">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-message" id="confirmMessage">确定要执行此操作吗？</div>
      <div class="confirm-buttons">
        <button class="confirm-cancel" id="confirmCancelBtn">取消</button>
        <button class="confirm-ok" id="confirmOkBtn">确定</button>
      </div>
    </div>
  </div>

  <div class="modal urge-modal" id="urgeModal">
    <div class="modal-card urge-card">
      <div class="urge-header">
        <div class="urge-title">⚡ <span id="urgeModalTitle"></span></div>
        <button class="urge-close" onclick="hideUrgeModal()">✕</button>
      </div>
      <div class="urge-list" id="urgeList"></div>
    </div>
  </div>

  <script src="languages.min.js?v=20260923c"></script>
  <script src="assets/core.js?v=20260924b"></script>
  <script src="assets/modules/ui.js?v=20260923"></script>
  <script src="assets/modules/money.js?v=20260923"></script>
  <script src="assets/modules/order-status.js?v=20260923"></script>
  <script src="assets/modules/customer-group.js?v=20260923"></script>
  <script src="assets/modules/role.js?v=20260923"></script>
  <script src="assets/modules/idle.js?v=20260923"></script>
  <script src="/socket.io/socket.io.js"></script>
<script src="pages/kitchen.js?v=20260923"></script>
</body>
</html>
